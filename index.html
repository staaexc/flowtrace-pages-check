    report.sourceConservation.expected = totalCounts(report.beforeCounts);
    report.sourceConservation.accounted = 0;
    report.sourceConservation.unaccountedPaths = enumerateSourcePaths(source);
    return { candidate, report };
  }

  function previewWorkspaceImport(source) {
    const sourceSchemaVersion =
      isObject(source) && hasOwn(source, "schemaVersion")
        ? source.schemaVersion
        : null;
    const report = createMigrationReport(sourceSchemaVersion);
    if (!isObject(source)) {
      return unsupportedPreview(
        source,
        report,
        "UNSUPPORTED_SCHEMA",
        "数据文件不是有效的 FlowTrace 工作区对象。",
      );
    }
    if (
      !Number.isInteger(sourceSchemaVersion) ||
      sourceSchemaVersion < 1 ||
      sourceSchemaVersion > SCHEMA_VERSION
    ) {
      return unsupportedPreview(
        source,
        report,
        "UNSUPPORTED_SCHEMA",
        `不支持 schemaVersion ${String(sourceSchemaVersion)}。`,
      );
    }
    let candidate = clone(source);
    let version = sourceSchemaVersion;
    while (version < SCHEMA_VERSION) {
      const matches = MIGRATION_REGISTRY.filter(
        (entry) => entry.fromVersion === version,
      );
      if (matches.length !== 1) {
        return unsupportedPreview(
          source,
          report,
          "MISSING_MIGRATION",
          `缺少从 schemaVersion ${version} 开始的唯一迁移路径。`,
        );
      }
      const migration = matches[0];
      const result = migration.migrate(candidate, report);
      candidate = result.candidate;
      version = migration.toVersion;
    }
    if (sourceSchemaVersion === SCHEMA_VERSION) {
      candidate = inspectWorkspaceV3(candidate, report);
    }
    finalizeMigrationReportV2(source, candidate, report);
    return { candidate, report };
  }

  function migrateWorkspace(source) {
    const { candidate, report } = previewWorkspaceImport(source);
    return { workspace: candidate, report };
  }

  function migrationBlockedError(report) {
    const future =
      Number(report && report.sourceSchemaVersion) > SCHEMA_VERSION;
    const summary =
      report && report.blockingErrors.length
        ? report.blockingErrors.map((item) => item.message).join("；")
        : "无法证明工作区可无损保存。";
    const error = new Error(
      future
        ? `数据版本 ${report.sourceSchemaVersion} 高于当前页面支持的版本：${summary}`
        : `FlowTrace 迁移被阻断：${summary}`,
    );
    error.code = "MIGRATION_BLOCKED";
    error.report = report;
    return error;
  }

  function normalizeWorkspaceV2(input) {
    const { candidate, report } = previewWorkspaceImport(input);
    if (!report.safe) throw migrationBlockedError(report);
    return candidate;
  }

  function assessWorkspaceForSave(workspace) {
    return previewWorkspaceImport(workspace).report;
  }

  function validateWorkspaceV2(workspace) {
    const report = assessWorkspaceForSave(workspace);
    if (!report.safe) {
      return report.blockingErrors.map((item) => item.message);
    }
    const errors = [];
    for (const run of workspace.runs || []) {
      if (!isObject(run) || run.templateVersion !== COMPANY_TEMPLATE_VERSION) {
        continue;
      }
      const slugs = (Array.isArray(run.stages) ? run.stages : []).map((stage) =>
        canonicalIdentity(stage && stage.slug),
      );
      for (const slug of COMPANY_STAGE_SLUGS) {
        if (!slugs.includes(slug)) {
          errors.push(`${run.name || run.id}: 缺少 ${slug}`);
        }
      }
    }
    return errors;
  }

  function activeRun(workspace) {
    return (
      workspace.runs.find((run) => run.id === workspace.activeRunId) ||
      workspace.runs[0]
    );
  }

  function stageTemplate(slug) {
    return STAGE_TEMPLATE.find((stage) => stage.slug === slug);
  }

  function stageState(run, slug) {
    return run.stages.find((stage) => stage.slug === slug);
  }

  function searchKnowledge(workspace, runId, query) {
    const records = Array.isArray(workspace && workspace.records)
      ? workspace.records
      : [];
    const attachments = Array.isArray(workspace && workspace.attachments)
      ? workspace.attachments
      : [];
    const attachmentNamesById = new Map();
    const attachmentNamesByRecord = new Map();

    for (const attachment of attachments) {
      if (!attachment || typeof attachment !== "object") continue;
      const name = String(attachment.name || "");
      attachmentNamesById.set(String(attachment.id || ""), name);
      if (attachment.recordId) {
        const recordId = String(attachment.recordId);
        const names = attachmentNamesByRecord.get(recordId) || [];
        names.push(name);
        attachmentNamesByRecord.set(recordId, names);
      }
    }

    const needle = String(query || "").trim().toLocaleLowerCase("zh-CN");
    return records
      .map((record, index) => ({ record, index }))
      .filter(
        ({ record }) =>
          record &&
          record.type === "knowledge" &&
          String(record.runId || "") === String(runId || ""),
      )
      .filter(({ record }) => {
        if (!needle) return true;
        const template = stageTemplate(record.stageSlug);
        const attachmentNames = [
          ...(attachmentNamesByRecord.get(String(record.id || "")) || []),
          ...(Array.isArray(record.attachmentIds) ? record.attachmentIds : [])
            .map((id) => attachmentNamesById.get(String(id)))
            .filter(Boolean),
        ];
        const haystack = [
          record.title,
          record.content,
          ...(Array.isArray(record.tags) ? record.tags : []),
          template ? template.name : "",
          template ? template.shortName : "",
          record.stageSlug,
          ...attachmentNames,
        ]
          .map((value) => String(value || ""))
          .join("\n")
          .toLocaleLowerCase("zh-CN");
        return haystack.includes(needle);
      })
      .sort((left, right) => {
        const leftTime = Date.parse(left.record.updatedAt) || 0;
        const rightTime = Date.parse(right.record.updatedAt) || 0;
        return rightTime - leftTime || left.index - right.index;
      })
      .map(({ record }) => record);
  }

  function runProgress(run) {
    const stages = Array.isArray(run && run.stages) ? run.stages : [];
    const complete = stages.filter((stage) => stage.status === "done").length;
    const total =
      run && run.templateVersion === COMPANY_TEMPLATE_VERSION
        ? COMPANY_STAGE_SLUGS.length
        : stages.length;
    return {
      complete,
      total,
      percent: total ? Math.min(100, Math.round((complete / total) * 100)) : 0,

    if (!finding || typeof finding !== "object") return String(finding || "");
    return [
      finding.message,
      finding.code ? `[${finding.code}]` : "",
      finding.path ? `位置：${finding.path}` : "",
    ]
      .filter(Boolean)
      .join(" ");
  }

  function priorityLabel(priority) {
    return (
      {
        low: "低",
        medium: "中",
        high: "高",
        critical: "紧急",
      }[priority] || "中"
    );
  }

  function recordStatusLabel(status) {
    return (
      {
        open: "待处理",
        "in-progress": "进行中",
        blocked: "阻塞",
        review: "待复核",
        done: "已完成",
        closed: "已关闭",
      }[status] || status
    );
  }

  function errorMessage(error) {
    if (error && error.message) return error.message;
    return "操作没有完成，请稍后重试。";
  }

  function migrationReportFromError(error) {
    if (!error || typeof error !== "object") return null;
    return error.report || error.migrationReport || error.details || null;
  }

  function isMigrationSafetyError(error) {
    return Boolean(
      error &&
        (error.code === "MIGRATION_BLOCKED" ||
          migrationReportFromError(error)),
    );
  }

  function reportItemText(item) {
    if (typeof item === "string") return item;
    if (!item || typeof item !== "object") return String(item || "未提供详情");
    const identity =
      item.identity || item.stageSlug || item.recordId || item.runId || item.kind;
    const location = item.path || item.sourcePath || item.destinationPath;
    return [
      item.code,
      item.message,
      identity ? `对象：${identity}` : "",
      location ? `位置：${location}` : "",
      item.reason ? `原因：${item.reason}` : "",
    ]
      .filter(Boolean)
      .join(" · ");
  }

  function reportItems(report, key) {
    return Array.isArray(report && report[key]) ? report[key] : [];
  }

  function validationReport(messages, path = "$") {
    const blockingErrors = (Array.isArray(messages) ? messages : [messages])
      .filter(Boolean)
      .map((message, index) => ({
        code: "WORKSPACE_VALIDATION_FAILED",
        path,
        identity: `validation-${index + 1}`,
        message: String(message),
        relatedPaths: [path],
      }));
    return {
      blockingErrors,
      discardedItems: [],
      sourceConservation: { unaccountedPaths: [] },
      safe: false,
      canImport: false,
      canSave: false,
    };
  }

  function setPersistentSafetyAlert(title, report, fallbackMessage) {
    const items = [
      ...reportItems(report, "blockingErrors").map(reportItemText),
      ...reportItems(report, "discardedItems").map(
        (item) => `丢弃清单：${reportItemText(item)}`,
      ),
      ...(((report && report.sourceConservation) || {}).unaccountedPaths || []).map(
        (path) => `未被迁移台账覆盖：${path}`,
      ),
    ].filter(Boolean);
    if (!items.length && fallbackMessage) items.push(fallbackMessage);
    state.persistentSafetyAlert = {
      title,
      items: items.length ? items : ["安全校验未通过，请检查源备份。"],
    };
  }

  function showSafetyFailure(title, error, fallbackMessage) {
    const report = migrationReportFromError(error);
    setPersistentSafetyAlert(
      title,
      report,
      fallbackMessage || errorMessage(error),
    );
    render();
  }

  function renderPersistentSafetyAlert() {
    const alert = state.persistentSafetyAlert;
    if (!alert) return "";
    return `
      <section class="persistent-safety-alert" data-persistent-safety-alert role="alert" aria-labelledby="persistent-safety-title">
        <div class="persistent-safety-copy">
          <p class="eyebrow">PRESERVATION BLOCK</p>
          <h2 id="persistent-safety-title">${escapeHtml(alert.title)}</h2>
          <p>为避免历史 Flow 或签核证据丢失，操作已停止。以下原因会一直保留，直到你确认已经看到。</p>

  function markDirty(run, stage) {

  function showToast(message, tone = "success") {

    renderToast();
    if (state.toastTimer) global.clearTimeout(state.toastTimer);
    state.toastTimer = global.setTimeout(() => {

  function renderToast() {
    let host = document.getElementById("toast-region");
    if (!host) {
      host = document.createElement("div");
      host.id = "toast-region";
      host.className = "toast-region";
      host.setAttribute("aria-live", "polite");

      ? `<div class="toast toast-${escapeHtml(state.toast.tone)}">${escapeHtml(
          state.toast.message,

  function clampPreviewZoom(value) {
    const numeric = Number(value);
    const safe = Number.isFinite(numeric) ? numeric : 1;
    return Math.min(PREVIEW_ZOOM_MAX, Math.max(PREVIEW_ZOOM_MIN, safe));
  }

  function previewStageSize(dialog) {
    const stage = dialog && dialog.querySelector(".attachment-preview-stage");
    if (!stage) return { width: 1, height: 1 };
    const style = global.getComputedStyle(stage);
    const horizontalPadding =
      Number.parseFloat(style.paddingLeft || "0") +
      Number.parseFloat(style.paddingRight || "0");
    const verticalPadding =
      Number.parseFloat(style.paddingTop || "0") +
      Number.parseFloat(style.paddingBottom || "0");
    return {
      width: Math.max(1, stage.clientWidth - horizontalPadding),
      height: Math.max(1, stage.clientHeight - verticalPadding),
    };
  }

  function updatePreviewZoomControls(dialog) {
    if (!dialog) return;
    const percent = Math.round(previewZoom.scale * 100);
    const output = dialog.querySelector("[data-preview-zoom-value]");
    const out = dialog.querySelector("[data-preview-zoom-out]");
    const zoomIn = dialog.querySelector("[data-preview-zoom-in]");
    const fit = dialog.querySelector("[data-preview-zoom-fit]");
    const actual = dialog.querySelector("[data-preview-zoom-actual]");
    if (output) output.textContent = `${percent}%`;
    if (out) out.disabled = previewZoom.scale <= PREVIEW_ZOOM_MIN + 0.001;
    if (zoomIn) zoomIn.disabled = previewZoom.scale >= PREVIEW_ZOOM_MAX - 0.001;
    if (fit) fit.setAttribute("aria-pressed", String(previewZoom.mode === "fit"));
    if (actual) {
      actual.setAttribute(
        "aria-pressed",
        String(previewZoom.mode === "actual" && Math.abs(previewZoom.scale - 1) < 0.001),
      );
    }
    dialog.dataset.previewZoomMode = previewZoom.mode;
  }

  function applyAttachmentPreviewZoom(value, mode = "custom") {
    const dialog = document.getElementById("attachment-preview-dialog");
    if (!dialog) return;
    const image = dialog.querySelector(".attachment-preview-image");
    const canvas = dialog.querySelector(".attachment-preview-canvas");
    if (!image || !canvas) return;
    const naturalWidth = image.naturalWidth || previewZoom.naturalWidth;
    const naturalHeight = image.naturalHeight || previewZoom.naturalHeight;
    if (!naturalWidth || !naturalHeight) return;

    const scale = clampPreviewZoom(value);
    previewZoom = {
      ...previewZoom,
      mode,
      scale,
      naturalWidth,
      naturalHeight,
    };
    canvas.style.width = `${naturalWidth * scale}px`;
    canvas.style.height = `${naturalHeight * scale}px`;
    updatePreviewZoomControls(dialog);
  }

  function fitAttachmentPreview(dialog) {
    const target = dialog || document.getElementById("attachment-preview-dialog");
    if (!target) return;
    const image = target.querySelector(".attachment-preview-image");
    if (!image) return;
    const naturalWidth = image.naturalWidth || previewZoom.naturalWidth;
    const naturalHeight = image.naturalHeight || previewZoom.naturalHeight;
    if (!naturalWidth || !naturalHeight) return;
    const available = previewStageSize(target);
    const fitScale = clampPreviewZoom(
      Math.min(
        available.width / naturalWidth,
        available.height / naturalHeight,
      ),
    );
    previewZoom.fitScale = fitScale;
    applyAttachmentPreviewZoom(fitScale, "fit");
  }

  function resetAttachmentPreviewZoom(dialog) {
    const image = dialog && dialog.querySelector(".attachment-preview-image");
    const knownNaturalWidth =
      (image && image.naturalWidth) || previewZoom.naturalWidth || 0;
    const knownNaturalHeight =
      (image && image.naturalHeight) || previewZoom.naturalHeight || 0;
    previewZoom = {
      mode: "fit",
      scale: 1,
      fitScale: 1,
      naturalWidth: knownNaturalWidth,
      naturalHeight: knownNaturalHeight,
    };
    const canvas = dialog && dialog.querySelector(".attachment-preview-canvas");
    const stage = dialog && dialog.querySelector(".attachment-preview-stage");
    if (canvas) {
      canvas.style.removeProperty("width");
      canvas.style.removeProperty("height");
    }
    if (stage) {
      stage.scrollLeft = 0;
      stage.scrollTop = 0;
    }
    updatePreviewZoomControls(dialog);
  }

  function changeAttachmentPreviewZoom(factor) {
    applyAttachmentPreviewZoom(previewZoom.scale * factor, "custom");
  }

  function ensureAttachmentPreviewDialog() {
    let dialog = document.getElementById("attachment-preview-dialog");
    if (dialog) return dialog;

    dialog = document.createElement("dialog");
    dialog.id = "attachment-preview-dialog";
    dialog.className = "attachment-preview-dialog";
    dialog.setAttribute("aria-labelledby", "attachment-preview-title");
    dialog.innerHTML = `
      <section class="attachment-preview-shell">
        <header class="attachment-preview-header">
          <div>
            <p class="eyebrow">IMAGE PREVIEW</p>
            <h2 id="attachment-preview-title"></h2>
          </div>
          <button class="btn btn-icon preview-close" type="button" data-preview-close aria-label="关闭图片查看器" title="关闭">×</button>
        </header>
        <figure class="attachment-preview-figure">
          <div class="attachment-preview-toolbar" data-preview-zoom-controls role="toolbar" aria-label="图片缩放工具">
            <button class="btn btn-icon preview-zoom-step" type="button" data-preview-zoom-out aria-label="缩小图片" title="缩小（-）">−</button>
            <output class="preview-zoom-value" data-preview-zoom-value aria-live="polite" aria-label="当前缩放比例">100%</output>
            <button class="btn btn-icon preview-zoom-step" type="button" data-preview-zoom-in aria-label="放大图片" title="放大（+）">+</button>
            <button class="btn preview-zoom-mode" type="button" data-preview-zoom-fit aria-pressed="true" title="适配窗口（0）">适配</button>
            <button class="btn preview-zoom-mode" type="button" data-preview-zoom-actual aria-pressed="false" title="按原始像素显示">100%</button>
          </div>
          <div class="attachment-preview-stage" tabindex="0" aria-label="图片查看区域，可用滚轮、加号、减号和数字 0 调整缩放">
            <div class="attachment-preview-canvas">
              <img class="attachment-preview-image" alt="" draggable="false" />
            </div>
          </div>
          <figcaption class="attachment-preview-meta"></figcaption>
        </figure>
        <footer class="attachment-preview-actions">
          <button class="btn" type="button" data-preview-download>下载原图</button>
          <button class="btn btn-primary" type="button" data-preview-close>关闭</button>
        </footer>
      </section>
    `;
    dialog.addEventListener("click", (event) => {
      if (event.target === dialog || event.target.closest("[data-preview-close]")) {
        closeAttachmentPreview();
        return;
      }
      if (event.target.closest("[data-preview-download]") && previewDownload) {
        previewDownload();
        return;
      }
      if (event.target.closest("[data-preview-zoom-out]")) {
        changeAttachmentPreviewZoom(1 / PREVIEW_ZOOM_STEP);
        return;
      }
      if (event.target.closest("[data-preview-zoom-in]")) {
        changeAttachmentPreviewZoom(PREVIEW_ZOOM_STEP);
        return;
      }
      if (event.target.closest("[data-preview-zoom-fit]")) {
        fitAttachmentPreview(dialog);
        return;
      }
      if (event.target.closest("[data-preview-zoom-actual]")) {
        applyAttachmentPreviewZoom(1, "actual");
      }
    });
    dialog.addEventListener("wheel",
      (event) => {
        if (!event.target.closest(".attachment-preview-stage") || !event.deltaY) return;
        event.preventDefault();
        changeAttachmentPreviewZoom(
          event.deltaY < 0 ? PREVIEW_ZOOM_STEP : 1 / PREVIEW_ZOOM_STEP,
        );
      }, { passive: false },
    );
    dialog.addEventListener("cancel", (event) => {
      event.preventDefault();
      closeAttachmentPreview();
    });
    const image = dialog.querySelector(".attachment-preview-image");
    if (image) {
      image.addEventListener("load", () => {
        previewZoom.naturalWidth = image.naturalWidth;
        previewZoom.naturalHeight = image.naturalHeight;
        const applyFit = () => fitAttachmentPreview(dialog);
        if (typeof global.requestAnimationFrame === "function") {
          global.requestAnimationFrame(applyFit);
        } else {
          global.setTimeout(applyFit, 0);
        }
      });
    }
    global.addEventListener("resize", () => {
      if (!dialog.open || previewZoom.mode !== "fit") return;
      const applyFit = () => fitAttachmentPreview(dialog);
      if (typeof global.requestAnimationFrame === "function") {
        global.requestAnimationFrame(applyFit);
      } else {
        global.setTimeout(applyFit, 0);
      }
    });
    document.body.appendChild(dialog);
    return dialog;
  }

  function openAttachmentPreview(attachment, trigger) {
    if (!attachment || !isPreviewableImage(attachment.dataUrl)) {
      showToast("这个附件不是可在网页内查看的图片，请使用下载。", "warning");
      return;
    }
    const dialog = ensureAttachmentPreviewDialog();
    if (typeof dialog.showModal !== "function") {
      showToast("当前浏览器不支持站内大图查看，请下载附件。", "warning");
      return;
    }
    const name = String(attachment.name || "图片附件");
    const size = Math.max(1, Math.round(Number(attachment.size || 0) / 1024));
    const image = dialog.querySelector(".attachment-preview-image");
    const title = dialog.querySelector("#attachment-preview-title");
    const meta = dialog.querySelector(".attachment-preview-meta");
    resetAttachmentPreviewZoom(dialog);
    if (image) {
      image.src = attachment.dataUrl;
      image.alt = `图片附件：${name}`;
    }
    if (title) title.textContent = name;
    if (meta) meta.textContent = `${size} KiB · 点击下载可保留原始文件`;
    previewReturnFocus =
      trigger instanceof HTMLElement ? trigger : document.activeElement;
    previewDownload = () => {
      try {
        downloadDataUrl(attachment.dataUrl, name);
      } catch (error) {
        showToast(errorMessage(error), "danger");
      }
    };
    if (!dialog.open) dialog.showModal();
    document.body.classList.add("is-previewing");
    fitAttachmentPreview(dialog);
    if (image && image.complete && image.naturalWidth) {
      const applyFit = () => fitAttachmentPreview(dialog);
      if (typeof global.requestAnimationFrame === "function") {
        global.requestAnimationFrame(applyFit);
      } else {
        global.setTimeout(applyFit, 0);
      }
    }
    const focusClose = () => {
      const close = dialog.querySelector("[data-preview-close]");
      if (close) close.focus();
    };
    if (typeof global.requestAnimationFrame === "function") {
      global.requestAnimationFrame(focusClose);
    } else {
      global.setTimeout(focusClose, 0);
    }
  }

  function closeAttachmentPreview() {
    const dialog = document.getElementById("attachment-preview-dialog");
    if (!dialog || !dialog.open) return;
    dialog.close();
    document.body.classList.remove("is-previewing");
    previewDownload = null;
    const returnFocus = previewReturnFocus;
    previewReturnFocus = null;
    if (returnFocus && returnFocus.isConnected) returnFocus.focus();
    const image = dialog.querySelector(".attachment-preview-image");
    global.setTimeout(() => {
      if (image && !dialog.open) image.removeAttribute("src");
    }, 0);
  }

  function previewAttachmentById(id, trigger) {
    const attachment = state.workspace.attachments.find((item) => item.id === id);
    if (!attachment) {
      showToast("没有找到这个附件，可能已被删除。", "warning");

    openAttachmentPreview(attachment, trigger);
  }

          } />

  function renderTopbar(run) {
    const syncLabel = state.conflict
      ? "检测到云端冲突"

      <header class="topbar">
        <button class="mobile-menu" type="button" data-action="toggle-sidebar" aria-label="${

        <div class="brand-lockup compact">
          <span class="brand-mark" aria-hidden="true">FT</span>
          <div>
            <strong>FlowTrace</strong>
            <small>Private GitHub workspace</small>
          </div>
        </div>
        <div class="topbar-context">
          <span class="sync-dot ${
            state.conflict ? "is-conflict" : state.dirty ? "is-dirty" : "is-synced"
          }"></span>
          <span>${escapeHtml(syncLabel)}</span>
        </div>
        <div class="topbar-actions">
          <button class="btn" type="button" data-action="sync" aria-label="从云端同步" ${
            state.busy ? "disabled" : ""
          }><span aria-hidden="true">↻</span><span class="btn-label">同步</span></button>
          <button class="btn btn-primary" type="button" data-action="save" aria-label="保存到云端" ${
            state.busy || !state.dirty ? "disabled" : ""
          }><span aria-hidden="true">⇧</span><span class="btn-label">${
            state.busy === "save" ? "保存中…" : "保存到云端"
          }</span></button>
          <button class="btn btn-icon" type="button" data-action="open-menu" aria-label="打开更多操作" title="更多操作">•••</button>
        </div>
      </header>
    `;
  }

  function renderMetrics(run) {
    const records = state.workspace.records.filter(
      (record) => record.runId === run.id,
    );
    const recordIds = new Set(records.map((record) => record.id));
    const attachments = state.workspace.attachments.filter(
      (attachment) =>
        attachment.recordId && recordIds.has(attachment.recordId),
    );
    const images = attachments.filter((attachment) =>
      isPreviewableImage(attachment.dataUrl),
    );
    const weeklyRecords = records.filter(
      (record) =>
        weeklySectionIdForRecord(record) &&
        weeklyDateForRecord(record) === state.weeklyDate,
    );
    const currentTemplate =
      Model.stageTemplate(run.currentStageSlug) || Model.STAGE_TEMPLATE[0];
    const currentRecordCount = records.filter(
      (record) => record.stageSlug === currentTemplate.slug,
    ).length;
    return `
      <section class="metric-grid record-metrics" aria-label="Flow 记录概览">
        <article class="metric-card">
          <span>当前阶段</span>
          <strong class="metric-stage-name">${escapeHtml(currentTemplate.shortName)}</strong>
          <small>${String(currentTemplate.order).padStart(2, "0")} / ${Model.STAGE_TEMPLATE.length} · ${currentRecordCount} 条阶段记录</small>
        </article>
        <article class="metric-card">
          <span>工作记录</span>
          <strong>${records.length}</strong>
          <small>覆盖进展、报告、问题、笔记和行动项</small>
        </article>
        <article class="metric-card">
          <span>图片证据</span>
          <strong>${images.length}</strong>
          <small>共 ${attachments.length} 个附件，可在页面内直接查看图片</small>
        </article>
        <article class="metric-card">
          <span>${escapeHtml(state.weeklyDate)} 周报</span>
          <strong>${weeklyRecords.length}<small> 条</small></strong>
          <button class="metric-link" type="button" data-action="switch-workspace-view" data-view="weekly">打开周报记录</button>
        </article>
      </section>
    `;
  }

  function stageRecords(runId, slug) {
    return state.workspace.records
      .filter(
        (record) => record.runId === runId && record.stageSlug === slug,
      )
      .sort(
        (left, right) =>
          new Date(right.updatedAt).getTime() -
          new Date(left.updatedAt).getTime(),
      );
  }

  function stageRecordCount(runId, slug) {
    return stageRecords(runId, slug).length;
  }

  function stageImageCount(runId, slug) {
    return stageRecords(runId, slug).reduce(
      (count, record) =>
        count +
        attachmentsForRecord(record).filter((attachment) =>
          isPreviewableImage(attachment.dataUrl),
        ).length,
      0,
    );
  }

  function renderStageCard(template, run) {
    const stage = Model.stageState(run, template.slug);
    const assessment = deriveAssessment(run, stage);
    const isSelected = template.slug === state.selectedStageSlug;
    const isCurrent = template.slug === run.currentStageSlug;
    const blockers = assessment.blockers || [];
    const warnings = assessment.warnings || [];
    const ordinaryPendingCodes = new Set([
      "GATE_PENDING",
      "EXECUTION_NOT_COMPLETE",
      "APPROVAL_NOT_GRANTED",
      "APPROVAL_STALE",
      "PREDECESSOR_NOT_ACCEPTED",
    ]);
    const realFailureBlockers = blockers.filter(
      (blocker) => !ordinaryPendingCodes.has(blocker.code),
    );
    const hasFailure =
      assessment.executionStatus === "blocked" ||
      assessment.qualityStatus === "fail" ||
      assessment.approvalStatus === "rejected" ||
      realFailureBlockers.length > 0;
    const needsAttention =
      !hasFailure &&
      (assessment.acceptedWithOverride ||
        assessment.qualityStatus === "pass_with_waiver" ||
        assessment.approvalStatus === "stale" ||
        warnings.length > 0);
    const records = stageRecords(run.id, template.slug);
    const imageCount = stageImageCount(run.id, template.slug);
    const latest = records[0] || null;
    const stateLabel = hasFailure
      ? "失败或明确阻断"
      : needsAttention
        ? "需关注"
        : assessment.accepted
          ? "已通过"
          : isCurrent
            ? "进行中"
            : "正常";
    return `
      <button
        class="stage-card gate2-card record-stage-card ${
          isSelected ? "is-selected" : ""
        } ${isCurrent ? "is-current" : ""} ${
          hasFailure
            ? "has-failure"
            : needsAttention
              ? "needs-attention"
              : assessment.accepted
                ? "has-passed"
                : ""
        }"
        type="button"
        data-action="select-stage"
        data-stage="${escapeHtml(template.slug)}"
        aria-pressed="${isSelected}"
        data-stage-visual-state="${hasFailure ? "failure" : needsAttention ? "attention" : isCurrent ? "current" : assessment.accepted ? "passed" : "neutral"}"
      >
        <span class="stage-order">${String(template.order).padStart(2, "0")}</span>
        <span class="stage-card-body">
          <strong>${escapeHtml(template.shortName)}</strong>
          <small>${records.length} 条记录 · ${imageCount} 张图片</small>
        </span>
        ${isCurrent ? '<span class="current-flag">当前</span>' : ""}
        <span class="stage-record-summary">
          <span class="stage-record-latest">${
            latest
              ? escapeHtml(latest.title || "未命名记录")
              : "尚无记录，点击后可添加"
          }</span>
          <span class="stage-compact-status is-${
            hasFailure
              ? "failure"
              : needsAttention
                ? "attention"
                : assessment.accepted
                  ? "passed"
                  : "neutral"
          }">
            <span class="stage-status-dot" aria-hidden="true"></span>
            ${escapeHtml(stateLabel)}
          </span>
        </span>
      </button>
    `;
  }

  function renderGateSummary(summary) {
    const counts = summary || {};
    const notApplicable =
      counts.notApplicable == null
        ? Number(counts.not_applicable || 0)
        : Number(counts.notApplicable || 0);
    return `
      <span class="stage-gate-summary" aria-label="Gate 结果汇总">
        <span class="gate-summary-count is-pass">Pass ${Number(counts.pass || 0)}</span>
        <span class="gate-summary-count is-fail">Fail ${Number(counts.fail || 0)}</span>
        <span class="gate-summary-count is-risk">Waiver ${Number(counts.waived || 0)}</span>
        <span class="gate-summary-count">Pending ${Number(counts.pending || 0)}</span>
        ${notApplicable ? `<span class="gate-summary-count is-risk">N/A ${notApplicable}</span>` : ""}
      </span>
    `;
  }

  function renderFlowMap(run) {
    const mainline = Model.STAGE_TEMPLATE.filter((stage) => stage.order <= 11);
    const timing = Model.STAGE_TEMPLATE.filter(
      (stage) => stage.lane === "timing",
    );
    const physical = Model.STAGE_TEMPLATE.filter(
      (stage) => stage.lane === "physical",
    );
    return `
      <section class="panel flow-panel" aria-labelledby="flow-map-title">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">COMPANY FLOW · RECORD VIEW</p>
            <h2 id="flow-map-title">流程记录</h2>
          </div>
          <span class="panel-hint">选择阶段，记录进展和截图</span>
        </div>
        <div class="flow-map">
          <div class="flow-mainline">
            ${mainline.map((stage) => renderStageCard(stage, run)).join("")}
          </div>
          <div class="branch-label"><span>从签核数据准备开始并行</span></div>
          <div class="flow-branches">
            <section class="flow-lane lane-timing" aria-label="RC 与时序签核">
              <header><span>RC / TIMING</span><strong>StarRC → PrimeTime</strong></header>
              <div class="flow-lane-stages">
                ${timing.map((stage) => renderStageCard(stage, run)).join("")}
              </div>
            </section>
            <section class="flow-lane lane-physical" aria-label="物理验证签核">
              <header><span>PHYSICAL VERIFICATION</span><strong>Calibre PV</strong></header>
              <div class="flow-lane-stages">
                ${physical.map((stage) => renderStageCard(stage, run)).join("")}

            </section>
          </div>

      </section>

  function formatRuleValue(value) {
    if (Array.isArray(value)) return value.join(" – ");
    if (value === null || value === undefined || value === "") return "人工复核";
    if (typeof value === "object") return JSON.stringify(value);
    return String(value);
  }

  function renderGate(gate, index, stage) {
    const definition = gate.definition || {};
    const result = currentGateResult(gate);
    const resultMeta = gateResultMeta(result ? result.status : "pending");
    const severity = definition.severity || "info";
    const ruleLabel =
      definition.operator === "manual"
        ? "manual review"
        : `${definition.operator || "manual"} ${formatRuleValue(definition.expected)}${
            definition.unit ? ` ${definition.unit}` : ""
          }`;
    return `
      <article class="gate2-row is-${escapeHtml(resultMeta.tone)}" data-gate-row="${escapeHtml(gate.id)}">
        <span class="gate-index">${String(index + 1).padStart(2, "0")}</span>
        <div class="gate2-rule">
          <strong>${escapeHtml(definition.label || gate.label || gate.id)}</strong>
          <small>${escapeHtml(ruleLabel)} · Rule ${escapeHtml(definition.ruleVersion || "legacy")}</small>
          <div class="gate2-meta">
            <span class="rule-chip is-${escapeHtml(severity)}">${escapeHtml(SEVERITY_LABEL[severity] || severity)}</span>
            ${(definition.requiredEvidenceTypes || [])
              .map(
                (type) =>
                  `<span class="rule-chip">${escapeHtml(type)}</span>`,
              )
              .join("")}
          </div>
        </div>
        <div class="gate2-result">
          <span class="gate-result-pill is-${escapeHtml(resultMeta.tone)}">${escapeHtml(resultMeta.label)}</span>
          <small>${result ? `Rev ${result.revision} · ${escapeHtml(result.checkedBy || "未检查")}` : "无结果"}</small>
        </div>
        <button
          class="btn btn-small"
          type="button"
          data-action="edit-gate-result"
          data-stage="${escapeHtml(stage.slug)}"
          data-gate-id="${escapeHtml(gate.id)}"
          data-focus-origin="gate-row"
          aria-label="检查 Gate：${escapeHtml(definition.label || gate.label || gate.id)}"
        >检查</button>
      </article>
    `;
  }

  function renderStageBlockers(assessment) {
    const blockers = assessment.blockers || [];
    const warnings = assessment.warnings || [];
    const items = blockers.length ? blockers : warnings;
    if (!items.length) return "";
    return `
      <section class="stage-blockers ${blockers.length ? "" : "is-warning"}" data-stage-blockers aria-labelledby="stage-blocker-title">
        <header>
          <h3 id="stage-blocker-title">${blockers.length ? "当前阻断原因" : "当前风险提示"}</h3>
          <span>${items.length}</span>
        </header>
        <ul class="stage-blocker-list">
          ${items
            .map(
              (item) => `
                <li data-blocker-id="${escapeHtml(item.id || item.code || "")}">
                  <span class="blocker-severity">${escapeHtml(item.severity || (blockers.length ? "blocker" : "warning"))}</span>
                  <span>
                    ${escapeHtml(findingText(item))}
                    ${
                      item.gateId
                        ? `<button class="btn btn-small" type="button" data-action="edit-gate-result" data-stage="${escapeHtml(item.stageSlug || state.selectedStageSlug)}" data-gate-id="${escapeHtml(item.gateId)}" data-focus-origin="stage-blocker">打开 Gate</button>`
                        : ""
                    }
                  </span>
                </li>
              `,
            )
            .join("")}
        </ul>
      </section>
    `;
  }

  function executionActions(stage, assessment) {
    const current = assessment.executionStatus;
    const actions = [];
    if (current === "not_started") {
      actions.push(["in_progress", "开始执行", "btn-primary"]);
    } else if (current === "in_progress") {
      actions.push(["blocked", "标记阻断", "btn-danger"]);
      actions.push(["completed", "完成执行", "btn-primary"]);
    } else if (current === "blocked") {
      actions.push(["in_progress", "恢复执行", "btn-primary"]);
    } else if (current === "completed") {
      actions.push(["in_progress", "重新打开", ""]);
    }
    return actions
      .map(
        ([target, label, buttonClass]) => `
          <button
            class="btn ${buttonClass}"
            type="button"
            data-action="open-stage-execution"
            data-stage="${escapeHtml(stage.slug)}"
            data-target-status="${escapeHtml(target)}"
          >${escapeHtml(label)}</button>
        `,
      )
      .join("");
  }

  function approvalActions(stage, assessment) {
    if (assessment.approvalStatus === "pending") {
      return `
        <button class="btn btn-primary" type="button" data-action="open-stage-approval" data-stage="${escapeHtml(stage.slug)}" data-approval-mode="decision" data-decision="approved">批准</button>
        <button class="btn btn-danger" type="button" data-action="open-stage-approval" data-stage="${escapeHtml(stage.slug)}" data-approval-mode="decision" data-decision="rejected">驳回</button>
      `;
    }
    if (
      assessment.approvalStatus === "approved" ||
      assessment.approvalStatus === "approved_with_override"
    ) {
      return "";
    }
    return `
      <button class="btn" type="button" data-action="open-stage-approval" data-stage="${escapeHtml(stage.slug)}" data-approval-mode="request">申请批准</button>
    `;
  }

  function renderOverrideAudit(stage) {
    const overrides =
      stage && stage.state && Array.isArray(stage.state.overrides)
        ? stage.state.overrides
        : [];
    if (!overrides.length) return "";
    return `
      <section class="override-audit" aria-label="Override 审计记录">
        ${overrides
          .slice()
          .reverse()
          .slice(0, 3)
          .map(
            (override) => `
              <div class="override-audit-item">
                <strong>${escapeHtml(override.status || "unknown")}</strong>
                · ${escapeHtml(override.approvedBy || "未记录批准人")}
                · ${escapeHtml(formatDate(override.approvedAt))}
                <br>${escapeHtml(override.reason || "未记录原因")}
              </div>
            `,
          )
          .join("")}
      </section>
    `;
  }

    const isCurrent = run.currentStageSlug === template.slug;

    const quality = axisMeta("quality", assessment.qualityStatus);

    const records = stageRecords(run.id, template.slug);

        <div class="panel-heading">
          <div>

            <h2 id="stage-detail-title">${escapeHtml(template.name)}</h2>
            <p class="panel-description">${escapeHtml(template.description)}</p>
          </div>
          <div class="panel-heading-actions">
            <span class="record-count-pill">${records.length} 条记录 · ${images} 张图片</span>
            <button class="btn ${isCurrent ? "" : "btn-secondary"}" type="button" data-action="mark-current" ${

            }>${isCurrent ? "当前阶段" : "设为当前阶段"}</button>
          </div>
        </div>
        <div class="stage-record-actions" aria-label="阶段记录快捷操作">
          <button class="btn btn-primary" type="button" data-action="new-record" data-record-type="progress">
            添加阶段记录
          </button>
          <button class="btn" type="button" data-action="new-record-with-image" data-record-type="progress">
            添加截图
          </button>
          <button class="btn" type="button" data-action="switch-workspace-view" data-view="weekly">
            放进周报
          </button>
        </div>
        <div class="stage-fields lightweight-stage-fields">
          <label class="field">
            <span>下一步</span>
            <textarea
              rows="3"
              maxlength="1000"
              data-action="stage-next"
              data-stage="${escapeHtml(stage.slug)}"
              placeholder="下一条准备执行的动作"

          </label>
          <label class="field">
            <span>阶段笔记</span>
            <textarea
              rows="5"
              maxlength="10000"
              data-action="stage-note"
              data-stage="${escapeHtml(stage.slug)}"
              placeholder="记录本阶段做了什么、看到什么结果，以及需要保留的命令或结论"
            >${escapeHtml(stage.note)}</textarea>
          </label>
        </div>
        <details class="advanced-audit" data-advanced-audit ${state.advancedAuditOpen ? "open" : ""}>
          <summary data-action="toggle-advanced-audit">
            <span>
              <strong>高级签核信息</strong>
              <small>Gate、执行/质量/批准、Waiver、Override 与历史阻断数据</small>
            </span>
            <span class="advanced-summary-status">${escapeHtml(execution.label)} · ${escapeHtml(quality.label)} · ${escapeHtml(approval.label)}</span>
          </summary>
          <div class="advanced-audit-content">
            <div class="stage-state-overview" data-stage-state-axes>
              <article class="state-axis-card is-${execution.tone}">
                <span>EXECUTION · 执行状态</span>
                <strong>${escapeHtml(execution.label)}</strong>
              </article>
              <article class="state-axis-card is-${quality.tone}">
                <span>QUALITY · 质量状态</span>
                <strong>${escapeHtml(quality.label)}</strong>
              </article>
              <article class="state-axis-card is-${approval.tone}">
                <span>APPROVAL · 批准状态</span>
                <strong>${escapeHtml(approval.label)}</strong>
              </article>
            </div>
            ${renderGateSummary(assessment.gateSummary)}
            ${
              assessment.accepted
                ? `<div class="stage-accepted-banner ${
                    assessment.acceptedWithOverride ? "is-override" : ""
                  }">${assessment.acceptedWithOverride ? "阶段已通过 Override 接受，底层风险仍需跟踪。" : "阶段已满足执行、质量、批准和前置依赖要求。"}</div>`
                : ""
            }
            ${renderStageBlockers(assessment)}
            <div class="stage-action-bar" data-stage-actions>
              <span class="action-context">此处保留完整审计逻辑；状态变化仍会写入历史，界面折叠不会修改数据。</span>
              ${executionActions(stage, assessment)}
              ${approvalActions(stage, assessment)}
              ${
                (assessment.blockers || []).some((item) => item.overrideable)

                  : ""

            ${renderOverrideAudit(stage)}
            <div class="gate2-list">
              <div class="section-label">
                <span>Gate 2.0 检查</span>
                <small>${escapeHtml(
                  `${Number((assessment.gateSummary || {}).pass || 0)} pass / ${stage.gates.length} total`,
                )}</small>
              </div>
              ${stage.gates
                .map((gate, index) => renderGate(gate, index, stage))
                .join("")}
            </div>
          </div>
        </details>
      </section>
    `;
  }

  function filteredRecords(run) {
    const query = state.query.trim().toLocaleLowerCase("zh-CN");
    return state.workspace.records
      .filter((record) => record.runId === run.id)
      .filter(
        (record) =>
          state.recordScope === "all" ||
          record.stageSlug === state.selectedStageSlug,
      )
      .filter(
        (record) =>
          state.recordType === "all" || record.type === state.recordType,
      )
      .filter((record) => {
        if (!query) return true;
        const template = Model.stageTemplate(record.stageSlug);
        const attachmentNames = attachmentsForRecord(record).map(
          (attachment) => attachment.name,
        );
        const haystack = [
          record.title,
          record.content,
          record.status,
          record.priority,
          ...(record.tags || []),
          ...attachmentNames,
          template ? template.name : "",
        ]
          .join("\n")
          .toLocaleLowerCase("zh-CN");
        return haystack.includes(query);
      })
      .sort(
        (left, right) =>
          new Date(right.updatedAt).getTime() -
          new Date(left.updatedAt).getTime(),
      );
  }

  function attachmentsForRecord(record) {
    const ids = new Set(record.attachmentIds || []);
    return state.workspace.attachments.filter(
      (attachment) =>
        ids.has(attachment.id) || attachment.recordId === record.id,
    );
  }

  function renderAttachment(attachment, editable = false) {
    const isImage = isPreviewableImage(attachment.dataUrl);
    const primaryAction = isImage
      ? "preview-attachment"
      : "download-attachment";
    const primaryTitle = isImage ? "查看大图" : "下载附件";
    return `
      <div class="attachment-chip">
        ${
          isImage
            ? `<button
                type="button"
                class="attachment-thumb"
                data-action="preview-attachment"

  function renderRecordCard(record, options = {}) {
    options =
      options && typeof options === "object" && !Array.isArray(options)
        ? options
        : {};
    const meta = Model.RECORD_TYPES[record.type];
    const template = Model.stageTemplate(record.stageSlug);
    const attachments = attachmentsForRecord(record);
    const visibleTags = (record.tags || []).filter(
      (tag) =>
        !options.hideWeeklyTags ||
        (!String(tag).startsWith(WEEKLY_TAG_PREFIX) &&
          !String(tag).startsWith(WEEK_TAG_PREFIX)),
    );
    return `
      <article class="record-card ${escapeHtml(options.className || "")}" data-record-id="${escapeHtml(record.id)}">
        <header>
          <div class="record-kind kind-${escapeHtml(record.type)}">
            <span aria-hidden="true">${escapeHtml(meta.icon)}</span>
            ${escapeHtml(meta.label)}
          </div>
          <div class="record-meta">
            <span>${escapeHtml(template ? template.shortName : record.stageSlug)}</span>
            <span>${escapeHtml(recordStatusLabel(record.status))}</span>
            <span class="priority priority-${escapeHtml(
              record.priority,
            )}">${priorityLabel(record.priority)}优先级</span>
          </div>
          <div class="record-card-actions">
            <button class="btn btn-icon" type="button" data-action="add-record-image" data-record-id="${escapeHtml(
              record.id,
            )}" aria-label="为这条记录添加图片" title="添加图片">▣</button>

  function weeklyRecordsForSection(runId, sectionId, weekDate = state.weeklyDate) {

      .filter(
        (record) =>
          record.runId === runId &&
          weeklySectionIdForRecord(record) === sectionId &&
          weeklyDateForRecord(record) === weekDate,
      )
      .sort(
        (left, right) =>
          new Date(right.updatedAt).getTime() -
          new Date(left.updatedAt).getTime(),
      );
  }

  function legacyEntries(kind) {
    const legacy = state.workspace && state.workspace.legacy;
    return legacy && Array.isArray(legacy[kind]) ? legacy[kind] : [];
  }

  function legacyOwnerRunId(entry) {
    if (!entry || typeof entry !== "object") return "";
    const value = entry.value && typeof entry.value === "object" ? entry.value : {};
    return String(entry.runId || value.runId || "");
  }

  function legacyEntriesForRun(kind, runId) {
    return legacyEntries(kind).filter((entry) => {
      if (!entry || typeof entry !== "object") return false;
      return legacyOwnerRunId(entry) === String(runId || "");
    });
  }

  function workspaceLevelLegacyEntries(kind) {
    return legacyEntries(kind).filter((entry) => !legacyOwnerRunId(entry));
  }

  function renderWorkspaceLegacySummary() {
    const attachments = workspaceLevelLegacyEntries("attachments");
    if (!attachments.length) return "";
    return `
      <section class="workspace-legacy-summary" data-workspace-legacy-summary role="status">
        <div>
          <p class="eyebrow">WORKSPACE LEGACY</p>
          <h2>工作区级历史附件</h2>
          <p>有 ${attachments.length} 个 Legacy 附件无法可靠归属到某个 Run，已原样保留且不会被静默分配。</p>
        </div>
        <strong aria-label="工作区级 Legacy 附件数量">${attachments.length}</strong>
      </section>
    `;
  }

  function renderHistoricalProtectedView(run) {
    const activeStages = Array.isArray(run.stages) ? run.stages : [];
    const legacyStages = legacyEntriesForRun("stages", run.id);
    const activeRecords = state.workspace.records.filter(
      (record) => record.runId === run.id,
    );
    const legacyRecords = legacyEntriesForRun("records", run.id);
    const activeRecordIds = new Set(activeRecords.map((record) => record.id));
    const activeAttachments = state.workspace.attachments.filter(
      (attachment) =>
        attachment.recordId && activeRecordIds.has(attachment.recordId),
    );
    const legacyAttachments = legacyEntriesForRun("attachments", run.id);
    const workspaceLegacyAttachments =
      workspaceLevelLegacyEntries("attachments");
    const legacyGates = legacyEntriesForRun("gates", run.id);
    const activeGateCount = activeStages.reduce(
      (total, stage) =>
        total + (Array.isArray(stage && stage.gates) ? stage.gates.length : 0),
      0,
    );
    const stageLabels = [
      ...activeStages.map((stage) => ({
        slug: stage && stage.slug,
        source: "active",
      })),
      ...legacyStages.map((entry) => ({
        slug:
          entry.stageSlug ||
          (entry.value && (entry.value.slug || entry.value.stageSlug)),
        source: "legacy",
      })),
    ].filter((stage) => stage.slug);
    return `
      <section class="historical-protection" data-historical-protection aria-labelledby="historical-protection-title">
        <header class="historical-protection-header">
          <div>
            <p class="eyebrow">HISTORICAL / LEGACY PROTECTION</p>
            <h1 id="historical-protection-title">${escapeHtml(run.name)}</h1>
            <p>模板 <strong>${escapeHtml(
              run.templateVersion || "未识别模板",
            )}</strong> 尚未由当前 14 阶段编辑器支持，因此以只读保护模式打开。</p>
          </div>
          <span class="historical-readonly-badge">只读保护</span>
        </header>
        <div class="notice notice-warning" role="status">
          FlowTrace 没有把这些阶段改名、合并或补成公司 14 阶段。你可以先导出完整备份；双模板编辑将在后续批次启用。
        </div>
        <div class="historical-metric-grid" aria-label="历史对象保留数量">
          <article><span>阶段</span><strong>${stageLabels.length}</strong><small>${legacyStages.length} 个位于 Legacy</small></article>
          <article><span>Gate</span><strong>${
            activeGateCount + legacyGates.length
          }</strong><small>${legacyGates.length} 个位于 Legacy</small></article>
          <article><span>记录</span><strong>${
            activeRecords.length + legacyRecords.length
          }</strong><small>${legacyRecords.length} 个位于 Legacy</small></article>
          <article><span>附件</span><strong>${
            activeAttachments.length + legacyAttachments.length
          }</strong><small>${legacyAttachments.length} 个属于本 Run；另有 ${
            workspaceLegacyAttachments.length
          } 个工作区级 Legacy</small></article>
        </div>
        <section class="panel historical-stage-panel" aria-labelledby="historical-stage-title">
          <div class="panel-heading">
            <div><p class="eyebrow">STABLE IDENTITIES</p><h2 id="historical-stage-title">原始阶段身份</h2></div>
            <span class="panel-hint">StageKey = runId + stageSlug</span>
          </div>
          ${
            stageLabels.length
              ? `<ol class="historical-stage-list">${stageLabels
                  .map(
                    (stage) =>
                      `<li><code>${escapeHtml(stage.slug)}</code><span>${
                        stage.source === "legacy" ? "Legacy 原样保留" : "历史对象"
                      }</span></li>`,
                  )
                  .join("")}</ol>`
              : '<p class="historical-empty">源 Run 没有可编辑阶段；其余字段仍保留在版本化工作区中。</p>'
          }
        </section>
      </section>
    `;
  }

  function recordModalState() {
    return state.modal && state.modal.type === "record" ? state.modal : null;
  }

  function recordModalDefaults(modal, existing = null) {
    const inferredSectionId = existing
      ? weeklySectionIdForRecord(existing)
      : modal.weeklySection || "";
    const definition = weeklySection(inferredSectionId);
    const weekDate =
      (existing && weeklyDateForRecord(existing)) ||
      modal.weekDate ||
      state.weeklyDate;
    const prefill = modal.prefill || {};
    const extraTags = Array.isArray(prefill.tags) ? prefill.tags : [];
    const tags = existing
      ? existing.tags || []
      : definition
        ? weeklyTags(definition.id, weekDate, extraTags)
        : extraTags;
    return {
      definition,
      weekDate,
      type: existing
        ? existing.type
        : definition
          ? definition.recordType
          : modal.recordType || "progress",
      stageSlug: existing
        ? existing.stageSlug
        : modal.stageSlug ||
          (definition && definition.stageSlug) ||
          state.selectedStageSlug,
      status: existing ? existing.status : prefill.status || "open",
      priority: existing ? existing.priority : prefill.priority || "medium",
      title: existing
        ? existing.title
        : prefill.title ||
          (definition ? `${definition.label} · ${weekDate}` : ""),
      content: existing ? existing.content : prefill.content || "",
      tags,
      dueAt:
        existing && existing.dueAt ? String(existing.dueAt).slice(0, 10) : "",
    };
  }

  function createRecordModal(options) {
    return {
      type: "record",
      pendingAttachments: [],
      pendingRead: Promise.resolve(),
      pendingJobs: 0,
      ...options,
    };
  }

  function focusRecordModal(preferPaste = false) {
    const selector = preferPaste
      ? "[data-attachment-paste-zone]"
      : '[data-form="record"] [name="title"]';
    const target = root.querySelector(selector);
    if (target) target.focus();
  }

  function openRecordWithImage(options) {
    state.modal = createRecordModal(options);
    render();
    focusRecordModal(true);
    const input = root.querySelector(
      '[data-form="record"] [name="attachments"]',
    );
    if (input) input.click();
  }

  function recordTypeForGlobalPaste() {
    if (state.workspaceView === "knowledge") return "knowledge";
    return Model.RECORD_TYPES[state.recordType]
      ? state.recordType
      : "progress";
  }

  function snapshotRecordForm() {
    const form = root.querySelector('[data-form="record"]');
    if (!form) return null;
    const fields = {};
    for (const element of Array.from(form.elements || [])) {
      if (!element.name || element.type === "file") continue;
      fields[element.name] =
        element.type === "checkbox" ? Boolean(element.checked) : element.value;
    }
    return { fields };
  }

  function restoreRecordForm(snapshot) {
    const form = root.querySelector('[data-form="record"]');
    if (!form || !snapshot) return;
    for (const [name, value] of Object.entries(snapshot.fields || {})) {
      const element = Array.from(form.elements || []).find(
        (item) => item.name === name,
      );
      if (!element || element.type === "file") continue;
      if (element.type === "checkbox") element.checked = Boolean(value);
      else element.value = value;
    }
  }

  function recordModalHasDraft() {
    const modal = recordModalState();
    const form = root.querySelector('[data-form="record"]');
    if (!modal || !form) return false;
    if (modal.pendingJobs || (modal.pendingAttachments || []).length) return true;
    const existing = modal.recordId
      ? state.workspace.records.find((record) => record.id === modal.recordId)
      : null;
    const defaults = recordModalDefaults(modal, existing);
    const baseline = {
      type: defaults.type,
      stageSlug: defaults.stageSlug,
      status: defaults.status,
      priority: defaults.priority,
      title: defaults.title,
      content: defaults.content,
      tags: defaults.tags.join(", "),
      dueAt: defaults.dueAt,
    };
    return Object.entries(baseline).some(([name, value]) => {
      const element = Array.from(form.elements || []).find(
        (item) => item.name === name,
      );
      return element && String(element.value) !== String(value);
    });
  }

  function suspendRecordDraftForImport() {
    const modal = recordModalState();
    if (!modal) return;
    state.suspendedRecordDraft = {
      modal,
      form: snapshotRecordForm(),
    };
  }

  function restoreSuspendedRecordDraft() {
    const suspended = state.suspendedRecordDraft;
    if (!suspended) return false;
    state.suspendedRecordDraft = null;
    state.modal = suspended.modal;
    render();
    restoreRecordForm(suspended.form);
    focusRecordModal();
    return true;
  }

  function closeModal() {
    if (
      state.modal &&
      (state.modal.type === "import" || state.modal.type === "import-report")
    ) {
      cancelPendingImport();
      return;
    }
    if (
      recordModalHasDraft() &&
      !global.confirm("这条记录还有未提交的修改，确定关闭并丢弃吗？")
    ) {
      return;
    }
    const returnFocus = modalReturnFocus;
    modalReturnFocus = null;
    state.modal = null;
    render();
    if (returnFocus && returnFocus.element && returnFocus.element.isConnected) {
      returnFocus.element.focus();
    } else if (returnFocus && returnFocus.action) {
      const candidate = Array.from(
        root.querySelectorAll(`[data-action="${returnFocus.action}"]`),
      ).find(
        (element) =>
          (!returnFocus.stage ||
            element.dataset.stage === returnFocus.stage) &&
          (!returnFocus.gateId ||
            element.dataset.gateId === returnFocus.gateId) &&
          (!returnFocus.focusOrigin ||
            element.dataset.focusOrigin === returnFocus.focusOrigin) &&
          (!returnFocus.targetStatus ||
            element.dataset.targetStatus === returnFocus.targetStatus) &&
          (!returnFocus.approvalMode ||
            element.dataset.approvalMode === returnFocus.approvalMode) &&
          (!returnFocus.decision ||
            element.dataset.decision === returnFocus.decision),
      );
      if (candidate) candidate.focus();
    }
  }

  function openAuditModal(modal, trigger) {
    modalReturnFocus = trigger
      ? {
          element: trigger,
          action: trigger.dataset.action || "",
          stage: trigger.dataset.stage || "",
          gateId: trigger.dataset.gateId || "",
          focusOrigin: trigger.dataset.focusOrigin || "",
          targetStatus: trigger.dataset.targetStatus || "",
          approvalMode: trigger.dataset.approvalMode || "",
          decision: trigger.dataset.decision || "",
        }
      : { element: document.activeElement };
    state.modal = modal;
    render();
    const dialog = root.querySelector(
      "[data-gate-result-dialog], [data-stage-execution-dialog], [data-stage-approval-dialog], [data-stage-override-dialog]",
    );
    const autofocus = dialog && dialog.querySelector("[autofocus]");
    if (autofocus) autofocus.focus();
    else if (dialog) dialog.focus();
  }

            ? `<button

  function renderMigrationReportModal() {
    const pending = state.pendingImport;
    const report = pending && pending.report ? pending.report : {};
    const canConfirm = Boolean(report.safe && report.canImport);
    const countKeys = [
      ["runs", "Run"],
      ["stages", "Stage"],
      ["gates", "Gate"],
      ["records", "Record"],
      ["attachments", "Attachment"],
    ];
    const before = report.beforeCounts || {};
    const after = report.afterCounts || {};
    const conservation = report.sourceConservation || {};
    const assignments = reportItems(report, "templateAssignments").map(
      (assignment) => {
        if (!assignment || typeof assignment !== "object") return assignment;
        return {
          ...assignment,
          message: `${assignment.runId || "未知 Run"}：${
            assignment.before || "未声明"
          } → ${assignment.after || "未识别"}${
            assignment.basis ? `（${assignment.basis}）` : ""

    );

              "模板判定",

              "info",
              "template-assignments",
            )}
            ${renderMigrationList(
              "新增的规范阶段",
              report.insertedStages,
              "没有新增阶段；现有阶段身份保持不变。",
              "info",
              "inserted-stages",
            )}
            ${renderMigrationList(
              "历史 / Legacy 保留",
              report.legacyPreservations,
              "没有对象需要转入 Legacy 区域。",
              "info",
              "legacy-preservations",
            )}
            ${renderMigrationList(
              "提醒",
              report.warnings,
              "没有额外提醒。",
              "warning",
              "warnings",
            )}
            ${renderMigrationList(
              "阻断原因",
              report.blockingErrors,
              "没有阻断原因。",
              canConfirm ? "safe" : "danger",
              "blocking-errors",
            )}
            ${renderMigrationList(
              "丢弃清单",
              report.discardedItems,
              "空：没有任何对象会被丢弃。",
              canConfirm ? "safe" : "danger",

            <button class="btn" type="button" data-action="cancel-import-preview">取消，保留当前工作区</button>
            <button
              class="btn btn-primary"

  function renderConflictModal() {

      <div class="modal" role="presentation">
        <button class="modal-backdrop" type="button" data-action="close-modal" aria-label="关闭"></button>

  function renderSyncConfirmModal() {
    return `
      <div class="modal" role="presentation">
        <button class="modal-backdrop" type="button" data-action="close-modal" aria-label="关闭"></button>
        <section class="modal-card" role="alertdialog" aria-modal="true" aria-labelledby="sync-confirm-title">

          <p>直接同步会用云端版本替换当前本地草稿。可以先保存，或先导出备份再读取云端。</p>

            <button class="btn" type="button" data-action="export">导出草稿</button>

          </footer>

  function modalContext(modal) {
    const run =
      state.workspace &&
      state.workspace.runs.find((item) => item.id === modal.runId);
    const stage =
      run && (run.stages || []).find((item) => item.slug === modal.stageSlug);
    return { run, stage };
  }

  function localDateTimeValue(value) {
    const date = value ? new Date(value) : new Date();
    if (Number.isNaN(date.getTime())) return "";
    const shifted = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
    return shifted.toISOString().slice(0, 16);
  }

  function dateTimeFromForm(value) {
    if (!value) return Model.now();
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? Model.now() : date.toISOString();
  }

  function renderFormFindings(findings) {
    if (!Array.isArray(findings) || !findings.length) return "";
    return `
      <ul class="form-findings" role="alert" data-form-findings tabindex="-1">
        ${findings
          .map((finding) => `<li>${escapeHtml(findingText(finding))}</li>`)
          .join("")}
      </ul>
    `;
  }

  function evidenceChoices(runId, stageSlug, selectedIds = []) {
    const selected = new Set(selectedIds || []);
    const records = state.workspace.records.filter(
      (record) =>
        record.runId === runId && record.stageSlug === stageSlug,
    );
    const recordIds = new Set(records.map((record) => record.id));
    const options = records.map((record) => ({
      id: `record:${record.id}`,
      title: record.title || "未命名记录",
      meta: `Record · ${Model.RECORD_TYPES[record.type]?.label || record.type || "unknown"}`,
    }));
    for (const attachment of state.workspace.attachments || []) {
      if (!recordIds.has(attachment.recordId)) continue;
      options.push({
        id: `attachment:${attachment.id}`,
        title: attachment.name || "未命名附件",
        meta: `Attachment · ${Math.max(1, Math.round(Number(attachment.size || 0) / 1024))} KiB`,
      });
    }
    if (!options.length) {
      return '<p class="evidence-empty">此阶段还没有可引用的 Record 或附件。请先在阶段记录中添加证据。</p>';
    }
    return options
      .map(
        (option) => `
          <label class="evidence-option">
            <input type="checkbox" name="evidenceIds" value="${escapeHtml(option.id)}" ${
              selected.has(option.id) ? "checked" : ""
            } />
            <span>
              <strong>${escapeHtml(option.title)}</strong>
              <small>${escapeHtml(option.meta)} · ${escapeHtml(option.id)}</small>
            </span>
          </label>
        `,
      )
      .join("");
  }

  function renderGateResultModal(modal) {
    const { run, stage } = modalContext(modal);
    const gate =
      stage && (stage.gates || []).find((item) => item.id === modal.gateId);
    if (!run || !stage || !gate) return "";
    const definition = gate.definition || {};
    const result = currentGateResult(gate);
    const status = modal.status || (result && result.status) || "pending";
    const selectedEvidence = result ? result.evidenceIds || [] : [];
    const waiver = (result && result.waiver) || {};
    const results = Array.isArray(gate.results) ? gate.results : [];
    return `
      <div class="modal" role="presentation">
        <button class="modal-backdrop" type="button" data-action="close-modal" aria-label="关闭 Gate 检查"></button>
        <section class="modal-card modal-gate-result" role="dialog" aria-modal="true" aria-labelledby="gate-result-title" data-gate-result-dialog>
          <header>
            <div>
              <p class="eyebrow">GATE 2.0 · APPEND-ONLY RESULT</p>
              <h2 id="gate-result-title">${escapeHtml(definition.label || gate.label || gate.id)}</h2>
              <p>提交会新增一个结果版本，不会覆盖旧结果。</p>
            </div>
            <button class="btn btn-icon" type="button" data-action="close-modal" aria-label="关闭">×</button>
          </header>
          <form data-form="gate-result" data-run-id="${escapeHtml(run.id)}" data-stage="${escapeHtml(stage.slug)}" data-gate-id="${escapeHtml(gate.id)}">
            ${renderFormFindings(modal.findings)}
            <section class="form-section">
              <header><h3>只读规则定义</h3><p>公司规则在本批次不可编辑。</p></header>
              <div class="gate-definition-grid">
                <div><span>规则版本</span><strong>${escapeHtml(definition.ruleVersion || "legacy")}</strong></div>
                <div><span>严重程度</span><strong>${escapeHtml(SEVERITY_LABEL[definition.severity] || definition.severity || "Info")}</strong></div>
                <div><span>Operator</span><strong>${escapeHtml(definition.operator || "manual")}</strong></div>
                <div><span>Expected</span><strong>${escapeHtml(formatRuleValue(definition.expected))}${definition.unit ? ` ${escapeHtml(definition.unit)}` : ""}</strong></div>
                <div class="field-span-2"><span>必需证据类型</span><strong>${escapeHtml((definition.requiredEvidenceTypes || []).join("、") || "无")}</strong></div>
              </div>
            </section>
            <section class="form-section">
              <header><h3>本次检查结果</h3><p>场景、实测值和身份会随本次 revision 固化。</p></header>
              <div class="gate-result-grid">
                <label class="field">
                  <span>结果状态</span>
                  <select name="status" data-action="gate-result-status" required autofocus>
                    ${Object.entries(GATE_RESULT_META)
                      .map(
                        ([value, meta]) =>
                          `<option value="${escapeHtml(value)}" ${value === status ? "selected" : ""}>${escapeHtml(meta.label)}</option>`,
                      )
                      .join("")}
                  </select>
                </label>
                <label class="field">
                  <span>Actual / 实测值</span>
                  <input name="actual" value="${escapeHtml(result && result.actual != null ? formatRuleValue(result.actual) : "")}" placeholder="人工复核可填写结论；数值规则填写数值" />
                </label>
                <label class="field">
                  <span>Mode</span>
                  <input name="mode" maxlength="120" value="${escapeHtml((result && result.mode) || "")}" placeholder="例如 functional" />
                </label>
                <label class="field">
                  <span>Corner</span>
                  <input name="corner" maxlength="120" value="${escapeHtml((result && result.corner) || "")}" placeholder="例如 ss_0p72v_125c" />
                </label>
                <label class="field field-span-2">
                  <span>Scenario</span>
                  <input name="scenario" maxlength="200" value="${escapeHtml((result && result.scenario) || "")}" placeholder="本次检查覆盖的场景" />
                </label>
                <label class="field">
                  <span>检查人</span>
                  <input name="checkedBy" required maxlength="120" value="${escapeHtml((result && result.checkedBy) || "")}" autocomplete="name" />
                </label>
                <label class="field">
                  <span>检查时间</span>
                  <input name="checkedAt" type="datetime-local" required value="${escapeHtml(localDateTimeValue(result && result.checkedAt))}" />
                </label>
                <label class="field">
                  <span>复核人</span>
                  <input name="reviewedBy" maxlength="120" value="${escapeHtml((result && result.reviewedBy) || "")}" />
                </label>
                <label class="field">
                  <span>复核时间</span>
                  <input name="reviewedAt" type="datetime-local" value="${escapeHtml(localDateTimeValue(result && result.reviewedAt))}" />
                </label>
              </div>
              <p class="self-review-warning">Critical / Blocker Gate 的处置需要复核人；检查人与复核人相同时会保留自审风险提示。</p>
            </section>
            <section class="form-section">
              <header><h3>证据引用</h3><p>引用使用明确的 record: 或 attachment: 命名空间，只允许当前 Run 和 Stage 的证据。</p></header>
              <div class="evidence-picker">
                ${evidenceChoices(run.id, stage.slug, selectedEvidence)}
              </div>
            </section>
            <section class="conditional-fields" data-waiver-fields ${status === "waived" ? "" : "hidden"}>
              <label class="field field-span-2">
                <span>Waiver 原因</span>
                <textarea name="waiverReason" rows="3" maxlength="2000">${escapeHtml(waiver.reason || "")}</textarea>
              </label>
              <label class="field">
                <span>Waiver 批准人</span>
                <input name="waiverApprovedBy" maxlength="120" value="${escapeHtml(waiver.approvedBy || "")}" />
              </label>
              <label class="field">
                <span>批准时间</span>
                <input name="waiverApprovedAt" type="datetime-local" value="${escapeHtml(localDateTimeValue(waiver.approvedAt))}" />
              </label>
              <label class="field field-span-2">
                <span>到期时间（可选）</span>
                <input name="waiverExpiresAt" type="datetime-local" value="${waiver.expiresAt ? escapeHtml(localDateTimeValue(waiver.expiresAt)) : ""}" />
              </label>
            </section>
            <section class="conditional-fields" data-not-applicable-fields ${status === "not_applicable" ? "" : "hidden"}>
              <label class="field field-span-2">
                <span>不适用原因</span>
                <textarea name="notApplicableReason" rows="3" maxlength="2000">${escapeHtml((result && result.notApplicableReason) || "")}</textarea>
              </label>
              <p class="field-span-2">只有定义明确允许 N/A，并且填写原因和复核信息时才能提交。</p>
            </section>
            ${
              results.length
                ? `
                  <section class="form-section">
                    <header><h3>历史结果</h3><p>旧 revision 只读保留。</p></header>
                    <ol class="gate-history">
                      ${results
                        .slice()
                        .reverse()
                        .map((item) => {
                          const meta = gateResultMeta(item.status);
                          return `<li>
                            <strong>Rev ${escapeHtml(item.revision)}</strong>
                            <span class="gate-result-pill is-${escapeHtml(meta.tone)}">${escapeHtml(meta.label)}</span>
                            <span>${escapeHtml(item.checkedBy || "未检查")} · ${escapeHtml(formatDate(item.checkedAt || item.createdAt))}</span>
                          </li>`;
                        })
                        .join("")}
                    </ol>
                  </section>
                `
                : ""
            }
            <footer class="modal-actions">
              <button class="btn" type="button" data-action="close-modal">取消</button>
              <button class="btn btn-primary" type="submit">新增结果 revision</button>
            </footer>
          </form>
        </section>
      </div>
    `;
  }

  function renderStageExecutionModal(modal) {
    const { run, stage } = modalContext(modal);
    if (!run || !stage) return "";
    const target = modal.targetStatus;
    const targetMeta = axisMeta("execution", target);
    const current = deriveAssessment(run, stage).executionStatus;
    const reopen = current === "completed" && target === "in_progress";
    return `
      <div class="modal" role="presentation">
        <button class="modal-backdrop" type="button" data-action="close-modal" aria-label="关闭执行状态表单"></button>
        <section class="modal-card modal-stage-action" role="dialog" aria-modal="true" aria-labelledby="stage-execution-title" data-stage-execution-dialog>

            <div><p class="eyebrow">EXECUTION TRANSITION</p><h2 id="stage-execution-title">更新执行状态：${escapeHtml(targetMeta.label)}</h2></div>
            <button class="btn btn-icon" type="button" data-action="close-modal" aria-label="关闭">×</button>
          </header>
          <form data-form="stage-execution" data-run-id="${escapeHtml(run.id)}" data-stage="${escapeHtml(stage.slug)}" data-target-status="${escapeHtml(target)}">
            ${renderFormFindings(modal.findings)}
            <p>从「${escapeHtml(axisMeta("execution", current).label)}」转换到「${escapeHtml(targetMeta.label)}」。该操作只改变执行轴。</p>

              <label class="field">
                <span>操作人</span>
                <input name="actor" required maxlength="120" autofocus />

              <label class="field">
                <span>操作时间</span>
                <input name="at" type="datetime-local" required value="${escapeHtml(localDateTimeValue())}" />
              </label>
              <label class="field field-span-2">
                <span>${reopen ? "重新打开原因" : "状态说明"}</span>
                <textarea name="reason" rows="4" maxlength="2000" ${reopen || target === "blocked" ? "required" : ""}></textarea>
              </label>
            </div>
            <footer class="modal-actions">
              <button class="btn" type="button" data-action="close-modal">取消</button>
              <button class="btn ${target === "blocked" ? "btn-danger" : "btn-primary"}" type="submit">确认转换</button>
            </footer>
          </form>
        </section>
      </div>
    `;
  }

  function renderStageApprovalModal(modal) {
    const { run, stage } = modalContext(modal);
    if (!run || !stage) return "";
    const request = modal.mode === "request";
    const decision = modal.decision || "approved";
    return `
      <div class="modal" role="presentation">
        <button class="modal-backdrop" type="button" data-action="close-modal" aria-label="关闭批准表单"></button>
        <section class="modal-card modal-stage-action" role="dialog" aria-modal="true" aria-labelledby="stage-approval-title" data-stage-approval-dialog>
          <header>
            <div>
              <p class="eyebrow">APPROVAL AUDIT</p>
              <h2 id="stage-approval-title">${request ? "申请阶段批准" : decision === "approved" ? "批准阶段" : "驳回阶段"}</h2>
            </div>
            <button class="btn btn-icon" type="button" data-action="close-modal" aria-label="关闭">×</button>
          </header>
          <form data-form="stage-approval" data-run-id="${escapeHtml(run.id)}" data-stage="${escapeHtml(stage.slug)}" data-approval-mode="${request ? "request" : "decision"}" data-decision="${escapeHtml(decision)}">
            ${renderFormFindings(modal.findings)}
            <p>${request ? "状态机会先检查执行、Gate、证据、Critical Issue 和前置阶段。" : "决定会追加到批准历史；后续输入变化会让批准自动变为 stale。"}</p>
            <div class="stage-action-grid">
              <label class="field">
                <span>${request ? "申请人" : "批准 / 驳回人"}</span>
                <input name="actor" required maxlength="120" autofocus />
              </label>
              <label class="field">
                <span>${request ? "申请时间" : "决定时间"}</span>
                <input name="at" type="datetime-local" required value="${escapeHtml(localDateTimeValue())}" />
              </label>
              ${
                request
                  ? ""
                  : `<label class="field field-span-2">
                      <span>${decision === "rejected" ? "驳回原因" : "决定说明（可选）"}</span>
                      <textarea name="reason" rows="4" maxlength="2000" ${decision === "rejected" ? "required" : ""}></textarea>
                    </label>`
              }
            </div>
            <footer class="modal-actions">
              <button class="btn" type="button" data-action="close-modal">取消</button>
              <button class="btn ${decision === "rejected" ? "btn-danger" : "btn-primary"}" type="submit">${request ? "提交申请" : decision === "approved" ? "确认批准" : "确认驳回"}</button>
            </footer>
          </form>
        </section>
      </div>
    `;
  }

  function renderStageOverrideModal(modal) {

    if (!run || !stage) return "";
    const assessment = deriveAssessment(run, stage);
    const blockers = (assessment.blockers || []).filter(
      (item) => item.overrideable,
    );
    return `
      <div class="modal" role="presentation">
        <button class="modal-backdrop" type="button" data-action="close-modal" aria-label="关闭 Override 表单"></button>
        <section class="modal-card modal-stage-action" role="dialog" aria-modal="true" aria-labelledby="stage-override-title" data-stage-override-dialog>
          <header>
            <div><p class="eyebrow">CONTROLLED EXCEPTION</p><h2 id="stage-override-title">申请 Stage Override</h2></div>
            <button class="btn btn-icon" type="button" data-action="close-modal" aria-label="关闭">×</button>

              <ul class="stage-blocker-list">

            <div class="stage-action-grid">

              <label class="field">
                <span>批准时间</span>
                <input name="approvedAt" type="datetime-local" required value="${escapeHtml(localDateTimeValue())}" />
              </label>
              <label class="field field-span-2">
                <span>到期时间（可选）</span>
                <input name="expiresAt" type="datetime-local" />
