        COMPANY_STAGE_SET.has(slug) && !PRODUCTION_STAGE_SET.has(slug),
    );
    const slugSet = new Set(slugs);
    const isCompleteProduction = PRODUCTION_STAGE_SLUGS.every((slug) =>
      slugSet.has(slug),
    );
    if (!containsUnknown && !containsProductionOnly) {
      return {
        value: COMPANY_TEMPLATE_VERSION,
        basis: "recognized-company-stage-set",
      };
    }
    if (
      !containsUnknown &&
      containsProductionOnly &&
      !containsCompanyOnly &&
      isCompleteProduction
    ) {
      return {
        value: PRODUCTION_TEMPLATE_VERSION,
        basis: "recognized-production-stage-set",
      };
    }
    return {
      value: LEGACY_MIXED_TEMPLATE_VERSION,
      basis: "mixed-or-unknown-stage-set",
    };
  }

  function isValidRevision(value) {
    return (
      Number.isSafeInteger(value) &&
      value >= 0 &&
      value < Number.MAX_SAFE_INTEGER
    );
  }

  function isValidUpdatedAt(value) {
    return (
      typeof value === "string" &&
      Boolean(value) &&
      value === value.trim() &&
      Number.isFinite(Date.parse(value))
    );
  }

  function isRecognizedGate(value) {
    return (
      isObject(value) &&
      Boolean(canonicalIdentity(value.id)) &&
      typeof value.label === "string"
    );
  }

  function isRecognizedAttachmentV2(value) {
    if (
      !isObject(value) ||
      !canonicalIdentity(value.id) ||
      typeof value.dataUrl !== "string" ||
      !value.dataUrl.startsWith("data:")
    ) {
      return false;
    }
    const name = sanitizeFilename(value.name || "attachment");
    const extension = name.toLowerCase().split(".").pop();
    const size = Math.max(0, Number(value.size) || 0);
    const dataMime = /^data:([^;,]*)(?:;base64)?,/i.exec(value.dataUrl);
    const mime = String(
      value.mime ||
        (dataMime && dataMime[1]) ||
        "application/octet-stream",
    )
      .toLowerCase()
      .slice(0, 120);
    return Boolean(
      ALLOWED_ATTACHMENT_EXTENSIONS.has(extension) &&
        ALLOWED_ATTACHMENT_MIMES.has(mime) &&
        dataMime &&
        (!dataMime[1] ||
          ALLOWED_ATTACHMENT_MIMES.has(dataMime[1].toLowerCase())) &&
        size <= MAX_ATTACHMENT_BYTES &&
        value.dataUrl.length <= MAX_ATTACHMENT_BYTES * 1.5 + 2048,
    );
  }

  function migrateV1ToV2(workspace, existingReport) {
    const source = clone(workspace);
    const report =
      existingReport || createMigrationReport(source.schemaVersion);
    const migratedEnvelope = clone(source);
    migratedEnvelope.schemaVersion = 2;
    const candidate = transformToWorkspaceV2(
      migratedEnvelope,
      report,
      1,
    );
    if (!report.appliedMigrationIds.includes("workspace-v1-to-v2")) {
      report.appliedMigrationIds.push("workspace-v1-to-v2");
    }
    if (!existingReport) {
      finalizeMigrationReportV2(source, candidate, report);
    }
    return { candidate, report };
  }

  function migrateV2ToV3(workspace, existingReport) {
    const source = clone(workspace);
    const report =
      existingReport || createMigrationReport(source.schemaVersion);
    if (!report.conservationLedger.length) {
      inspectWorkspaceV2(source, report);
    }
    const candidate = transformToWorkspaceV3(source, report);
    if (!report.appliedMigrationIds.includes("workspace-v2-to-v3")) {
      report.appliedMigrationIds.push("workspace-v2-to-v3");
    }
    if (!existingReport) {
      finalizeMigrationReportV2(source, candidate, report);
    }
    return { candidate, report };
  }

  const MIGRATION_REGISTRY = Object.freeze([
    Object.freeze({
      id: "workspace-v1-to-v2",
      fromVersion: 1,
      toVersion: 2,
      migrate: migrateV1ToV2,
    }),
    Object.freeze({
      id: "workspace-v2-to-v3",
      fromVersion: 2,
      toVersion: 3,
      migrate: migrateV2ToV3,
    }),
  ]);

  function transformToWorkspaceV2(source, report, sourceSchemaVersion) {
    const candidate = {
      ...clone(source),
      schemaVersion: PREVIOUS_SCHEMA_VERSION,
      runs: [],
      records: [],
      attachments: [],
      legacy: copyLegacyStore(source.legacy),
    };
    reapplyPreservedWorkspaceBlocks(candidate.legacy, report);
    if (!hasOwn(source, "revision")) {
      candidate.revision = 0;
      addWarning(
        report,
        "MISSING_REVISION_DEFAULTED",
        "$.revision",
        "v1 缺少 revision，已确定性补为 0。",
      );
    } else if (!isValidRevision(source.revision)) {
      preserveInvalidWorkspaceField(candidate.legacy, report, {
        sourcePath: "$.revision",
        field: "revision",
        value: source.revision,
        blockingCode: "INVALID_REVISION",
        message:
          "revision 必须是仍有递增空间的非负安全整数（小于 Number.MAX_SAFE_INTEGER）；原值已保留。",
      });
    }
    if (!hasOwn(source, "updatedAt")) {
      const runTimestamp = (
        Array.isArray(source.runs) ? source.runs : []
      ).find(
        (run) => isObject(run) && isValidUpdatedAt(run.updatedAt),
      );
      candidate.updatedAt = runTimestamp
        ? runTimestamp.updatedAt
        : "1970-01-01T00:00:00.000Z";
      addWarning(
        report,
        "MISSING_UPDATED_AT_DEFAULTED",
        "$.updatedAt",
        "v1 缺少 updatedAt，已从 Run 时间或固定纪元确定性补齐。",
      );
    } else if (!isValidUpdatedAt(source.updatedAt)) {
      preserveInvalidWorkspaceField(candidate.legacy, report, {
        sourcePath: "$.updatedAt",
        field: "updatedAt",
        value: source.updatedAt,
        blockingCode: "INVALID_UPDATED_AT",
        message: "updatedAt 必须是有效且无首尾空格的日期字符串；原值已保留。",
      });
    }
    if (hasOwn(source, "legacy") && !isObject(source.legacy)) {
      preserveInvalidWorkspaceField(candidate.legacy, report, {
        sourcePath: "$.legacy",
        field: "legacy",
        value: source.legacy,
        blockingCode: "INVALID_LEGACY_STORE",
        message: "legacy 必须是对象；原值已保留，修复前禁止导入或保存。",
      });
    } else if (isObject(source.legacy)) {
      for (const category of [
        "stages",
        "gates",
        "records",
        "attachments",
        "workspaceFields",
      ]) {
        if (
          hasOwn(source.legacy, category) &&
          !Array.isArray(source.legacy[category])
        ) {
          preserveInvalidWorkspaceField(candidate.legacy, report, {
            sourcePath: `$.legacy.${category}`,
            field: `legacy.${category}`,
            value: source.legacy[category],
            blockingCode: "INVALID_COLLECTION",
            message: `legacy.${category} 必须是数组；原值已保留。`,
          });
        }
      }
    }
    for (const category of ["records", "attachments"]) {
      if (hasOwn(source, category) && !Array.isArray(source[category])) {
        preserveInvalidWorkspaceField(candidate.legacy, report, {
          sourcePath: `$.${category}`,
          field: category,
          value: source[category],
          blockingCode: "INVALID_COLLECTION",
          message: `${category} 必须是数组；原值已保留。`,
        });
      }
    }
    if (hasOwn(source, "runs") && !Array.isArray(source.runs)) {
      preserveInvalidWorkspaceField(candidate.legacy, report, {
        sourcePath: "$.runs",
        field: "runs",
        value: source.runs,
        blockingCode: "INVALID_COLLECTION",
        message: "runs 必须是数组；原值已保留。",
      });
    }
    if (!Array.isArray(source.runs) || source.runs.length === 0) {
      addBlocking(
        report,
        "MISSING_RUNS",
        "$.runs",
        null,
        "工作区必须至少包含一个可追溯的 Run；禁止自动创建替代历史。",
      );
    }
    const initialLegacyLengths = {};
    for (const category of ["stages", "gates", "records", "attachments"]) {
      initialLegacyLengths[category] = candidate.legacy[category].length;
      for (
        let index = 0;
        index < initialLegacyLengths[category];
        index += 1
      ) {
        const entry = candidate.legacy[category][index];
        const value = isObject(entry) && hasOwn(entry, "value")
          ? entry.value
          : entry;
        const identity =
          category === "stages"
            ? `${canonicalIdentity(entry && entry.runId)}::${canonicalIdentity(
                entry && (entry.stageSlug || (value && value.slug)),
              )}`
            : canonicalIdentity(value && value.id);
        addLedger(
          report,
          `$.legacy.${category}[${index}]`,
          category.slice(0, -1),
          identity,
          "legacy",
          `$.legacy.${category}[${index}]`,
          value,
        );
      }
    }

    const sourceRuns = Array.isArray(source.runs) ? source.runs : [];
    for (let runIndex = 0; runIndex < sourceRuns.length; runIndex += 1) {
      const rawRun = sourceRuns[runIndex];
      const runPath = `$.runs[${runIndex}]`;
      if (!isObject(rawRun)) {
        candidate.runs.push(clone(rawRun));
        addLedger(
          report,
          runPath,
          "run",
          null,
          "active",
          `$.runs[${candidate.runs.length - 1}]`,
          rawRun,
        );
        addBlocking(
          report,
          "INVALID_RUN_ID",
          runPath,
          null,
          "Run 不是带稳定 ID 的对象，无法证明无损迁移。",
        );
        continue;
      }
      const runId = canonicalIdentity(rawRun.id);
      if (
        hasOwn(rawRun, "templateVersion") &&
        !(
          typeof rawRun.templateVersion === "string" &&
          rawRun.templateVersion.trim()
        )
      ) {
        preserveInvalidWorkspaceField(candidate.legacy, report, {
          sourcePath: `${runPath}.templateVersion`,
          field: "templateVersion",
          runId,
          value: rawRun.templateVersion,
          blockingCode: "INVALID_TEMPLATE_VERSION",
          message:
            "v1 Run 的 templateVersion 已存在但不是非空字符串；原值已保留。",
        });
      }
      if (hasOwn(rawRun, "stages") && !Array.isArray(rawRun.stages)) {
        preserveInvalidWorkspaceField(candidate.legacy, report, {
          sourcePath: `${runPath}.stages`,
          field: "stages",
          runId,
          value: rawRun.stages,
          blockingCode: "INVALID_COLLECTION",
          message: "Run.stages 必须是数组；原值已保留。",
        });
      }
      const assignment = inferTemplateVersion(rawRun);
      report.templateAssignments.push({
        runId: runId || null,
        before:
          typeof rawRun.templateVersion === "string" &&
          rawRun.templateVersion.trim()
            ? rawRun.templateVersion
            : null,
        after: assignment.value,
        basis: assignment.basis,
      });
      if (
        sourceSchemaVersion === PREVIOUS_SCHEMA_VERSION &&
        !(
          typeof rawRun.templateVersion === "string" &&
          rawRun.templateVersion.trim()
        )
      ) {
        addBlocking(
          report,
          "MISSING_TEMPLATE_VERSION",
          `${runPath}.templateVersion`,
          runId,
          "Schema v2 Run 缺少 templateVersion。",
        );
      }
      const outputRun = {
        ...clone(rawRun),
        templateVersion: assignment.value,
        stages: [],
      };
      const sourceStages = Array.isArray(rawRun.stages) ? rawRun.stages : [];
      for (
        let stageIndex = 0;
        stageIndex < sourceStages.length;
        stageIndex += 1
      ) {
        const rawStage = sourceStages[stageIndex];
        const stagePath = `${runPath}.stages[${stageIndex}]`;
        const stageSlug =
          isObject(rawStage) && typeof rawStage.slug === "string"
            ? rawStage.slug
            : "";
        const canonicalSlug = canonicalIdentity(stageSlug);
        const recognizedForTemplate =
          assignment.value === COMPANY_TEMPLATE_VERSION
            ? COMPANY_STAGE_SET.has(canonicalSlug)
            : assignment.value === PRODUCTION_TEMPLATE_VERSION
              ? PRODUCTION_STAGE_SET.has(canonicalSlug)
              : RECOGNIZED_HISTORICAL_STAGE_SET.has(canonicalSlug);
        if (!isObject(rawStage) || !canonicalSlug || !recognizedForTemplate) {
          addLegacy(
            candidate.legacy,
            "stages",
            report,
            {
              sourcePath: stagePath,
              sourceIdentity: `${runId}::${canonicalSlug}`,
              runId,
              stageSlug: canonicalSlug,
            },
            rawStage,
          );
          const rawGates = Array.isArray(rawStage && rawStage.gates)
            ? rawStage.gates
            : [];
          for (
            let gateIndex = 0;
            gateIndex < rawGates.length;
            gateIndex += 1
          ) {
            const rawGate = rawGates[gateIndex];
            addLegacy(
              candidate.legacy,
              "gates",
              report,
              {
                sourcePath: `${stagePath}.gates[${gateIndex}]`,
                sourceIdentity: `${runId}::${canonicalSlug}::${canonicalIdentity(
                  rawGate && rawGate.id,
                )}`,
                runId,
                stageSlug: canonicalSlug,
              },
              rawGate,
            );
          }
          continue;
        }
        const outputStage = { ...clone(rawStage) };
        if (!hasOwn(rawStage, "gates")) {
          outputStage.gates = [];
          addWarning(
            report,
            "MISSING_GATES_DEFAULTED",
            `${stagePath}.gates`,
            "v1 Stage 缺少 gates 字段，已确定性补为空数组。",
          );
        } else if (!Array.isArray(rawStage.gates)) {
          preserveInvalidWorkspaceField(candidate.legacy, report, {
            sourcePath: `${stagePath}.gates`,
            field: "gates",
            runId,
            value: rawStage.gates,
            blockingCode: "INVALID_COLLECTION",
            message: "Stage.gates 已存在但不是数组；原值已保留。",
          });
          outputStage.gates = [];
        } else {
          outputStage.gates = [];
          for (
            let gateIndex = 0;
            gateIndex < rawStage.gates.length;
            gateIndex += 1
          ) {
            const rawGate = rawStage.gates[gateIndex];
            const gatePath = `${stagePath}.gates[${gateIndex}]`;
            const gateIdentity = `${runId}::${canonicalSlug}::${canonicalIdentity(
              rawGate && rawGate.id,
            )}`;
            if (isRecognizedGate(rawGate)) {
              outputStage.gates.push(clone(rawGate));
              addLedger(
                report,
                gatePath,
                "gate",
                gateIdentity,
                "active",
                `$.runs[${candidate.runs.length}].stages[${outputRun.stages.length}].gates[${outputStage.gates.length - 1}]`,
                rawGate,
              );
            } else {
              addLegacy(
                candidate.legacy,
                "gates",
                report,
                {
                  sourcePath: gatePath,
                  sourceIdentity: gateIdentity,
                  runId,
                  stageSlug: canonicalSlug,
                },
                rawGate,
              );
            }
          }
        }
        outputRun.stages.push(outputStage);
        const destinationPath = `$.runs[${candidate.runs.length}].stages[${outputRun.stages.length - 1}]`;
        addLedger(
          report,
          stagePath,
          "stage",
          `${runId}::${canonicalSlug}`,
          "active",
          destinationPath,
          rawStage,
        );
        if (
          assignment.value !== COMPANY_TEMPLATE_VERSION &&
          !COMPANY_STAGE_SET.has(canonicalSlug)
        ) {
          report.legacyPreservations.push({
            kind: "stage",
            sourcePath: stagePath,
            destinationPath,
            disposition: "historical-active",
            runId,
            stageSlug: canonicalSlug,
            recordId: null,
          });
        }
      }
      if (assignment.value === COMPANY_TEMPLATE_VERSION) {
        const presentSlugs = new Set(
          outputRun.stages
            .map((stage) => canonicalIdentity(stage && stage.slug))
            .filter(Boolean),
        );
        const timestamp =
          typeof rawRun.updatedAt === "string" && rawRun.updatedAt
            ? rawRun.updatedAt
            : typeof source.updatedAt === "string" && source.updatedAt
              ? source.updatedAt
              : "1970-01-01T00:00:00.000Z";
        for (const template of STAGE_TEMPLATE) {
          if (presentSlugs.has(template.slug)) continue;
          outputRun.stages.push(createSchema2StageState(template, timestamp));
          report.insertedStages.push({
            runId,
            stageSlug: template.slug,
            reason: "missing-company-template-stage",
          });
        }
      }
      candidate.runs.push(outputRun);
      addLedger(
        report,
        runPath,
        "run",
        runId,
        "active",
        `$.runs[${candidate.runs.length - 1}]`,
        rawRun,
      );
    }

    const activeStageKeys = new Set();
    for (const run of candidate.runs) {
      if (!isObject(run)) continue;
      const runId = canonicalIdentity(run.id);
      for (const stage of Array.isArray(run.stages) ? run.stages : []) {
        if (!isObject(stage)) continue;
        activeStageKeys.add(`${runId}::${canonicalIdentity(stage.slug)}`);
      }
    }
    const allStageKeys = new Set(activeStageKeys);
    for (const entry of candidate.legacy.stages) {
      if (!isObject(entry)) continue;
      const value = hasOwn(entry, "value") ? entry.value : entry;
      allStageKeys.add(
        `${canonicalIdentity(entry.runId)}::${canonicalIdentity(
          entry.stageSlug || (value && value.slug),
        )}`,
      );
    }
    const runIds = new Set(
      candidate.runs
        .filter(isObject)
        .map((run) => canonicalIdentity(run.id))
        .filter(Boolean),
    );
    const sourceRecords = Array.isArray(source.records) ? source.records : [];
    const recordDisposition = new Map();
    const recordOwnership = new Map();
    for (
      let recordIndex = 0;
      recordIndex < sourceRecords.length;
      recordIndex += 1
    ) {
      const rawRecord = sourceRecords[recordIndex];
      const recordPath = `$.records[${recordIndex}]`;
      const recordId = canonicalIdentity(rawRecord && rawRecord.id);
      const runId = canonicalIdentity(rawRecord && rawRecord.runId);
      const stageSlug = canonicalIdentity(rawRecord && rawRecord.stageSlug);
      if (recordId && !recordOwnership.has(recordId)) {
        recordOwnership.set(recordId, { runId, stageSlug });
      }
      const invalidTags =
        isObject(rawRecord) &&
        hasOwn(rawRecord, "tags") &&
        !Array.isArray(rawRecord.tags);
      const invalidAttachmentIds =
        isObject(rawRecord) &&
        hasOwn(rawRecord, "attachmentIds") &&
        !Array.isArray(rawRecord.attachmentIds);
      if (invalidTags || invalidAttachmentIds) {
        addBlocking(
          report,
          "INVALID_COLLECTION",
          invalidTags
            ? `${recordPath}.tags`
            : `${recordPath}.attachmentIds`,
          recordId,
          "Record 的 tags 和 attachmentIds 在存在时必须是数组；原 Record 已转入 typed legacy。",
        );
      }
      const active =
        isObject(rawRecord) &&
        Boolean(RECORD_TYPES[rawRecord.type]) &&
        !invalidTags &&
        !invalidAttachmentIds &&
        runIds.has(runId) &&
        activeStageKeys.has(`${runId}::${stageSlug}`);
      if (active) {
        candidate.records.push(clone(rawRecord));
        recordDisposition.set(recordId, "active");
        addLedger(
          report,
          recordPath,
          "record",
          recordId,
          "active",
          `$.records[${candidate.records.length - 1}]`,
          rawRecord,
        );
      } else {
        const legacyRecord = addLegacy(
          candidate.legacy,
          "records",
          report,
          {
            sourcePath: recordPath,
            sourceIdentity: recordId,
            runId,
            stageSlug,
            recordId,
          },
          rawRecord,
        );
        if (invalidTags || invalidAttachmentIds) {
          legacyRecord.blockingCode = "INVALID_COLLECTION";
          legacyRecord.blockingMessage =
            "Record 的 tags 和 attachmentIds 形状无效，修复前禁止保存。";
        }
        recordDisposition.set(recordId, "legacy");
      }
    }
    for (
      let index = 0;
      index < initialLegacyLengths.records;
      index += 1
    ) {
      const entry = candidate.legacy.records[index];
      const value = isObject(entry) && hasOwn(entry, "value")
        ? entry.value
        : entry;
      const recordId = canonicalIdentity(value && value.id);
      recordDisposition.set(recordId, "legacy");
      if (recordId && !recordOwnership.has(recordId)) {
        recordOwnership.set(recordId, {
          runId: canonicalIdentity(
            (entry && entry.runId) || (value && value.runId),
          ),
          stageSlug: canonicalIdentity(
            (entry && entry.stageSlug) || (value && value.stageSlug),
          ),
        });
      }
    }

    const sourceAttachments = Array.isArray(source.attachments)
      ? source.attachments
      : [];
    for (
      let attachmentIndex = 0;
      attachmentIndex < sourceAttachments.length;
      attachmentIndex += 1
    ) {
      const rawAttachment = sourceAttachments[attachmentIndex];
      const attachmentPath = `$.attachments[${attachmentIndex}]`;
      const attachmentId = canonicalIdentity(rawAttachment && rawAttachment.id);
      const recordId = canonicalIdentity(rawAttachment && rawAttachment.recordId);
      const owner = recordOwnership.get(recordId);
      const active =
        isRecognizedAttachmentV2(rawAttachment) &&
        (!recordId || recordDisposition.get(recordId) === "active");
      if (active) {
        candidate.attachments.push(clone(rawAttachment));
        addLedger(
          report,
          attachmentPath,
          "attachment",
          attachmentId,
          "active",
          `$.attachments[${candidate.attachments.length - 1}]`,
          rawAttachment,
        );
      } else {
        addLegacy(
          candidate.legacy,
          "attachments",
          report,
          {
            sourcePath: attachmentPath,
            sourceIdentity: attachmentId,
            runId: owner ? owner.runId : null,
            stageSlug: owner ? owner.stageSlug : null,
            recordId,
          },
          rawAttachment,
        );
      }
    }

    validateCandidateIdentities(candidate, report);
    validateCanonicalCandidate(candidate, report);
    validateV2ActiveStructures(candidate, report);
    validateCandidateRelationships(candidate, report, runIds, allStageKeys);
    return candidate;
  }

  function collectCandidateObjects(candidate) {
    const collected = {
      runs: [],
      stages: [],
      gates: [],
      records: [],
      attachments: [],
    };
    const runs = Array.isArray(candidate.runs) ? candidate.runs : [];
    for (let runIndex = 0; runIndex < runs.length; runIndex += 1) {
      const run = runs[runIndex];
      collected.runs.push({ value: run, path: `$.runs[${runIndex}]` });
      if (!isObject(run)) continue;
      const runId = canonicalIdentity(run.id);
      const stages = Array.isArray(run.stages) ? run.stages : [];
      for (
        let stageIndex = 0;
        stageIndex < stages.length;
        stageIndex += 1
      ) {
        const stage = stages[stageIndex];
        const stageSlug = canonicalIdentity(stage && stage.slug);
        const stagePath = `$.runs[${runIndex}].stages[${stageIndex}]`;
        collected.stages.push({
          value: stage,
          path: stagePath,
          runId,
          stageSlug,
        });
        const gates = Array.isArray(stage && stage.gates) ? stage.gates : [];
        for (
          let gateIndex = 0;
          gateIndex < gates.length;
          gateIndex += 1
        ) {
          collected.gates.push({
            value: gates[gateIndex],
            path: `${stagePath}.gates[${gateIndex}]`,
            runId,
            stageSlug,
          });
        }
      }
    }
    const legacy = copyLegacyStore(candidate.legacy);
    for (const category of ["stages", "gates", "records", "attachments"]) {
      for (let index = 0; index < legacy[category].length; index += 1) {
        const entry = legacy[category][index];
        const value = isObject(entry) && hasOwn(entry, "value")
          ? entry.value
          : entry;
        collected[category].push({
          value,
          path: `$.legacy.${category}[${index}]`,
          runId: canonicalIdentity(entry && entry.runId),
          stageSlug: canonicalIdentity(
            entry && (entry.stageSlug || (value && value.slug)),
          ),
        });
      }
    }
    for (let index = 0; index < candidate.records.length; index += 1) {
      collected.records.push({
        value: candidate.records[index],
        path: `$.records[${index}]`,
      });
    }
    for (let index = 0; index < candidate.attachments.length; index += 1) {
      collected.attachments.push({
        value: candidate.attachments[index],
        path: `$.attachments[${index}]`,
      });
    }
    return collected;
  }

  function detectDuplicates(report, objects, code, identityFor) {
    const pathsByIdentity = new Map();
    for (const object of objects) {
      const identity = identityFor(object);
      if (!identity) {
        addBlocking(
          report,
          code.replace("DUPLICATE", "INVALID"),
          object.path,
          null,
          "对象缺少可验证的稳定身份。",
        );
        continue;
      }
      const paths = pathsByIdentity.get(identity) || [];
      paths.push(object.path);
      pathsByIdentity.set(identity, paths);
    }
    for (const [identity, paths] of pathsByIdentity) {
      if (paths.length < 2) continue;
      addBlocking(
        report,
        code,
        paths[0],
        identity,
        `稳定身份 ${identity} 重复，无法无损选择权威对象。`,
        paths,
      );
    }
  }

  function validateCandidateIdentities(candidate, report) {
    const objects = collectCandidateObjects(candidate);
    detectDuplicates(
      report,
      objects.runs,
      "DUPLICATE_RUN_ID",
      (item) => canonicalIdentity(item.value && item.value.id),
    );
    detectDuplicates(
      report,
      objects.stages,
      "DUPLICATE_STAGE_KEY",
      (item) =>
        item.runId && item.stageSlug
          ? `${item.runId}::${item.stageSlug}`
          : "",
    );
    detectDuplicates(
      report,
      objects.gates,
      "DUPLICATE_GATE_ID",
      (item) => {
        const gateId = canonicalIdentity(item.value && item.value.id);
        return item.runId && item.stageSlug && gateId
          ? `${item.runId}::${item.stageSlug}::${gateId}`
          : "";
      },
    );
    detectDuplicates(
      report,
      objects.records,
      "DUPLICATE_RECORD_ID",
      (item) => canonicalIdentity(item.value && item.value.id),
    );
    detectDuplicates(
      report,
      objects.attachments,
      "DUPLICATE_ATTACHMENT_ID",
      (item) => canonicalIdentity(item.value && item.value.id),
    );
  }

  function addCanonicalFinding(report, code, path, value, label) {
    if (
      typeof value === "string" &&
      value.length > 0 &&
      value === value.trim()
    ) {
      return;
    }
    addBlocking(
      report,
      code,
      path,
      canonicalIdentity(value),
      `${label} 必须是无首尾空格的非空字符串。`,
    );
  }

  function validateCanonicalCandidate(candidate, report) {
    const objects = collectCandidateObjects(candidate);
    for (const item of objects.runs) {
      addCanonicalFinding(
        report,
        "NON_CANONICAL_IDENTITY",
        `${item.path}.id`,
        item.value && item.value.id,
        "Run ID",
      );
      if (isObject(item.value) && hasOwn(item.value, "templateVersion")) {
        addCanonicalFinding(
          report,
          "NON_CANONICAL_IDENTITY",
          `${item.path}.templateVersion`,
          item.value.templateVersion,
          "templateVersion",
        );
      }
      if (isObject(item.value)) {
        addCanonicalFinding(
          report,
          "NON_CANONICAL_REFERENCE",
          `${item.path}.currentStageSlug`,
          item.value.currentStageSlug,
          "currentStageSlug",
        );
      }
    }
    for (const item of objects.stages) {
      addCanonicalFinding(
        report,
        "NON_CANONICAL_IDENTITY",
        `${item.path}.slug`,
        item.value && item.value.slug,
        "Stage slug",
      );
    }
    for (const item of objects.gates) {
      addCanonicalFinding(
        report,
        "NON_CANONICAL_IDENTITY",
        `${item.path}.id`,
        item.value && item.value.id,
        "Gate ID",
      );
    }
    for (const item of objects.records) {
      const record = item.value;
      addCanonicalFinding(
        report,
        "NON_CANONICAL_IDENTITY",
        `${item.path}.id`,
        record && record.id,
        "Record ID",
      );
      if (!isObject(record)) continue;
      addCanonicalFinding(
        report,
        "NON_CANONICAL_REFERENCE",
        `${item.path}.runId`,
        record.runId,
        "Record.runId",
      );
      addCanonicalFinding(
        report,
        "NON_CANONICAL_REFERENCE",
        `${item.path}.stageSlug`,
        record.stageSlug,
        "Record.stageSlug",
      );
      if (Array.isArray(record.attachmentIds)) {
        for (let index = 0; index < record.attachmentIds.length; index += 1) {
          addCanonicalFinding(
            report,
            "NON_CANONICAL_REFERENCE",
            `${item.path}.attachmentIds[${index}]`,
            record.attachmentIds[index],
            "Record attachment reference",
          );
        }
      }
    }
    for (const item of objects.attachments) {
      const attachment = item.value;
      addCanonicalFinding(
        report,
        "NON_CANONICAL_IDENTITY",
        `${item.path}.id`,
        attachment && attachment.id,
        "Attachment ID",
      );
      if (
        isObject(attachment) &&
        hasOwn(attachment, "recordId") &&
        attachment.recordId !== null
      ) {
        addCanonicalFinding(
          report,
          "NON_CANONICAL_REFERENCE",
          `${item.path}.recordId`,
          attachment.recordId,
          "Attachment.recordId",
        );
      }
    }

    if (
      !hasOwn(candidate, "activeRunId") ||
      typeof candidate.activeRunId !== "string" ||
      !candidate.activeRunId.trim()
    ) {
      addBlocking(
        report,
        "MISSING_ACTIVE_RUN",
        "$.activeRunId",
        null,
        "工作区缺少有效 activeRunId。",
      );
      return;
    }
    addCanonicalFinding(
      report,
      "NON_CANONICAL_REFERENCE",
      "$.activeRunId",
      candidate.activeRunId,
      "activeRunId",
    );
    const exactRunIds = new Set(
      (Array.isArray(candidate.runs) ? candidate.runs : [])
        .filter(isObject)
        .map((run) => run.id),
    );
    if (!exactRunIds.has(candidate.activeRunId)) {
      addBlocking(
        report,
        "ORPHAN_ACTIVE_RUN",
        "$.activeRunId",
        candidate.activeRunId,
        "activeRunId 没有精确匹配任何 Run ID。",
      );
    }
  }

  function validateV2CollectionShapes(candidate, report) {
    if (!isValidRevision(candidate.revision)) {
      addBlocking(
        report,
        "INVALID_REVISION",
        "$.revision",
        null,
        "Schema v2 revision 必须是仍有递增空间的非负安全整数（小于 Number.MAX_SAFE_INTEGER）。",
      );
    }
    if (!isValidUpdatedAt(candidate.updatedAt)) {
      addBlocking(
        report,
        "INVALID_UPDATED_AT",
        "$.updatedAt",
        null,
        "Schema v2 updatedAt 必须是有效且无首尾空格的日期字符串。",
      );
    }
    if (!Array.isArray(candidate.runs)) {
      addBlocking(
        report,
        "INVALID_COLLECTION",
        "$.runs",
        null,
        "Schema v2 runs 必须是数组。",
      );
    } else if (candidate.runs.length === 0) {
      addBlocking(
        report,
        "MISSING_RUNS",
        "$.runs",
        null,
        "Schema v2 至少需要一个 Run。",
      );
    }
    for (let index = 0; index < (candidate.runs || []).length; index += 1) {
      const run = candidate.runs[index];
      if (isObject(run) && !Array.isArray(run.stages)) {
        addBlocking(
          report,
          "INVALID_COLLECTION",
          `$.runs[${index}].stages`,
          canonicalIdentity(run.id),
          "Schema v2 Run.stages 必须是数组。",
        );
      } else if (isObject(run)) {
        for (
          let stageIndex = 0;
          stageIndex < run.stages.length;
          stageIndex += 1
        ) {
          if (!Array.isArray(run.stages[stageIndex] && run.stages[stageIndex].gates)) {
            addBlocking(
              report,
              "INVALID_COLLECTION",
              `$.runs[${index}].stages[${stageIndex}].gates`,
              canonicalIdentity(run.stages[stageIndex] && run.stages[stageIndex].slug),
              "Schema v2 active Stage.gates 必须是数组。",
            );
          }
        }
      }
    }
    for (const category of ["records", "attachments"]) {
      if (!Array.isArray(candidate[category])) {
        addBlocking(
          report,
          "INVALID_COLLECTION",
          `$.${category}`,
          null,
          `Schema v2 ${category} 必须是数组。`,
        );
      }
    }
    if (Array.isArray(candidate.records)) {
      for (let index = 0; index < candidate.records.length; index += 1) {
        const record = candidate.records[index];
        if (!isObject(record)) continue;
        for (const field of ["tags", "attachmentIds"]) {
          if (hasOwn(record, field) && !Array.isArray(record[field])) {
            addBlocking(
              report,
              "INVALID_COLLECTION",
              `$.records[${index}].${field}`,
              canonicalIdentity(record.id),
              `Schema v2 Record.${field} 在存在时必须是数组。`,
            );
          }
        }
      }
    }
    if (!isObject(candidate.legacy)) {
      addBlocking(
        report,
        "INVALID_LEGACY_STORE",
        "$.legacy",
        null,
        "Schema v2 legacy 必须是对象。",
      );
      return;
    }
    for (const category of [
      "stages",
      "gates",
      "records",
      "attachments",
      "workspaceFields",
    ]) {
      if (!Array.isArray(candidate.legacy[category])) {
        addBlocking(
          report,
          "INVALID_COLLECTION",
          `$.legacy.${category}`,
          null,
          `Schema v2 legacy.${category} 必须是数组。`,
        );
      }
    }
  }

  function validateV2ActiveStructures(candidate, report) {
    const runs = Array.isArray(candidate.runs) ? candidate.runs : [];
    for (let runIndex = 0; runIndex < runs.length; runIndex += 1) {
      const run = runs[runIndex];
      if (!isObject(run)) continue;
      const runPath = `$.runs[${runIndex}]`;
      const templateVersion = run.templateVersion;
      if (
        typeof templateVersion !== "string" ||
        !templateVersion.trim()
      ) {
        addBlocking(
          report,
          "INVALID_TEMPLATE_VERSION",
          `${runPath}.templateVersion`,
          canonicalIdentity(run.id),
          "Schema v2 templateVersion 必须是非空字符串。",
        );
      }
      if (
        !report.templateAssignments.some(
          (assignment) =>
            assignment.runId === (canonicalIdentity(run.id) || null),
        )
      ) {
        report.templateAssignments.push({
          runId: canonicalIdentity(run.id) || null,
          before:
            typeof templateVersion === "string" ? templateVersion : null,
          after:
            typeof templateVersion === "string" ? templateVersion : null,
          basis: "existing-template-version",
        });
      }
      const stages = Array.isArray(run.stages) ? run.stages : [];
      const allowed =
        templateVersion === COMPANY_TEMPLATE_VERSION
          ? COMPANY_STAGE_SET
          : templateVersion === PRODUCTION_TEMPLATE_VERSION
            ? PRODUCTION_STAGE_SET
            : RECOGNIZED_HISTORICAL_STAGE_SET;
      const required =
        templateVersion === COMPANY_TEMPLATE_VERSION
          ? COMPANY_STAGE_SLUGS
          : templateVersion === PRODUCTION_TEMPLATE_VERSION
            ? PRODUCTION_STAGE_SLUGS
            : [];
      const observed = new Set();
      const exactStageSlugs = new Set(
        stages
          .filter(isObject)
          .map((stage) => stage.slug),
      );
      const currentStageMatchesActive =
        typeof run.currentStageSlug === "string" &&
        exactStageSlugs.has(run.currentStageSlug);
      const currentStageMatchesLegacy =
        templateVersion !== COMPANY_TEMPLATE_VERSION &&
        typeof run.currentStageSlug === "string" &&
        isObject(candidate.legacy) &&
        Array.isArray(candidate.legacy.stages) &&
        candidate.legacy.stages.some(
          (entry) =>
            isObject(entry) &&
            entry.runId === run.id &&
            entry.stageSlug === run.currentStageSlug,
        );
      if (
        !currentStageMatchesActive &&
        !currentStageMatchesLegacy
      ) {
        addBlocking(
          report,
          "ORPHAN_CURRENT_STAGE",
          `${runPath}.currentStageSlug`,
          canonicalIdentity(run.currentStageSlug),
          "currentStageSlug 没有精确匹配当前 Run 的 active Stage；非公司模板也可以匹配同 Run 的 typed legacy Stage。",
        );
      }
      for (let stageIndex = 0; stageIndex < stages.length; stageIndex += 1) {
        const stage = stages[stageIndex];
        const stagePath = `${runPath}.stages[${stageIndex}]`;
        const slug = canonicalIdentity(stage && stage.slug);
        observed.add(slug);
        if (!allowed.has(slug)) {
          addBlocking(
            report,
            "UNKNOWN_ACTIVE_STAGE",
            stagePath,
            `${canonicalIdentity(run.id)}::${slug}`,
            "Schema v2 未识别 Stage 必须已位于 typed legacy，禁止在校验时重分类。",
          );
        }
        const gates = Array.isArray(stage && stage.gates) ? stage.gates : [];
        for (let gateIndex = 0; gateIndex < gates.length; gateIndex += 1) {
          if (!isRecognizedGate(gates[gateIndex])) {
            addBlocking(
              report,
              "UNKNOWN_ACTIVE_GATE",
              `${stagePath}.gates[${gateIndex}]`,
              canonicalIdentity(gates[gateIndex] && gates[gateIndex].id),
              "Schema v2 未识别 Gate 必须位于 typed legacy。",
            );
          }
        }
      }
      for (const slug of required) {
        if (!observed.has(slug)) {
          addBlocking(
            report,
            "MISSING_TEMPLATE_STAGE",
            `${runPath}.stages`,
            `${canonicalIdentity(run.id)}::${slug}`,
            `模板 ${templateVersion} 缺少 Stage ${slug}；校验不能自动补写。`,
          );
        }
      }
    }
    const records = Array.isArray(candidate.records)
      ? candidate.records
      : [];
    for (let index = 0; index < records.length; index += 1) {
      if (!isObject(records[index]) || !RECORD_TYPES[records[index].type]) {
        addBlocking(
          report,
          "UNKNOWN_ACTIVE_RECORD",
          `$.records[${index}]`,
          canonicalIdentity(records[index] && records[index].id),
          "Schema v2 未识别 Record 必须位于 typed legacy。",
        );
      }
    }
    const attachments = Array.isArray(candidate.attachments)
      ? candidate.attachments
      : [];
    for (let index = 0; index < attachments.length; index += 1) {
      if (!isRecognizedAttachmentV2(attachments[index])) {
        addBlocking(
          report,
          "UNKNOWN_ACTIVE_ATTACHMENT",
          `$.attachments[${index}]`,
          canonicalIdentity(attachments[index] && attachments[index].id),
          "Schema v2 未识别 Attachment 必须位于 typed legacy。",
        );
      }
    }
  }

  function candidateOwnershipSets(candidate) {
    const runIds = new Set();
    const stageKeys = new Set();
    const runs = Array.isArray(candidate.runs) ? candidate.runs : [];
    for (const run of runs) {
      if (!isObject(run)) continue;
      const runId = canonicalIdentity(run.id);
      if (runId) runIds.add(runId);
      for (const stage of Array.isArray(run.stages) ? run.stages : []) {
        const slug = canonicalIdentity(stage && stage.slug);
        if (runId && slug) stageKeys.add(`${runId}::${slug}`);
      }
    }
    const legacy =
      isObject(candidate.legacy) && Array.isArray(candidate.legacy.stages)
        ? candidate.legacy.stages
        : [];
    for (const entry of legacy) {
      if (!isObject(entry)) continue;
      const value = hasOwn(entry, "value") ? entry.value : entry;
      const runId = canonicalIdentity(entry.runId);
      const slug = canonicalIdentity(
        entry.stageSlug || (value && value.slug),
      );
      if (runId && slug) stageKeys.add(`${runId}::${slug}`);
    }
    return { runIds, stageKeys };
  }

  function buildExactConservationLedger(candidate, report) {
    for (const path of enumerateSourcePaths(candidate)) {
      const resolved = resolveJsonPath(candidate, path);
      if (!resolved.found) continue;
      const kind = kindForSourcePath(path);
      const value = unwrapLegacyPath(path, resolved.value);
      let identity = canonicalIdentity(value && value.id);
      const activeStageMatch = /^\$\.runs\[(\d+)\]\.stages\[(\d+)\]$/.exec(
        path,
      );
      const activeGateMatch =
        /^\$\.runs\[(\d+)\]\.stages\[(\d+)\]\.gates\[(\d+)\]$/.exec(
          path,
        );
      if (kind === "stage") {
        if (activeStageMatch) {
          const run = candidate.runs[Number(activeStageMatch[1])];
          identity = `${canonicalIdentity(run && run.id)}::${canonicalIdentity(
            value && value.slug,
          )}`;
        } else {
          identity = `${canonicalIdentity(
            resolved.value && resolved.value.runId,
          )}::${canonicalIdentity(
            (resolved.value && resolved.value.stageSlug) ||
              (value && value.slug),
          )}`;
        }
      } else if (kind === "gate") {
        if (activeGateMatch) {
          const run = candidate.runs[Number(activeGateMatch[1])];
          const stage =
            run && Array.isArray(run.stages)
              ? run.stages[Number(activeGateMatch[2])]
              : null;
          identity = `${canonicalIdentity(run && run.id)}::${canonicalIdentity(
            stage && stage.slug,
          )}::${canonicalIdentity(value && value.id)}`;
        } else {
          identity = `${canonicalIdentity(
            resolved.value && resolved.value.runId,
          )}::${canonicalIdentity(
            resolved.value && resolved.value.stageSlug,
          )}::${canonicalIdentity(value && value.id)}`;
        }
      }
      addLedger(
        report,
        path,
        kind,
        identity,
        path.startsWith("$.legacy.") ? "legacy" : "active",
        path,
        value,
      );
    }
  }

  function inspectWorkspaceV2(source, report) {
    const candidate = clone(source);
    validateV2CollectionShapes(candidate, report);
    if (isObject(candidate.legacy)) {
      reapplyPreservedWorkspaceBlocks(candidate.legacy, report);
    }
    buildExactConservationLedger(candidate, report);
    validateCandidateIdentities(candidate, report);
    validateCanonicalCandidate(candidate, report);
    validateV2ActiveStructures(candidate, report);
    const ownership = candidateOwnershipSets(candidate);
    validateCandidateRelationships(
      candidate,
      report,
      ownership.runIds,
      ownership.stageKeys,
    );
    return candidate;
  }

  function modelFinding(code, path, message, details = {}) {
    return {
      code,
      path,
      message,
      severity: details.severity || "error",
      ...details,
    };
  }

  function validationResult(findings, extra = {}) {
    return {
      ok: !findings.some((finding) => finding.severity !== "warning"),
      findings,
      errors: findings.filter((finding) => finding.severity !== "warning"),
      warnings: findings.filter((finding) => finding.severity === "warning"),
      ...extra,
    };
  }

  function deterministicMigrationTimestamp(workspace, run, stage) {
    for (const value of [
      stage && stage.updatedAt,
      run && run.updatedAt,
      workspace && workspace.updatedAt,
      "1970-01-01T00:00:00.000Z",
    ]) {
      if (isValidUpdatedAt(value)) return value;
    }
    return "1970-01-01T00:00:00.000Z";
  }

  function transformToWorkspaceV3(source, report) {
    const candidate = clone(source);
    candidate.schemaVersion = SCHEMA_VERSION;
    const runs = Array.isArray(candidate.runs) ? candidate.runs : [];
    for (let runIndex = 0; runIndex < runs.length; runIndex += 1) {
      const run = runs[runIndex];
      if (!isObject(run) || !Array.isArray(run.stages)) continue;
      const runId = canonicalIdentity(run.id);
      for (let stageIndex = 0; stageIndex < run.stages.length; stageIndex += 1) {
        const stage = run.stages[stageIndex];
        if (!isObject(stage)) continue;
        const stageSlug = canonicalIdentity(stage.slug);
        const stagePath = `$.runs[${runIndex}].stages[${stageIndex}]`;
        const timestamp = deterministicMigrationTimestamp(candidate, run, stage);
        if (hasOwn(stage, "state")) {
          addBlocking(
            report,
            "RESERVED_STAGE_FIELD_COLLISION",
            `${stagePath}.state`,
            `${runId}::${stageSlug}`,
            "Schema v2 Stage already contains reserved Gate 2.0 field state; the source value was preserved and migration is blocked.",
          );
        } else {
          stage.state = createStageMachineState(stage.status, null);
          report.derivedAdditions.stageStates += 1;
          report.addedStageStates.push({
            runId,
            stageSlug,
            path: `${stagePath}.state`,
          });
        }
        const gates = Array.isArray(stage.gates) ? stage.gates : [];
        for (let gateIndex = 0; gateIndex < gates.length; gateIndex += 1) {
          const gate = gates[gateIndex];
          if (!isObject(gate)) continue;
          const gateId = canonicalIdentity(gate.id);
          const gatePath = `${stagePath}.gates[${gateIndex}]`;
          const collisions = [
            "definition",
            "results",
            "currentResultId",
          ].filter((field) => hasOwn(gate, field));
          for (const field of collisions) {
            addBlocking(
              report,
              "RESERVED_GATE_FIELD_COLLISION",
              `${gatePath}.${field}`,
              `${runId}::${stageSlug}::${gateId}`,
              `Schema v2 Gate already contains reserved Gate 2.0 field ${field}; the source value was preserved and migration is blocked.`,
            );
          }
          if (collisions.length) continue;
          gate.definition = createGateDefinition(
            gate,
            gateIndex,
            "migrated-v2-legacy-checkbox",
          );
          const initialResult = createInitialGateResult(
            gate,
            "migrated-v2-legacy-checkbox",
            timestamp,
            gateResultId(runId, stageSlug, gateId, 1),
          );
          gate.results = [initialResult];
          gate.currentResultId = initialResult.id;
          report.derivedAdditions.gateDefinitions += 1;
          report.derivedAdditions.gateResults += 1;
          report.addedGateDefinitions.push({
            runId,
            stageSlug,
            gateId,
            path: `${gatePath}.definition`,
          });
          report.addedGateResults.push({
            runId,
            stageSlug,
            gateId,
            resultId: initialResult.id,
            path: `${gatePath}.results[0]`,
          });
        }
      }
    }
    validateWorkspaceV3Candidate(candidate, report);
    return candidate;
  }

  function isFiniteNumber(value) {
    return typeof value === "number" && Number.isFinite(value);
  }

  function isScalarExpected(value) {
    return (
      typeof value === "boolean" ||
      typeof value === "string" ||
      isFiniteNumber(value)
    );
  }

  function supportedEvidenceType(value) {
    if (value === "attachment") return true;
    if (typeof value !== "string" || !value.startsWith("record:")) return false;
    return Boolean(RECORD_TYPES[value.slice("record:".length)]);
  }

  function validateGateDefinition(
    definition,
    gateId = null,
    gateLabel = null,
    path = "$.definition",
  ) {
    const findings = [];
    if (!isObject(definition)) {
      findings.push(
        modelFinding(
          "INVALID_GATE_DEFINITION",
          path,
          "Gate definition must be an object.",
        ),
      );
      return validationResult(findings);
    }
    for (const field of ["id", "ruleVersion", "label"]) {
      if (
        typeof definition[field] !== "string" ||
        !definition[field] ||
        definition[field] !== definition[field].trim()
      ) {
        findings.push(
          modelFinding(
            "INVALID_GATE_DEFINITION",
            `${path}.${field}`,
            `${field} must be a canonical non-empty string.`,
          ),
        );
      }
    }
    if (gateId !== null && definition.id !== gateId) {
      findings.push(
        modelFinding(
          "GATE_DEFINITION_ID_MISMATCH",
          `${path}.id`,
          "Gate definition ID must equal its owning Gate ID.",
        ),
      );
    }
    if (gateLabel !== null && definition.label !== gateLabel) {
      findings.push(
        modelFinding(
          "GATE_DEFINITION_LABEL_MISMATCH",
          `${path}.label`,
          "Gate definition label must preserve the owning Gate label.",
        ),
      );
    }
    if (!GATE_SEVERITIES.includes(definition.severity)) {
      findings.push(
        modelFinding(
          "INVALID_GATE_SEVERITY",
          `${path}.severity`,
          "Gate severity is unsupported.",
        ),
      );
    }
    if (!GATE_OPERATORS.includes(definition.operator)) {
      findings.push(
        modelFinding(
          "INVALID_GATE_OPERATOR",
          `${path}.operator`,
          "Gate operator is unsupported.",
        ),
      );
    } else if (["lt", "lte", "gt", "gte"].includes(definition.operator)) {
      if (!isFiniteNumber(definition.expected)) {
        findings.push(
          modelFinding(
            "INVALID_GATE_EXPECTED",
            `${path}.expected`,
            "Numeric comparisons require a finite expected number.",
          ),
        );
      }
    } else if (definition.operator === "between") {
      if (
        !Array.isArray(definition.expected) ||
        definition.expected.length !== 2 ||
        !definition.expected.every(isFiniteNumber) ||
        definition.expected[0] > definition.expected[1]
      ) {
        findings.push(
          modelFinding(
            "INVALID_GATE_EXPECTED",
            `${path}.expected`,
            "Between requires an ordered two-number range.",
          ),
        );
      }
    } else if (definition.operator === "exists") {
      if (typeof definition.expected !== "boolean") {
        findings.push(
          modelFinding(
            "INVALID_GATE_EXPECTED",
            `${path}.expected`,
            "Exists requires a boolean expected value.",
          ),
        );
      }
    } else if (
      definition.operator !== "manual" &&
      !isScalarExpected(definition.expected)
    ) {
      findings.push(
        modelFinding(
          "INVALID_GATE_EXPECTED",
          `${path}.expected`,
          "This operator requires a boolean, string, or finite number.",
        ),
      );
    }
    if (
      definition.unit !== null &&
      typeof definition.unit !== "string"
    ) {
      findings.push(
        modelFinding(
          "INVALID_GATE_UNIT",
          `${path}.unit`,
          "Gate unit must be a string or null.",
        ),
      );
    }
    if (!Array.isArray(definition.requiredEvidenceTypes)) {
      findings.push(
        modelFinding(
          "INVALID_EVIDENCE_TYPES",
          `${path}.requiredEvidenceTypes`,
          "Required evidence types must be an array.",
        ),
      );
    } else {
      const seen = new Set();
      for (
        let index = 0;
        index < definition.requiredEvidenceTypes.length;
        index += 1
      ) {
        const type = definition.requiredEvidenceTypes[index];
        if (!supportedEvidenceType(type)) {
          findings.push(
            modelFinding(
              "INVALID_EVIDENCE_TYPE",
              `${path}.requiredEvidenceTypes[${index}]`,
              "Required evidence type is unsupported.",
            ),
          );
        }
        if (seen.has(type)) {
          findings.push(
            modelFinding(
              "DUPLICATE_EVIDENCE_TYPE",
              `${path}.requiredEvidenceTypes[${index}]`,
              "Required evidence types must be unique.",
            ),
          );
        }
        seen.add(type);
      }
    }
    if (typeof definition.allowNotApplicable !== "boolean") {
      findings.push(
        modelFinding(
          "INVALID_NOT_APPLICABLE_POLICY",
          `${path}.allowNotApplicable`,
          "allowNotApplicable must be boolean.",
        ),
      );
    }
    return validationResult(findings);
  }

  function evaluateGateDefinition(definition, actual) {
    const validated = validateGateDefinition(definition);
    if (!validated.ok) {
      return validationResult(validated.findings, { outcome: null });
    }
    if (definition.operator === "manual") {
      return validationResult([], { outcome: null });
    }
    let passed = false;
    if (definition.operator === "eq") {
      passed = stableSerialize(actual) === stableSerialize(definition.expected);
    } else if (definition.operator === "ne") {
      passed = stableSerialize(actual) !== stableSerialize(definition.expected);
    } else if (definition.operator === "exists") {
      const exists =
        actual !== null &&
        actual !== undefined &&
        !(typeof actual === "string" && actual.length === 0);
      passed = exists === definition.expected;
    } else {
      if (!isFiniteNumber(actual)) {
        return validationResult(
          [
            modelFinding(
              "INVALID_GATE_ACTUAL",
              "$.actual",
              "Numeric comparison requires a finite actual number.",
            ),
          ],
          { outcome: null },
        );
      }
      if (definition.operator === "lt") passed = actual < definition.expected;
      if (definition.operator === "lte") passed = actual <= definition.expected;
      if (definition.operator === "gt") passed = actual > definition.expected;
      if (definition.operator === "gte") passed = actual >= definition.expected;
      if (definition.operator === "between") {
        passed =
          actual >= definition.expected[0] &&
          actual <= definition.expected[1];
      }
    }
    return validationResult([], { outcome: passed ? "pass" : "fail" });
  }

  function exactActiveRecordMatches(workspace, id) {
    return (Array.isArray(workspace && workspace.records)
      ? workspace.records
      : []
    ).filter((record) => isObject(record) && record.id === id);
  }

  function exactActiveAttachmentMatches(workspace, id) {
    return (Array.isArray(workspace && workspace.attachments)
      ? workspace.attachments
      : []
    ).filter((attachment) => isObject(attachment) && attachment.id === id);
  }

  function resolveEvidenceReference(
    workspace,
    runId,
    stageSlug,
    reference,
  ) {
    const path = "$.evidenceIds";
    if (
      typeof reference !== "string" ||
      reference !== reference.trim() ||
      !/^(record|attachment):[^:]+$/.test(reference)
    ) {
      return validationResult([
        modelFinding(
          "INVALID_EVIDENCE_REFERENCE",
          path,
          "Evidence must use record:<id> or attachment:<id>.",
        ),
      ]);
    }
    const separator = reference.indexOf(":");
    const kind = reference.slice(0, separator);
    const id = reference.slice(separator + 1);
    if (kind === "record") {
      const matches = exactActiveRecordMatches(workspace, id);
      if (matches.length !== 1) {
        return validationResult([
          modelFinding(
            matches.length ? "AMBIGUOUS_EVIDENCE" : "UNRESOLVED_EVIDENCE",
            path,
            `Record evidence ${id} must resolve exactly once.`,
          ),
        ]);
      }
      const record = matches[0];
      if (record.runId !== runId || record.stageSlug !== stageSlug) {
        return validationResult([
          modelFinding(
            "EVIDENCE_OWNERSHIP_MISMATCH",
            path,
            `Record evidence ${id} belongs to another Run or Stage.`,
          ),
        ]);
      }
      return validationResult([], {
        kind,
        id,
        target: record,
        record,
        evidenceType: `record:${record.type}`,
      });
    }
    const matches = exactActiveAttachmentMatches(workspace, id);
    if (matches.length !== 1) {
      return validationResult([
        modelFinding(
          matches.length ? "AMBIGUOUS_EVIDENCE" : "UNRESOLVED_EVIDENCE",
          path,
          `Attachment evidence ${id} must resolve exactly once.`,
        ),
      ]);
    }
    const attachment = matches[0];
    const recordMatches = exactActiveRecordMatches(
      workspace,
      attachment.recordId,
    );
    if (recordMatches.length !== 1) {
      return validationResult([
        modelFinding(
          "UNRESOLVED_EVIDENCE_OWNER",
          path,
          `Attachment evidence ${id} has no unique owning Record.`,
        ),
      ]);
    }
    const record = recordMatches[0];
    if (record.runId !== runId || record.stageSlug !== stageSlug) {
      return validationResult([
        modelFinding(
          "EVIDENCE_OWNERSHIP_MISMATCH",
          path,
          `Attachment evidence ${id} belongs to another Run or Stage.`,
        ),
      ]);
    }
    return validationResult([], {
      kind,
      id,
      target: attachment,
      record,
      evidenceType: "attachment",
    });
  }

  function validateEvidenceIds(
    workspace,
    runId,
    stageSlug,
    evidenceIds,
    path,
  ) {
    const findings = [];
    const resolved = [];
    if (!Array.isArray(evidenceIds)) {
      findings.push(
        modelFinding(
          "INVALID_EVIDENCE_REFERENCES",
          path,
          "Evidence references must be an array.",
        ),
      );
      return validationResult(findings, { resolved });
    }
    const seen = new Set();
    for (let index = 0; index < evidenceIds.length; index += 1) {
      const reference = evidenceIds[index];
      if (seen.has(reference)) {
        findings.push(
          modelFinding(
            "DUPLICATE_EVIDENCE_REFERENCE",
            `${path}[${index}]`,
            "Evidence references must be unique.",
          ),
        );
      }
      seen.add(reference);
      const result = resolveEvidenceReference(
        workspace,
        runId,
        stageSlug,
        reference,
      );
      if (!result.ok) {
        findings.push(
          ...result.findings.map((finding) => ({
            ...finding,
            path: `${path}[${index}]`,
          })),
        );
      } else {
        resolved.push(result);
      }
    }
    return validationResult(findings, { resolved });
  }

  function validateWaiver(
    workspace,
    runId,
    stageSlug,
    gate,
    waiver,
    path,
    enforceCurrentAuthorization = true,
  ) {
    const findings = [];
    if (!isObject(waiver)) {
      findings.push(
        modelFinding("INVALID_WAIVER", path, "Waiver must be an object."),
      );
      return validationResult(findings);
    }
    for (const field of ["reason", "approvedBy"]) {
      if (
        typeof waiver[field] !== "string" ||
        !waiver[field].trim()
      ) {
        findings.push(
          modelFinding(
            "INCOMPLETE_WAIVER",
            `${path}.${field}`,
            `Waiver ${field} is required.`,
          ),
        );
      }
    }
    if (!isValidUpdatedAt(waiver.approvedAt)) {
      findings.push(
        modelFinding(
          "INCOMPLETE_WAIVER",
          `${path}.approvedAt`,
          "Waiver approval time is required.",
        ),
      );
    }
    const evidence = validateEvidenceIds(
      workspace,
      runId,
      stageSlug,
      waiver.evidenceIds,
      `${path}.evidenceIds`,
    );
    findings.push(...evidence.findings);
    if (!Array.isArray(waiver.evidenceIds) || waiver.evidenceIds.length === 0) {
      findings.push(
        modelFinding(
          "INCOMPLETE_WAIVER",
          `${path}.evidenceIds`,
          "Waiver requires at least one resolvable evidence reference.",
        ),
      );
    }
    if (
      waiver.expiresAt !== null &&
      waiver.expiresAt !== undefined &&
      !isValidUpdatedAt(waiver.expiresAt)
    ) {
      findings.push(
        modelFinding(
          "INVALID_WAIVER_EXPIRY",
          `${path}.expiresAt`,
          "Waiver expiry must be null or a valid timestamp.",
        ),
      );
    } else if (
      enforceCurrentAuthorization &&
      isValidUpdatedAt(waiver.expiresAt) &&
      Date.parse(waiver.expiresAt) <= Date.now()
    ) {
      findings.push(
        modelFinding(
          "EXPIRED_WAIVER",
          `${path}.expiresAt`,
          "Waiver has expired.",
        ),
      );
    }
    const hasRevokedAt = waiver.revokedAt !== null && waiver.revokedAt !== undefined;
    const hasRevokedBy =
      typeof waiver.revokedBy === "string" && Boolean(waiver.revokedBy.trim());
    if (hasRevokedAt || hasRevokedBy) {
      if (!isValidUpdatedAt(waiver.revokedAt) || !hasRevokedBy) {
        findings.push(
          modelFinding(
            "INVALID_WAIVER_REVOCATION",
            path,
            "Waiver revocation requires revokedAt and revokedBy.",
          ),
        );
      } else if (enforceCurrentAuthorization) {
        findings.push(
          modelFinding(
            "REVOKED_WAIVER",
            path,
            "Waiver has been revoked.",
          ),
        );
      }
    }
    if (
      gate &&
      gate.definition &&
      waiver.ruleVersion !== undefined &&
      waiver.ruleVersion !== gate.definition.ruleVersion
    ) {
      findings.push(
        modelFinding(
          "WAIVER_RULE_VERSION_MISMATCH",
          `${path}.ruleVersion`,
          "Waiver belongs to a different Gate rule version.",
        ),
      );
    }
    return validationResult(findings);
  }

  function validateGateResult(
    workspace,
    runId,
    stageSlug,
    gate,
    result,
    path = "$.result",
    options = {},
  ) {
    const findings = [];
    if (!isObject(result)) {
      findings.push(
        modelFinding(
          "INVALID_GATE_RESULT",
          path,
          "Gate result must be an object.",
        ),
      );
      return validationResult(findings);
    }
    if (
      typeof result.id !== "string" ||
      !result.id ||
      result.id !== result.id.trim()
    ) {
      findings.push(
        modelFinding(
          "INVALID_GATE_RESULT_ID",
          `${path}.id`,
          "Gate result ID must be canonical and non-empty.",
        ),
      );
    }
    if (!Number.isSafeInteger(result.revision) || result.revision < 1) {
      findings.push(
        modelFinding(
          "INVALID_GATE_RESULT_REVISION",
          `${path}.revision`,
          "Gate result revision must be a positive safe integer.",
        ),
      );
    }
    const hasDefinition = Boolean(gate && isObject(gate.definition));
    if (
      !hasDefinition ||
      result.definitionId !== gate.definition.id
    ) {
      findings.push(
        modelFinding(
          "GATE_RESULT_DEFINITION_MISMATCH",
          `${path}.definitionId`,
          "Gate result definition identity does not match.",
        ),
      );
    }
    if (
      !hasDefinition ||
      result.ruleVersion !== gate.definition.ruleVersion
    ) {
      findings.push(
        modelFinding(
          "GATE_RESULT_RULE_VERSION_MISMATCH",
          `${path}.ruleVersion`,
          "Gate result rule version does not match.",
        ),
      );
    }
    if (!GATE_RESULT_STATUSES.includes(result.status)) {
      findings.push(
        modelFinding(
          "INVALID_GATE_RESULT_STATUS",
          `${path}.status`,
          "Gate result status is unsupported.",
        ),
      );
    }
    for (const field of ["mode", "corner", "scenario"]) {
      if (typeof result[field] !== "string") {
        findings.push(
          modelFinding(
            "INVALID_GATE_RESULT_CONTEXT",
            `${path}.${field}`,
            `${field} must be a string.`,
          ),
        );
      }
    }
    const evidence = validateEvidenceIds(
      workspace,
      runId,
      stageSlug,
      result.evidenceIds,
      `${path}.evidenceIds`,
    );
    findings.push(...evidence.findings);
    if (typeof result.checkedBy !== "string") {
      findings.push(
        modelFinding(
          "INVALID_GATE_CHECKER",
          `${path}.checkedBy`,
          "checkedBy must be a string.",
        ),
      );
    }
    if (
      result.checkedAt !== null &&
      !isValidUpdatedAt(result.checkedAt)
    ) {
      findings.push(
        modelFinding(
          "INVALID_GATE_CHECK_TIME",
          `${path}.checkedAt`,
          "checkedAt must be null or a valid timestamp.",
        ),
      );
    }
    if (typeof result.reviewedBy !== "string") {
      findings.push(
        modelFinding(
          "INVALID_GATE_REVIEWER",
          `${path}.reviewedBy`,
          "reviewedBy must be a string.",
        ),
      );
    }
    if (
      result.reviewedAt !== null &&
      !isValidUpdatedAt(result.reviewedAt)
    ) {
      findings.push(
        modelFinding(
          "INVALID_GATE_REVIEW_TIME",
          `${path}.reviewedAt`,
          "reviewedAt must be null or a valid timestamp.",
        ),
      );
    }
    if (typeof result.notApplicableReason !== "string") {
      findings.push(
        modelFinding(
          "INVALID_NOT_APPLICABLE_REASON",
          `${path}.notApplicableReason`,
          "notApplicableReason must be a string.",
        ),
      );
    }
    if (typeof result.origin !== "string" || !result.origin.trim()) {
      findings.push(
        modelFinding(
          "INVALID_GATE_RESULT_ORIGIN",
          `${path}.origin`,
          "Gate result origin is required.",
        ),
      );
    }
    if (
      result.legacyDone !== null &&
      typeof result.legacyDone !== "boolean"
    ) {
      findings.push(
        modelFinding(
          "INVALID_LEGACY_DONE",
          `${path}.legacyDone`,
          "legacyDone must be boolean for migrated history or null for native results.",
        ),
      );
    }
    if (!isValidUpdatedAt(result.createdAt)) {
      findings.push(
        modelFinding(
          "INVALID_GATE_RESULT_TIME",
          `${path}.createdAt`,
          "Gate result creation time is required.",
        ),
      );
    }
    if (
      result.supersedesId !== null &&
      (typeof result.supersedesId !== "string" ||
        !result.supersedesId.trim())
    ) {
      findings.push(
        modelFinding(
          "INVALID_SUPERSEDES_ID",
          `${path}.supersedesId`,
          "supersedesId must be null or a canonical result ID.",
        ),
      );
    }
    const acceptedStatus = ["pass", "fail", "waived", "not_applicable"].includes(
      result.status,
    );
    if (
      acceptedStatus &&
      (typeof result.checkedBy !== "string" ||
        !result.checkedBy.trim() ||
        !isValidUpdatedAt(result.checkedAt))
    ) {
      findings.push(
        modelFinding(
          "MISSING_GATE_CHECK_AUDIT",
          path,
          "A non-pending Gate result requires checker identity and time.",
        ),
      );
    }
    if (
      hasDefinition &&
      (result.status === "pass" || result.status === "fail")
    ) {
      const evaluated = evaluateGateDefinition(gate.definition, result.actual);
      if (!evaluated.ok) {
        findings.push(...evaluated.findings);
      } else if (
        evaluated.outcome !== null &&
        evaluated.outcome !== result.status
      ) {
        findings.push(
          modelFinding(
            "GATE_RESULT_CONTRADICTS_RULE",
            `${path}.status`,
            "Pass/fail status contradicts operator evaluation.",
          ),
        );
      }
    }
    if (hasDefinition && result.status === "pass") {
      const resolvedTypes = new Set(
        evidence.resolved.map((item) => item.evidenceType),
      );
      for (const required of gate.definition.requiredEvidenceTypes || []) {
        if (!resolvedTypes.has(required)) {
          findings.push(
            modelFinding(
              "MISSING_REQUIRED_EVIDENCE",
              `${path}.evidenceIds`,
              `Gate pass is missing required evidence type ${required}.`,
            ),
          );
        }
      }
    }
    if (result.status === "waived") {
      const waiver = validateWaiver(
        workspace,
        runId,
        stageSlug,
        gate,
        result.waiver,
        `${path}.waiver`,
        options.enforceWaiverAuthorization !== false,
      );
      findings.push(...waiver.findings);
    } else if (result.waiver !== null) {
      findings.push(
        modelFinding(
          "UNEXPECTED_WAIVER",
          `${path}.waiver`,
          "Only a waived result may contain a Waiver.",
        ),
      );
    }
    if (result.status === "not_applicable") {
      if (!hasDefinition || !gate.definition.allowNotApplicable) {
        findings.push(
          modelFinding(
            "NOT_APPLICABLE_NOT_ALLOWED",
            `${path}.status`,
            "This Gate definition does not allow not-applicable.",
          ),
        );
      }
      if (
        typeof result.notApplicableReason !== "string" ||
        !result.notApplicableReason.trim()
      ) {
        findings.push(
          modelFinding(
            "MISSING_NOT_APPLICABLE_REASON",
            `${path}.notApplicableReason`,
            "Not-applicable requires a reason.",
          ),
        );
      }
    } else if (result.notApplicableReason) {
      findings.push(
        modelFinding(
          "UNEXPECTED_NOT_APPLICABLE_REASON",
          `${path}.notApplicableReason`,
          "Only not-applicable may contain this reason.",
        ),
      );
    }
    const requiresReview =
      hasDefinition &&
      ["critical", "blocker"].includes(gate.definition.severity) &&
      ["pass", "waived", "not_applicable"].includes(result.status);
    if (
      (requiresReview || result.status === "not_applicable") &&
      (typeof result.reviewedBy !== "string" ||
        !result.reviewedBy.trim() ||
        !isValidUpdatedAt(result.reviewedAt))
    ) {
      findings.push(
        modelFinding(
          "MISSING_GATE_REVIEW_AUDIT",
          path,
          "This Gate disposition requires reviewer identity and time.",
        ),
      );
    }
    if (
      typeof result.checkedBy === "string" &&
      typeof result.reviewedBy === "string" &&
      result.checkedBy &&
      result.reviewedBy &&
      result.checkedBy.trim() === result.reviewedBy.trim()
    ) {
      findings.push(
        modelFinding(
          "SELF_REVIEW",
          path,
          "Checker and reviewer are the same person.",
          { severity: "warning" },
        ),
      );
    }
    return validationResult(findings);
  }

  function currentGateResult(gate) {
    if (!gate || !Array.isArray(gate.results)) return null;
    return gate.results.find((result) => result.id === gate.currentResultId) || null;
  }

  function validateGateHistory(
    workspace,
    runId,
    stageSlug,
    gate,
    path,
  ) {
    const findings = [];
    const definition = validateGateDefinition(
      gate && gate.definition,
      gate && gate.id,
      gate && gate.label,
      `${path}.definition`,
    );
    findings.push(...definition.findings);
    if (!Array.isArray(gate && gate.results) || gate.results.length === 0) {
      findings.push(
        modelFinding(
          "INVALID_GATE_RESULTS",
          `${path}.results`,
          "Gate results must contain at least one revision.",
        ),
      );
      return validationResult(findings, { current: null });
    }
    const ids = new Set();
    const revisions = new Set();
    for (let index = 0; index < gate.results.length; index += 1) {
      const result = gate.results[index];
      const resultPath = `${path}.results[${index}]`;
      const validated = validateGateResult(
        workspace,
        runId,
        stageSlug,
        gate,
        result,
        resultPath,
        {
          enforceWaiverAuthorization: result.id === gate.currentResultId,
        },
      );
      findings.push(...validated.findings);
      if (index === 0) {
        const migratedOrigin = result &&
          result.origin === "migrated-v2-legacy-checkbox";
        const nativeOrigin = result && result.origin === "native-v3";
        const validInitialBaseline = Boolean(
          isObject(result) &&
            result.id === gateResultId(runId, stageSlug, gate.id, 1) &&
            result.revision === 1 &&
            result.status === "pending" &&
            result.actual === null &&
            result.mode === "" &&
            result.corner === "" &&
            result.scenario === "" &&
            Array.isArray(result.evidenceIds) &&
            result.evidenceIds.length === 0 &&
            result.checkedBy === "" &&
            result.checkedAt === null &&
            result.reviewedBy === "" &&
            result.reviewedAt === null &&
            result.notApplicableReason === "" &&
            result.waiver === null &&
            result.supersedesId === null &&
            (nativeOrigin || migratedOrigin) &&
            (nativeOrigin
              ? result.legacyDone === null
              : result.legacyDone === Boolean(gate.done)),
        );
        if (!validInitialBaseline) {
          findings.push(
            modelFinding(
              "INVALID_INITIAL_GATE_RESULT",
              resultPath,
              "Gate result revision 1 must remain the immutable pending baseline.",
            ),
          );
        }
      }
      if (ids.has(result && result.id)) {
        findings.push(
          modelFinding(
            "DUPLICATE_GATE_RESULT_ID",
            `${resultPath}.id`,
            "Gate result IDs must be unique.",
          ),
        );
      }
      if (revisions.has(result && result.revision)) {
        findings.push(
          modelFinding(
            "DUPLICATE_GATE_RESULT_REVISION",
            `${resultPath}.revision`,
            "Gate result revisions must be unique.",
          ),
        );
      }
      ids.add(result && result.id);
      revisions.add(result && result.revision);
      if (result && result.revision !== index + 1) {
        findings.push(
          modelFinding(
            "NON_SEQUENTIAL_GATE_RESULT_REVISION",
            `${resultPath}.revision`,
            "Gate result revisions must be append-only and sequential.",
          ),
        );
      }
      const expectedSupersedes =
        index === 0 ? null : gate.results[index - 1] && gate.results[index - 1].id;
      if (result && result.supersedesId !== expectedSupersedes) {
        findings.push(
          modelFinding(
            "INVALID_GATE_RESULT_CHAIN",
            `${resultPath}.supersedesId`,
            "Gate result revision must supersede the prior revision.",
          ),
        );
      }
    }
    const current = currentGateResult(gate);
    if (
      !current ||
      gate.currentResultId !== gate.results[gate.results.length - 1].id
    ) {
      findings.push(
        modelFinding(
          "INVALID_CURRENT_GATE_RESULT",
          `${path}.currentResultId`,
          "Current result must select the latest Gate result revision.",
        ),
      );
    }
    return validationResult(findings, { current });
  }

  function locateStage(workspace, runId, stageSlug) {
    const runs = Array.isArray(workspace && workspace.runs)
      ? workspace.runs
      : [];
    const runMatches = runs.filter(
      (run) => isObject(run) && run.id === runId,
    );
    if (runMatches.length !== 1) {
      return validationResult([
        modelFinding(
          runMatches.length ? "AMBIGUOUS_RUN" : "RUN_NOT_FOUND",
          "$.runs",
          `Run ${String(runId)} must resolve exactly once.`,
        ),
      ]);
    }
    const run = runMatches[0];
    const stageMatches = (Array.isArray(run.stages) ? run.stages : []).filter(
      (stage) => isObject(stage) && stage.slug === stageSlug,
    );
    if (stageMatches.length !== 1) {
      return validationResult([
        modelFinding(
          stageMatches.length ? "AMBIGUOUS_STAGE" : "STAGE_NOT_FOUND",
          "$.runs[].stages",
          `Stage ${String(stageSlug)} must resolve exactly once in its Run.`,
        ),
      ]);
    }
    return validationResult([], { run, stage: stageMatches[0] });
  }

  function locateGate(workspace, runId, stageSlug, gateId) {
    const located = locateStage(workspace, runId, stageSlug);
    if (!located.ok) return located;
    const matches = (Array.isArray(located.stage.gates)
      ? located.stage.gates
      : []
    ).filter((gate) => isObject(gate) && gate.id === gateId);
    if (matches.length !== 1) {
      return validationResult([
        modelFinding(
          matches.length ? "AMBIGUOUS_GATE" : "GATE_NOT_FOUND",
          "$.runs[].stages[].gates",
          `Gate ${String(gateId)} must resolve exactly once in its Stage.`,
        ),
      ]);
    }
    return validationResult([], {
      run: located.run,
      stage: located.stage,
      gate: matches[0],
    });
  }

  const EXECUTION_TRANSITIONS = Object.freeze({
    not_started: Object.freeze(["in_progress"]),
    in_progress: Object.freeze(["blocked", "completed"]),
    blocked: Object.freeze(["in_progress"]),
    completed: Object.freeze(["in_progress"]),
  });

  function matchingOverrideDecision(state, override) {
    if (
      !isObject(state) ||
      !isObject(override) ||
      typeof override.decisionId !== "string" ||
      !override.decisionId.trim() ||
      !Array.isArray(state.approvalHistory)
    ) {
      return null;
    }
    const matches = state.approvalHistory.filter(
      (entry) =>
        isObject(entry) &&
        entry.id === override.decisionId &&
        entry.kind === "decision" &&
        entry.outcome === "approved_with_override" &&
        entry.overrideId === override.id,
    );
    if (matches.length !== 1) return null;
    const decision = matches[0];
    return decision.actor === override.approvedBy &&
      decision.at === override.approvedAt &&
      decision.reason === override.reason &&
      decision.blockerFingerprint === override.blockerFingerprint
      ? decision
      : null;
  }

  function validateStageStateStructure(
    state,
    path = "$.state",
    baselineExecutionStatus = "not_started",
  ) {
    const findings = [];
    if (!isObject(state)) {
      findings.push(
        modelFinding(
          "INVALID_STAGE_STATE",
          path,
          "Stage state must be an object.",
        ),
      );
      return validationResult(findings);
    }
    if (state.stateVersion !== 1) {
      findings.push(
        modelFinding(
          "INVALID_STAGE_STATE_VERSION",
          `${path}.stateVersion`,
          "Stage stateVersion must equal 1.",
        ),
      );
    }
    if (!EXECUTION_STATUSES.includes(state.executionStatus)) {
      findings.push(
        modelFinding(
          "INVALID_EXECUTION_STATUS",
          `${path}.executionStatus`,
          "Execution status is unsupported.",
        ),
      );
    }
    if (!QUALITY_STATUSES.includes(state.qualityStatus)) {
      findings.push(
        modelFinding(
          "INVALID_QUALITY_STATUS",
          `${path}.qualityStatus`,
          "Quality status is unsupported.",
        ),
      );
    }
    if (!APPROVAL_STATUSES.includes(state.approvalStatus)) {
      findings.push(
