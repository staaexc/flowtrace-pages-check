<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f9" />
    <meta name="color-scheme" content="light" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'sha256-yzc4P2QRQ5baymXLu/ZlGWn3QmcAV9pc3jEduXREuRY='; style-src 'sha256-RI6n7rsVLQh16jXrKZ7s37qDHfgJa7mK6kSXaj0/yDY='; connect-src https://api.github.com; img-src data:; font-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none';"
    />
    <meta
      name="description"
      content="FlowTrace — 私密、可复盘的 Innovus 后端流程工作台"
    />
    <title>FlowTrace</title>
    <style>:root {
  color-scheme: light;
  --bg: #f6f7f9;
  --bg-soft: #eef1f4;
  --surface: #ffffff;
  --surface-2: #f8fafb;
  --surface-3: #eef3f1;
  --line: #dfe4ea;
  --line-strong: #cbd3dc;
  --text: #17202a;
  --text-soft: #4f5d6b;
  --muted: #657383;
  --green: #1f7a55;
  --green-strong: #176443;
  --green-deep: #0f5538;
  --mint: #176443;
  --amber: #8a5900;
  --red: #b4232c;
  --blue: #2667b2;
  --shadow: 0 18px 48px rgba(22, 34, 45, 0.16);
  --radius-xl: 10px;
  --radius-lg: 8px;
  --radius-md: 8px;
  --radius-sm: 6px;
  --sidebar: 256px;
  --font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
    "Microsoft YaHei", sans-serif;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  margin: 0;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.55;
}

.project-flow-background {
  position: fixed;
  z-index: 0;
  inset: 0;
  width: 100%;
  height: 100%;
  max-width: none;
  object-fit: cover;
  object-position: center center;
  opacity: 0.86;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
  transition: opacity 160ms ease;
}

#app {
  position: relative;
  z-index: 1;
  min-height: 100vh;
}

body.is-locked .project-flow-background {
  opacity: 1;
}

body.is-connected .project-flow-background {
  opacity: 0.68;
}

button,
input,
textarea,
select {
  font: inherit;
}

button,
a,
input,
textarea,
select {
  -webkit-tap-highlight-color: transparent;
}

button {
  color: inherit;
}

a {
  color: var(--blue);
}

img {
  display: block;
  max-width: 100%;
}

[hidden] {
  display: none !important;
}

.skip-link {
  position: fixed;
  z-index: 1000;
  top: 8px;
  left: 8px;
  padding: 10px 14px;
  border-radius: 10px;
  background: var(--text);
  color: var(--bg);
  transform: translateY(-150%);
}

.skip-link:focus {
  transform: translateY(0);
}

:focus-visible {
  outline: 3px solid rgba(31, 122, 85, 0.32);
  outline-offset: 2px;
}

.boot-screen {
  min-height: 100vh;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 16px;
  color: var(--text-soft);
}

.boot-mark,
.brand-mark {
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  border: 1px solid #b9d5c8;
  border-radius: 8px;
  background: #e9f3ee;
  color: var(--green-strong);
  font-weight: 800;
  letter-spacing: 0;
  box-shadow: none;
}

.boot-mark {
  animation: breathe 2s ease-in-out infinite;
}

@keyframes breathe {
  50% {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(31, 122, 85, 0.14);
  }
}

.lock-shell {
  position: relative;
  min-height: 100vh;
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(360px, 0.75fr);
  align-items: center;
  gap: clamp(36px, 7vw, 110px);
  width: min(1180px, calc(100% - 48px));
  margin: 0 auto;
  padding: 64px 0;
}

.lock-shell::before {
  content: "";
  position: fixed;
  z-index: -1;
  inset: 0;
  display: none;
}

.lock-intro {
  max-width: 670px;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 18px;
  color: var(--green);
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0;
  text-transform: uppercase;
}

.eyebrow::before {
  content: "";
  width: 28px;
  height: 1px;
  background: currentColor;
}

.lock-title {
  margin: 0;
  max-width: 720px;
  font-size: 56px;
  font-weight: 690;
  line-height: 1.02;
  letter-spacing: 0;
}

.lock-title em {
  color: var(--green);
  font-style: normal;
}

.lock-copy {
  max-width: 600px;
  margin: 24px 0 0;
  color: var(--text-soft);
  font-size: 18px;
}

.privacy-points {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin-top: 34px;
}

.privacy-point {
  min-height: 112px;
  padding: 17px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: #ffffff;
}

.privacy-point strong {
  display: block;
  margin-bottom: 5px;
  font-size: 14px;
}

.privacy-point span {
  color: var(--muted);
  font-size: 12px;
}

.connect-card {
  position: relative;
  padding: clamp(24px, 3vw, 34px);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-xl);
  background: var(--surface);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.connect-card::after {
  content: "";
  position: absolute;
  top: -70px;
  right: -70px;
  width: 170px;
  height: 170px;
  border: 0;
  border-radius: 50%;
  box-shadow: none;
  display: none;
  pointer-events: none;
}

.connect-head {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 25px;
}

.connect-head h2,
.panel-title {
  margin: 0;
  font-size: 20px;
  letter-spacing: 0;
}

.connect-head p {
  margin: 3px 0 0;
  color: var(--muted);
  font-size: 12px;
}

.form-grid,
.stack {
  display: grid;
  gap: 16px;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.field {
  display: grid;
  gap: 7px;
}

.field > span,
.field > label,
.field-label {
  color: var(--text-soft);
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 0;
}

.field small,
.help,
.muted {
  color: var(--muted);
  font-size: 12px;
}

input,
textarea,
select {
  width: 100%;
  min-height: 46px;
  padding: 11px 13px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  outline: none;
  background: #ffffff;
  color: var(--text);
  transition:
    border-color 160ms ease,
    box-shadow 160ms ease,
    background 160ms ease;
}

textarea {
  min-height: 118px;
  resize: vertical;
}

input:hover,
textarea:hover,
select:hover {
  border-color: #9aa8b6;
}

input:focus,
textarea:focus,
select:focus {
  border-color: var(--green);
  box-shadow: 0 0 0 3px rgba(31, 122, 85, 0.12);
  background: #ffffff;
}

input::placeholder,
textarea::placeholder {
  color: #98a2ad;
}

select {
  cursor: pointer;
}

.checkbox {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  cursor: pointer;
  color: var(--text-soft);
  font-size: 13px;
}

.checkbox input {
  flex: 0 0 auto;
  width: 18px;
  min-height: 18px;
  height: 18px;
  margin-top: 2px;
  accent-color: var(--green-strong);
}

.security-note,
.callout {
  padding: 13px 14px;
  border: 1px solid #ead6a7;
  border-radius: 6px;
  background: #fff9eb;
  color: #6d5214;
  font-size: 12px;
}

.security-note strong,
.callout strong {
  color: var(--amber);
}

.error-box {
  padding: 12px 14px;
  border: 1px solid #efc4c7;
  border-radius: 6px;
  background: #fff3f3;
  color: #8e1f27;
  font-size: 13px;
}

.btn {
  min-height: 42px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 9px 15px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: #ffffff;
  color: var(--text);
  cursor: pointer;
  text-decoration: none;
  font-weight: 680;
  font-size: 13px;
  transition:
    transform 150ms ease,
    background 150ms ease,
    border-color 150ms ease,
    color 150ms ease;
}

.btn:hover:not(:disabled) {
  transform: none;
  border-color: #9aa8b6;
  background: #f3f5f7;
}

.btn:active:not(:disabled) {
  transform: translateY(0);
}

.btn:disabled {
  opacity: 0.5;
  cursor: wait;
}

.btn-primary {
  border-color: var(--green-strong);
  background: var(--green-strong);
  color: #ffffff;
  box-shadow: none;
}

.btn-primary:hover:not(:disabled) {
  border-color: var(--green-deep);
  background: var(--green-deep);
}

.btn-danger {
  border-color: #e4b5b9;
  background: #fff3f3;
  color: var(--red);
}

.btn-ghost {
  border-color: transparent;
  background: transparent;
  color: var(--text-soft);
}

.btn-small {
  min-height: 34px;
  padding: 6px 10px;
  font-size: 12px;
}

.btn-block {
  width: 100%;
}

.app-shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: var(--sidebar) minmax(0, 1fr);
  grid-template-rows: 74px minmax(0, 1fr);
  grid-template-areas:
    "sidebar topbar"
    "sidebar main";
}

.topbar {
  grid-area: topbar;
  position: sticky;
  z-index: 20;
  top: 0;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 0 26px;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(12px);
}

.topbar-title {
  min-width: 0;
}

.topbar-title h1 {
  overflow: hidden;
  margin: 0;
  font-size: 18px;
  font-weight: 720;
  letter-spacing: 0;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.topbar-title p {
  margin: 2px 0 0;
  color: var(--muted);
  font-size: 11px;
}

.topbar-actions,
.panel-actions,
.inline-actions,
.toolbar {
  display: flex;
  align-items: center;
  gap: 9px;
}

.sync-state {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 11px;
  white-space: nowrap;
}

.sync-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--muted);
}

.sync-state.is-clean .sync-dot {
  background: var(--green);
  box-shadow: none;
}

.sync-state.is-dirty .sync-dot {
  background: var(--amber);
}

.sync-state.is-error .sync-dot {
  background: var(--red);
}

.sidebar {
  grid-area: sidebar;
  position: fixed;
  z-index: 30;
  inset: 0 auto 0 0;
  width: var(--sidebar);
  display: flex;
  flex-direction: column;
  padding: 18px 14px;
  border-right: 1px solid var(--line);
  background: #f1f3f5;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 5px 8px 18px;
}

.brand-mark {
  width: 40px;
  height: 40px;
  border-radius: 13px;
  font-size: 13px;
}

.brand-copy strong {
  display: block;
  letter-spacing: 0;
}

.brand-copy span {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0;
  text-transform: uppercase;
}

.nav-list,
.flow-list {
  display: grid;
  gap: 5px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.nav-button,
.flow-button {
  width: 100%;
  min-height: 42px;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 9px 11px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: transparent;
  color: var(--text-soft);
  cursor: pointer;
  text-align: left;
}

.nav-button:hover,
.flow-button:hover {
  background: #e7eaee;
  color: var(--text);
}

.nav-button.is-active,
.flow-button.is-active {
  border-color: #c9ddd4;
  border-left-color: var(--green);
  background: #e7f1ec;
  color: var(--green-strong);
}

.nav-icon {
  width: 22px;
  color: var(--green);
  font-size: 15px;
  text-align: center;
}

.sidebar-section {
  min-height: 0;
  margin-top: 24px;
}

.sidebar-section-grow {
  flex: 1;
  overflow-y: auto;
}

.section-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 0 8px 8px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 750;
  letter-spacing: 0;
  text-transform: uppercase;
}

.flow-button {
  align-items: flex-start;
}

.flow-button-copy {
  min-width: 0;
}

.flow-button-copy strong {
  display: block;
  overflow: hidden;
  color: inherit;
  font-size: 13px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.flow-button-copy span {
  color: var(--muted);
  font-size: 10px;
}

.sidebar-footer {
  padding: 12px 6px 0;
  border-top: 1px solid var(--line);
}

.connection-chip {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
  margin-bottom: 10px;
  color: var(--muted);
  font-size: 10px;
}

.connection-chip span:last-child {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.mobile-menu {
  display: none;
}

.sidebar-scrim {
  display: none;
}

.main {
  grid-area: main;
  min-width: 0;
  width: 100%;
  max-width: 1540px;
  margin: 0 auto;
  padding: 28px;
}

.page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 22px;
}

.page-head h2 {
  margin: 0;
  font-size: 30px;
  letter-spacing: 0;
}

.page-head p {
  max-width: 720px;
  margin: 7px 0 0;
  color: var(--text-soft);
}

.metric-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 18px;
}

.metric-card {
  min-width: 0;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: #ffffff;
}

.metric-label {
  color: var(--muted);
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0;
}

.metric-value {
  display: block;
  overflow: hidden;
  margin-top: 7px;
  font-size: 26px;
  font-weight: 720;
  letter-spacing: 0;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.metric-foot {
  margin-top: 4px;
  color: var(--text-soft);
  font-size: 11px;
}

.panel {
  min-width: 0;
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: #ffffff;
  box-shadow: none;
}

.panel + .panel {
  margin-top: 16px;
}

.panel-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 16px;
}

.panel-head p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 12px;
}

.content-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(330px, 0.8fr);
  gap: 16px;
  align-items: start;
}

.flow-map {
  display: grid;
  gap: 14px;
}

.flow-line {
  display: grid;
  grid-template-columns: repeat(6, minmax(105px, 1fr));
  gap: 9px;
}

.flow-branch-grid {
  display: grid;
  grid-template-columns: 92px minmax(0, 1fr);
  gap: 10px;
}

.branch-label {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 78px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #f8fafb;
  color: var(--muted);
  font-size: 10px;
  font-weight: 750;
  letter-spacing: 0;
  text-align: center;
  text-transform: uppercase;
}

.branch-stages {
  display: grid;
  grid-template-columns: repeat(2, minmax(120px, 1fr));
  gap: 9px;
}

.branch-stages.is-single {
  grid-template-columns: minmax(120px, 1fr);
}

.stage-card {
  position: relative;
  min-width: 0;
  min-height: 78px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 11px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #ffffff;
  color: var(--text-soft);
  cursor: pointer;
  text-align: left;
  transition:
    transform 150ms ease,
    border-color 150ms ease,
    background 150ms ease;
}

.stage-card:hover {
  transform: none;
  border-color: #99b9aa;
}

.stage-card.is-selected {
  border-color: var(--green);
  background: #edf6f1;
  box-shadow: 0 0 0 2px rgba(31, 122, 85, 0.1);
}

.stage-card.is-current::after {
  content: "";
  position: absolute;
  top: 8px;
  right: 8px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: none;
}

.stage-card.status-done {
  border-color: #b9d7c9;
  background: #f0f7f3;
}

.stage-card.status-blocked {
  border-color: #e6bfc2;
  background: #fff4f4;
}

.stage-card.status-review {
  border-color: #e5c980;
  background: #fffaec;
}

.stage-number {
  color: var(--muted);
  font-size: 10px;
  font-weight: 750;
  letter-spacing: 0;
}

.stage-name {
  overflow: hidden;
  color: var(--text);
  font-size: 12px;
  font-weight: 680;
  line-height: 1.3;
  text-overflow: ellipsis;
}

.stage-status-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 7px;
  color: var(--muted);
  font-size: 10px;
}

.progress-track {
  width: 100%;
  height: 7px;
  display: block;
  appearance: none;
  overflow: hidden;
  border: 0;
  border-radius: 99px;
  background: #e4e8ed;
}

.progress-track::-webkit-progress-bar {
  border-radius: inherit;
  background: #e4e8ed;
}

.progress-track::-webkit-progress-value {
  border-radius: inherit;
  background: var(--green);
}

.progress-track::-moz-progress-bar {
  border-radius: inherit;
  background: var(--green);
}

.progress-bar {
  width: var(--progress, 0%);
  height: 100%;
  border-radius: inherit;
  background: var(--green);
  transition: width 300ms ease;
}

.stage-focus {
  position: sticky;
  top: 94px;
}

.stage-focus-title {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}

.stage-focus-title h3 {
  margin: 0;
  font-size: 20px;
  letter-spacing: 0;
}

.stage-focus-title p {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 11px;
}

.status-pill,
.type-pill,
.priority-pill,
.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 24px;
  padding: 3px 8px;
  border: 1px solid var(--line);
  border-radius: 99px;
  background: #f2f4f6;
  color: var(--text-soft);
  font-size: 10px;
  font-weight: 680;
  white-space: nowrap;
}

.status-pill.is-done,
.status-pill.is-success {
  border-color: #b9d7c9;
  background: #edf6f1;
  color: var(--green-strong);
}

.status-pill.is-blocked,
.priority-pill.is-critical {
  border-color: #e6bfc2;
  background: #fff2f2;
  color: var(--red);
}

.status-pill.is-review,
.priority-pill.is-high {
  border-color: #e4c777;
  background: #fff8e6;

.modal-card > header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 18px;
}

.modal-card > header h2 {
  margin: 0;
  font-size: 21px;
}

.modal-card form {
  display: grid;
  gap: 14px;
}

.action-list {
  display: grid;
  gap: 7px;
}

.action-row {
  width: 100%;
  display: grid;
  grid-template-columns: 32px minmax(0, 1fr);
  align-items: center;
  gap: 10px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #ffffff;
  color: var(--text);
  cursor: pointer;
  text-align: left;
}

.action-row:hover {
  border-color: #a9bbb2;
  background: #f4f7f5;
}

.action-row > span {
  color: var(--green);
  font-size: 18px;
  text-align: center;
}

.action-row strong,
.action-row small {
  display: block;
}

.action-row small {
  margin-top: 2px;
  color: var(--muted);
  font-size: 10px;
}

.action-row.danger {
  color: var(--red);
}

.action-row.danger > span {
  color: var(--red);
}

.form-grid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.push-left {
  margin-right: auto;
}

.upload-field input[type="file"] {
  padding: 9px;
}

.attachment-paste-zone {
  min-width: 0;
  min-height: 88px;
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  padding: 13px;
  border: 1px dashed #8ebaa5;
  border-radius: 8px;
  background: #f5faf7;
  transition:
    border-color 160ms ease,
    background 160ms ease,
    box-shadow 160ms ease;
}

.attachment-paste-zone:hover,
.attachment-paste-zone:focus {
  border-color: var(--green);
  background: #edf6f1;
  box-shadow: 0 0 0 3px rgba(31, 122, 85, 0.1);
}

.attachment-paste-icon {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border: 1px solid #b9d7c9;
  border-radius: 8px;
  background: #e8f3ed;
  color: var(--green-strong);
  font-size: 20px;
}

.attachment-paste-copy {
  min-width: 0;
}

.attachment-paste-copy strong,
.attachment-paste-copy small {
  display: block;
}

.attachment-paste-copy strong {
  color: var(--text);
  font-size: 13px;
}

.attachment-paste-copy small {
  margin-top: 2px;
  color: var(--muted);
  font-size: 10px;
}

.pending-attachment-panel {
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #f8fafb;
}

.pending-attachment-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.pending-attachment-head small {
  color: var(--muted);
  font-size: 10px;
  text-align: right;
}

.pending-attachment .attachment-name {
  cursor: default;
}

.attachment-optimized {
  color: var(--green);
  font-size: 10px;
  white-space: nowrap;
}

.toast-success {
  border-color: #99c4b0;
}

.toast-error {
  border-color: #dc9fa4;
  color: var(--red);
}

.workspace-nav {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
  margin: 0 0 14px;
  padding: 6px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #e8ecef;
}

.workspace-nav-button {
  min-width: 0;
  min-height: 40px;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 7px;
  padding: 7px 9px;
  border: 1px solid transparent;
  border-radius: 5px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 11px;
  font-weight: 700;
  line-height: 1.25;
  text-align: left;
  transition:
    border-color 150ms ease,
    background 150ms ease,
    color 150ms ease;
}

.workspace-nav-button:hover {
  background: rgba(255, 255, 255, 0.72);
  color: var(--text-soft);
}

.workspace-nav-button.is-active {
  border-color: #cbd3dc;
  background: #ffffff;
  color: var(--green-strong);
}

.workspace-nav-button:focus-visible {
  outline-offset: 2px;
}

.workspace-nav-button > span:last-child {
  min-width: 0;
  overflow-wrap: anywhere;
}

.workspace-nav-icon {
  flex: 0 0 22px;
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  border-radius: 6px;
  background: #dde9e3;
  color: var(--green-strong);
  font-size: 14px;
  line-height: 1;
}

.workspace-nav-button.is-active .workspace-nav-icon {
  background: #dcece4;
  color: var(--green-strong);
}

.knowledge-view {
  min-width: 0;
  width: 100%;
  display: grid;
  gap: 18px;
}

.knowledge-header {
  min-width: 0;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  padding: 4px 0 2px;
}

.knowledge-header > div:first-child {
  min-width: 0;
}

.knowledge-header .eyebrow {
  margin-bottom: 4px;
}

.knowledge-header h1 {
  margin: 0;
  overflow-wrap: anywhere;
  font-size: 34px;
  line-height: 1.08;
  letter-spacing: 0;
}

.knowledge-header p:last-child {
  max-width: 720px;
  margin: 8px 0 0;
  color: var(--text-soft);
  font-size: 12px;
  overflow-wrap: anywhere;
}

.knowledge-header-actions {
  flex: 0 0 auto;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
}

.knowledge-header-actions .btn {
  white-space: nowrap;
}

.knowledge-panel.panel {
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
}

.knowledge-toolbar {
  min-width: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 14px;
  margin-bottom: 12px;
  padding: 14px 0 16px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.knowledge-search-field {
  position: relative;
  min-width: 0;
  width: min(720px, 100%);
  display: block;
}

.knowledge-search-field input {
  width: 100%;
  min-width: 0;
  min-height: 48px;
  padding: 11px 50px 11px 42px;
  border-color: var(--line-strong);
  border-radius: 6px;
  background: #ffffff;
}

.knowledge-search-icon {
  position: absolute;
  z-index: 1;
  top: 50%;
  left: 14px;
  color: var(--green);
  font-size: 17px;
  line-height: 1;
  pointer-events: none;
  transform: translateY(-50%);
}

.knowledge-clear.btn-icon {
  position: absolute;
  z-index: 2;
  top: 6px;
  right: 6px;
  width: 36px;
  min-width: 36px;
  height: 36px;
  min-height: 36px;
  border-radius: 8px;
  font-size: 18px;
}

.knowledge-clear:disabled {
  opacity: 0.34;
  cursor: default;
}

.knowledge-toolbar .result-count {
  justify-self: end;
  white-space: nowrap;
}

.knowledge-grid {
  min-width: 0;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 500px), 1fr));
  align-items: stretch;
  gap: 12px;
}

.knowledge-grid .record-card {
  min-width: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: 16px 18px;
  border-radius: 8px;
  background: #ffffff;
}

.knowledge-grid .record-card > footer {
  margin-top: auto;
}

.knowledge-empty {
  grid-column: 1 / -1;
  min-width: 0;
  min-height: 270px;
  padding: 42px 24px;
}

.knowledge-empty > span:first-child {
  color: var(--green);
  font-size: 24px;
  line-height: 1;
}

.knowledge-empty h3 {
  margin: 10px 0 0;
  color: var(--text);
  font-size: 18px;
  letter-spacing: 0;
}

.knowledge-empty p {
  max-width: 560px;
  margin: 7px auto 0;
  color: var(--muted);
  overflow-wrap: anywhere;
}

.empty-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-top: 18px;
}

.empty-actions .btn {
  white-space: normal;
}

@media (max-width: 1180px) {
  :root {
    --sidebar: 238px;
  }

  .metric-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .content-grid {
    grid-template-columns: minmax(0, 1fr);
  }

  .stage-focus {
    position: static;
  }

  .flow-line {
    grid-template-columns: repeat(4, minmax(105px, 1fr));
  }

  .record-toolbar {
    grid-template-columns: minmax(180px, 1fr) repeat(2, minmax(120px, 0.45fr));
  }

  .run-header {
    align-items: stretch;
    flex-direction: column;
  }

  .run-fields {
    width: 100%;
  }

  .flow-mainline {
    grid-template-columns: repeat(4, minmax(100px, 1fr));
  }
}

@media (max-width: 860px) {
  .project-flow-background {
    object-position: 72% center;
  }

  .is-locked .lock-shell {
    grid-template-columns: minmax(0, 1fr);
    justify-content: stretch;
  }

  .lock-shell {
    grid-template-columns: 1fr;
    width: min(620px, calc(100% - 32px));
    padding: 38px 0;
  }

  .privacy-points {
    grid-template-columns: 1fr;
  }

  .privacy-point {
    min-height: 0;
  }

  .app-shell {
    display: block;
    padding-top: 66px;
  }

  .topbar {
    position: fixed;
    inset: 0 0 auto 0;
    min-height: 66px;
    padding: 0 14px;
  }

  .mobile-menu {
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    width: 42px;
    height: 42px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: #ffffff;
  }

  .topbar-title {
    flex: 1;
  }

  .topbar .sync-state,
  .topbar .btn-label {
    display: none;
  }

  .sidebar {
    width: min(300px, 86vw);
    transform: translateX(-105%);
    box-shadow: var(--shadow);
    transition: transform 220ms ease;
  }

  .sidebar.is-open {
    transform: translateX(0);
  }

  .sidebar-scrim {
    display: block;
    position: fixed;
    z-index: 25;
    inset: 0;
    background: rgba(23, 32, 42, 0.46);
  }

  .main {
    padding: 20px 14px 40px;
  }

  .knowledge-header {
    align-items: flex-start;
    gap: 18px;
  }

  .knowledge-grid {
    grid-template-columns: minmax(0, 1fr);
  }

  .flow-line {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .record-toolbar {
    grid-template-columns: 1fr 1fr;
  }

  .record-toolbar > :first-child {
    grid-column: 1 / -1;
  }

  .topbar .brand-lockup.compact small,
  .topbar-context {
    display: none;
  }

  .run-fields {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .stage-editor {
    grid-template-columns: 1fr;
  }

  .flow-mainline {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (max-width: 590px) {
  .project-flow-background {
    object-position: 78% center;
  }

  body.is-connected .project-flow-background {
    opacity: 0.54;
  }

  body {
    font-size: 14px;
  }

  input,
  textarea,
  select {
    font-size: 16px;
  }

  .lock-title {
    font-size: 44px;
  }

  .connect-card {
    padding: 22px 18px;
    border-radius: 22px;
  }

  .form-row,
  .metric-grid,
  .backup-grid,
  .connection-details {
    grid-template-columns: 1fr;
  }

  .form-grid,
  .run-fields,
  .flow-branches {
    grid-template-columns: 1fr;
  }

  .attachment-paste-zone {
    grid-template-columns: 40px minmax(0, 1fr);
  }

  .attachment-paste-zone .btn {
    grid-column: 1 / -1;
    width: 100%;
  }

  .pending-attachment {
    grid-template-columns: 36px minmax(0, 1fr) auto;
  }

  .pending-attachment .attachment-optimized,
  .pending-attachment small {
    grid-column: 2;
  }

  .topbar {
    gap: 8px;
  }

  .topbar-actions {
    gap: 6px;
  }

  .topbar-actions .btn {
    width: 42px;
    min-width: 42px;
    padding-inline: 0;
  }

  .page-head {
    display: grid;
  }

  .page-head .panel-actions {
    width: 100%;
  }

  .page-head .btn {
    flex: 1;
  }

  .knowledge-view {
    gap: 14px;
  }

  .knowledge-header {
    align-items: stretch;
    flex-direction: column;
    gap: 14px;
    padding-top: 0;
  }

  .knowledge-header h1 {
    font-size: 28px;
  }

  .knowledge-header-actions {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .knowledge-header-actions .btn {
    min-width: 0;
    width: 100%;
    padding-inline: 10px;
    white-space: normal;
  }

  .knowledge-toolbar {
    grid-template-columns: minmax(0, 1fr);
    gap: 8px;
    padding-top: 0;
  }

  .knowledge-search-field {
    width: 100%;
  }

  .knowledge-toolbar .result-count {
    justify-self: start;
    text-align: left;
  }

  .knowledge-grid {
    gap: 9px;
  }

  .knowledge-grid .record-card {
    padding: 14px;
  }

  .knowledge-empty {
    min-height: 240px;
    padding: 30px 16px;
  }

  .empty-actions {
    width: min(100%, 360px);
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .empty-actions .btn {
    min-width: 0;
    width: 100%;
    padding-inline: 10px;
  }

  .flow-line {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .flow-mainline {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .flow-branch-grid {
    grid-template-columns: 1fr;
  }

  .branch-label {
    min-height: 34px;
  }

  .branch-stages {
    grid-template-columns: 1fr;
  }

  .stage-card {
    min-height: 84px;
  }

  .quick-create {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .record-toolbar {
    grid-template-columns: 1fr;
  }

  .record-toolbar > :first-child {
    grid-column: auto;
  }

  .record-head,
  .record-footer,
  .panel-head {
    align-items: stretch;
    flex-direction: column;
  }

  .record-head .inline-actions {
    justify-content: flex-end;
  }

  .modal-backdrop {
    padding: 0;
  }

  .modal {
    align-items: end;
    padding: 0;
  }

  .modal-card {
    width: 100%;
    max-height: 92vh;
    border-right: 0;
    border-bottom: 0;
    border-left: 0;
    border-radius: 24px 24px 0 0;
    padding-bottom: calc(22px + env(safe-area-inset-bottom));
  }

  .modal-actions {
    position: sticky;
    bottom: 0;
    padding-top: 12px;
    background: #ffffff;
  }
}

/* Lightweight record workspace */

.workspace-nav {
  grid-template-columns: minmax(0, 1fr);
}

.record-metrics .metric-stage-name {
  max-width: 100%;
  overflow-wrap: anywhere;
  font-size: clamp(20px, 2vw, 28px);
}

.metric-link {
  justify-self: start;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--blue);
  cursor: pointer;
  font-size: 11px;
  font-weight: 750;
}

.metric-link:hover {
  text-decoration: underline;
  text-underline-offset: 3px;
}

.stage-card.gate2-card.record-stage-card {
  min-height: 116px;
  grid-template-rows: auto minmax(0, 1fr);
  align-content: stretch;
  border-color: var(--line-strong);
  background: rgba(255, 255, 255, 0.97);
  box-shadow: none;
}

.stage-card.gate2-card.record-stage-card.has-failure,
.stage-card.gate2-card.record-stage-card.needs-attention,
.stage-card.gate2-card.record-stage-card.has-passed {
  border-color: var(--line-strong);
  background: rgba(255, 255, 255, 0.97);
}

.stage-card.gate2-card.record-stage-card.is-selected {
  border-color: #8d9aa8;
  background: #f7f9fb;
  box-shadow: inset 3px 0 0 #8d9aa8;
}

.stage-card.gate2-card.record-stage-card.is-current,
.stage-card.gate2-card.record-stage-card.is-current.has-failure,
.stage-card.gate2-card.record-stage-card.is-current.needs-attention {
  border-color: var(--state-blue);
  background: var(--state-blue-soft);
  box-shadow:
    inset 3px 0 0 var(--state-blue),
    0 0 0 2px rgba(38, 103, 178, 0.1);
}

.stage-card.gate2-card.record-stage-card:hover {
  border-color: #9eaebe;
  background: #fbfcfd;
  transform: translateY(-1px);
}

.stage-card.gate2-card.record-stage-card.is-current:hover,
.stage-card.gate2-card.record-stage-card.is-current.is-selected:hover {
  border-color: var(--state-blue);
  background: var(--state-blue-soft);
}

.stage-card.gate2-card.record-stage-card.is-selected:not(.is-current):hover {
  border-color: #7f8d9b;
  background: #f4f7fa;
}

.stage-record-summary {
  grid-column: 1 / -1;
  min-width: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: end;
}

.stage-record-latest {
  min-width: 0;
  display: -webkit-box;
  overflow: hidden;
  color: var(--text-soft);
  font-size: 11px;
  line-height: 1.4;
  overflow-wrap: anywhere;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

.stage-compact-status {
  display: inline-flex;

  color: var(--state-gray);
  font-size: 11px;
  font-weight: 800;
  white-space: nowrap;
}

.stage-status-dot {
  width: 8px;
  height: 8px;
  flex: 0 0 8px;
  border-radius: 50%;
  background: var(--state-gray);
}

.stage-compact-status.is-failure {
  color: var(--state-red);
}

.stage-compact-status.is-failure .stage-status-dot {
  background: var(--state-red);
  box-shadow: 0 0 0 3px rgba(180, 35, 44, 0.1);
}

.stage-compact-status.is-attention {
  color: var(--state-yellow);
}

.stage-compact-status.is-attention .stage-status-dot {
  background: #c39816;
}

.stage-compact-status.is-passed {
  color: var(--state-green);
}

.stage-compact-status.is-passed .stage-status-dot {
  background: var(--state-green);
}

.record-count-pill {

.stage-record-actions {

  flex-wrap: wrap;
  gap: 8px;
  margin: 0 0 14px;

.lightweight-stage-fields {

.advanced-audit {

.advanced-audit > summary strong,

.advanced-audit > summary strong {

.advanced-audit > summary small {

.advanced-summary-status {
  color: #5f6d7c;
  font-size: 11px;
  white-space: nowrap;
}

.advanced-audit-content {
  min-width: 0;
  padding: 14px;
  border-top: 1px solid var(--line);

.advanced-audit-content .stage-action-bar {
  margin-bottom: 14px;

.weekly-view {

.weekly-hero {

  display: flex;

  justify-content: space-between;
  gap: 24px;
  padding: 6px 0 4px;

.weekly-hero .eyebrow {
  margin-bottom: 5px;

.weekly-hero h1 {

  line-height: 1.08;

.weekly-total strong {

}

.weekly-total span {

}

.weekly-context {

.weekly-context-item {

}

.weekly-context-item > span {
  color: var(--muted);
  font-size: 11px;
  font-weight: 750;
}

.weekly-context-item > strong,
.weekly-context-item > small {

.weekly-context-item > strong {

.weekly-context-item > small {

.weekly-reference-note {

.weekly-reference-note strong {

.weekly-section-grid {

}

.weekly-section {
  min-width: 0;

  align-content: start;
  gap: 12px;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.97);
  box-shadow: 0 5px 18px rgba(23, 32, 42, 0.045);
}

.weekly-section-summary,
.weekly-section-next-plan {
  grid-column: 1 / -1;
}

.weekly-section-header {
  min-width: 0;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}

.weekly-section-header > div {
  min-width: 0;
}

.weekly-ppt-label {
  margin: 0 0 4px;
  color: var(--blue);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.weekly-section-header h2 {
  margin: 0;
  font-size: 19px;
  line-height: 1.2;
}

.weekly-section-header p:last-child {
  margin: 6px 0 0;
  color: var(--text-soft);
  font-size: 11px;
  line-height: 1.5;
}

.weekly-section-count {
  flex: 0 0 auto;
  padding: 4px 7px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--muted);

}

.weekly-section-actions {

  flex-wrap: wrap;

}

.weekly-record-list {
  min-width: 0;

  gap: 10px;
}

.weekly-empty {

  align-content: center;

}

.weekly-empty > span {

}

.weekly-empty p,
.weekly-empty small {

}

.weekly-empty p {

}

.weekly-empty small {

  line-height: 1.5;
}

.weekly-record-card {

}

.weekly-record-card .attachment-list {

}

.weekly-record-card .attachment-chip:has(.attachment-thumb) {

}

.weekly-record-card .attachment-thumb {

}

.weekly-record-card .attachment-name {
  grid-column: 1;
  grid-row: 2;
  align-self: end;
}

.weekly-record-card .attachment-chip > small {
  grid-column: 1;
  grid-row: 3;
}

.weekly-record-card .attachment-download {
  grid-column: 2;
  grid-row: 2 / 4;
}

.weekly-form-context {
  min-width: 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.weekly-form-context > div {
  min-width: 0;
  display: grid;
  gap: 3px;
  padding: 9px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface-2);
}

.weekly-form-context span {
  color: var(--muted);
  font-size: 10px;
  font-weight: 750;
}

.weekly-form-context strong {
  overflow-wrap: anywhere;
  font-size: 12px;
}

@media (max-width: 1024px) {

@media (max-width: 768px) {

@media (max-width: 590px) {

  }

  .stage-compact-status {
    justify-self: start;
  }

  .stage-record-actions {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
  }

  .stage-record-actions .btn {
    width: 100%;
  }

  .advanced-audit > summary {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
  }

  .advanced-summary-status {
    grid-column: 1 / -1;

  .weekly-hero {

  }

  .weekly-context,

  .weekly-reference-note {

  .weekly-section {

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;

/* Light workspace refinements */

::selection {
  background: #cfe5da;
  color: var(--text);
}

.field > span,
.field > label,
.field-label {
  letter-spacing: 0;
}

.record-quick-action,
.record-card-actions {
  min-width: 0;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.record-quick-action > .btn:first-child {
  min-width: 0;
  flex: 1;
}

.record-card-actions .btn-icon,
.record-quick-action .btn-icon,
.attachment-download {
  width: 34px;
  min-width: 34px;
  min-height: 34px;
  height: 34px;
}

.attachment-chip {
  grid-template-columns: 44px minmax(0, 1fr) auto auto;
  grid-template-rows: auto auto;
  min-height: 58px;
}

.attachment-thumb,
.attachment-icon {
  grid-column: 1;
  grid-row: 1 / 3;
}

.attachment-thumb {
  width: 72px;
  height: 56px;
  display: grid;
  place-items: center;
  padding: 0;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #eef1f4;
  color: inherit;
  cursor: zoom-in;
}

.attachment-thumb:hover {
  border-color: #8eaa9d;
  box-shadow: 0 0 0 2px rgba(31, 122, 85, 0.1);
}

.attachment-thumb img,
.attachment-chip .attachment-thumb img {
  width: 100%;
  height: 100%;
  border-radius: 5px;
  object-fit: cover;
}

.attachment-name {
  grid-column: 2;
  grid-row: 1;
  align-self: end;
  color: var(--text-soft);
}

.attachment-name:hover {
  color: var(--blue);
  text-decoration: underline;
  text-underline-offset: 2px;
}

.attachment-chip > small {
  grid-column: 2;
  grid-row: 2;
  align-self: start;
}

.attachment-download {
  grid-column: 3;
  grid-row: 1 / 3;
  align-self: center;
}

.attachment-chip > .btn-danger {
  grid-column: 4;
  grid-row: 1 / 3;
  align-self: center;
}

.attachment-chip:has(.attachment-thumb) {
  grid-template-columns: 72px minmax(0, 1fr) auto auto;
  min-height: 70px;
}

.attachment-chip:not(:has(.attachment-thumb)) {
  min-height: 50px;
}

body.is-previewing {
  overflow: hidden;
}

.attachment-preview-dialog {
  position: fixed;
  z-index: 220;
  inset: 0;
  width: 100%;
  max-width: none;
  height: 100%;
  max-height: none;
  margin: 0;
  padding: 24px;
  overflow: hidden;
  border: 0;
  background: transparent;
  color: var(--text);
}

.attachment-preview-dialog[open] {
  display: grid;
  place-items: center;
}

.attachment-preview-dialog::backdrop {
  background: rgba(23, 32, 42, 0.62);
  backdrop-filter: blur(3px);
}

.attachment-preview-shell {
  width: min(1120px, 100%);
  height: min(900px, calc(100dvh - 48px));
  min-height: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  overflow: hidden;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  background: #ffffff;
  box-shadow: 0 24px 64px rgba(20, 30, 40, 0.24);
}

.attachment-preview-header {
  min-width: 0;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 18px;
  border-bottom: 1px solid var(--line);
}

.attachment-preview-header > div {
  min-width: 0;
}

.attachment-preview-header .eyebrow {
  margin-bottom: 3px;
  font-size: 10px;
}

.attachment-preview-header h2 {
  margin: 0;
  overflow: hidden;
  color: var(--text);
  font-size: 18px;
  line-height: 1.35;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.preview-close {
  flex: 0 0 auto;
  font-size: 20px;
  line-height: 1;
}

.attachment-preview-figure {
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  margin: 0;
  overflow: hidden;
  background: #e9eef2;
}

.attachment-preview-toolbar {
  min-width: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 12px;
  overflow: hidden;
  border-bottom: 1px solid var(--line);
  background: #e4eaee;
}

.attachment-preview-toolbar .btn {
  min-height: 36px;
  border-color: #bcc8d0;
  background: #f8fafb;
}

.attachment-preview-toolbar .btn:hover {
  border-color: var(--accent);
  background: #edf5f1;
}

.attachment-preview-toolbar .btn[aria-pressed="true"] {
  border-color: #8eb8a7;
  background: #dfeee7;
  color: #155b44;
}

.preview-zoom-step {
  flex: 0 0 38px;
  width: 38px;
  min-width: 38px;
  padding: 0;
  font-size: 19px;
  font-weight: 700;
  line-height: 1;
}

.preview-zoom-value {
  flex: 0 0 58px;
  min-width: 58px;
  color: var(--text);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  font-weight: 800;
  text-align: center;
}

.preview-zoom-mode {
  flex: 0 1 auto;
  padding-inline: 12px;
}

.attachment-preview-stage {
  min-width: 0;
  min-height: 0;
  display: flex;
  align-items: safe center;
  justify-content: safe center;
  padding: 18px;
  overflow: auto;
  overscroll-behavior: contain;
  touch-action: pan-x pan-y;
  background-color: #e9eef2;
  background-image:
    linear-gradient(rgba(86, 106, 120, 0.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(86, 106, 120, 0.055) 1px, transparent 1px);
  background-size: 24px 24px;
  scrollbar-color: #aebbc4 transparent;
}

.attachment-preview-stage:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: -3px;
}

.attachment-preview-canvas {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 1px;
  height: 1px;
  overflow: hidden;
  background: #ffffff;
  box-shadow: 0 8px 24px rgba(34, 49, 60, 0.15);
}

.attachment-preview-image {
  display: block;
  width: 100%;
  height: 100%;
  max-width: none;
  max-height: none;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
}

.attachment-preview-meta {
  min-width: 0;
  padding: 9px 14px;
  overflow: hidden;
  border-top: 1px solid var(--line);
  background: #ffffff;
  color: var(--muted);
  font-size: 11px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.attachment-preview-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 12px 16px;
  border-top: 1px solid var(--line);
  background: #ffffff;
}

@media (max-width: 860px) {

/* Batch 1: lossless migration preview and historical-data safety states. */
.persistent-safety-alert {
  min-width: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: start;
  gap: 20px;
  margin-bottom: 18px;
  padding: 18px;
  border: 1px solid #e1a3a8;
  border-left: 4px solid var(--red);
  border-radius: 10px;
  background: #fff7f7;
  box-shadow: 0 4px 14px rgba(120, 28, 34, 0.08);
}

.persistent-safety-copy {
  min-width: 0;
}

.persistent-safety-alert .eyebrow {
  margin-bottom: 5px;
  color: var(--red);
}

.persistent-safety-alert h2 {
  margin: 0;
  color: #7f1d25;

}

.persistent-safety-alert p:not(.eyebrow) {

.persistent-safety-alert ul {
  display: grid;

.modal-migration-report > header > div {

.modal-migration-report > header .eyebrow {

.modal-migration-report > header h2 {

.migration-source-name {

.migration-verdict {

.migration-verdict.is-safe {

.migration-version-grid,

.migration-version-grid > div,
.historical-metric-grid > article {

  border: 1px solid var(--line);

  background: var(--surface-2);
}

.migration-version-grid span,
.historical-metric-grid span {
  display: block;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.migration-version-grid strong,
.historical-metric-grid strong {
  display: block;
  margin-top: 5px;
  color: var(--text);
  font-size: 16px;

.migration-count-wrap {

.migration-count-wrap > h3 {

.migration-count-table {
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 8px;
}

.migration-count-row {
  min-width: 0;
  display: grid;
  grid-template-columns: minmax(90px, 1.4fr) repeat(3, minmax(56px, 0.7fr));
  align-items: center;
  border-top: 1px solid var(--line);
}

.migration-count-row:first-child {
  border-top: 0;
}

.migration-count-row > * {
  min-width: 0;
  padding: 8px 10px;
  overflow-wrap: anywhere;
  font-size: 11px;
}

.migration-count-head {
  background: #edf2f6;
  color: var(--text-soft);
  font-weight: 700;
}

.migration-count-row .is-negative {
  color: var(--red);
  font-weight: 800;
}

.migration-report-sections {
  min-width: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-top: 18px;
}

.migration-list {
  min-width: 0;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #ffffff;
}

.migration-list > header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.migration-list h3 {
  margin: 0;
  font-size: 12px;
}

.migration-list > header span {
  min-width: 25px;
  padding: 2px 6px;
  border-radius: 999px;
  background: #e8edf1;
  color: var(--text-soft);
  font-size: 10px;
  font-weight: 800;
  text-align: center;
}

.migration-list p,
.migration-list ul {
  margin: 8px 0 0;
  color: var(--text-soft);
  font-size: 11px;
}

.migration-list ul {
  display: grid;
  gap: 5px;
  max-height: 180px;
  padding-left: 18px;
  overflow: auto;
  overflow-wrap: anywhere;
}

.migration-list-warning {
  border-color: #dec77f;
  background: #fffdf4;
}

.migration-list-danger {
  border-color: #e0a7ac;
  background: #fff5f5;
  color: #7f1d25;
}

.migration-list-safe {
  border-color: #afd2bf;
  background: #f4faf6;
}

.migration-report-actions {
  position: sticky;
  bottom: -22px;
  margin: 18px -22px -22px;
  padding: 14px 22px;
  border-top: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.97);
}

.migration-report-actions .btn[disabled] {
  cursor: not-allowed;
  opacity: 0.48;
}

.historical-protection {
  min-width: 0;
  display: grid;
  gap: 18px;
}

.historical-protection-header {
  min-width: 0;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
}

.historical-protection-header > div {
  min-width: 0;
}

.historical-protection-header .eyebrow {
  margin-bottom: 5px;
  color: var(--amber);
}

.historical-protection-header h1 {
  margin: 0;
  font-size: 34px;
  overflow-wrap: anywhere;
}

.historical-protection-header p:not(.eyebrow) {
  margin: 7px 0 0;
  color: var(--text-soft);
}

.historical-readonly-badge {
  flex: 0 0 auto;
  padding: 7px 10px;
  border: 1px solid #d9bf72;
  border-radius: 6px;
  background: #fff8e7;
  color: #694a00;
  font-size: 11px;
  font-weight: 800;
}

.historical-metric-grid > article strong {
  font-size: 26px;
}

.historical-metric-grid > article small {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: 10px;
}

.historical-stage-list {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.historical-stage-list li {
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface-2);
}

.historical-stage-list code {
  min-width: 0;
  overflow: hidden;
  color: var(--text);
  font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
  font-size: 11px;
  text-overflow: ellipsis;
}

.historical-stage-list span {
  flex: 0 0 auto;
  color: var(--muted);
  font-size: 10px;
}

.historical-empty {
  margin: 0;
  color: var(--text-soft);
}

@media (max-width: 860px) {
  .migration-version-grid,
  .historical-metric-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .historical-stage-list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 590px) {
  .persistent-safety-alert {
    grid-template-columns: minmax(0, 1fr);
  }

  .persistent-safety-alert .btn {
    width: 100%;
  }

  .migration-report-modal {
    padding: 0;
    align-items: end;
  }

  .modal-migration-report {
    width: 100%;
    max-height: 96dvh;
    padding: 16px;
    border-radius: 10px 10px 0 0;
  }

  .migration-report-sections,
  .historical-stage-list {
    grid-template-columns: minmax(0, 1fr);
  }

  .migration-count-row {
    grid-template-columns: minmax(76px, 1.3fr) repeat(3, minmax(44px, 0.7fr));
  }

  .migration-count-row > * {
    padding-inline: 6px;
    font-size: 10px;
  }

  .migration-report-actions {
    bottom: -16px;
    grid-template-columns: minmax(0, 1fr);
    margin: 16px -16px -16px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  }

  .migration-report-actions .btn {
    width: 100%;
  }

  .historical-protection-header {
    display: grid;
  }

  .historical-readonly-badge {
    justify-self: start;
  }
}

@media (max-width: 390px) {
  .migration-version-grid,
  .historical-metric-grid {
    grid-template-columns: minmax(0, 1fr);
  }
}

.modal-header-actions {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

.workspace-legacy-summary {
  min-width: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 18px;
  margin-bottom: 18px;
  padding: 15px 17px;
  border: 1px solid #d8c581;
  border-left: 4px solid var(--amber);
  border-radius: 10px;
  background: #fffdf5;
}

.workspace-legacy-summary > div {
  min-width: 0;
}

.workspace-legacy-summary .eyebrow {
  margin-bottom: 3px;
  color: var(--amber);
}

.workspace-legacy-summary h2 {
  margin: 0;
  font-size: 16px;
}

.workspace-legacy-summary p:not(.eyebrow) {
  margin: 4px 0 0;
  color: var(--text-soft);
  font-size: 11px;
}

.workspace-legacy-summary > strong {
  min-width: 42px;
  padding: 8px 10px;
  border: 1px solid #d8c581;
  border-radius: 8px;
  background: #ffffff;
  color: #694a00;
  font-size: 21px;
  text-align: center;
}

@media (max-width: 590px) {
  .modal-header-actions .btn-small {
    min-height: 40px;
  }

  .workspace-legacy-summary {
    grid-template-columns: minmax(0, 1fr);
  }

  .workspace-legacy-summary > strong {
    justify-self: start;
  }
}

/* Batch 2: Gate 2.0, three-axis Stage state, and auditable exceptions. */
:root {
  --state-blue: #2667b2;
  --state-blue-soft: #edf4fc;
  --state-green: #176443;
  --state-green-soft: #edf7f1;
  --state-red: #a61f2b;
  --state-red-soft: #fff2f3;
  --state-yellow: #765000;
  --state-yellow-soft: #fff8e6;
  --state-gray: #596775;
  --state-gray-soft: #f1f3f5;
}

:focus-visible {
  outline-color: rgba(38, 103, 178, 0.56);
}

.workflow-alert {
  min-width: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: start;
  gap: 16px;
  margin-bottom: 18px;
  padding: 16px;
  border: 1px solid #dfa4aa;
  border-left: 4px solid var(--state-red);
  border-radius: 8px;
  background: var(--state-red-soft);
  color: #671921;
}

.workflow-alert h2 {
  margin: 0;
  font-size: 16px;
}

.workflow-alert p {
  margin: 5px 0 0;
  font-size: 12px;
}

.workflow-alert ul {
  display: grid;
  gap: 4px;
  margin: 10px 0 0;
  padding-left: 20px;
  font-size: 12px;
  overflow-wrap: anywhere;
}

.stage-card.gate2-card {
  min-height: 142px;
  grid-template-columns: auto minmax(0, 1fr);
  grid-template-rows: auto auto auto;
  align-content: start;
  gap: 8px;
  padding: 11px;
  border-color: var(--line-strong);
  background: rgba(255, 255, 255, 0.96);
}

.stage-card.gate2-card.is-current {
  border-color: var(--state-blue);
  box-shadow: inset 3px 0 0 var(--state-blue);
}

.stage-card.gate2-card.is-current::after {
  background: var(--state-blue);
}

.stage-card.gate2-card.is-accepted {
  border-color: #a9cfba;
  background: var(--state-green-soft);
}

.stage-card.gate2-card.risk-blocking {
  border-color: #dfa4aa;
  background: var(--state-red-soft);
}

.stage-card.gate2-card.risk-warning {
  border-color: #dcc16b;
  background: var(--state-yellow-soft);
}

.stage-card.gate2-card.is-selected {
  border-color: var(--state-blue);
  background: var(--state-blue-soft);
  box-shadow: 0 0 0 2px rgba(38, 103, 178, 0.12);
}

.stage-card.gate2-card .stage-card-body {
  padding-right: 34px;
}

.stage-card.gate2-card .stage-card-body small {
  white-space: normal;
}

.stage-axis-strip {
  grid-column: 1 / -1;
  min-width: 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 5px;
}

.stage-axis {
  min-width: 0;
  display: grid;
  gap: 2px;
  padding: 5px 6px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.78);
}

.axis-label {
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
}

.axis-value {
  overflow: hidden;
  font-size: 12px;
  font-weight: 800;
  line-height: 1.25;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.semantic-success {
  color: var(--state-green);
}

.semantic-danger {
  color: var(--state-red);
}

.semantic-info {
  color: var(--state-blue);
}

.semantic-warning {
  color: var(--state-yellow);
}

.semantic-muted {
  color: var(--state-gray);
}

.progress-track.is-blue::-webkit-progress-value {
  background: var(--state-blue);
}

.progress-track.is-blue::-moz-progress-bar {
  background: var(--state-blue);
}

.stage-card-footer {
  grid-column: 1 / -1;
  min-width: 0;
  display: grid;
  gap: 5px;
}

.stage-gate-summary {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.gate-summary-count {
  display: inline-flex;
  align-items: center;
  min-height: 19px;
  padding: 2px 5px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: rgba(255, 255, 255, 0.82);
  color: var(--text-soft);
  font-size: 11px;
  font-weight: 750;
}

.gate-summary-count.is-pass {
  border-color: #abd0bb;
  color: var(--state-green);
}

.gate-summary-count.is-fail {
  border-color: #dfa4aa;
  color: var(--state-red);
}

.gate-summary-count.is-risk {
  border-color: #dcc16b;
  color: var(--state-yellow);
}

.stage-leading-blocker {
  min-width: 0;
  min-height: 2.7em;
  display: -webkit-box;
  overflow: hidden;
  color: var(--state-red);
  font-size: 11px;
  line-height: 1.35;
  overflow-wrap: anywhere;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

.stage-leading-blocker.is-warning {
  color: var(--state-yellow);
}

.stage-state-overview {
  min-width: 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 14px;
}

.state-axis-card {
  min-width: 0;
  display: grid;
  gap: 4px;
  padding: 12px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--line-strong);
  border-radius: 7px;
  background: var(--surface-2);
}

.state-axis-card > span {
  color: var(--muted);
  font-size: 11px;
  font-weight: 750;
}

.state-axis-card > strong {
  overflow-wrap: anywhere;
  font-size: 14px;
}

.state-axis-card.is-success {
  border-left-color: var(--state-green);
  background: var(--state-green-soft);
  color: var(--state-green);
}

.state-axis-card.is-danger {
  border-left-color: var(--state-red);
  background: var(--state-red-soft);
  color: var(--state-red);
}

.state-axis-card.is-info {
  border-left-color: var(--state-blue);
  background: var(--state-blue-soft);
  color: var(--state-blue);
}

.state-axis-card.is-warning {
  border-left-color: #c39816;
  background: var(--state-yellow-soft);
  color: var(--state-yellow);
}

.state-axis-card.is-muted {
  color: var(--state-gray);
}

.stage-action-bar {
  min-width: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 16px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #f7f9fb;
}

.stage-action-bar .action-context {
  min-width: 180px;
  flex: 1 1 240px;
  color: var(--text-soft);
  font-size: 11px;
}

.stage-blockers {
  min-width: 0;
  margin-bottom: 16px;
  padding: 13px;
  border: 1px solid #dfa4aa;
  border-left: 4px solid var(--state-red);
  border-radius: 7px;
  background: var(--state-red-soft);
}

.stage-blockers.is-warning {
  border-color: #dcc16b;
  border-left-color: #c39816;
  background: var(--state-yellow-soft);
}

.stage-blockers > header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.stage-blockers h3 {
  margin: 0;
  font-size: 13px;
}

.stage-blockers > header span {
  flex: 0 0 auto;
  min-width: 24px;
  padding: 2px 6px;
  border-radius: 99px;
  background: #ffffff;
  font-size: 10px;
  font-weight: 800;
  text-align: center;
}

.stage-blocker-list {
  display: grid;
  gap: 7px;
  margin: 10px 0 0;
  padding: 0;
  list-style: none;
}

.stage-blocker-list li {
  min-width: 0;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 8px;
  align-items: start;
  font-size: 11px;
  overflow-wrap: anywhere;
}

.blocker-severity {
  min-width: 56px;
  padding: 2px 5px;
  border: 1px solid currentColor;
  border-radius: 4px;
  color: var(--state-red);
  font-size: 11px;
  font-weight: 800;
  text-align: center;
  text-transform: uppercase;
}

.stage-accepted-banner {
  margin-bottom: 16px;
  padding: 11px 13px;
  border: 1px solid #abd0bb;
  border-left: 4px solid var(--state-green);
  border-radius: 7px;
  background: var(--state-green-soft);
  color: var(--state-green);
  font-size: 12px;
  font-weight: 700;
}

.stage-accepted-banner.is-override {
  border-color: #dcc16b;
  border-left-color: #c39816;
  background: var(--state-yellow-soft);
  color: var(--state-yellow);
}

.gate2-list {
  min-width: 0;
  display: grid;
  gap: 8px;
}

.gate2-row {
  min-width: 0;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  padding: 11px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--line-strong);
  border-radius: 7px;
  background: #f9fafb;
}

.gate2-row.is-pass {
  border-left-color: var(--state-green);
}

.gate2-row.is-fail {
  border-left-color: var(--state-red);
  background: var(--state-red-soft);
}

.gate2-row.is-risk,
.gate2-row.is-waived,
.gate2-row.is-not_applicable {
  border-left-color: #c39816;
  background: var(--state-yellow-soft);
}

.gate2-row.is-pending {
  border-left-color: var(--state-gray);
}

.gate2-rule {
  min-width: 0;
}

.gate2-rule strong,
.gate2-rule small {
  display: block;
}

.gate2-rule strong {
  overflow-wrap: anywhere;
  font-size: 13px;
}

.gate2-rule small {
  margin-top: 3px;
  color: var(--muted);
  font-size: 11px;
  overflow-wrap: anywhere;
}

.gate2-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 6px;
}

.rule-chip,
.gate-result-pill {
  display: inline-flex;
  align-items: center;
  min-height: 21px;
  padding: 2px 6px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: #ffffff;
  color: var(--text-soft);
  font-size: 11px;
  font-weight: 750;
}

.rule-chip.is-blocker,
.rule-chip.is-critical,
.gate-result-pill.is-fail {
  border-color: #dfa4aa;
  color: var(--state-red);
}

.rule-chip.is-warning,
.gate-result-pill.is-waived,
.gate-result-pill.is-not_applicable {
  border-color: #dcc16b;
  color: var(--state-yellow);
}

.gate-result-pill.is-pass {
  border-color: #abd0bb;
  color: var(--state-green);
}

.gate-result-pill.is-pending {
  color: var(--state-gray);
}

.gate2-result {
  min-width: 0;
  display: grid;
  justify-items: end;
  gap: 4px;
  text-align: right;
}

.gate2-result small {
  color: var(--muted);
  font-size: 11px;
}

.gate-history {
  display: grid;
  gap: 6px;
  margin: 10px 0 0;
  padding: 0;
  list-style: none;
}

.gate-history li {
  display: grid;
  grid-template-columns: auto auto minmax(0, 1fr);
  gap: 8px;
  align-items: center;
  padding: 7px 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #ffffff;
  color: var(--text-soft);
  font-size: 11px;
}

.modal-gate-result {
  width: min(920px, 100%);
  max-height: min(94vh, 980px);
}

.modal-stage-action {
  width: min(680px, 100%);
}

.form-section {
  min-width: 0;
  display: grid;
  gap: 10px;
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface-2);
}

.form-section > header h3 {
  margin: 0;
  font-size: 13px;
}

.form-section > header p {
  margin: 3px 0 0;
  color: var(--muted);
  font-size: 11px;
}

.gate-definition-grid,
.gate-result-grid,
.stage-action-grid {
  min-width: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.gate-definition-grid > div {
  min-width: 0;
  display: grid;
  gap: 2px;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #ffffff;
}

.gate-definition-grid span {
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
}

.gate-definition-grid strong {
  overflow-wrap: anywhere;
  font-size: 12px;
}

.field-span-2 {
  grid-column: 1 / -1;
}

.evidence-picker {
  min-width: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 7px;
  max-height: 250px;
  padding: 8px;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #ffffff;
}

.evidence-option {
  min-width: 0;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: start;
  gap: 8px;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface-2);
  cursor: pointer;
}

.evidence-option input {
  width: 17px;
  height: 17px;
  margin: 1px 0 0;
  accent-color: var(--state-blue);
}

.evidence-option strong,
.evidence-option small {
  display: block;
  overflow-wrap: anywhere;
}

.evidence-option strong {
  font-size: 12px;
}

.evidence-option small {
  margin-top: 3px;
  color: var(--muted);
  font-size: 11px;
}

.evidence-empty {
  grid-column: 1 / -1;
  margin: 0;
  padding: 12px;
  color: var(--muted);
  font-size: 11px;
  text-align: center;
}

.conditional-fields {
  min-width: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  padding: 12px;
  border: 1px solid #dcc16b;
  border-radius: 7px;
  background: var(--state-yellow-soft);
}

.form-findings {
  margin: 0;
  padding: 10px 10px 10px 28px;
  border: 1px solid #dfa4aa;
  border-radius: 7px;
  background: var(--state-red-soft);
  color: #671921;
  font-size: 11px;
  overflow-wrap: anywhere;
}

.self-review-warning {
  margin: 0;
  padding: 8px 10px;
  border: 1px solid #dcc16b;
  border-radius: 6px;
  background: var(--state-yellow-soft);
  color: var(--state-yellow);
  font-size: 11px;
}

.override-audit {
  display: grid;
  gap: 6px;
  margin-top: 12px;
}

.override-audit-item {
  min-width: 0;
  padding: 9px;
  border: 1px solid #dcc16b;
  border-radius: 6px;
  background: var(--state-yellow-soft);
  color: var(--state-yellow);
  font-size: 11px;
  overflow-wrap: anywhere;
}

@media (max-width: 1024px) {
  .stage-card.gate2-card {
    min-height: 150px;
  }

  .stage-action-bar .btn {
    flex: 1 1 auto;
  }
}

@media (max-width: 768px) {
  .stage-state-overview,
  .gate-definition-grid,
  .gate-result-grid,
  .stage-action-grid {
    grid-template-columns: minmax(0, 1fr);
  }

  .field-span-2 {
    grid-column: auto;
  }

  .gate2-row {
    grid-template-columns: auto minmax(0, 1fr);
  }

  .gate2-result {
    grid-column: 2;
    justify-items: start;
    text-align: left;
  }

  .gate2-row > .btn {
    grid-column: 1 / -1;
    width: 100%;
  }

  .evidence-picker {
    grid-template-columns: minmax(0, 1fr);
  }
}

@media (max-width: 590px) {
  .workflow-alert {
    grid-template-columns: minmax(0, 1fr);
  }

  .workflow-alert .btn {
    width: 100%;
  }

  .stage-card.gate2-card {
    min-height: 164px;
  }

  .stage-axis-strip {
    grid-template-columns: minmax(0, 1fr);
  }

  .stage-axis {
    grid-template-columns: 52px minmax(0, 1fr);
    align-items: center;
  }

  .stage-action-bar {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
  }

  .stage-action-bar .action-context {
    min-width: 0;
  }

  .stage-action-bar .btn {
    width: 100%;
  }

  .stage-blocker-list li {
    grid-template-columns: minmax(0, 1fr);
  }

  .blocker-severity {
    justify-self: start;
  }

  .conditional-fields {
    grid-template-columns: minmax(0, 1fr);
  }

  .modal-gate-result,
  .modal-stage-action {
    width: 100%;
    max-height: 96dvh;
    border-radius: 10px 10px 0 0;
  }

  .gate-history li {
    grid-template-columns: auto minmax(0, 1fr);
  }

  .gate-history li > :last-child {
    grid-column: 1 / -1;
  }
}
</style>

  function isObject(value) {

        .sort()
        .map((key) => `${JSON.stringify(key)}:${stableSerialize(value[key])}`)

    return JSON.stringify(value);

    // Consistency checksum only; local JSON is not cryptographically authenticated.
    const text = stableSerialize(value) ?? "undefined";
    let hash = 2166136261;
    for (let index = 0; index < text.length; index += 1) {
      hash ^= text.charCodeAt(index);
      hash = Math.imul(hash, 16777619);
    }
    return `fnv1a-${(hash >>> 0).toString(16).padStart(8, "0")}`;

      "records",
      "attachments",
      "workspaceFields",

    const runs = Array.isArray(workspace && workspace.runs)
      ? workspace.runs

    counts.runs = runs.length;
    for (const run of runs) {
      const stages = Array.isArray(run && run.stages) ? run.stages : [];
      counts.stages += stages.length;
      for (const stage of stages) {
        counts.gates += Array.isArray(stage && stage.gates)
          ? stage.gates.length
          : 0;
      }
    }
    counts.records = Array.isArray(workspace && workspace.records)
      ? workspace.records.length
      : 0;
    counts.attachments = Array.isArray(workspace && workspace.attachments)
      ? workspace.attachments.length
      : 0;

    counts.gates += Array.isArray(legacy.gates) ? legacy.gates.length : 0;

      afterCounts: emptyCounts(),
      sourceConservation: {
        expected: 0,
        accounted: 0,
        unaccountedPaths: [],
      },
      conservationLedger: [],
      insertedStages: [],
      derivedAdditions: {
        stageStates: 0,
        gateDefinitions: 0,
        gateResults: 0,
      },
      addedStageStates: [],
      addedGateDefinitions: [],
      addedGateResults: [],
      legacyPreservations: [],
      warnings: [],
      blockingErrors: [],
      discardedItems: [],
      safe: false,
      canImport: false,
      canSave: false,
    };
  }

  function addUniqueFinding(collection, finding) {
    const key = [
      finding.code,
      finding.path || "",
      finding.identity || "",
      (finding.relatedPaths || []).join("|"),
    ].join("::");
    if (
      !collection.some(
        (item) =>
          [
            item.code,
            item.path || "",
            item.identity || "",
            (item.relatedPaths || []).join("|"),
          ].join("::") === key,
      )
    ) {
      collection.push(finding);
    }
  }

  function addBlocking(
    report,
    code,
    path,
    identity,
    message,
    relatedPaths = [],
  ) {
    addUniqueFinding(report.blockingErrors, {
      code,
      path,
      identity: identity || null,
      message,
      relatedPaths,
    });
  }

  function addWarning(report, code, path, message) {
    addUniqueFinding(report.warnings, { code, path, message });
  }

  function addLedger(
    report,
    sourcePath,
    kind,
    sourceIdentity,
    destination,
    destinationPath,
    value,
  ) {
    report.conservationLedger.push({
      sourcePath,
      kind,
      sourceIdentity: sourceIdentity || null,
      destination,
      destinationPath,
      preserved: true,
      projection:
        kind === "run"
          ? "run-without-stages-or-template-version"
          : kind === "stage"
            ? "stage-without-gates"
            : "full-object",
      fingerprintBefore: fingerprint(projectConservedValue(kind, value)),
      fingerprintAfter: null,
    });
  }

  function projectConservedValue(kind, value) {
    const projected = clone(value);
    if (!isObject(projected)) return projected;
    if (kind === "run") {
      delete projected.stages;
      delete projected.templateVersion;
    } else if (kind === "stage") {
      delete projected.gates;
      delete projected.state;
    } else if (kind === "gate") {
      delete projected.definition;
      delete projected.results;
      delete projected.currentResultId;
    }
    return projected;
  }

  function resolveJsonPath(root, path) {
    if (path === "$") return { found: true, value: root };
    if (typeof path !== "string" || !path.startsWith("$")) {
      return { found: false, value: undefined };
    }
    const tokenPattern = /\.([A-Za-z_$][\w$]*)|\[(\d+)\]/g;
    let cursor = root;
    let consumed = 1;
    let match;
    while ((match = tokenPattern.exec(path))) {
      if (match.index !== consumed) {
        return { found: false, value: undefined };
      }
      const key = match[1] === undefined ? Number(match[2]) : match[1];
      if (
        cursor === null ||
        cursor === undefined ||
        !Object.prototype.hasOwnProperty.call(Object(cursor), key)
      ) {
        return { found: false, value: undefined };
      }
      cursor = cursor[key];
      consumed = tokenPattern.lastIndex;
    }
    return consumed === path.length
      ? { found: true, value: cursor }
      : { found: false, value: undefined };
  }

  function unwrapLegacyPath(path, value) {
    return (
      typeof path === "string" &&
      path.startsWith("$.legacy.") &&
      isObject(value) &&
      hasOwn(value, "value")
    )
      ? value.value
      : value;
  }

  function kindForSourcePath(path) {
    if (/\.gates\[\d+\]$/.test(path) || /^\$\.legacy\.gates\[\d+\]$/.test(path)) {
      return "gate";
    }
    if (
      /\.stages\[\d+\]$/.test(path) ||
      /^\$\.legacy\.stages\[\d+\]$/.test(path)
    ) {
      return "stage";
    }
    if (/^\$\.runs\[\d+\]$/.test(path)) return "run";
    if (/records\[\d+\]$/.test(path)) return "record";
    if (/attachments\[\d+\]$/.test(path)) return "attachment";
    return "";
  }

  function verifyConservation(source, candidate, ledgerInput) {
    const ledger = Array.isArray(ledgerInput) ? clone(ledgerInput) : [];
    const expectedPaths = enumerateSourcePaths(source);
    const expectedSet = new Set(expectedPaths);
    const entriesBySource = new Map();
    const entriesByDestination = new Map();
    const extraSourcePaths = [];
    for (const entry of ledger) {
      const sourcePath = String((entry && entry.sourcePath) || "");
      const destinationPath = String((entry && entry.destinationPath) || "");
      const sourceEntries = entriesBySource.get(sourcePath) || [];
      sourceEntries.push(entry);
      entriesBySource.set(sourcePath, sourceEntries);
      const destinationEntries =
        entriesByDestination.get(destinationPath) || [];
      destinationEntries.push(entry);
      entriesByDestination.set(destinationPath, destinationEntries);
      if (!expectedSet.has(sourcePath)) extraSourcePaths.push(sourcePath);
    }

    const duplicateSourcePaths = Array.from(entriesBySource)
      .filter(([, entries]) => entries.length !== 1)
      .map(([path]) => path);
    const duplicateDestinationPaths = Array.from(entriesByDestination)
      .filter(
        ([path, entries]) => Boolean(path) && entries.length !== 1,
      )
      .map(([path]) => path);
    const duplicateDestinationSet = new Set(duplicateDestinationPaths);
    const missingDestinations = [];
    const fingerprintMismatches = [];
    const invalidSourcePaths = new Set();

    for (const sourcePath of expectedPaths) {
      const entries = entriesBySource.get(sourcePath) || [];
      if (entries.length !== 1) {
        invalidSourcePaths.add(sourcePath);
        continue;
      }
      const entry = entries[0];
      const expectedKind = kindForSourcePath(sourcePath);
      if (entry.kind !== expectedKind) {
        fingerprintMismatches.push({
          sourcePath,
          reason: "kind-mismatch",
          expectedKind,
          actualKind: entry.kind,
        });
        invalidSourcePaths.add(sourcePath);
        continue;
      }
      if (duplicateDestinationSet.has(entry.destinationPath)) {
        invalidSourcePaths.add(sourcePath);
      }
      const sourceResult = resolveJsonPath(source, sourcePath);
      const destinationResult = resolveJsonPath(
        candidate,
        entry.destinationPath,
      );
      if (!sourceResult.found || !destinationResult.found) {
        missingDestinations.push({
          sourcePath,
          destinationPath: entry.destinationPath,
        });
        invalidSourcePaths.add(sourcePath);
        continue;
      }
      const sourceValue = unwrapLegacyPath(sourcePath, sourceResult.value);
      const destinationValue = unwrapLegacyPath(
        entry.destinationPath,
        destinationResult.value,
      );
      const serializedBefore = stableSerialize(
        projectConservedValue(entry.kind, sourceValue),
      );
      const serializedAfter = stableSerialize(
        projectConservedValue(entry.kind, destinationValue),
      );
      const fingerprintBefore = fingerprint(
        projectConservedValue(entry.kind, sourceValue),
      );
      const fingerprintAfter = fingerprint(
        projectConservedValue(entry.kind, destinationValue),
      );
      if (
        (entry.fingerprintBefore &&
          entry.fingerprintBefore !== fingerprintBefore) ||
        (entry.fingerprintAfter &&
          entry.fingerprintAfter !== fingerprintAfter) ||
        serializedBefore !== serializedAfter ||
        fingerprintBefore !== fingerprintAfter
      ) {
        fingerprintMismatches.push({
          sourcePath,
          destinationPath: entry.destinationPath,
          reason: "payload-mismatch",
          fingerprintBefore,
          fingerprintAfter,
        });
        invalidSourcePaths.add(sourcePath);
      }
      entry.projection =
        entry.kind === "run"
          ? "run-without-stages-or-template-version"
          : entry.kind === "stage"
            ? "stage-without-gates"
            : "full-object";
      entry.fingerprintBefore = fingerprintBefore;
      entry.fingerprintAfter = fingerprintAfter;
      entry.preserved = !invalidSourcePaths.has(sourcePath);
    }
    for (const path of extraSourcePaths) invalidSourcePaths.add(path);
    return {
      safe:
        invalidSourcePaths.size === 0 &&
        extraSourcePaths.length === 0 &&
        duplicateDestinationPaths.length === 0,
      expected: expectedPaths.length,
      accounted: expectedPaths.filter(
        (path) => !invalidSourcePaths.has(path),
      ).length,
      unaccountedPaths: expectedPaths.filter((path) =>
        invalidSourcePaths.has(path),
      ),
      duplicateSourcePaths,
      extraSourcePaths: Array.from(new Set(extraSourcePaths)),
      duplicateDestinationPaths,
      missingDestinations,
      fingerprintMismatches,
      ledger,
    };
  }

  function addLegacy(legacy, category, report, context, value) {
    const singular = category.slice(0, -1);
    const entry = {
      kind: singular,
      sourcePath: context.sourcePath,
      runId: context.runId || null,
      stageSlug: context.stageSlug || null,
      recordId: context.recordId || null,
      value: clone(value),
    };
    const index = legacy[category].push(entry) - 1;
    const destinationPath = `$.legacy.${category}[${index}]`;
    report.legacyPreservations.push({
      kind: singular,
      sourcePath: context.sourcePath,
      destinationPath,
      disposition: "typed-legacy",
      runId: entry.runId,
      stageSlug: entry.stageSlug,
      recordId: entry.recordId,
    });
    addLedger(
      report,
      context.sourcePath,
      singular,
      context.sourceIdentity,
      "legacy",
      destinationPath,
      value,
    );
    return entry;
  }

  function preserveInvalidWorkspaceField(
    legacy,
    report,
    {
      sourcePath,
      field,
      runId = null,
      value,
      blockingCode,
      message,
    },
  ) {
    const entry = {
      kind: "workspace-field",
      sourcePath,
      field,
      runId,
      value: clone(value),
      blockingCode,
      blockingMessage: message,
    };
    const index = legacy.workspaceFields.push(entry) - 1;
    const destinationPath = `$.legacy.workspaceFields[${index}]`;
    report.legacyPreservations.push({
      kind: "workspace-field",
      sourcePath,
      destinationPath,
      disposition: "typed-legacy",
      runId,
      stageSlug: null,
      recordId: null,
    });
    addBlocking(
      report,
      blockingCode,
      sourcePath,
      null,
      message,
      [destinationPath],
    );
  }

  function reapplyPreservedWorkspaceBlocks(legacy, report) {
    const entries = [];
    for (const category of [
      "workspaceFields",
      "stages",
      "gates",
      "records",
      "attachments",
    ]) {
      if (Array.isArray(legacy && legacy[category])) {
        entries.push(
          ...legacy[category].map((entry, index) => ({
            entry,
            fallbackPath: `$.legacy.${category}[${index}]`,
          })),
        );
      }
    }
    for (const { entry, fallbackPath } of entries) {
      if (
        !isObject(entry) ||
        typeof entry.blockingCode !== "string" ||
        !entry.blockingCode
      ) {
        continue;
      }
      addBlocking(
        report,
        entry.blockingCode,
        String(entry.sourcePath || fallbackPath),
        null,
        String(
          entry.blockingMessage ||
            "历史工作区字段形状无效，修复前禁止保存。",
        ),
        [fallbackPath],
      );
    }
  }

  function inferTemplateVersion(run) {
    if (
      isObject(run) &&
      typeof run.templateVersion === "string" &&
      run.templateVersion.trim()
    ) {
      return {
        value: run.templateVersion,
        basis: "existing-template-version",
      };
    }
    const slugs = (Array.isArray(run && run.stages) ? run.stages : [])
      .map((stage) =>
        isObject(stage) && typeof stage.slug === "string"
          ? stage.slug.trim()
          : "",
      )
      .filter(Boolean);
    const containsUnknown = slugs.some(
      (slug) => !RECOGNIZED_HISTORICAL_STAGE_SET.has(slug),
    );
    const containsProductionOnly = slugs.some(
      (slug) =>
        PRODUCTION_STAGE_SET.has(slug) && !COMPANY_STAGE_SET.has(slug),
    );
    const containsCompanyOnly = slugs.some(
      (slug) =>
