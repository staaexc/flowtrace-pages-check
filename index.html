<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f9" />
    <meta name="color-scheme" content="light" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'sha256-lQ2inaZ/Qklk8HkxZ9OuY0NrCtvPYhqtwMbF52Jh51k='; style-src 'sha256-LNzu56dJYWNHwSgeLvW02Nr9QHrpRpBI/oG+5A4qYjQ='; connect-src https://api.github.com; img-src data:; font-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none';"
    />
    <meta
      name="description"
      content="FlowTrace — 私密、可复盘的 Innovus 后端流程工作台"
    />
    <title>FlowTrace</title>
    <style>:root {
  color-scheme: light;
  --bg: #f6f7f9;
  --bg-soft: #eef1f4;
  --surface: #ffffff;
  --surface-2: #f8fafb;
  --surface-3: #eef3f1;
  --line: #dfe4ea;
  --line-strong: #cbd3dc;
  --text: #17202a;
  --text-soft: #4f5d6b;
  --muted: #73808d;
  --green: #1f7a55;
  --green-strong: #176443;
  --green-deep: #0f5538;
  --mint: #176443;
  --amber: #8a5900;
  --red: #b4232c;
  --blue: #2667b2;
  --shadow: 0 18px 48px rgba(22, 34, 45, 0.16);
  --radius-xl: 10px;
  --radius-lg: 8px;
  --radius-md: 8px;
  --radius-sm: 6px;
  --sidebar: 256px;
  --font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
    "Microsoft YaHei", sans-serif;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  margin: 0;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.55;
}

button,
input,
textarea,
select {
  font: inherit;
}

button,
a,
input,
textarea,
select {
  -webkit-tap-highlight-color: transparent;
}

button {
  color: inherit;
}

a {
  color: var(--blue);
}

img {
  display: block;
  max-width: 100%;
}

[hidden] {
  display: none !important;
}

.skip-link {
  position: fixed;
  z-index: 1000;
  top: 8px;
  left: 8px;
  padding: 10px 14px;
  border-radius: 10px;
  background: var(--text);
  color: var(--bg);
  transform: translateY(-150%);
}

.skip-link:focus {
  transform: translateY(0);
}

:focus-visible {
  outline: 3px solid rgba(31, 122, 85, 0.32);
  outline-offset: 2px;
}

.boot-screen {
  min-height: 100vh;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 16px;
  color: var(--text-soft);
}

.boot-mark,
.brand-mark {
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  border: 1px solid #b9d5c8;
  border-radius: 8px;
  background: #e9f3ee;
  color: var(--green-strong);
  font-weight: 800;
  letter-spacing: 0;
  box-shadow: none;
}

.boot-mark {
  animation: breathe 2s ease-in-out infinite;
}

@keyframes breathe {
  50% {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(31, 122, 85, 0.14);
  }
}

.lock-shell {
  position: relative;
  min-height: 100vh;
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(360px, 0.75fr);
  align-items: center;
  gap: clamp(36px, 7vw, 110px);
  width: min(1180px, calc(100% - 48px));
  margin: 0 auto;
  padding: 64px 0;
}

.lock-shell::before {
  content: "";
  position: fixed;
  z-index: -1;
  inset: 0;
  display: none;
}

.lock-intro {
  max-width: 670px;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 18px;
  color: var(--green);
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0;
  text-transform: uppercase;
}

.eyebrow::before {
  content: "";
  width: 28px;
  height: 1px;
  background: currentColor;
}

.lock-title {
  margin: 0;
  max-width: 720px;
  font-size: 56px;
  font-weight: 690;
  line-height: 1.02;
  letter-spacing: 0;
}

.lock-title em {
  color: var(--green);
  font-style: normal;
}

.lock-copy {
  max-width: 600px;
  margin: 24px 0 0;
  color: var(--text-soft);
  font-size: 18px;
}

.privacy-points {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin-top: 34px;
}

.privacy-point {
  min-height: 112px;
  padding: 17px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: #ffffff;
}

.privacy-point strong {
  display: block;
  margin-bottom: 5px;
  font-size: 14px;
}

.privacy-point span {
  color: var(--muted);
  font-size: 12px;
}

.connect-card {
  position: relative;
  padding: clamp(24px, 3vw, 34px);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-xl);
  background: var(--surface);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.connect-card::after {
  content: "";
  position: absolute;
  top: -70px;
  right: -70px;
  width: 170px;
  height: 170px;
  border: 0;
  border-radius: 50%;
  box-shadow: none;
  display: none;
  pointer-events: none;
}

.connect-head {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 25px;
}

.connect-head h2,
.panel-title {
  margin: 0;
  font-size: 20px;
  letter-spacing: 0;
}

.connect-head p {
  margin: 3px 0 0;
  color: var(--muted);
  font-size: 12px;
}

.form-grid,
.stack {
  display: grid;
  gap: 16px;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.field {
  display: grid;
  gap: 7px;
}

.field > span,
.field > label,
.field-label {
  color: var(--text-soft);
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 0;
}

.field small,
.help,
.muted {
  color: var(--muted);
  font-size: 12px;
}

input,
textarea,
select {
  width: 100%;
  min-height: 46px;
  padding: 11px 13px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  outline: none;
  background: #ffffff;
  color: var(--text);
  transition:
    border-color 160ms ease,
    box-shadow 160ms ease,
    background 160ms ease;
}

textarea {
  min-height: 118px;
  resize: vertical;
}

input:hover,
textarea:hover,
select:hover {
  border-color: #9aa8b6;
}

input:focus,
textarea:focus,
select:focus {
  border-color: var(--green);
  box-shadow: 0 0 0 3px rgba(31, 122, 85, 0.12);
  background: #ffffff;
}

input::placeholder,
textarea::placeholder {
  color: #98a2ad;
}

select {
  cursor: pointer;
}

.checkbox {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  cursor: pointer;
  color: var(--text-soft);
  font-size: 13px;
}

.checkbox input {
  flex: 0 0 auto;
  width: 18px;
  min-height: 18px;
  height: 18px;
  margin-top: 2px;
  accent-color: var(--green-strong);
}

.security-note,
.callout {
  padding: 13px 14px;
  border: 1px solid #ead6a7;
  border-radius: 6px;
  background: #fff9eb;
  color: #6d5214;
  font-size: 12px;
}

.security-note strong,
.callout strong {
  color: var(--amber);
}

.error-box {
  padding: 12px 14px;
  border: 1px solid #efc4c7;
  border-radius: 6px;
  background: #fff3f3;
  color: #8e1f27;
  font-size: 13px;
}

.btn {
  min-height: 42px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 9px 15px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: #ffffff;
  color: var(--text);
  cursor: pointer;
  text-decoration: none;
  font-weight: 680;
  font-size: 13px;
  transition:
    transform 150ms ease,
    background 150ms ease,
    border-color 150ms ease,
    color 150ms ease;
}

.btn:hover:not(:disabled) {
  transform: none;
  border-color: #9aa8b6;
  background: #f3f5f7;
}

.btn:active:not(:disabled) {
  transform: translateY(0);
}

.btn:disabled {
  opacity: 0.5;
  cursor: wait;
}

.btn-primary {
  border-color: var(--green-strong);
  background: var(--green-strong);
  color: #ffffff;
  box-shadow: none;
}

.btn-primary:hover:not(:disabled) {
  border-color: var(--green-deep);
  background: var(--green-deep);
}

.btn-danger {
  border-color: #e4b5b9;
  background: #fff3f3;
  color: var(--red);
}

.btn-ghost {
  border-color: transparent;
  background: transparent;
  color: var(--text-soft);
}

.btn-small {
  min-height: 34px;
  padding: 6px 10px;
  font-size: 12px;
}

.btn-block {
  width: 100%;
}

.app-shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: var(--sidebar) minmax(0, 1fr);
  grid-template-rows: 74px minmax(0, 1fr);
  grid-template-areas:
    "sidebar topbar"
    "sidebar main";
}

.topbar {
  grid-area: topbar;
  position: sticky;
  z-index: 20;
  top: 0;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 0 26px;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(12px);
}

.topbar-title {
  min-width: 0;
}

.topbar-title h1 {
  overflow: hidden;
  margin: 0;
  font-size: 18px;
  font-weight: 720;
  letter-spacing: 0;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.topbar-title p {
  margin: 2px 0 0;
  color: var(--muted);
  font-size: 11px;
}

.topbar-actions,
.panel-actions,
.inline-actions,
.toolbar {
  display: flex;
  align-items: center;
  gap: 9px;
}

.sync-state {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 11px;
  white-space: nowrap;
}

.sync-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--muted);
}

.sync-state.is-clean .sync-dot {
  background: var(--green);
  box-shadow: none;
}

.sync-state.is-dirty .sync-dot {
  background: var(--amber);
}

.sync-state.is-error .sync-dot {
  background: var(--red);
}

.sidebar {
  grid-area: sidebar;
  position: fixed;
  z-index: 30;
  inset: 0 auto 0 0;
  width: var(--sidebar);
  display: flex;
  flex-direction: column;
  padding: 18px 14px;
  border-right: 1px solid var(--line);
  background: #f1f3f5;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 5px 8px 18px;
}

.brand-mark {
  width: 40px;
  height: 40px;
  border-radius: 13px;
  font-size: 13px;
}

.brand-copy strong {
  display: block;
  letter-spacing: 0;
}

.brand-copy span {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0;
  text-transform: uppercase;
}

.nav-list,
.flow-list {
  display: grid;
  gap: 5px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.nav-button,
.flow-button {
  width: 100%;
  min-height: 42px;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 9px 11px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: transparent;
  color: var(--text-soft);
  cursor: pointer;
  text-align: left;
}

.nav-button:hover,
.flow-button:hover {
  background: #e7eaee;
  color: var(--text);
}

.nav-button.is-active,
.flow-button.is-active {
  border-color: #c9ddd4;
  border-left-color: var(--green);
  background: #e7f1ec;
  color: var(--green-strong);
}

.nav-icon {
  width: 22px;
  color: var(--green);
  font-size: 15px;
  text-align: center;
}

.sidebar-section {
  min-height: 0;
  margin-top: 24px;
}

.sidebar-section-grow {
  flex: 1;
  overflow-y: auto;
}

.section-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 0 8px 8px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 750;
  letter-spacing: 0;
  text-transform: uppercase;
}

.flow-button {
  align-items: flex-start;
}

.flow-button-copy {
  min-width: 0;
}

.flow-button-copy strong {
  display: block;
  overflow: hidden;
  color: inherit;
  font-size: 13px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.flow-button-copy span {
  color: var(--muted);
  font-size: 10px;
}

.sidebar-footer {
  padding: 12px 6px 0;
  border-top: 1px solid var(--line);
}

.connection-chip {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
  margin-bottom: 10px;
  color: var(--muted);
  font-size: 10px;
}

.connection-chip span:last-child {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.mobile-menu {
  display: none;
}

.sidebar-scrim {
  display: none;
}

.main {
  grid-area: main;
  min-width: 0;
  width: 100%;
  max-width: 1540px;
  margin: 0 auto;
  padding: 28px;
}

.page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 22px;
}

.page-head h2 {
  margin: 0;
  font-size: 30px;
  letter-spacing: 0;
}

.page-head p {
  max-width: 720px;
  margin: 7px 0 0;
  color: var(--text-soft);
}

.metric-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 18px;
}

.metric-card {
  min-width: 0;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: #ffffff;
}

.metric-label {
  color: var(--muted);
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0;
}

.metric-value {
  display: block;
  overflow: hidden;
  margin-top: 7px;
  font-size: 26px;
  font-weight: 720;
  letter-spacing: 0;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.metric-foot {
  margin-top: 4px;
  color: var(--text-soft);
  font-size: 11px;
}

.panel {
  min-width: 0;
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: #ffffff;
  box-shadow: none;
}

.panel + .panel {
  margin-top: 16px;
}

.panel-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 16px;
}

.panel-head p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 12px;
}

.content-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(330px, 0.8fr);
  gap: 16px;
  align-items: start;
}

.flow-map {
  display: grid;
  gap: 14px;
}

.flow-line {
  display: grid;
  grid-template-columns: repeat(6, minmax(105px, 1fr));
  gap: 9px;
}

.flow-branch-grid {
  display: grid;
  grid-template-columns: 92px minmax(0, 1fr);
  gap: 10px;
}

.branch-label {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 78px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #f8fafb;
  color: var(--muted);
  font-size: 10px;
  font-weight: 750;
  letter-spacing: 0;
  text-align: center;
  text-transform: uppercase;
}

.branch-stages {
  display: grid;
  grid-template-columns: repeat(2, minmax(120px, 1fr));
  gap: 9px;
}

.branch-stages.is-single {
  grid-template-columns: minmax(120px, 1fr);
}

.stage-card {
  position: relative;
  min-width: 0;
  min-height: 78px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 11px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #ffffff;
  color: var(--text-soft);
  cursor: pointer;
  text-align: left;
  transition:
    transform 150ms ease,
    border-color 150ms ease,
    background 150ms ease;
}

.stage-card:hover {
  transform: none;
  border-color: #99b9aa;
}

.stage-card.is-selected {
  border-color: var(--green);
  background: #edf6f1;
  box-shadow: 0 0 0 2px rgba(31, 122, 85, 0.1);
}

.stage-card.is-current::after {
  content: "";
  position: absolute;
  top: 8px;
  right: 8px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: none;
}

.stage-card.status-done {
  border-color: #b9d7c9;
  background: #f0f7f3;
}

.stage-card.status-blocked {
  border-color: #e6bfc2;
  background: #fff4f4;
}

.stage-card.status-review {
  border-color: #e5c980;
  background: #fffaec;
}

.stage-number {
  color: var(--muted);
  font-size: 9px;
  font-weight: 750;
  letter-spacing: 0;
}

.stage-name {
  overflow: hidden;
  color: var(--text);
  font-size: 12px;
  font-weight: 680;
  line-height: 1.3;
  text-overflow: ellipsis;
}

.stage-status-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 7px;
  color: var(--muted);
  font-size: 9px;
}

.progress-track {
  width: 100%;
  height: 7px;
  display: block;
  appearance: none;
  overflow: hidden;
  border: 0;
  border-radius: 99px;
  background: #e4e8ed;
}

.progress-track::-webkit-progress-bar {
  border-radius: inherit;
  background: #e4e8ed;
}

.progress-track::-webkit-progress-value {
  border-radius: inherit;
  background: var(--green);
}

.progress-track::-moz-progress-bar {
  border-radius: inherit;
  background: var(--green);
}

.progress-bar {
  width: var(--progress, 0%);
  height: 100%;
  border-radius: inherit;
  background: var(--green);
  transition: width 300ms ease;
}

.stage-focus {
  position: sticky;
  top: 94px;
}

.stage-focus-title {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}

.stage-focus-title h3 {
  margin: 0;
  font-size: 20px;
  letter-spacing: 0;
}

.stage-focus-title p {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 11px;
}

.status-pill,
.type-pill,
.priority-pill,
.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 24px;
  padding: 3px 8px;
  border: 1px solid var(--line);
  border-radius: 99px;
  background: #f2f4f6;
  color: var(--text-soft);
  font-size: 10px;
  font-weight: 680;
  white-space: nowrap;
}

.status-pill.is-done,
.status-pill.is-success {
  border-color: #b9d7c9;
  background: #edf6f1;
  color: var(--green-strong);
}

.status-pill.is-blocked,
.priority-pill.is-critical {
  border-color: #e6bfc2;
  background: #fff2f2;
  color: var(--red);
}

.status-pill.is-review,
.priority-pill.is-high {
  border-color: #e4c777;
  background: #fff8e6;
  color: var(--amber);
}

.stage-description {
  margin: 0 0 18px;
  padding: 13px 14px;
  border-left: 2px solid #7aab93;
  background: #f3f8f5;
  color: var(--text-soft);
  font-size: 12px;
}

.gate-list {
  display: grid;
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.gate-item {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 9px 10px;
  border: 1px solid var(--line);
  border-radius: 10px;

  border: 1px solid var(--line);
  border-radius: 6px;
  background: #ffffff;
  color: var(--text);
  cursor: pointer;
  text-align: left;
}

.action-row:hover {
  border-color: #a9bbb2;
  background: #f4f7f5;
}

.action-row > span {
  color: var(--green);
  font-size: 18px;
  text-align: center;
}

.action-row strong,
.action-row small {
  display: block;
}

.action-row small {
  margin-top: 2px;
  color: var(--muted);
  font-size: 10px;
}

.action-row.danger {
  color: var(--red);
}

.action-row.danger > span {
  color: var(--red);
}

.form-grid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.push-left {
  margin-right: auto;
}

.upload-field input[type="file"] {
  padding: 9px;
}

.attachment-paste-zone {
  min-width: 0;
  min-height: 88px;
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  padding: 13px;
  border: 1px dashed #8ebaa5;
  border-radius: 8px;
  background: #f5faf7;
  transition:
    border-color 160ms ease,
    background 160ms ease,
    box-shadow 160ms ease;
}

.attachment-paste-zone:hover,
.attachment-paste-zone:focus {
  border-color: var(--green);
  background: #edf6f1;
  box-shadow: 0 0 0 3px rgba(31, 122, 85, 0.1);
}

.attachment-paste-icon {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border: 1px solid #b9d7c9;
  border-radius: 8px;
  background: #e8f3ed;
  color: var(--green-strong);
  font-size: 20px;
}

.attachment-paste-copy {
  min-width: 0;
}

.attachment-paste-copy strong,
.attachment-paste-copy small {
  display: block;
}

.attachment-paste-copy strong {
  color: var(--text);
  font-size: 13px;
}

.attachment-paste-copy small {
  margin-top: 2px;
  color: var(--muted);
  font-size: 10px;
}

.pending-attachment-panel {
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #f8fafb;
}

.pending-attachment-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.pending-attachment-head small {
  color: var(--muted);
  font-size: 9px;
  text-align: right;
}

.pending-attachment .attachment-name {
  cursor: default;
}

.attachment-optimized {
  color: var(--green);
  font-size: 8px;
  white-space: nowrap;
}

.toast-success {
  border-color: #99c4b0;
}

.toast-error {

  color: var(--red);
}

.workspace-nav {

  margin: 0 0 14px;
  padding: 6px;

  border-radius: 8px;
  background: #e8ecef;
}

.workspace-nav-button {

  padding: 7px 9px;

  border-radius: 5px;
  background: transparent;

  font-size: 11px;
  font-weight: 700;
  line-height: 1.25;
  text-align: left;

.workspace-nav-button:hover {

}

.workspace-nav-button.is-active {

  background: #ffffff;
  color: var(--green-strong);
}

.workspace-nav-button:focus-visible {
  outline-offset: 2px;
}

.workspace-nav-button > span:last-child {
  min-width: 0;
  overflow-wrap: anywhere;
}

.workspace-nav-icon {
  flex: 0 0 22px;
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  border-radius: 6px;
  background: #dde9e3;
  color: var(--green-strong);
  font-size: 14px;
  line-height: 1;
}

.workspace-nav-button.is-active .workspace-nav-icon {
  background: #dcece4;
  color: var(--green-strong);
}

.knowledge-view {
  min-width: 0;
  width: 100%;
  display: grid;
  gap: 18px;
}

.knowledge-header {

  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  padding: 4px 0 2px;
}

.knowledge-header > div:first-child {

}

.knowledge-header .eyebrow {

}

.knowledge-header h1 {

  font-size: 34px;

}

.knowledge-header p:last-child {

.knowledge-header-actions {

}

.knowledge-panel.panel {

  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
}

.knowledge-toolbar {
  min-width: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 14px;
  margin-bottom: 12px;
  padding: 14px 0 16px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.knowledge-search-field {
  position: relative;
  min-width: 0;
  width: min(720px, 100%);
  display: block;
}

.knowledge-search-field input {
  width: 100%;
  min-width: 0;
  min-height: 48px;
  padding: 11px 50px 11px 42px;
  border-color: var(--line-strong);
  border-radius: 6px;
  background: #ffffff;
}

.knowledge-search-icon {

  z-index: 1;
  top: 50%;
  left: 14px;

  font-size: 17px;

.knowledge-clear.btn-icon {

}

.knowledge-clear:disabled {

}

.knowledge-toolbar .result-count {
  justify-self: end;
  white-space: nowrap;
}

.knowledge-grid {
  min-width: 0;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 500px), 1fr));
  align-items: stretch;
  gap: 12px;
}

.knowledge-grid .record-card {

  display: flex;
  flex-direction: column;
  padding: 16px 18px;
  border-radius: 8px;
  background: #ffffff;
}

.knowledge-grid .record-card > footer {
  margin-top: auto;
}

.knowledge-empty {

  min-width: 0;

}

.knowledge-empty > span:first-child {

.knowledge-empty h3 {

}

.knowledge-empty p {

}

.empty-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-top: 18px;
}

.empty-actions .btn {
  white-space: normal;
}

/* Light workspace refinements */

::selection {
  background: #cfe5da;
  color: var(--text);
}

.field > span,
.field > label,
.field-label {
  letter-spacing: 0;
}

.record-quick-action,
.record-card-actions {
  min-width: 0;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.record-quick-action > .btn:first-child {
  min-width: 0;
  flex: 1;
}

.record-card-actions .btn-icon,
.record-quick-action .btn-icon,
.attachment-download {
  width: 34px;
  min-width: 34px;
  min-height: 34px;
  height: 34px;
}

.attachment-chip {
  grid-template-columns: 44px minmax(0, 1fr) auto auto;
  grid-template-rows: auto auto;
  min-height: 58px;
}

.attachment-thumb,
.attachment-icon {
  grid-column: 1;
  grid-row: 1 / 3;
}

.attachment-thumb {
  width: 72px;
  height: 56px;
  display: grid;
  place-items: center;
  padding: 0;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #eef1f4;
  color: inherit;
  cursor: zoom-in;
}

.attachment-thumb:hover {
  border-color: #8eaa9d;
  box-shadow: 0 0 0 2px rgba(31, 122, 85, 0.1);
}

.attachment-thumb img,
.attachment-chip .attachment-thumb img {
  width: 100%;
  height: 100%;
  border-radius: 5px;
  object-fit: cover;
}

.attachment-name {
  grid-column: 2;
  grid-row: 1;
  align-self: end;
  color: var(--text-soft);
}

.attachment-name:hover {
  color: var(--blue);
  text-decoration: underline;
  text-underline-offset: 2px;
}

.attachment-chip > small {
  grid-column: 2;
  grid-row: 2;
  align-self: start;
}

.attachment-download {
  grid-column: 3;
  grid-row: 1 / 3;
  align-self: center;
}

.attachment-chip > .btn-danger {
  grid-column: 4;
  grid-row: 1 / 3;
  align-self: center;
}

.attachment-chip:has(.attachment-thumb) {
  grid-template-columns: 72px minmax(0, 1fr) auto auto;
  min-height: 70px;
}

.attachment-chip:not(:has(.attachment-thumb)) {
  min-height: 50px;
}

body.is-previewing {
  overflow: hidden;
}

.attachment-preview-dialog {
  position: fixed;
  z-index: 220;
  inset: 0;
  width: 100%;
  max-width: none;
  height: 100%;
  max-height: none;
  margin: 0;
  padding: 24px;
  overflow: hidden;
  border: 0;
  background: transparent;
  color: var(--text);
}

.attachment-preview-dialog[open] {
  display: grid;
  place-items: center;
}

.attachment-preview-dialog::backdrop {
  background: rgba(23, 32, 42, 0.62);
  backdrop-filter: blur(3px);
}

.attachment-preview-shell {
  width: min(1120px, 100%);
  height: min(900px, calc(100dvh - 48px));
  min-height: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  overflow: hidden;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  background: #ffffff;
  box-shadow: 0 24px 64px rgba(20, 30, 40, 0.24);
}

.attachment-preview-header {
  min-width: 0;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 18px;
  border-bottom: 1px solid var(--line);
}

.attachment-preview-header > div {
  min-width: 0;
}

.attachment-preview-header .eyebrow {
  margin-bottom: 3px;
  font-size: 10px;
}

.attachment-preview-header h2 {
  margin: 0;
  overflow: hidden;
  color: var(--text);
  font-size: 18px;
  line-height: 1.35;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.preview-close {
  flex: 0 0 auto;
  font-size: 20px;
  line-height: 1;
}

.attachment-preview-figure {
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  margin: 0;
  overflow: hidden;
  background: #eef1f4;
}

.attachment-preview-image {
  align-self: center;
  justify-self: center;
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

.attachment-preview-meta {
  min-width: 0;
  padding: 9px 14px;
  overflow: hidden;
  border-top: 1px solid var(--line);
  background: #ffffff;
  color: var(--muted);
  font-size: 11px;
  text-overflow: ellipsis;
  white-space: nowrap;

.attachment-preview-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 12px 16px;
  border-top: 1px solid var(--line);

      name: String(run.name || `Flow ${index + 1}`).slice(0, 80),

  function normalizeRecord(record) {
    if (!record || typeof record !== "object") return null;
    if (!RECORD_TYPES[record.type]) return null;
    if (!STAGE_TEMPLATE.some((stage) => stage.slug === record.stageSlug)) return null;
    return {
      id: String(record.id || uid("record")),
      runId: String(record.runId || ""),
      stageSlug: String(record.stageSlug),
      type: record.type,
      title: String(record.title || "未命名记录").slice(0, 120),
      content: String(record.content || "").slice(0, 50000),
      status: String(record.status || "open").slice(0, 40),

      dueAt: record.dueAt ? String(record.dueAt) : null,
      attachmentIds: Array.isArray(record.attachmentIds)
        ? record.attachmentIds.map(String)
        : [],
      createdAt: String(record.createdAt || now()),
      updatedAt: String(record.updatedAt || now()),

  }

  function normalizeAttachment(attachment) {
    if (!attachment || typeof attachment !== "object") return null;
    if (

      !attachment.dataUrl.startsWith("data:")

    const name = sanitizeFilename(attachment.name || "attachment");
    const extension = name.toLowerCase().split(".").pop();
    const size = Math.max(0, Number(attachment.size) || 0);

    if (
      !ALLOWED_ATTACHMENT_EXTENSIONS.has(extension) ||

      !dataMime ||
      (dataMime[1] && !ALLOWED_ATTACHMENT_MIMES.has(dataMime[1].toLowerCase())) ||

      const slugs = (run.stages || []).map((stage) => stage.slug);
      if (slugs.length !== STAGE_TEMPLATE.length) {
        errors.push(`${run.name}: 阶段数量不是 14`);
      }
      if (new Set(slugs).size !== STAGE_TEMPLATE.length) {
        errors.push(`${run.name}: 阶段标识重复`);
      }
      for (const template of STAGE_TEMPLATE) {
        if (!slugs.includes(template.slug)) {
          errors.push(`${run.name}: 缺少 ${template.slug}`);

      }

  }

    return (
      workspace.runs.find((run) => run.id === workspace.activeRunId) ||
      workspace.runs[0]
    );
  }

  function stageTemplate(slug) {
    return STAGE_TEMPLATE.find((stage) => stage.slug === slug);
  }

  function stageState(run, slug) {
    return run.stages.find((stage) => stage.slug === slug);
  }

  function searchKnowledge(workspace, runId, query) {
    const records = Array.isArray(workspace && workspace.records)
      ? workspace.records
      : [];
    const attachments = Array.isArray(workspace && workspace.attachments)
      ? workspace.attachments
      : [];
    const attachmentNamesById = new Map();
    const attachmentNamesByRecord = new Map();

    for (const attachment of attachments) {
      if (!attachment || typeof attachment !== "object") continue;
      const name = String(attachment.name || "");
      attachmentNamesById.set(String(attachment.id || ""), name);
      if (attachment.recordId) {
        const recordId = String(attachment.recordId);
        const names = attachmentNamesByRecord.get(recordId) || [];
        names.push(name);
        attachmentNamesByRecord.set(recordId, names);
      }
    }

    const needle = String(query || "").trim().toLocaleLowerCase("zh-CN");
    return records
      .map((record, index) => ({ record, index }))
      .filter(
        ({ record }) =>
          record &&
          record.type === "knowledge" &&
          String(record.runId || "") === String(runId || ""),
      )
      .filter(({ record }) => {
        if (!needle) return true;
        const template = stageTemplate(record.stageSlug);
        const attachmentNames = [
          ...(attachmentNamesByRecord.get(String(record.id || "")) || []),
          ...(Array.isArray(record.attachmentIds) ? record.attachmentIds : [])
            .map((id) => attachmentNamesById.get(String(id)))
            .filter(Boolean),
        ];
        const haystack = [
          record.title,
          record.content,
          ...(Array.isArray(record.tags) ? record.tags : []),
          template ? template.name : "",
          template ? template.shortName : "",
          record.stageSlug,
          ...attachmentNames,
        ]
          .map((value) => String(value || ""))
          .join("\n")
          .toLocaleLowerCase("zh-CN");
        return haystack.includes(needle);
      })
      .sort((left, right) => {
        const leftTime = Date.parse(left.record.updatedAt) || 0;
        const rightTime = Date.parse(right.record.updatedAt) || 0;
        return rightTime - leftTime || left.index - right.index;
      })
      .map(({ record }) => record);
  }

  function runProgress(run) {
    const complete = run.stages.filter((stage) => stage.status === "done").length;
    return {
      complete,
      total: STAGE_TEMPLATE.length,
      percent: Math.round((complete / STAGE_TEMPLATE.length) * 100),
    };
  }

  function gateProgress(run) {
    const gates = run.stages.flatMap((stage) => stage.gates || []);
    const done = gates.filter((gate) => gate.done).length;
    return { done, total: gates.length };
  }

  function touchWorkspace(workspace, run) {
    const timestamp = now();
    workspace.updatedAt = timestamp;
    if (run) run.updatedAt = timestamp;
    return workspace;
  }

  function prepareForSave(workspace) {
    const copy = normalizeWorkspace(clone(workspace));
    copy.revision += 1;
    copy.updatedAt = now();
    return copy;
  }

  function exportWorkspace(workspace) {
    const output = normalizeWorkspace(clone(workspace));
    return JSON.stringify(output, null, 2);
  }

  function sanitizeFilename(name) {
    return String(name)
      .split(/[\\/]/)
      .pop()
      .replace(/[^\p{L}\p{N}._()\- ]/gu, "_")
      .replace(/\s+/g, " ")
      .slice(0, 120) || "attachment";
  }

  global.FlowTraceModel = Object.freeze({
    SCHEMA_VERSION,
    STAGE_TEMPLATE,
    STATUS_META,
    RECORD_TYPES,
    now,
    uid,
    clone,
    createRun,
    createWorkspace,
    normalizeWorkspace,
    validateWorkspace,
    activeRun,
    stageTemplate,
    stageState,
    searchKnowledge,
    runProgress,
    gateProgress,
    touchWorkspace,
    prepareForSave,
    exportWorkspace,
    sanitizeFilename,
  });
})(typeof window !== "undefined" ? window : globalThis);

  function encodeUtf8Base64(value) {

    let binary = "";
    const chunk = 0x8000;
    for (let index = 0; index < bytes.length; index += chunk) {
      binary += String.fromCharCode(...bytes.subarray(index, index + chunk));
    }
    return btoa(binary);

    }
    return new TextDecoder().decode(bytes);

  function clearToken() {

  function filteredRecords(run) {
    const query = state.query.trim().toLocaleLowerCase("zh-CN");
    return state.workspace.records
      .filter((record) => record.runId === run.id)
      .filter(
        (record) =>
          state.recordScope === "all" ||
          record.stageSlug === state.selectedStageSlug,
      )
      .filter(
        (record) =>
          state.recordType === "all" || record.type === state.recordType,
      )
      .filter((record) => {
        if (!query) return true;
        const template = Model.stageTemplate(record.stageSlug);
        const attachmentNames = attachmentsForRecord(record).map(
          (attachment) => attachment.name,
        );
        const haystack = [
          record.title,
          record.content,
          record.status,
          record.priority,
          ...(record.tags || []),
          ...attachmentNames,
          template ? template.name : "",
        ]
          .join("\n")
          .toLocaleLowerCase("zh-CN");
        return haystack.includes(query);
      })
      .sort(
        (left, right) =>
          new Date(right.updatedAt).getTime() -
          new Date(left.updatedAt).getTime(),
      );
  }

  function attachmentsForRecord(record) {
    const ids = new Set(record.attachmentIds || []);
    return state.workspace.attachments.filter(
      (attachment) =>
        ids.has(attachment.id) || attachment.recordId === record.id,
    );
  }

  function renderAttachment(attachment, editable = false) {
    const isImage = isPreviewableImage(attachment.dataUrl);

    return `
      <div class="attachment-chip">
        ${
          isImage
            ? `<button
                type="button"
                class="attachment-thumb"
                data-action="preview-attachment"
                data-attachment-id="${escapeHtml(attachment.id)}"
                aria-label="查看大图：${escapeHtml(attachment.name)}"
                title="查看大图"
              ><img src="${escapeHtml(
                attachment.dataUrl,
              )}" alt="" loading="lazy" /></button>`
            : '<span class="attachment-icon" aria-hidden="true">▣</span>'
        }
        <button
          type="button"
          class="attachment-name"
          data-action="${primaryAction}"
          data-attachment-id="${escapeHtml(attachment.id)}"
          title="${primaryTitle}：${escapeHtml(attachment.name)}"
        >${escapeHtml(attachment.name)}</button>
        <small>${Math.max(1, Math.round(attachment.size / 1024))} KiB</small>
        <button class="btn btn-icon attachment-download" type="button" data-action="download-attachment" data-attachment-id="${escapeHtml(
          attachment.id,
        )}" aria-label="下载附件：${escapeHtml(
          attachment.name,

        ${

            ? `<button class="btn btn-icon btn-danger" type="button" data-action="delete-attachment" data-attachment-id="${escapeHtml(

        }

    `;
  }

  function snapshotRecordForm() {
    const form = root.querySelector('[data-form="record"]');
    if (!form) return null;
    const fields = {};
    for (const element of Array.from(form.elements || [])) {
      if (!element.name || element.type === "file") continue;
      fields[element.name] =
        element.type === "checkbox" ? Boolean(element.checked) : element.value;
    }
    return { fields };
  }

  function restoreRecordForm(snapshot) {
    const form = root.querySelector('[data-form="record"]');
    if (!form || !snapshot) return;
    for (const [name, value] of Object.entries(snapshot.fields || {})) {
      const element = Array.from(form.elements || []).find(
        (item) => item.name === name,
      );
      if (!element || element.type === "file") continue;
      if (element.type === "checkbox") element.checked = Boolean(value);
      else element.value = value;
    }
  }

  function recordModalHasDraft() {
    const modal = recordModalState();
    const form = root.querySelector('[data-form="record"]');
    if (!modal || !form) return false;
    if (modal.pendingJobs || (modal.pendingAttachments || []).length) return true;
    const existing = modal.recordId
      ? state.workspace.records.find((record) => record.id === modal.recordId)
      : null;
    const baseline = {
      type: existing ? existing.type : modal.recordType || "progress",
      stageSlug: existing
        ? existing.stageSlug
        : modal.stageSlug || state.selectedStageSlug,
      status: existing ? existing.status : "open",
      priority: existing ? existing.priority : "medium",
      title: existing ? existing.title : "",
      content: existing ? existing.content : "",
      tags: existing ? (existing.tags || []).join(", ") : "",
      dueAt:
        existing && existing.dueAt ? String(existing.dueAt).slice(0, 10) : "",
    };
    return Object.entries(baseline).some(([name, value]) => {
      const element = Array.from(form.elements || []).find(
        (item) => item.name === name,
      );
      return element && String(element.value) !== String(value);
    });
  }

  async function connect(form) {
    const data = new FormData(form);
    const owner = String(data.get("owner") || "").trim();
    const repo = String(data.get("repo") || "").trim();
    const enteredToken = String(data.get("token") || "").trim();
    const token = enteredToken || GitHub.getStoredToken();
    const remember = data.get("remember") === "on";
    state.error = "";
    if (!token) {
      state.error = "请输入新的 fine-grained access token。";
      render();
      return;
    }

    state.busy = "connect";
    state.owner = owner;
    state.repo = repo;
    state.remember = remember;
    render();
    try {
      const store = new GitHub.GitHubStore({ owner, repo, token });
      await store.probe();
      const remote = await store.load();
      const workspace = remote.exists
        ? Model.normalizeWorkspace(remote.workspace)
        : Model.createWorkspace();
      const errors = Model.validateWorkspace(workspace);
      if (errors.length) {
        throw new Error(`私有数据校验失败：${errors.slice(0, 3).join("；")}`);
      }

      let storageWarning = "";
      try {
        GitHub.storeToken(token, remember);
      } catch (error) {
        storageWarning = errorMessage(error);
      }
      GitHub.savePreferences({ owner, repo });
      state.store = store;
      state.workspace = workspace;
      state.sha = remote.sha;
      state.dirty = !remote.exists;
      state.conflict = false;
      state.selectedStageSlug = Model.activeRun(workspace).currentStageSlug;
      state.lastSyncAt = remote.exists ? Model.now() : "";
      state.view = "app";
      state.hasStoredToken = Boolean(GitHub.getStoredToken());
      state.error = "";
      render();
      showToast(
        remote.exists
          ? "私有数据已读取，可以开始编辑。"
          : "仓库中还没有数据文件，已建立本地初始 Flow；请点击保存到云端。",
        remote.exists ? "success" : "warning",
      );
      if (storageWarning) {
        global.setTimeout(() => showToast(storageWarning, "warning"), 400);
      }
    } catch (error) {
      state.store = null;
      state.workspace = null;
      state.sha = null;
      state.view = "locked";
      state.error = errorMessage(error);
      render();
    } finally {
      state.busy = "";
      render();
    }
  }

  async function saveToCloud() {
    if (!state.store || !state.workspace || state.busy) return;
    const errors = Model.validateWorkspace(state.workspace);
    if (errors.length) {
      showToast(`无法保存：${errors.slice(0, 3).join("；")}`, "danger");
      return;
    }
    if (!state.dirty) {
      showToast("当前没有需要保存的修改。", "info");
      return;
    }
    state.busy = "save";
    render();
    try {
      const next = Model.prepareForSave(state.workspace);
      const result = await state.store.save(next, state.sha);
      state.workspace = next;
      state.sha = result.sha;
      state.dirty = false;
      state.conflict = false;
      state.lastSyncAt = Model.now();
      state.modal = null;
      render();
      showToast("已安全保存到私有 GitHub 仓库。");
    } catch (error) {
      state.conflict = Boolean(error && error.code === "CONFLICT");
      state.modal = state.conflict ? { type: "conflict" } : null;
      render();
      showToast(errorMessage(error), state.conflict ? "warning" : "danger");
    } finally {
      state.busy = "";
      render();
    }
  }

  async function syncFromCloud(force = false) {
    if (!state.store || state.busy) return;
    if (state.dirty && !force) {
      state.modal = { type: "sync-confirm" };
      render();
      return;
    }
    state.busy = "sync";
    state.modal = null;
    render();
    try {
      const remote = await state.store.load();
      const workspace = remote.exists
        ? Model.normalizeWorkspace(remote.workspace)
        : Model.createWorkspace();
      const errors = Model.validateWorkspace(workspace);
      if (errors.length) {
        throw new Error(`云端数据校验失败：${errors.slice(0, 3).join("；")}`);
      }
      state.workspace = workspace;
      state.sha = remote.sha;
      state.dirty = !remote.exists;
      state.conflict = false;
      state.selectedStageSlug = Model.activeRun(workspace).currentStageSlug;
      state.lastSyncAt = remote.exists ? Model.now() : "";
      render();
      showToast(
        remote.exists
          ? "已读取云端最新版本。"
          : "云端数据文件不存在，已建立新的本地工作区。",
        remote.exists ? "success" : "warning",
      );
    } catch (error) {
      render();
      showToast(errorMessage(error), "danger");
    } finally {
      state.busy = "";
      render();
    }
  }

  function exportData() {
    if (!state.workspace) return;
    const text = Model.exportWorkspace(state.workspace);
    const run = activeRun();
    const date = new Date().toISOString().slice(0, 10);
    const safeName = Model.sanitizeFilename(
      `${run ? run.name : "workspace"}-${date}.json`,
    );
    downloadBlob(new Blob([text], { type: "application/json;charset=utf-8" }), safeName);
    showToast("JSON 备份已导出；其中不包含访问令牌。", "info");
  }

  function downloadBlob(blob, name) {
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement("a");
    anchor.href = url;
    anchor.download = name;
    anchor.rel = "noopener";
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    global.setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function downloadDataUrl(dataUrl, name) {
    const match = /^data:([^;,]*)(;base64)?,(.*)$/s.exec(dataUrl);
    if (!match) throw new Error("附件格式无效。");
    const mime = match[1] || "application/octet-stream";
    let bytes;
    if (match[2]) {
      const binary = atob(match[3].replace(/\s/g, ""));
      bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
    } else {
      bytes = new TextEncoder().encode(decodeURIComponent(match[3]));
    }
    downloadBlob(new Blob([bytes], { type: mime }), name);
  }

  function downloadAttachment(id) {
    const attachment = state.workspace.attachments.find((item) => item.id === id);
    if (!attachment) {
      showToast("没有找到这个附件，可能已被删除。", "warning");
      return;
    }
    try {
      downloadDataUrl(attachment.dataUrl, attachment.name);
    } catch (error) {
      showToast(errorMessage(error), "danger");
    }
  }

  function lock(forget) {
    if (forget) GitHub.clearToken();
    state.store = null;
    state.workspace = null;
    state.sha = null;
    state.dirty = false;
    state.conflict = false;
    state.busy = "";
    state.modal = null;
    state.view = "locked";
    state.hasStoredToken = Boolean(GitHub.getStoredToken());
    state.remember = hasTrustedToken();
    state.error = "";
    render();
    showToast(
      forget ? "本设备令牌已清除，页面已锁定。" : "页面已锁定。",
      "info",
    );
  }

  function createRun(form) {
    const data = new FormData(form);
    const run = Model.createRun(data.get("name"));
    run.design = String(data.get("design") || "").trim().slice(0, 120);
    run.owner = String(data.get("owner") || "").trim().slice(0, 80);
    state.workspace.runs.push(run);
    state.workspace.activeRunId = run.id;
    state.selectedStageSlug = "init";
    state.modal = null;
    markDirty(run);
    render();
    showToast("已创建包含 14 个阶段的新 Flow；保存后才会同步到云端。");
  }

  function readAsDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ""));
      reader.onerror = () =>
        reject(new Error(`无法读取附件：${file.name || "未命名文件"}`));
      reader.readAsDataURL(file);
    });
  }

  function namedFile(blob, name, type) {
    if (typeof global.File === "function") {
      return new global.File([blob], name, {
        type: type || blob.type || "application/octet-stream",
        lastModified: Date.now(),
      });
    }
    Object.defineProperty(blob, "name", { value: name, configurable: true });
    return blob;
  }

  function extensionForMime(mime) {
    return {
      "image/png": "png",
      "image/jpeg": "jpg",
      "image/webp": "webp",
      "image/gif": "gif",
    }[String(mime || "").toLowerCase()];
  }

  function clipboardFile(file, index) {
    const extension = extensionForMime(file.type) || "png";
    const stamp = new Date()
      .toISOString()
      .replace(/[-:TZ.]/g, "")
      .slice(0, 14);
    return namedFile(
      file,
      `clipboard-${stamp}-${String(index + 1).padStart(2, "0")}.${extension}`,
      file.type || `image/${extension === "jpg" ? "jpeg" : extension}`,
    );
  }

  function canvasToBlob(canvas, type, quality) {
    return new Promise((resolve) => canvas.toBlob(resolve, type, quality));
  }

  async function loadImageForCanvas(file) {
    const dataUrl = await readAsDataUrl(file);
    return new Promise((resolve, reject) => {
      const image = new global.Image();
      image.onload = () => resolve(image);
      image.onerror = () => reject(new Error(`${file.name} 无法作为图片读取。`));
      image.src = dataUrl;
    });
  }

  function isOptimizableImage(file) {
    const mime = String(file.type || "").toLowerCase();
    const extension = String(file.name || "")
      .toLowerCase()
      .split(".")
      .pop();
    return (
      ["image/png", "image/jpeg", "image/webp"].includes(mime) ||
      ["png", "jpg", "jpeg", "webp"].includes(extension)
    );
  }

  async function optimizeImageForAttachment(file) {
    const image = await loadImageForCanvas(file);
    const sourceWidth = image.naturalWidth || image.width;
    const sourceHeight = image.naturalHeight || image.height;
    if (!sourceWidth || !sourceHeight) {
      throw new Error(`${file.name} 没有可用的图片尺寸。`);
    }

    const initialScale = Math.min(1, 2400 / Math.max(sourceWidth, sourceHeight));
    const qualities = [0.96, 0.9, 0.82, 0.74, 0.66];
    let scale = initialScale;
    let smallest = null;

    for (let resize = 0; resize < 5; resize += 1) {
      const width = Math.max(1, Math.round(sourceWidth * scale));
      const height = Math.max(1, Math.round(sourceHeight * scale));
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext("2d", { alpha: false });
      if (!context) throw new Error("当前浏览器无法处理截图。");
      context.fillStyle = "#ffffff";
      context.fillRect(0, 0, width, height);
      context.drawImage(image, 0, 0, width, height);

      for (const quality of qualities) {
        const blob = await canvasToBlob(canvas, "image/webp", quality);
        if (!blob) continue;
        if (!smallest || blob.size < smallest.size) smallest = blob;
        if (blob.size <= MAX_ATTACHMENT_BYTES) {
          const base = Model.sanitizeFilename(file.name).replace(/\.[^.]+$/, "");
          return namedFile(blob, `${base || "screenshot"}.webp`, "image/webp");
        }
      }
      scale *= 0.82;
    }

    const size = smallest ? Math.round(smallest.size / 1024) : "未知";
    throw new Error(`${file.name} 自动优化后仍为 ${size} KiB，未添加。`);
  }

  function validateAttachment(file) {
    if (file.size > MAX_ATTACHMENT_BYTES) {
      throw new Error(`${file.name} 超过 750 KiB，未添加。`);
    }
    const extension = String(file.name).toLowerCase().split(".").pop();
    const allowedExtensions = new Set([
      "png",
      "jpg",
      "jpeg",
      "webp",
      "gif",
      "pdf",
      "txt",
      "md",
      "csv",
      "rpt",
    ]);
    if (!allowedExtensions.has(extension)) {
      throw new Error(
        `${file.name} 的类型不允许。仅支持脱敏图片、PDF 和小型文本/报告。`,
      );
    }
    const allowedMimes = new Set([
      "",
      "image/png",
      "image/jpeg",
      "image/webp",
      "image/gif",
      "application/pdf",
      "application/octet-stream",
      "text/plain",
      "text/markdown",
      "text/csv",
    ]);
    if (!allowedMimes.has(String(file.type || "").toLowerCase())) {
      throw new Error(`${file.name} 的实际内容类型不允许，未添加。`);
    }
  }

  function pendingAttachmentExists(modal, dataUrl) {
    if ((modal.pendingAttachments || []).some((item) => item.dataUrl === dataUrl)) {
      return true;
    }
    if (!modal.recordId) return false;
    const record = state.workspace.records.find((item) => item.id === modal.recordId);
    return record
      ? attachmentsForRecord(record).some((item) => item.dataUrl === dataUrl)
      : false;
  }

  async function preparePendingAttachment(file, source, index) {
    let candidate = source === "clipboard" ? clipboardFile(file, index) : file;
    const originalSize = candidate.size;
    if (candidate.size > MAX_ATTACHMENT_BYTES && isOptimizableImage(candidate)) {
      candidate = await optimizeImageForAttachment(candidate);
    }
    validateAttachment(candidate);
    return {
      id: Model.uid("pending-attachment"),
      name: Model.sanitizeFilename(candidate.name),
      mime: candidate.type || "application/octet-stream",
      size: candidate.size,
      originalSize,
      dataUrl: await readAsDataUrl(candidate),
    };
  }

  function updatePendingAttachmentUi(modal) {
    if (recordModalState() !== modal) return;
    const panel = document.getElementById("pending-attachment-list");
    const items = document.getElementById("pending-attachment-items");
    const count = document.getElementById("pending-attachment-count");
    const attachments = modal.pendingAttachments || [];
    if (panel) panel.hidden = !attachments.length && !modal.pendingJobs;
    if (items) items.innerHTML = attachments.map(renderPendingAttachment).join("");
    if (count) {
      count.textContent = modal.pendingJobs
        ? "正在处理图片…"
        : `${attachments.length} 个，提交记录后加入本地草稿`;
    }
    const submit = root.querySelector('[data-form="record"] [data-record-submit]');
    if (submit) submit.disabled = Boolean(modal.pendingJobs);
  }

  async function queueRecordAttachments(files, source) {
    const modal = recordModalState();
    const candidates = Array.from(files || []).filter(Boolean);
    if (!modal || !candidates.length) return;

    modal.pendingJobs += 1;
    updatePendingAttachmentUi(modal);
    const previous = modal.pendingRead || Promise.resolve();
    const task = previous.then(async () => {
      let added = 0;
      let duplicates = 0;
      const errors = [];
      for (let index = 0; index < candidates.length; index += 1) {
        try {
          const attachment = await preparePendingAttachment(
            candidates[index],
            source,
            index,
          );
          if (recordModalState() !== modal) return;
          if (pendingAttachmentExists(modal, attachment.dataUrl)) {
            duplicates += 1;
            continue;
          }
          modal.pendingAttachments.push(attachment);
          added += 1;
        } catch (error) {
          errors.push(errorMessage(error));
        }
      }
      if (recordModalState() !== modal) return;
      if (added) {
        const checkbox = root.querySelector('[data-form="record"] [name="sanitized"]');
        if (checkbox) checkbox.checked = false;
        showToast(`已加入 ${added} 个待添加附件，请确认脱敏后提交记录。`);
      }
      if (duplicates) showToast(`已跳过 ${duplicates} 个重复图片。`, "info");
      if (errors.length) showToast(errors[0], "warning");
    });
    modal.pendingRead = task.catch(() => {});
    try {
      await task;
    } finally {
      modal.pendingJobs = Math.max(0, modal.pendingJobs - 1);
      updatePendingAttachmentUi(modal);
    }
  }

  function removePendingAttachment(id) {
    const modal = recordModalState();
    if (!modal) return;
    modal.pendingAttachments = (modal.pendingAttachments || []).filter(
      (item) => item.id !== id,
    );
    updatePendingAttachmentUi(modal);
    showToast("待添加附件已移除。", "info");
  }

  function clipboardImageFiles(clipboardData) {
    if (!clipboardData) return [];
    const fromItems = Array.from(clipboardData.items || [])
      .filter(
        (item) =>
          item.kind === "file" && String(item.type || "").startsWith("image/"),
      )
      .map((item) => item.getAsFile())
      .filter(Boolean);
    if (fromItems.length) return fromItems;
    return Array.from(clipboardData.files || []).filter((file) =>
      String(file.type || "").startsWith("image/"),
    );
  }

  function handlePaste(event) {
    const form = event.target.closest
      ? event.target.closest('[data-form="record"]')
      : null;
    const files = clipboardImageFiles(event.clipboardData);
    if (!files.length) return;
    if (form && recordModalState()) {
      event.preventDefault();
      void queueRecordAttachments(files, "clipboard");
      return;
    }
    if (
      state.view === "app" &&
      state.workspace &&
      !state.modal
    ) {
      event.preventDefault();
      state.modal = createRecordModal({
        recordType: recordTypeForGlobalPaste(),
        stageSlug: state.selectedStageSlug,
      });
      render();
      focusRecordModal(true);
      void queueRecordAttachments(files, "clipboard");
    }
  }

  async function saveRecord(form) {
    const modal = recordModalState();
    if (modal && modal.pendingRead) await modal.pendingRead;
    if (modal && recordModalState() !== modal) return;
    const data = new FormData(form);
    const run = activeRun();
    const recordId = form.dataset.recordId || "";
    const existing = recordId
      ? state.workspace.records.find((record) => record.id === recordId)
      : null;
    const pendingAttachments = modal ? modal.pendingAttachments || [] : [];
    if (pendingAttachments.length && data.get("sanitized") !== "on") {
      showToast("添加附件前，请确认附件已经脱敏。", "warning");
      return;
    }
    try {
      const timestamp = Model.now();
      const preparedAttachments = pendingAttachments.map((attachment) => ({
          id: Model.uid("attachment"),
          recordId: existing ? existing.id : null,
          name: attachment.name,
          mime: attachment.mime,
          size: attachment.size,
          dataUrl: attachment.dataUrl,
          createdAt: timestamp,
        }));
      const record =
        existing ||
        {
          id: Model.uid("record"),
          runId: run.id,
          createdAt: timestamp,
          attachmentIds: [],
        };
      record.stageSlug = String(data.get("stageSlug") || state.selectedStageSlug);
      record.type = String(data.get("type") || "progress");
      record.title =
        String(data.get("title") || "").trim().slice(0, 120) || "未命名记录";
      record.content = String(data.get("content") || "").slice(0, 50000);
      record.status = String(data.get("status") || "open").slice(0, 40);
      record.priority = String(data.get("priority") || "medium");
      record.tags = String(data.get("tags") || "")
        .split(/[,，]/)
        .map((tag) => tag.trim())
        .filter(Boolean)
        .slice(0, 20);
      record.dueAt = data.get("dueAt")
        ? `${String(data.get("dueAt"))}T00:00:00.000Z`
        : null;
      record.updatedAt = timestamp;
      if (!existing) state.workspace.records.push(record);

      for (const attachment of preparedAttachments) {
        attachment.recordId = record.id;
        state.workspace.attachments.push(attachment);
        record.attachmentIds.push(attachment.id);
      }
      state.selectedStageSlug = record.stageSlug;
      state.modal = null;
      markDirty(run);
      render();
      showToast(existing ? "记录已更新到本地草稿。" : "记录已加入本地草稿。");
    } catch (error) {
      showToast(errorMessage(error), "danger");
    }
  }

  async function importData(form) {
    const file = form.elements.file.files[0];
    if (!file) return;
    try {
      if (file.size > MAX_IMPORT_BYTES) {
        throw new Error("备份超过 10 MiB 安全上限，未导入。");
      }
      const raw = await file.text();
      const workspace = Model.normalizeWorkspace(JSON.parse(raw));
      const errors = Model.validateWorkspace(workspace);
      if (errors.length) {
        throw new Error(`备份校验失败：${errors.slice(0, 5).join("；")}`);
      }
      state.workspace = workspace;
      state.selectedStageSlug = Model.activeRun(workspace).currentStageSlug;
      state.dirty = true;
      state.conflict = false;
      state.modal = null;
      Model.touchWorkspace(workspace, Model.activeRun(workspace));
      render();
      showToast("备份已导入本地草稿；确认后请手动保存到云端。", "warning");
    } catch (error) {
      showToast(`导入失败：${errorMessage(error)}`, "danger");
    }
  }

  function deleteRecord(id) {
    const record = state.workspace.records.find((item) => item.id === id);
    if (!record) return;
    if (!global.confirm(`确定删除记录“${record.title}”及其附件吗？`)) return;
    const attachmentIds = new Set(record.attachmentIds || []);
    state.workspace.records = state.workspace.records.filter(
      (item) => item.id !== id,
    );
    state.workspace.attachments = state.workspace.attachments.filter(
      (attachment) =>
        attachment.recordId !== id && !attachmentIds.has(attachment.id),
    );
    state.modal = null;
    markDirty(activeRun());
    render();
    showToast("记录已从本地草稿删除。", "warning");
  }

  function deleteAttachment(id) {
    const attachment = state.workspace.attachments.find((item) => item.id === id);
    if (!attachment) return;
    if (!global.confirm(`确定删除附件“${attachment.name}”吗？`)) return;
    const formSnapshot = snapshotRecordForm();
    state.workspace.attachments = state.workspace.attachments.filter(
      (item) => item.id !== id,
    );
    for (const record of state.workspace.records) {
      record.attachmentIds = (record.attachmentIds || []).filter(
        (attachmentId) => attachmentId !== id,
      );
    }
    markDirty(activeRun());
    render();
    restoreRecordForm(formSnapshot);
    focusRecordModal();
    showToast("附件已从本地草稿删除。", "warning");
  }

  function archiveRun(run) {
    if (
      !global.confirm(
        `归档“${run.name}”？数据不会删除，之后可通过“显示已归档 Flow”恢复。`,
      )
    ) {
      return;
    }
    run.archived = true;
    const next = state.workspace.runs.find((item) => !item.archived);
    if (next) {
      state.workspace.activeRunId = next.id;
      state.selectedStageSlug = next.currentStageSlug;
    } else {
      const replacement = Model.createRun("新的 Flow");
      state.workspace.runs.push(replacement);
      state.workspace.activeRunId = replacement.id;
      state.selectedStageSlug = "init";
    }
    markDirty(run);
    render();
    showToast("Flow 已归档到本地草稿。", "info");
  }

  function handleClick(event) {
    const target = event.target.closest("[data-action]");
    if (!target) return;
    const action = target.dataset.action;
    if (target.tagName === "A") event.preventDefault();

    if (action === "select-stage") {
      state.selectedStageSlug = target.dataset.stage;
      render();
    } else if (action === "switch-workspace-view") {
      state.workspaceView = target.dataset.view === "knowledge" ? "knowledge" : "flow";
      state.sidebarOpen = false;
      render();
    } else if (action === "mark-current") {
      const run = activeRun();
      run.currentStageSlug = state.selectedStageSlug;
      markDirty(run);
      render();
      showToast("当前阶段已更新到本地草稿。");
    } else if (action === "select-run") {
      const run = state.workspace.runs.find(
        (item) => item.id === target.dataset.runId,
      );
      if (!run) return;
      state.workspace.activeRunId = run.id;
      state.selectedStageSlug = run.currentStageSlug;
      state.sidebarOpen = false;
      markDirty(run);
      render();
    } else if (action === "toggle-sidebar") {
      state.sidebarOpen = !state.sidebarOpen;
      render();
    } else if (action === "close-sidebar") {
      state.sidebarOpen = false;
      render();
    } else if (action === "new-run") {
      state.sidebarOpen = false;
      state.modal = { type: "new-run" };
      render();
    } else if (action === "new-record") {
      state.modal = createRecordModal({
        recordType: target.dataset.recordType || "progress",
        stageSlug: state.selectedStageSlug,
      });
      render();
      focusRecordModal();
    } else if (action === "new-record-with-image") {
      const recordType = Model.RECORD_TYPES[target.dataset.recordType]
        ? target.dataset.recordType
        : "progress";
      openRecordWithImage({
        recordType,
        stageSlug: state.selectedStageSlug,
      });
    } else if (action === "new-knowledge-with-image") {
      openRecordWithImage({
        recordType: "knowledge",
        stageSlug: state.selectedStageSlug,
      });
    } else if (action === "clear-knowledge-search") {
      state.knowledgeQuery = "";
      const input = root.querySelector('[data-action="search-knowledge"]');
      if (input) input.value = "";
      renderKnowledgeResults();
      const clear = root.querySelector('[data-action="clear-knowledge-search"]');
      if (clear) clear.disabled = true;
      if (input) input.focus();
    } else if (action === "edit-record") {
      state.modal = createRecordModal({ recordId: target.dataset.recordId });
      render();
      focusRecordModal();
    } else if (action === "add-record-image") {
      openRecordWithImage({ recordId: target.dataset.recordId });
    } else if (action === "choose-attachments") {
      const input = root.querySelector('[data-form="record"] [name="attachments"]');
      if (input) input.click();
    } else if (action === "remove-pending-attachment") {
      removePendingAttachment(target.dataset.pendingAttachmentId);
    } else if (action === "preview-pending-attachment") {
      previewPendingAttachmentById(target.dataset.pendingAttachmentId, target);
    } else if (action === "preview-attachment") {
      previewAttachmentById(target.dataset.attachmentId, target);
    } else if (action === "delete-record") {
      deleteRecord(target.dataset.recordId);
    } else if (action === "delete-attachment") {
      deleteAttachment(target.dataset.attachmentId);
    } else if (action === "download-attachment") {
      downloadAttachment(target.dataset.attachmentId);
    } else if (action === "open-menu") {
      state.modal = { type: "menu" };
      render();
    } else if (action === "close-modal") {
      closeModal();
    } else if (action === "sync") {
      syncFromCloud();
    } else if (action === "force-sync") {
      syncFromCloud(true);
    } else if (action === "save") {
      saveToCloud();
    } else if (action === "export") {
      exportData();
      if (state.modal && state.modal.type === "menu") {
        state.modal = null;
        render();
      }
    } else if (action === "import") {
      state.modal = { type: "import" };
      render();
    } else if (action === "lock") {
      if (
        !state.dirty ||
        global.confirm("本地有未保存修改，仍然锁定并丢弃这些修改吗？")
      ) {
        lock(false);
      }
    } else if (action === "forget") {
      if (
        global.confirm(
          "忘记本设备会清除浏览器里的访问令牌并锁定页面，确定继续吗？",
        )
      ) {
        lock(true);
      }
    } else if (action === "archive-run") {
      archiveRun(activeRun());
    } else if (action === "restore-run") {
      const run = activeRun();
      run.archived = false;
      markDirty(run);
      render();
      showToast("Flow 已恢复到本地草稿。");
    }
  }

  async function handleChange(event) {
    const target = event.target.closest("[data-action]");
    if (!target || !state.workspace) return;
    const action = target.dataset.action;
    const run = activeRun();
    if (action === "attachment-files") {
      const files = Array.from(target.files || []);
      target.value = "";
      await queueRecordAttachments(files, "picker");
    } else if (action === "stage-status") {
      const stage = Model.stageState(run, target.dataset.stage);
      if (!stage || !Model.STATUS_META[target.value]) return;
      stage.status = target.value;
      markDirty(run, stage);
      render();
    } else if (action === "stage-next" || action === "stage-note") {
      const stage = Model.stageState(run, target.dataset.stage);
      if (!stage) return;
      const field = action === "stage-next" ? "nextStep" : "note";
      stage[field] = String(target.value).slice(
        0,
        field === "nextStep" ? 1000 : 10000,
      );
      markDirty(run, stage);
      render();
    } else if (action === "gate-toggle") {
      const stage = Model.stageState(run, target.dataset.stage);
      const gate = stage
        ? stage.gates.find((item) => item.id === target.dataset.gateId)
        : null;
      if (!gate) return;
      gate.done = target.checked;
      markDirty(run, stage);
      render();
    } else if (action === "run-field") {
      const field = target.dataset.field;
      if (!["name", "design", "owner"].includes(field)) return;
      const limits = { name: 80, design: 120, owner: 80 };
      const value = String(target.value).trim().slice(0, limits[field]);
      run[field] = field === "name" ? value || "未命名 Flow" : value;
      markDirty(run);
      render();
    } else if (action === "record-scope") {
      state.recordScope = target.value === "all" ? "all" : "stage";
      renderRecordList();
    } else if (action === "record-type-filter") {
      state.recordType = Model.RECORD_TYPES[target.value] ? target.value : "all";
      renderRecordList();
    } else if (action === "show-archived") {
      state.showArchived = target.checked;
      render();
    }
  }

  function handleInput(event) {
    const recordSearch = event.target.closest('[data-action="search-records"]');
    if (recordSearch) {
      state.query = recordSearch.value;
      renderRecordList();
      return;
    }
    const knowledgeSearch = event.target.closest(
      '[data-action="search-knowledge"]',
    );
    if (!knowledgeSearch) return;
    state.knowledgeQuery = knowledgeSearch.value;
    renderKnowledgeResults();
    const clear = root.querySelector('[data-action="clear-knowledge-search"]');
    if (clear) clear.disabled = !state.knowledgeQuery;
  }

  async function handleSubmit(event) {
    const form = event.target.closest("[data-form]");
    if (!form) return;
    event.preventDefault();
    const type = form.dataset.form;
    if (type === "connect") await connect(form);
    else if (type === "new-run") createRun(form);
    else if (type === "record") await saveRecord(form);
    else if (type === "import") await importData(form);
  }

  root.addEventListener("click", handleClick);
  root.addEventListener("change", handleChange);
  root.addEventListener("input", handleInput);
  root.addEventListener("submit", handleSubmit);
  document.addEventListener("paste", handlePaste);
  document.addEventListener("keydown", (event) => {
    const previewDialog = document.getElementById("attachment-preview-dialog");
    if (event.key === "Escape" && previewDialog && previewDialog.open) {
      event.preventDefault();
      closeAttachmentPreview();
      return;
    }
    if (event.key === "Escape" && state.modal) {
      closeModal();
      return;
    }
    if (event.key === "Tab" && state.modal) {
      const dialog = root.querySelector('[role="dialog"]');
      if (!dialog) return;
      const focusable = Array.from(
        dialog.querySelectorAll(
          'button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])',
        ),
      ).filter((element) => !element.hidden);
      if (!focusable.length) return;
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      } else if (!dialog.contains(document.activeElement)) {
        event.preventDefault();
        first.focus();
      }
    }
  });
  global.addEventListener("beforeunload", (event) => {
    if (!state.dirty) return;
    event.preventDefault();
    event.returnValue = "";
  });
  global.addEventListener("offline", () =>
    showToast("网络已断开；本地草稿仍保留在当前页面。", "warning"),
  );
  global.addEventListener("online", () =>
    showToast("网络已恢复，需要时请手动同步。", "info"),
  );

  render();
})(typeof window !== "undefined" ? window : globalThis);
</script>
  </body>
</html>
