              <header><h3>批准证据</h3><p>Override 至少需要一个可解析的当前阶段证据。</p></header>
              <div class="evidence-picker">
                ${evidenceChoices(run.id, stage.slug)}
              </div>
            </section>
            <footer class="modal-actions">
              <button class="btn" type="button" data-action="close-modal">取消</button>
              <button class="btn btn-primary" type="submit" ${blockers.length ? "" : "disabled"}>记录 Override</button>
            </footer>
          </form>
        </section>
      </div>
    `;
  }

  function renderModal() {
    if (!state.modal) return "";
    if (state.modal.type === "menu") return renderMenuModal();
    if (state.modal.type === "new-run") return renderNewRunModal();
    if (state.modal.type === "record") return renderRecordModal(state.modal);
    if (state.modal.type === "import") return renderImportModal();
    if (state.modal.type === "import-report") return renderMigrationReportModal();
    if (state.modal.type === "conflict") return renderConflictModal();
    if (state.modal.type === "sync-confirm") return renderSyncConfirmModal();
    if (state.modal.type === "gate-result") {
      return renderGateResultModal(state.modal);
    }
    if (state.modal.type === "stage-execution") {
      return renderStageExecutionModal(state.modal);
    }
    if (state.modal.type === "stage-approval") {
      return renderStageApprovalModal(state.modal);
    }
    if (state.modal.type === "stage-override") {
      return renderStageOverrideModal(state.modal);
    }
    return "";
  }

  function renderApp() {
    const run = activeRun();
    if (!run) {
      state.error = "工作区里没有可用的 Flow。请导入有效备份后重试。";
      lock(false);
      return;
    }
    if (!Model.stageTemplate(state.selectedStageSlug)) {
      state.selectedStageSlug = run.currentStageSlug;
    }
    const historicalProtection = Boolean(
      run.templateVersion && run.templateVersion !== "company-ppt-v1",
    );
    const viewTitle =
      state.workspaceView === "knowledge"
        ? "知识库 · "
        : state.workspaceView === "weekly"
          ? "周报记录 · "
          : "";
    document.title = `${viewTitle}${run.name} · FlowTrace`;
    document.body.className = "is-connected";
    root.innerHTML = `
      <div class="app-shell">
        ${renderTopbar(run)}
        ${renderSidebar(run)}
        ${
          state.sidebarOpen
            ? '<button class="sidebar-scrim" type="button" data-action="close-sidebar" aria-label="关闭 Flow 导航"></button>'
            : ""
        }
        <main class="main" id="main-content">
          ${renderPersistentSafetyAlert()}
          ${renderWorkflowAlert()}
          ${renderWorkspaceLegacySummary()}
          ${
            historicalProtection
              ? renderHistoricalProtectedView(run)
              : state.workspaceView === "knowledge"
              ? renderKnowledgeView(run)
              : state.workspaceView === "weekly"
                ? renderWeeklyView(run)
              : `
                ${renderRunHeader(run)}
                ${renderMetrics(run)}
                ${renderFlowMap(run)}
                ${renderStagePanel(run)}
                ${renderRecordsPanel(run)}
              `
          }
        </main>
      </div>
      ${renderModal()}
    `;
    renderToast();
  }

  function render() {
    if (state.view === "app" && state.workspace) renderApp();
    else renderLock();
  }

  function migrateLoadedWorkspace(source) {
    if (typeof Model.migrateWorkspace !== "function") {
      return { workspace: Model.normalizeWorkspace(source), report: null };
    }
    const result = Model.migrateWorkspace(source);
    const report = result && result.report;
    if (!result || !result.workspace || (report && !report.safe)) {
      const details = reportItems(report, "blockingErrors")
        .map(reportItemText)
        .slice(0, 5);
      const error = new Error(
        details.length
          ? `云端数据安全校验失败：${details.join("；")}`
          : "云端数据没有通过无损迁移校验。",
      );
      error.code = "MIGRATION_BLOCKED";
      error.report = report;
      throw error;
    }
    return result;
  }

  function migrationCreatesLocalDraft(report) {
    return Boolean(
      report &&
        (report.sourceSchemaVersion !== report.targetSchemaVersion ||
          reportItems(report, "appliedMigrationIds").length ||
          reportItems(report, "insertedStages").length),
    );
  }

  async function connect(form) {
    const data = new FormData(form);
    const owner = String(data.get("owner") || "").trim();
    const repo = String(data.get("repo") || "").trim();
    const enteredToken = String(data.get("token") || "").trim();
    const token = enteredToken || GitHub.getStoredToken();
    const remember = data.get("remember") === "on";
    state.error = "";
    if (!token) {
      state.error = "请输入新的 fine-grained access token。";
      render();
      return;
    }

    state.busy = "connect";
    state.owner = owner;
    state.repo = repo;
    state.remember = remember;
    render();
    try {
      const store = new GitHub.GitHubStore({ owner, repo, token });
      await store.probe();
      const remote = await store.load();
      const loaded = remote.exists
        ? migrateLoadedWorkspace(remote.workspace)
        : { workspace: Model.createWorkspace(), report: null };
      const workspace = loaded.workspace;
      const migrationDraft = migrationCreatesLocalDraft(loaded.report);
      const errors = Model.validateWorkspace(workspace);
      if (errors.length) {
        throw new Error(`私有数据校验失败：${errors.slice(0, 3).join("；")}`);
      }

      let storageWarning = "";
      try {
        GitHub.storeToken(token, remember);
      } catch (error) {
        storageWarning = errorMessage(error);
      }
      GitHub.savePreferences({ owner, repo });
      state.store = store;
      state.workspace = workspace;
      state.sha = remote.sha;
      state.dirty = !remote.exists || migrationDraft;
      state.conflict = false;
      state.selectedStageSlug = Model.activeRun(workspace).currentStageSlug;
      state.lastSyncAt = remote.exists ? Model.now() : "";
      state.view = "app";
      state.hasStoredToken = Boolean(GitHub.getStoredToken());
      state.error = "";
      render();
      showToast(
        remote.exists && migrationDraft
          ? "私有数据已无损升级为本地草稿；尚未写回 GitHub。"
          : remote.exists
            ? "私有数据已读取，可以开始编辑。"
          : "仓库中还没有数据文件，已建立本地初始 Flow；请点击保存到云端。",
        remote.exists && !migrationDraft ? "success" : "warning",
      );
      if (storageWarning) {
        global.setTimeout(() => showToast(storageWarning, "warning"), 400);
      }
    } catch (error) {
      state.store = null;
      state.workspace = null;
      state.sha = null;
      state.view = "locked";
      state.error = errorMessage(error);
      render();
    } finally {
      state.busy = "";
      render();
    }
  }

  async function saveToCloud() {
    if (!state.store || !state.workspace || state.busy) return;
    try {
      if (typeof Model.assessWorkspaceForSave === "function") {
        const assessment = Model.assessWorkspaceForSave(state.workspace);
        const report = assessment && (assessment.report || assessment);
        if (report && (!report.safe || !report.canSave)) {
          setPersistentSafetyAlert(
            "保存已被历史数据安全门阻止",
            report,
            "当前工作区未通过无损保存校验。",
          );
          render();
          return;
        }
      }
    } catch (error) {
      showSafetyFailure(
        "保存已被历史数据安全门阻止",
        error,
        errorMessage(error),
      );
      return;
    }
    const errors = Model.validateWorkspace(state.workspace);
    if (errors.length) {
      setPersistentSafetyAlert(
        "保存已被工作区校验阻止",
        null,
        errors.join("；"),
      );
      render();
      return;
    }
    if (!state.dirty) {
      showToast("当前没有需要保存的修改。", "info");
      return;
    }
    let next;
    try {
      next = Model.prepareForSave(state.workspace);
    } catch (error) {
      showSafetyFailure(
        "保存已被历史数据安全门阻止",
        error,
        errorMessage(error),
      );
      return;
    }
    state.busy = "save";
    render();
    try {
      const result = await state.store.save(next, state.sha);
      state.workspace = next;
      state.sha = result.sha;
      state.dirty = false;
      state.conflict = false;
      state.lastSyncAt = Model.now();
      state.modal = null;
      render();
      showToast("已安全保存到私有 GitHub 仓库。");
    } catch (error) {
      if (isMigrationSafetyError(error)) {
        state.modal = null;
        showSafetyFailure(
          "保存已被历史数据安全门阻止",
          error,
          errorMessage(error),
        );
        return;
      }
      state.conflict = Boolean(error && error.code === "CONFLICT");
      state.modal = state.conflict ? { type: "conflict" } : null;
      render();
      showToast(errorMessage(error), state.conflict ? "warning" : "danger");
    } finally {
      state.busy = "";
      render();
    }
  }

  async function syncFromCloud(force = false) {
    if (!state.store || state.busy) return;
    if (state.dirty && !force) {
      state.modal = { type: "sync-confirm" };
      render();
      return;
    }
    state.busy = "sync";
    state.modal = null;
    render();
    try {
      const remote = await state.store.load();
      const loaded = remote.exists
        ? migrateLoadedWorkspace(remote.workspace)
        : { workspace: Model.createWorkspace(), report: null };
      const workspace = loaded.workspace;
      const migrationDraft = migrationCreatesLocalDraft(loaded.report);
      const errors = Model.validateWorkspace(workspace);
      if (errors.length) {
        const error = new Error(`云端数据校验失败：${errors.join("；")}`);
        error.code = "MIGRATION_BLOCKED";
        error.report = validationReport(errors, "$.remoteWorkspace");
        throw error;
      }
      state.workspace = workspace;
      state.sha = remote.sha;
      state.dirty = !remote.exists || migrationDraft;
      state.conflict = false;
      state.selectedStageSlug = Model.activeRun(workspace).currentStageSlug;
      state.lastSyncAt = remote.exists ? Model.now() : "";
      render();
      showToast(
        remote.exists && migrationDraft
          ? "已读取云端并无损升级为本地草稿；尚未写回 GitHub。"
          : remote.exists
            ? "已读取云端最新版本。"
          : "云端数据文件不存在，已建立新的本地工作区。",
        remote.exists && !migrationDraft ? "success" : "warning",
      );
    } catch (error) {
      if (isMigrationSafetyError(error)) {
        state.modal = null;
        showSafetyFailure(
          "同步已被历史数据安全门阻止",
          error,
          errorMessage(error),
        );
      } else {
        render();
        showToast(errorMessage(error), "danger");
      }
    } finally {
      state.busy = "";
      render();
    }
  }

  function exportData() {
    if (!state.workspace) return;
    let text;
    try {
      text = Model.exportWorkspace(state.workspace);
    } catch (error) {
      showSafetyFailure(
        "导出已被历史数据安全门阻止",
        error,
        errorMessage(error),
      );
      return;
    }
    const run = activeRun();
    const date = new Date().toISOString().slice(0, 10);
    const safeName = Model.sanitizeFilename(
      `${run ? run.name : "workspace"}-${date}.json`,
    );
    downloadBlob(new Blob([text], { type: "application/json;charset=utf-8" }), safeName);
    showToast("JSON 备份已导出；其中不包含访问令牌。", "info");
  }

  function downloadBlob(blob, name) {
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement("a");
    anchor.href = url;
    anchor.download = name;
    anchor.rel = "noopener";
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    global.setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function downloadDataUrl(dataUrl, name) {
    const match = /^data:([^;,]*)(;base64)?,(.*)$/s.exec(dataUrl);
    if (!match) throw new Error("附件格式无效。");
    const mime = match[1] || "application/octet-stream";
    let bytes;
    if (match[2]) {
      const binary = atob(match[3].replace(/\s/g, ""));
      bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
    } else {
      bytes = new TextEncoder().encode(decodeURIComponent(match[3]));
    }
    downloadBlob(new Blob([bytes], { type: mime }), name);
  }

  function downloadAttachment(id) {
    const attachment = state.workspace.attachments.find((item) => item.id === id);
    if (!attachment) {
      showToast("没有找到这个附件，可能已被删除。", "warning");
      return;
    }
    try {
      downloadDataUrl(attachment.dataUrl, attachment.name);
    } catch (error) {
      showToast(errorMessage(error), "danger");
    }
  }

  function lock(forget) {
    if (forget) GitHub.clearToken();
    state.store = null;
    state.workspace = null;
    state.sha = null;
    state.dirty = false;
    state.conflict = false;
    state.busy = "";
    state.modal = null;
    state.pendingImport = null;
    state.suspendedRecordDraft = null;
    state.persistentSafetyAlert = null;
    state.workflowAlert = null;
    modalReturnFocus = null;
    state.view = "locked";
    state.hasStoredToken = Boolean(GitHub.getStoredToken());
    state.remember = hasTrustedToken();
    state.error = "";
    render();
    showToast(
      forget ? "本设备令牌已清除，页面已锁定。" : "页面已锁定。",
      "info",
    );
  }

  function createRun(form) {
    const data = new FormData(form);
    const run = Model.createRun(data.get("name"));
    run.design = String(data.get("design") || "").trim().slice(0, 120);
    run.owner = String(data.get("owner") || "").trim().slice(0, 80);
    state.workspace.runs.push(run);
    state.workspace.activeRunId = run.id;
    state.selectedStageSlug = "init";
    state.modal = null;
    markDirty(run);
    render();
    showToast("已创建包含 14 个阶段的新 Flow；保存后才会同步到云端。");
  }

  function readAsDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ""));
      reader.onerror = () =>
        reject(new Error(`无法读取附件：${file.name || "未命名文件"}`));
      reader.readAsDataURL(file);
    });
  }

  function namedFile(blob, name, type) {
    if (typeof global.File === "function") {
      return new global.File([blob], name, {
        type: type || blob.type || "application/octet-stream",
        lastModified: Date.now(),
      });
    }
    Object.defineProperty(blob, "name", { value: name, configurable: true });
    return blob;
  }

  function extensionForMime(mime) {
    return {
      "image/png": "png",
      "image/jpeg": "jpg",
      "image/webp": "webp",
      "image/gif": "gif",
    }[String(mime || "").toLowerCase()];
  }

  function clipboardFile(file, index) {
    const extension = extensionForMime(file.type) || "png";
    const stamp = new Date()
      .toISOString()
      .replace(/[-:TZ.]/g, "")
      .slice(0, 14);
    return namedFile(
      file,
      `clipboard-${stamp}-${String(index + 1).padStart(2, "0")}.${extension}`,
      file.type || `image/${extension === "jpg" ? "jpeg" : extension}`,
    );
  }

  function canvasToBlob(canvas, type, quality) {
    return new Promise((resolve) => canvas.toBlob(resolve, type, quality));
  }

  async function loadImageForCanvas(file) {
    const dataUrl = await readAsDataUrl(file);
    return new Promise((resolve, reject) => {
      const image = new global.Image();
      image.onload = () => resolve(image);
      image.onerror = () => reject(new Error(`${file.name} 无法作为图片读取。`));
      image.src = dataUrl;
    });
  }

  function isOptimizableImage(file) {
    const mime = String(file.type || "").toLowerCase();
    const extension = String(file.name || "")
      .toLowerCase()
      .split(".")
      .pop();
    return (
      ["image/png", "image/jpeg", "image/webp"].includes(mime) ||
      ["png", "jpg", "jpeg", "webp"].includes(extension)
    );
  }

  async function optimizeImageForAttachment(file) {
    const image = await loadImageForCanvas(file);
    const sourceWidth = image.naturalWidth || image.width;
    const sourceHeight = image.naturalHeight || image.height;
    if (!sourceWidth || !sourceHeight) {
      throw new Error(`${file.name} 没有可用的图片尺寸。`);
    }

    const initialScale = Math.min(1, 2400 / Math.max(sourceWidth, sourceHeight));
    const qualities = [0.96, 0.9, 0.82, 0.74, 0.66];
    let scale = initialScale;
    let smallest = null;

    for (let resize = 0; resize < 5; resize += 1) {
      const width = Math.max(1, Math.round(sourceWidth * scale));
      const height = Math.max(1, Math.round(sourceHeight * scale));
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext("2d", { alpha: false });
      if (!context) throw new Error("当前浏览器无法处理截图。");
      context.fillStyle = "#ffffff";
      context.fillRect(0, 0, width, height);
      context.drawImage(image, 0, 0, width, height);

      for (const quality of qualities) {
        const blob = await canvasToBlob(canvas, "image/webp", quality);
        if (!blob) continue;
        if (!smallest || blob.size < smallest.size) smallest = blob;
        if (blob.size <= MAX_ATTACHMENT_BYTES) {
          const base = Model.sanitizeFilename(file.name).replace(/\.[^.]+$/, "");
          return namedFile(blob, `${base || "screenshot"}.webp`, "image/webp");
        }
      }
      scale *= 0.82;
    }

    const size = smallest ? Math.round(smallest.size / 1024) : "未知";
    throw new Error(`${file.name} 自动优化后仍为 ${size} KiB，未添加。`);
  }

  function validateAttachment(file) {
    if (file.size > MAX_ATTACHMENT_BYTES) {
      throw new Error(`${file.name} 超过 750 KiB，未添加。`);
    }
    const extension = String(file.name).toLowerCase().split(".").pop();
    const allowedExtensions = new Set([
      "png",
      "jpg",
      "jpeg",
      "webp",
      "gif",
      "pdf",
      "txt",
      "md",
      "csv",
      "rpt",
    ]);
    if (!allowedExtensions.has(extension)) {
      throw new Error(
        `${file.name} 的类型不允许。仅支持脱敏图片、PDF 和小型文本/报告。`,
      );
    }
    const allowedMimes = new Set([
      "",
      "image/png",
      "image/jpeg",
      "image/webp",
      "image/gif",
      "application/pdf",
      "application/octet-stream",
      "text/plain",
      "text/markdown",
      "text/csv",
    ]);
    if (!allowedMimes.has(String(file.type || "").toLowerCase())) {
      throw new Error(`${file.name} 的实际内容类型不允许，未添加。`);
    }
  }

  function pendingAttachmentExists(modal, dataUrl) {
    if ((modal.pendingAttachments || []).some((item) => item.dataUrl === dataUrl)) {
      return true;
    }
    if (!modal.recordId) return false;
    const record = state.workspace.records.find((item) => item.id === modal.recordId);
    return record
      ? attachmentsForRecord(record).some((item) => item.dataUrl === dataUrl)
      : false;
  }

  async function preparePendingAttachment(file, source, index) {
    let candidate = source === "clipboard" ? clipboardFile(file, index) : file;
    const originalSize = candidate.size;
    if (candidate.size > MAX_ATTACHMENT_BYTES && isOptimizableImage(candidate)) {
      candidate = await optimizeImageForAttachment(candidate);
    }
    validateAttachment(candidate);
    return {
      id: Model.uid("pending-attachment"),
      name: Model.sanitizeFilename(candidate.name),
      mime: candidate.type || "application/octet-stream",
      size: candidate.size,
      originalSize,
      dataUrl: await readAsDataUrl(candidate),
    };
  }

  function updatePendingAttachmentUi(modal) {
    if (recordModalState() !== modal) return;
    const panel = document.getElementById("pending-attachment-list");
    const items = document.getElementById("pending-attachment-items");
    const count = document.getElementById("pending-attachment-count");
    const attachments = modal.pendingAttachments || [];
    if (panel) panel.hidden = !attachments.length && !modal.pendingJobs;
    if (items) items.innerHTML = attachments.map(renderPendingAttachment).join("");
    if (count) {
      count.textContent = modal.pendingJobs
        ? "正在处理图片…"
        : `${attachments.length} 个，提交记录后加入本地草稿`;
    }
    const submit = root.querySelector('[data-form="record"] [data-record-submit]');
    if (submit) submit.disabled = Boolean(modal.pendingJobs);
  }

  async function queueRecordAttachments(files, source) {
    const modal = recordModalState();
    const candidates = Array.from(files || []).filter(Boolean);
    if (!modal || !candidates.length) return;

    modal.pendingJobs += 1;
    updatePendingAttachmentUi(modal);
    const previous = modal.pendingRead || Promise.resolve();
    const task = previous.then(async () => {
      let added = 0;
      let duplicates = 0;
      const errors = [];
      for (let index = 0; index < candidates.length; index += 1) {
        try {
          const attachment = await preparePendingAttachment(
            candidates[index],
            source,
            index,
          );
          if (recordModalState() !== modal) return;
          if (pendingAttachmentExists(modal, attachment.dataUrl)) {
            duplicates += 1;
            continue;
          }
          modal.pendingAttachments.push(attachment);
          added += 1;
        } catch (error) {
          errors.push(errorMessage(error));
        }
      }
      if (recordModalState() !== modal) return;
      if (added) {
        const checkbox = root.querySelector('[data-form="record"] [name="sanitized"]');
        if (checkbox) checkbox.checked = false;
        showToast(`已加入 ${added} 个待添加附件，请确认脱敏后提交记录。`);
      }
      if (duplicates) showToast(`已跳过 ${duplicates} 个重复图片。`, "info");
      if (errors.length) showToast(errors[0], "warning");
    });
    modal.pendingRead = task.catch(() => {});
    try {
      await task;
    } finally {
      modal.pendingJobs = Math.max(0, modal.pendingJobs - 1);
      updatePendingAttachmentUi(modal);
    }
  }

  function removePendingAttachment(id) {
    const modal = recordModalState();
    if (!modal) return;
    modal.pendingAttachments = (modal.pendingAttachments || []).filter(
      (item) => item.id !== id,
    );
    updatePendingAttachmentUi(modal);
    showToast("待添加附件已移除。", "info");
  }

  function clipboardImageFiles(clipboardData) {
    if (!clipboardData) return [];
    const fromItems = Array.from(clipboardData.items || [])
      .filter(
        (item) =>
          item.kind === "file" && String(item.type || "").startsWith("image/"),
      )
      .map((item) => item.getAsFile())
      .filter(Boolean);
    if (fromItems.length) return fromItems;
    return Array.from(clipboardData.files || []).filter((file) =>
      String(file.type || "").startsWith("image/"),
    );
  }

  function handlePaste(event) {
    const form = event.target.closest
      ? event.target.closest('[data-form="record"]')
      : null;
    const files = clipboardImageFiles(event.clipboardData);
    if (!files.length) return;
    if (form && recordModalState()) {
      event.preventDefault();
      void queueRecordAttachments(files, "clipboard");
      return;
    }
    if (
      state.view === "app" &&
      state.workspace &&
      !state.modal
    ) {
      event.preventDefault();
      state.modal = createRecordModal({
        recordType:
          state.workspaceView === "weekly"
            ? weeklySection("summary").recordType
            : recordTypeForGlobalPaste(),
        stageSlug: state.selectedStageSlug,
        ...(state.workspaceView === "weekly"
          ? {
              weeklySection: "summary",
              weekDate: state.weeklyDate,
            }
          : {}),
      });
      render();
      focusRecordModal(true);
      void queueRecordAttachments(files, "clipboard");
    }
  }

  function evidenceMutationCandidate() {
    if (!state.workspace || typeof Model.clone !== "function") return null;
    return Model.clone(state.workspace);
  }

  function reconcileEvidenceCandidate(
    previousWorkspace,
    candidateWorkspace,
    options,
  ) {
    if (typeof Model.reconcileEvidenceMutation !== "function") {
      return {
        ok: false,
        workspace: previousWorkspace,
        findings: [
          {
            code: "EVIDENCE_RECONCILIATION_UNAVAILABLE",
            path: "$",
            message: "当前构建不能安全协调证据变更。",
          },
        ],
        changedIds: [],
      };
    }
    try {
      return Model.reconcileEvidenceMutation(
        previousWorkspace,
        candidateWorkspace,
        options,
      );
    } catch (error) {
      return {
        ok: false,
        workspace: previousWorkspace,
        findings: [
          {
            code: "EVIDENCE_RECONCILIATION_FAILED",
            path: "$",
            message: errorMessage(error),
          },
        ],
        changedIds: [],
      };
    }
  }

  function commitEvidenceMutation(
    result,
    { stageSlug, closeRecordModal = true, successMessage },
  ) {
    if (!result || !result.ok || !result.workspace) return false;
    state.workspace = result.workspace;
    if (stageSlug) state.selectedStageSlug = stageSlug;
    if (closeRecordModal) state.modal = null;
    state.dirty = true;
    state.conflict = false;
    render();
    showToast(successMessage, "info");
    return true;
  }

  function rejectEvidenceMutation(
    title,
    result,
    fallbackMessage,
    formSnapshot = null,
  ) {
    stageOperationFailure(title, result, fallbackMessage);
    if (formSnapshot) {
      restoreRecordForm(formSnapshot);
      focusRecordModal();
    }
  }

  async function saveRecord(form) {
    const modal = recordModalState();
    if (modal && modal.pendingRead) await modal.pendingRead;
    if (modal && recordModalState() !== modal) return;
    const data = new FormData(form);
    const formSnapshot = snapshotRecordForm();
    const previousWorkspace = state.workspace;
    const recordId = form.dataset.recordId || "";
    const existingBefore = recordId
      ? previousWorkspace.records.find((record) => record.id === recordId)
      : null;
    const pendingAttachments = modal ? modal.pendingAttachments || [] : [];
    if (pendingAttachments.length && data.get("sanitized") !== "on") {
      showToast("添加附件前，请确认附件已经脱敏。", "warning");
      return;
    }
    try {
      const timestamp = Model.now();
      const candidate = evidenceMutationCandidate();
      if (!candidate) {
        rejectEvidenceMutation(
          "记录变更已被阻止",
          null,
          "当前构建无法创建独立候选工作区。",
          formSnapshot,
        );
        return;
      }
      const candidateRun = Model.activeRun(candidate);
      const existing = recordId
        ? candidate.records.find((record) => record.id === recordId)
        : null;
      if (recordId && !existing) {
        rejectEvidenceMutation(
          "记录变更已被阻止",
          null,
          "要编辑的记录已经不存在，原工作区保持不变。",
          formSnapshot,
        );
        return;
      }
      const preparedAttachments = pendingAttachments.map((attachment) => ({
        id: Model.uid("attachment"),
        recordId: existing ? existing.id : null,
        name: attachment.name,
        mime: attachment.mime,
        size: attachment.size,
        dataUrl: attachment.dataUrl,
        createdAt: timestamp,
      }));
      const record =
        existing ||
        {
          id: Model.uid("record"),
          runId: candidateRun.id,
          createdAt: timestamp,
          attachmentIds: [],
        };
      if (preparedAttachments.length && !Array.isArray(record.attachmentIds)) {
        record.attachmentIds = Array.from(
          new Set(
            candidate.attachments
              .filter(
                (attachment) =>
                  attachment &&
                  attachment.recordId === record.id &&
                  typeof attachment.id === "string" &&
                  attachment.id,
              )
              .map((attachment) => attachment.id),
          ),
        );
      }
      record.stageSlug = String(data.get("stageSlug") || state.selectedStageSlug);
      record.type = String(data.get("type") || "progress");
      record.title =
        String(data.get("title") || "").trim().slice(0, 120) || "未命名记录";
      record.content = String(data.get("content") || "").slice(0, 50000);
      record.status = String(data.get("status") || "open").slice(0, 40);
      record.priority = String(data.get("priority") || "medium");
      record.tags = String(data.get("tags") || "")
        .split(/[,，]/)
        .map((tag) => tag.trim())
        .filter(Boolean)
        .slice(0, 20);
      record.dueAt = data.get("dueAt")
        ? `${String(data.get("dueAt"))}T00:00:00.000Z`
        : null;
      record.updatedAt = timestamp;
      if (!existing) candidate.records.push(record);

      for (const attachment of preparedAttachments) {
        attachment.recordId = record.id;
        candidate.attachments.push(attachment);
        record.attachmentIds.push(attachment.id);
      }
      const result = reconcileEvidenceCandidate(previousWorkspace, candidate, {
        at: timestamp,
        reason: existingBefore
          ? `Record ${record.id} updated through the audited editor.`
          : `Record ${record.id} added through the audited editor.`,
      });
      if (!result || !result.ok) {
        rejectEvidenceMutation(
          "记录变更已被阻止",
          result,
          "变更会破坏当前 Gate 或批准证据链，原工作区和表单已保留。",
          formSnapshot,
        );
        return;
      }
      commitEvidenceMutation(result, {
        stageSlug: record.stageSlug,
        successMessage: existingBefore
          ? "记录已经安全更新到本地草稿。"
          : "记录已经安全加入本地草稿。",
      });
    } catch (error) {
      rejectEvidenceMutation(
        "记录变更已被阻止",
        null,
        errorMessage(error),
        formSnapshot,
      );
    }
  }

  async function importData(form) {
    const file = form.elements.file.files[0];
    if (!file) return;
    try {
      if (file.size > MAX_IMPORT_BYTES) {
        throw new Error("备份超过 10 MiB 安全上限，未导入。");
      }
      const raw = await file.text();
      if (typeof Model.previewWorkspaceImport !== "function") {
        throw new Error("当前构建缺少版本化迁移器，已阻止导入。");
      }
      const preview = Model.previewWorkspaceImport(JSON.parse(raw));
      if (!preview || !preview.report) {
        throw new Error("迁移器没有返回可审计报告，已阻止导入。");
      }
      state.pendingImport = {
        candidate: preview.candidate,
        report: preview.report,
        fileName: file.name,
      };
      state.modal = { type: "import-report" };
      render();
      const reportDialog = root.querySelector("[data-migration-report]");
      if (reportDialog) reportDialog.focus();
    } catch (error) {
      const report = migrationReportFromError(error);
      if (report) {
        state.pendingImport = {
          candidate: error.candidate || null,
          report,
          fileName: file.name,
        };
        state.modal = { type: "import-report" };
        render();
        const reportDialog = root.querySelector("[data-migration-report]");
        if (reportDialog) reportDialog.focus();
      } else {
        state.pendingImport = null;
        state.modal = null;
        setPersistentSafetyAlert(
          "导入预检没有完成",
          null,
          `导入失败：${errorMessage(error)}`,
        );
        if (!restoreSuspendedRecordDraft()) render();
      }
    }
  }

  function cancelPendingImport() {
    const report = state.pendingImport && state.pendingImport.report;
    if (report && (!report.safe || !report.canImport)) {
      setPersistentSafetyAlert(
        "备份导入已被安全门阻止",
        report,
        "迁移报告未证明源对象可以无损保留。",
      );
    }
    state.pendingImport = null;
    state.modal = null;
    if (!restoreSuspendedRecordDraft()) render();
  }

  function confirmPendingImport() {
    const pending = state.pendingImport;
    const report = pending && pending.report;
    if (!pending || !report || !(report.safe && report.canImport)) {
      setPersistentSafetyAlert(
        "备份导入已被安全门阻止",
        report,
        "只有 safe 且 canImport 的迁移报告可以确认。",
      );
      render();
      return;
    }
    const workspace = pending.candidate;
    const run = workspace && Model.activeRun(workspace);
    if (!workspace || !run) {
      setPersistentSafetyAlert(
        "备份导入已被安全门阻止",
        report,
        "迁移候选中没有可用 Run，当前工作区保持不变。",
      );
      render();
      return;
    }
    state.workspace = workspace;
    state.selectedStageSlug = Model.stageTemplate(run.currentStageSlug)
      ? run.currentStageSlug
      : (run.stages || []).find(
          (stage) => stage && Model.stageTemplate(stage.slug),
        )?.slug || "init";
    state.dirty = true;
    state.conflict = false;
    state.pendingImport = null;
    state.suspendedRecordDraft = null;
    state.modal = null;
    render();
    showToast("已导入为本地未保存草稿；没有自动写入 GitHub。", "warning");
  }

  function deleteRecord(id) {
    const previousWorkspace = state.workspace;
    const record = previousWorkspace.records.find((item) => item.id === id);
    if (!record) return;
    if (!global.confirm(`确定删除记录“${record.title}”及其附件吗？`)) return;
    const formSnapshot = snapshotRecordForm();
    const candidate = evidenceMutationCandidate();
    if (!candidate) {
      rejectEvidenceMutation(
        "记录删除已被阻止",
        null,
        "当前构建无法创建独立候选工作区。",
        formSnapshot,
      );
      return;
    }
    const candidateRecord = candidate.records.find((item) => item.id === id);
    const attachmentIds = new Set(candidateRecord?.attachmentIds || []);
    candidate.records = candidate.records.filter(
      (item) => item.id !== id,
    );
    candidate.attachments = candidate.attachments.filter(
      (attachment) =>
        attachment.recordId !== id && !attachmentIds.has(attachment.id),
    );
    const timestamp = Model.now();
    const result = reconcileEvidenceCandidate(previousWorkspace, candidate, {
      at: timestamp,
      reason: `Record ${id} deletion requested through the audited editor.`,
    });
    if (!result || !result.ok) {
      rejectEvidenceMutation(
        "记录删除已被阻止",
        result,
        "这条记录或附件仍被当前 Gate、Waiver 或 Override 引用；原草稿没有改变。",
        formSnapshot,
      );
      return;
    }
    commitEvidenceMutation(result, {
      stageSlug: record.stageSlug,
      successMessage: "记录已经从本地草稿安全删除。",
    });
  }

  function deleteAttachment(id) {
    const previousWorkspace = state.workspace;
    const attachment = previousWorkspace.attachments.find((item) => item.id === id);
    if (!attachment) return;
    if (!global.confirm(`确定删除附件“${attachment.name}”吗？`)) return;
    const formSnapshot = snapshotRecordForm();
    const candidate = evidenceMutationCandidate();
    if (!candidate) {
      rejectEvidenceMutation(
        "附件删除已被阻止",
        null,
        "当前构建无法创建独立候选工作区。",
        formSnapshot,
      );
      return;
    }
    candidate.attachments = candidate.attachments.filter(
      (item) => item.id !== id,
    );
    for (const record of candidate.records) {
      if (!Array.isArray(record.attachmentIds)) continue;
      record.attachmentIds = record.attachmentIds.filter(
        (attachmentId) => attachmentId !== id,
      );
    }
    const timestamp = Model.now();
    const result = reconcileEvidenceCandidate(previousWorkspace, candidate, {
      at: timestamp,
      reason: `Attachment ${id} deletion requested through the audited editor.`,
    });
    if (!result || !result.ok) {
      rejectEvidenceMutation(
        "附件删除已被阻止",
        result,
        "这个附件仍被当前 Gate、Waiver 或 Override 引用；原草稿没有改变。",
        formSnapshot,
      );
      return;
    }
    commitEvidenceMutation(result, {
      stageSlug: recordModalState()?.stageSlug || state.selectedStageSlug,
      closeRecordModal: false,
      successMessage: "附件已经从本地草稿安全删除。",
    });
    restoreRecordForm(formSnapshot);
    focusRecordModal();
  }

  function archiveRun(run) {
    if (
      !global.confirm(
        `归档“${run.name}”？数据不会删除，之后可通过“显示已归档 Flow”恢复。`,
      )
    ) {
      return;
    }
    run.archived = true;
    const next = state.workspace.runs.find((item) => !item.archived);
    if (next) {
      state.workspace.activeRunId = next.id;
      state.selectedStageSlug = next.currentStageSlug;
    } else {
      const replacement = Model.createRun("新的 Flow");
      state.workspace.runs.push(replacement);
      state.workspace.activeRunId = replacement.id;
      state.selectedStageSlug = "init";
    }
    markDirty(run);
    render();
    showToast("Flow 已归档到本地草稿。", "info");
  }

  function stageOperationFailure(title, result, fallbackMessage) {
    const findings =
      result && Array.isArray(result.findings) ? result.findings : [];
    if (state.modal) state.modal.findings = findings;
    setWorkflowAlert(title, findings, fallbackMessage);
    render();
    const dialog = root.querySelector(
      ".modal-record, [data-gate-result-dialog], [data-stage-execution-dialog], [data-stage-approval-dialog], [data-stage-override-dialog]",
    );
    const findingsHost = dialog && dialog.querySelector("[data-form-findings]");
    if (findingsHost) findingsHost.focus();
    else if (dialog) dialog.focus();
  }

  function commitStageOperation(result, stageSlug, successMessage) {
    if (!result || !result.ok || !result.workspace) {
      stageOperationFailure(
        "阶段状态操作已被阻止",
        result,
        "模型没有返回完整的、可提交的新工作区。",
      );
      return false;
    }
    state.workspace = result.workspace;
    const run = activeRun();
    const stage = run && Model.stageState(run, stageSlug);
    markDirty(run, stage);
    closeModal();
    showToast(successMessage, "info");
    return true;
  }

  function parseGateActual(rawValue, definition) {
    const raw = String(rawValue == null ? "" : rawValue).trim();
    if (!raw) return null;
    const operator = definition && definition.operator;
    if (["lt", "lte", "gt", "gte", "between"].includes(operator)) {
      const numeric = Number(raw);
      return Number.isFinite(numeric) ? numeric : raw;
    }
    if (
      ["eq", "ne"].includes(operator) &&
      typeof definition.expected === "number"
    ) {
      const numeric = Number(raw);
      return Number.isFinite(numeric) ? numeric : raw;
    }
    if (
      ["eq", "ne"].includes(operator) &&
      typeof definition.expected === "boolean"
    ) {
      if (raw.toLowerCase() === "true") return true;
      if (raw.toLowerCase() === "false") return false;
    }
    return raw;
  }

  function submitGateResult(form) {
    const data = new FormData(form);
    const run = state.workspace.runs.find(
      (item) => item.id === form.dataset.runId,
    );
    const stage =
      run &&
      (run.stages || []).find((item) => item.slug === form.dataset.stage);
    const gate =
      stage &&
      (stage.gates || []).find((item) => item.id === form.dataset.gateId);
    if (!run || !stage || !gate || !Model.transitionGateResult) {
      stageOperationFailure(
        "Gate 检查已被阻止",
        null,
        "没有找到 Gate 或当前构建缺少 Gate 2.0 操作。",
      );
      return;
    }
    const status = String(data.get("status") || "pending");
    const evidenceIds = data
      .getAll("evidenceIds")
      .map((value) => String(value));
    const waiver =
      status === "waived"
        ? {
            reason: String(data.get("waiverReason") || "").trim(),
            approvedBy: String(
              data.get("waiverApprovedBy") || "",
            ).trim(),
            approvedAt: dateTimeFromForm(data.get("waiverApprovedAt")),
            evidenceIds,
            expiresAt: data.get("waiverExpiresAt")
              ? dateTimeFromForm(data.get("waiverExpiresAt"))
              : null,
            revokedAt: null,
            revokedBy: null,
          }
        : null;
    let result;
    try {
      result = Model.transitionGateResult(state.workspace, {
        runId: run.id,
        stageSlug: stage.slug,
        gateId: gate.id,
        status,
        actual: parseGateActual(data.get("actual"), gate.definition || {}),
        mode: String(data.get("mode") || "").trim(),
        corner: String(data.get("corner") || "").trim(),
        scenario: String(data.get("scenario") || "").trim(),
        evidenceIds,
        checkedBy: String(data.get("checkedBy") || "").trim(),
        checkedAt: dateTimeFromForm(data.get("checkedAt")),
        reviewedBy: String(data.get("reviewedBy") || "").trim(),
        reviewedAt: data.get("reviewedAt")
          ? dateTimeFromForm(data.get("reviewedAt"))
          : null,
        waiver,
        notApplicableReason: String(
          data.get("notApplicableReason") || "",
        ).trim(),
        createdAt: Model.now(),
      });
    } catch (error) {
      stageOperationFailure("Gate 检查已被阻止", null, errorMessage(error));
      return;
    }
    if (!result || !result.ok) {
      stageOperationFailure(
        "Gate 检查已被阻止",
        result,
        "结果没有通过规则、证据或审计字段校验。",
      );
      return;
    }
    commitStageOperation(result, stage.slug, "Gate 新结果已加入本地草稿。");
  }

  function submitStageExecution(form) {
    const data = new FormData(form);
    if (!Model.transitionStageExecution) {
      stageOperationFailure(
        "执行状态转换已被阻止",
        null,
        "当前构建缺少 Stage 执行状态机。",
      );
      return;
    }
    let result;
    try {
      result = Model.transitionStageExecution(state.workspace, {
        runId: form.dataset.runId,
        stageSlug: form.dataset.stage,
        targetStatus: form.dataset.targetStatus,
        actor: String(data.get("actor") || "").trim(),
        reason: String(data.get("reason") || "").trim(),
        at: dateTimeFromForm(data.get("at")),
      });
    } catch (error) {
      stageOperationFailure(
        "执行状态转换已被阻止",
        null,
        errorMessage(error),
      );
      return;
    }
    if (!result || !result.ok) {
      stageOperationFailure(
        "执行状态转换已被阻止",
        result,
        "转换不符合允许的 Stage 执行路径。",
      );
      return;
    }
    commitStageOperation(
      result,
      form.dataset.stage,
      "执行状态已通过状态机更新到本地草稿。",
    );
  }

  function submitStageApproval(form) {
    const data = new FormData(form);
    const request = form.dataset.approvalMode === "request";
    const operation = request
      ? Model.requestStageApproval
      : Model.decideStageApproval;
    if (!operation) {
      stageOperationFailure(
        "批准操作已被阻止",
        null,
        "当前构建缺少 Stage 批准状态机。",
      );
      return;
    }
    const input = request
      ? {
          runId: form.dataset.runId,
          stageSlug: form.dataset.stage,
          requester: String(data.get("actor") || "").trim(),
          requestedAt: dateTimeFromForm(data.get("at")),
        }
      : {
          runId: form.dataset.runId,
          stageSlug: form.dataset.stage,
          decision: form.dataset.decision,
          approver: String(data.get("actor") || "").trim(),
          decidedAt: dateTimeFromForm(data.get("at")),
          reason: String(data.get("reason") || "").trim(),
        };
    let result;
    try {
      result = operation(state.workspace, input);
    } catch (error) {
      stageOperationFailure("批准操作已被阻止", null, errorMessage(error));
      return;
    }
    if (!result || !result.ok) {
      stageOperationFailure(
        "批准操作已被阻止",
        result,
        "阶段尚未满足批准条件。",
      );
      return;
    }
    commitStageOperation(
      result,
      form.dataset.stage,
      request ? "阶段批准申请已记录。" : "阶段批准决定已记录。",
    );
  }

  function submitStageOverride(form) {
    const data = new FormData(form);
    if (!Model.applyStageOverride) {
      stageOperationFailure(
        "Override 已被阻止",
        null,
        "当前构建缺少 Stage Override 操作。",
      );
      return;
    }
    let result;
    try {
      result = Model.applyStageOverride(state.workspace, {
        runId: form.dataset.runId,
        stageSlug: form.dataset.stage,
        reason: String(data.get("reason") || "").trim(),
        approvedBy: String(data.get("approvedBy") || "").trim(),
        approvedAt: dateTimeFromForm(data.get("approvedAt")),
        evidenceIds: data
          .getAll("evidenceIds")
          .map((value) => String(value)),
        expiresAt: data.get("expiresAt")
          ? dateTimeFromForm(data.get("expiresAt"))
          : null,
      });
    } catch (error) {
      stageOperationFailure("Override 已被阻止", null, errorMessage(error));
      return;
    }
    if (!result || !result.ok) {
      stageOperationFailure(
        "Override 已被阻止",
        result,
        "Override 未覆盖完整阻断集，或包含不可绕过的完整性阻断。",
      );
      return;
    }
    commitStageOperation(
      result,
      form.dataset.stage,
      "Override 审计记录已加入本地草稿；底层风险未被隐藏。",
    );
  }

  function handleClick(event) {
    const target = event.target.closest("[data-action]");
    if (!target) return;
    const action = target.dataset.action;
    if (target.tagName === "A") event.preventDefault();

    if (action === "select-stage") {
      state.selectedStageSlug = target.dataset.stage;
      render();
    } else if (action === "toggle-advanced-audit") {
      const details = target.closest("[data-advanced-audit]");
      state.advancedAuditOpen = details ? !details.open : false;
    } else if (action === "edit-gate-result") {
      const run = activeRun();
      openAuditModal(
        {
          type: "gate-result",
          runId: run.id,
          stageSlug: target.dataset.stage || state.selectedStageSlug,
          gateId: target.dataset.gateId,
          findings: [],
        },
        target,
      );
    } else if (action === "open-stage-execution") {
      const run = activeRun();
      openAuditModal(
        {
          type: "stage-execution",
          runId: run.id,
          stageSlug: target.dataset.stage || state.selectedStageSlug,
          targetStatus: target.dataset.targetStatus,
          findings: [],
        },
        target,
      );
    } else if (action === "open-stage-approval") {
      const run = activeRun();
      openAuditModal(
        {
          type: "stage-approval",
          runId: run.id,
          stageSlug: target.dataset.stage || state.selectedStageSlug,
          mode: target.dataset.approvalMode || "request",
          decision: target.dataset.decision || "",
          findings: [],
        },
        target,
      );
    } else if (action === "open-stage-override") {
      const run = activeRun();
      openAuditModal(
        {
          type: "stage-override",
          runId: run.id,
          stageSlug: target.dataset.stage || state.selectedStageSlug,
          findings: [],
        },
        target,
      );
    } else if (action === "switch-workspace-view") {
      state.workspaceView = ["flow", "weekly", "knowledge"].includes(
        target.dataset.view,
      )
        ? target.dataset.view
        : "flow";
      state.sidebarOpen = false;
      render();
    } else if (action === "mark-current") {
      const run = activeRun();
      run.currentStageSlug = state.selectedStageSlug;
      markDirty(run);
      render();
      showToast("当前阶段已更新到本地草稿。");
    } else if (action === "select-run") {
      const run = state.workspace.runs.find(
        (item) => item.id === target.dataset.runId,
      );
      if (!run) return;
      state.workspace.activeRunId = run.id;
      state.selectedStageSlug = run.currentStageSlug;
      state.sidebarOpen = false;
      markDirty(run);
      render();
    } else if (action === "toggle-sidebar") {
      state.sidebarOpen = !state.sidebarOpen;
      render();
    } else if (action === "close-sidebar") {
      state.sidebarOpen = false;
      render();
    } else if (action === "new-run") {
      state.sidebarOpen = false;
      state.modal = { type: "new-run" };
      render();
    } else if (action === "new-record") {
      state.modal = createRecordModal({
        recordType: target.dataset.recordType || "progress",
        stageSlug: state.selectedStageSlug,
      });
      render();
      focusRecordModal();
    } else if (action === "new-record-with-image") {
      const recordType = Model.RECORD_TYPES[target.dataset.recordType]
        ? target.dataset.recordType
        : "progress";
      openRecordWithImage({
        recordType,
        stageSlug: state.selectedStageSlug,
      });
    } else if (
      action === "new-weekly-record" ||
      action === "new-weekly-image"
    ) {
      const definition = weeklySection(target.dataset.weeklySection);
      if (!definition) return;
      const options = {
        weeklySection: definition.id,
        weekDate: state.weeklyDate,
        recordType: definition.recordType,
        stageSlug: definition.stageSlug || state.selectedStageSlug,
      };
      if (action === "new-weekly-image") {
        openRecordWithImage(options);
      } else {
        state.modal = createRecordModal(options);
        render();
        focusRecordModal();
      }
    } else if (action === "new-knowledge-with-image") {
      openRecordWithImage({
        recordType: "knowledge",
        stageSlug: state.selectedStageSlug,
      });
    } else if (action === "clear-knowledge-search") {
      state.knowledgeQuery = "";
      const input = root.querySelector('[data-action="search-knowledge"]');
      if (input) input.value = "";
      renderKnowledgeResults();
      const clear = root.querySelector('[data-action="clear-knowledge-search"]');
      if (clear) clear.disabled = true;
      if (input) input.focus();
    } else if (action === "edit-record") {
      state.modal = createRecordModal({ recordId: target.dataset.recordId });
      render();
      focusRecordModal();
    } else if (action === "add-record-image") {
      openRecordWithImage({ recordId: target.dataset.recordId });
    } else if (action === "choose-attachments") {
      const input = root.querySelector('[data-form="record"] [name="attachments"]');
      if (input) input.click();
    } else if (action === "remove-pending-attachment") {
      removePendingAttachment(target.dataset.pendingAttachmentId);
    } else if (action === "preview-pending-attachment") {
      previewPendingAttachmentById(target.dataset.pendingAttachmentId, target);
    } else if (action === "preview-attachment") {
      previewAttachmentById(target.dataset.attachmentId, target);
    } else if (action === "delete-record") {
      deleteRecord(target.dataset.recordId);
    } else if (action === "delete-attachment") {
      deleteAttachment(target.dataset.attachmentId);
    } else if (action === "download-attachment") {
      downloadAttachment(target.dataset.attachmentId);
    } else if (action === "open-menu") {
      state.modal = { type: "menu" };
      render();
    } else if (action === "close-modal") {
      closeModal();
    } else if (action === "cancel-import-preview") {
      cancelPendingImport();
    } else if (action === "confirm-import-preview") {
      confirmPendingImport();
    } else if (action === "acknowledge-safety-alert") {
      state.persistentSafetyAlert = null;
      render();
    } else if (action === "acknowledge-workflow-alert") {
      state.workflowAlert = null;
      render();
    } else if (action === "sync") {
      syncFromCloud();
    } else if (action === "force-sync") {
      syncFromCloud(true);
    } else if (action === "save") {
      saveToCloud();
    } else if (action === "export") {
      exportData();
      if (state.modal && state.modal.type === "menu") {
        state.modal = null;
        render();
      }
    } else if (action === "import") {
      suspendRecordDraftForImport();
      state.pendingImport = null;
      state.modal = { type: "import" };
      render();
    } else if (action === "lock") {
      if (
        !state.dirty ||
        global.confirm("本地有未保存修改，仍然锁定并丢弃这些修改吗？")
      ) {
        lock(false);
      }
    } else if (action === "forget") {
      if (
        global.confirm(
          "忘记本设备会清除浏览器里的访问令牌并锁定页面，确定继续吗？",
        )
      ) {
        lock(true);
      }
    } else if (action === "archive-run") {
      archiveRun(activeRun());
    } else if (action === "restore-run") {
      const run = activeRun();
      run.archived = false;
      markDirty(run);
      render();
      showToast("Flow 已恢复到本地草稿。");
    }
  }

  async function handleChange(event) {
    const target = event.target.closest("[data-action]");
    if (!target || !state.workspace) return;
    const action = target.dataset.action;
    const run = activeRun();
    if (action === "attachment-files") {
      const files = Array.from(target.files || []);
      target.value = "";
      await queueRecordAttachments(files, "picker");
    } else if (action === "gate-result-status") {
      const form = target.closest('[data-form="gate-result"]');
      if (!form) return;
      const waiver = form.querySelector("[data-waiver-fields]");
      const notApplicable = form.querySelector(
        "[data-not-applicable-fields]",
      );
      if (waiver) waiver.hidden = target.value !== "waived";
      if (notApplicable) {
        notApplicable.hidden = target.value !== "not_applicable";
      }
    } else if (action === "stage-next" || action === "stage-note") {
      const stage = Model.stageState(run, target.dataset.stage);
      if (!stage) return;
      const field = action === "stage-next" ? "nextStep" : "note";
      stage[field] = String(target.value).slice(
        0,
        field === "nextStep" ? 1000 : 10000,
      );
      markDirty(run, stage);
      render();
    } else if (action === "weekly-date") {
      const value = String(target.value || "");
      if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return;
      state.weeklyDate = value;
      render();
    } else if (action === "run-field") {
      const field = target.dataset.field;
      if (!["name", "design", "owner"].includes(field)) return;
      const limits = { name: 80, design: 120, owner: 80 };
      const value = String(target.value).trim().slice(0, limits[field]);
      run[field] = field === "name" ? value || "未命名 Flow" : value;
      markDirty(run);
      render();
    } else if (action === "record-scope") {
      state.recordScope = target.value === "all" ? "all" : "stage";
      renderRecordList();
    } else if (action === "record-type-filter") {
      state.recordType = Model.RECORD_TYPES[target.value] ? target.value : "all";
      renderRecordList();
    } else if (action === "show-archived") {
      state.showArchived = target.checked;
      render();
    }
  }

  function handleInput(event) {
    const recordSearch = event.target.closest('[data-action="search-records"]');
    if (recordSearch) {
      state.query = recordSearch.value;
      renderRecordList();
      return;
    }
    const knowledgeSearch = event.target.closest(
      '[data-action="search-knowledge"]',
    );
    if (!knowledgeSearch) return;
    state.knowledgeQuery = knowledgeSearch.value;
    renderKnowledgeResults();
    const clear = root.querySelector('[data-action="clear-knowledge-search"]');
    if (clear) clear.disabled = !state.knowledgeQuery;
  }

  async function handleSubmit(event) {
    const form = event.target.closest("[data-form]");
    if (!form) return;
    event.preventDefault();
    const type = form.dataset.form;
    if (type === "connect") await connect(form);
    else if (type === "new-run") createRun(form);
    else if (type === "record") await saveRecord(form);
    else if (type === "import") await importData(form);
    else if (type === "gate-result") submitGateResult(form);
    else if (type === "stage-execution") submitStageExecution(form);
    else if (type === "stage-approval") submitStageApproval(form);
    else if (type === "stage-override") submitStageOverride(form);
  }

  root.addEventListener("click", handleClick);
  root.addEventListener("change", handleChange);
  root.addEventListener("input", handleInput);
  root.addEventListener("submit", handleSubmit);
  document.addEventListener("paste", handlePaste);
  document.addEventListener("keydown", (event) => {
    const previewDialog = document.getElementById("attachment-preview-dialog");
    if (previewDialog && previewDialog.open) {
      if (event.key === "Escape") {
        event.preventDefault();
        closeAttachmentPreview();
        return;
      }
      if (event.key === "+" || event.key === "=") {
        event.preventDefault();
        changeAttachmentPreviewZoom(PREVIEW_ZOOM_STEP);
        return;
      }
      if (event.key === "-" || event.key === "_") {
        event.preventDefault();
        changeAttachmentPreviewZoom(1 / PREVIEW_ZOOM_STEP);
        return;
      }
      if (event.key === "0") {
        event.preventDefault();
        fitAttachmentPreview(previewDialog);
        return;
      }
    }
    if (event.key === "Escape" && state.modal) {
      closeModal();
      return;
    }
    if (event.key === "Tab" && state.modal) {
      const dialog = root.querySelector(
        '[role="dialog"], [role="alertdialog"]',
      );
      if (!dialog) return;
      const focusable = Array.from(
        dialog.querySelectorAll(
          'button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])',
        ),
      ).filter((element) => !element.hidden);
      if (!focusable.length) return;
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      } else if (!dialog.contains(document.activeElement)) {
        event.preventDefault();
        first.focus();
      }
    }
  });
  global.addEventListener("beforeunload", (event) => {
    if (!state.dirty) return;
    event.preventDefault();
    event.returnValue = "";
  });
  global.addEventListener("offline", () =>
    showToast("网络已断开；本地草稿仍保留在当前页面。", "warning"),
  );
  global.addEventListener("online", () =>
    showToast("网络已恢复，需要时请手动同步。", "info"),
  );

  render();
})(typeof window !== "undefined" ? window : globalThis);
</script>
  </body>
</html>
