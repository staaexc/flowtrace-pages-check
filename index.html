        modelFinding(
          "INVALID_APPROVAL_STATUS",
          `${path}.approvalStatus`,
          "Approval status is unsupported.",
        ),
      );
    }
    for (const field of [
      "executionHistory",
      "approvalHistory",
      "overrides",
    ]) {
      if (!Array.isArray(state[field])) {
        findings.push(
          modelFinding(
            "INVALID_STAGE_HISTORY",
            `${path}.${field}`,
            `${field} must be an array.`,
          ),
        );
      }
    }
    if (
      state.evaluatedAt !== null &&
      !isValidUpdatedAt(state.evaluatedAt)
    ) {
      findings.push(
        modelFinding(
          "INVALID_STAGE_EVALUATION_TIME",
          `${path}.evaluatedAt`,
          "evaluatedAt must be null or a valid timestamp.",
        ),
      );
    }
    if (Array.isArray(state.executionHistory)) {
      const ids = new Set();
      let previousTo = null;
      for (let index = 0; index < state.executionHistory.length; index += 1) {
        const entry = state.executionHistory[index];
        const entryPath = `${path}.executionHistory[${index}]`;
        const structurallyValid = !(
          !isObject(entry) ||
          typeof entry.id !== "string" ||
          !entry.id.trim() ||
          ids.has(entry.id) ||
          !EXECUTION_STATUSES.includes(entry.from) ||
          !EXECUTION_STATUSES.includes(entry.to) ||
          typeof entry.actor !== "string" ||
          typeof entry.reason !== "string" ||
          !isValidUpdatedAt(entry.at)
        );
        const transitionValid =
          structurallyValid &&
          (EXECUTION_TRANSITIONS[entry.from] || []).includes(entry.to) &&
          (index === 0
            ? entry.from === baselineExecutionStatus
            : entry.from === previousTo) &&
          (entry.from !== "completed" ||
            entry.to !== "in_progress" ||
            (entry.actor.trim() && entry.reason.trim()));
        if (!structurallyValid || !transitionValid) {
          findings.push(
            modelFinding(
              "INVALID_EXECUTION_HISTORY",
              entryPath,
              "Execution history must be canonical, contiguous, and follow the transition graph.",
            ),
          );
        }
        if (isObject(entry) && typeof entry.id === "string") ids.add(entry.id);
        if (isObject(entry) && EXECUTION_STATUSES.includes(entry.to)) {
          previousTo = entry.to;
        }
      }
      if (
        state.executionHistory.length &&
        previousTo !== state.executionStatus
      ) {
        findings.push(
          modelFinding(
            "INVALID_EXECUTION_HISTORY",
            `${path}.executionStatus`,
            "Execution status must equal the final audited transition.",
          ),
        );
      }
      if (
        state.executionHistory.length === 0 &&
        state.executionStatus !== baselineExecutionStatus
      ) {
        findings.push(
          modelFinding(
            "INVALID_EXECUTION_HISTORY",
            `${path}.executionStatus`,
            `Execution without history must remain at its ${baselineExecutionStatus} baseline.`,
          ),
        );
      }
    }
    if (Array.isArray(state.approvalHistory)) {
      const ids = new Set();
      const overridesById = new Map();
      if (Array.isArray(state.overrides)) {
        for (let index = 0; index < state.overrides.length; index += 1) {
          const override = state.overrides[index];
          const overridePath = `${path}.overrides[${index}]`;
          if (
            !isObject(override) ||
            typeof override.id !== "string" ||
            !override.id.trim() ||
            overridesById.has(override.id) ||
            typeof override.decisionId !== "string" ||
            !override.decisionId.trim()
          ) {
            findings.push(
              modelFinding(
                "INVALID_APPROVAL_HISTORY",
                overridePath,
                "Each Stage Override must have unique identity and a linked approval decision.",
              ),
            );
          }
          if (isObject(override) && typeof override.id === "string") {
            overridesById.set(override.id, override);
          }
        }
      }
      let effectiveStatus = "not_requested";
      let pendingRequest = null;
      for (let index = 0; index < state.approvalHistory.length; index += 1) {
        const entry = state.approvalHistory[index];
        const entryPath = `${path}.approvalHistory[${index}]`;
        const structurallyValid = !(
          !isObject(entry) ||
          typeof entry.id !== "string" ||
          !entry.id.trim() ||
          ids.has(entry.id) ||
          !["request", "decision", "stale"].includes(entry.kind) ||
          typeof entry.actor !== "string" ||
          !entry.actor.trim() ||
          typeof entry.reason !== "string" ||
          !isValidUpdatedAt(entry.at)
        );
        let chainValid = structurallyValid;
        if (structurallyValid && entry.kind === "request") {
          chainValid =
            effectiveStatus !== "pending" &&
            entry.outcome === "pending" &&
            typeof entry.inputFingerprint === "string" &&
            Boolean(entry.inputFingerprint) &&
            typeof entry.blockerFingerprint === "string" &&
            Boolean(entry.blockerFingerprint);
          if (chainValid) {
            pendingRequest = entry;
            effectiveStatus = "pending";
          }
        } else if (structurallyValid && entry.kind === "decision") {
          if (["approved", "rejected"].includes(entry.outcome)) {
            chainValid =
              effectiveStatus === "pending" &&
              Boolean(pendingRequest) &&
              entry.inputFingerprint === pendingRequest.inputFingerprint &&
              typeof entry.blockerFingerprint === "string" &&
              Boolean(entry.blockerFingerprint) &&
              (entry.outcome !== "rejected" || Boolean(entry.reason.trim()));
            if (chainValid) {
              effectiveStatus = entry.outcome;
              pendingRequest = null;
            }
          } else if (entry.outcome === "approved_with_override") {
            const override = overridesById.get(entry.overrideId);
            chainValid =
              effectiveStatus !== "pending" &&
              Boolean(override) &&
              matchingOverrideDecision(state, override) === entry &&
              typeof entry.inputFingerprint === "string" &&
              Boolean(entry.inputFingerprint);
            if (chainValid) {
              effectiveStatus = "approved_with_override";
              pendingRequest = null;
            }
          } else {
            chainValid = false;
          }
        } else if (structurallyValid && entry.kind === "stale") {
          chainValid =
            ["pending", "approved", "approved_with_override"].includes(
              effectiveStatus,
            ) &&
            entry.outcome === "stale" &&
            entry.inputFingerprint === null &&
            entry.blockerFingerprint === null;
          if (chainValid) {
            effectiveStatus = "stale";
            pendingRequest = null;
          }
        }
        if (!structurallyValid || !chainValid) {
          findings.push(
            modelFinding(
              "INVALID_APPROVAL_HISTORY",
              entryPath,
              "Approval history must form an audited request, decision, Override, and stale chain.",
            ),
          );
        }
        if (isObject(entry) && typeof entry.id === "string") ids.add(entry.id);
      }
      if (effectiveStatus !== state.approvalStatus) {
        findings.push(
          modelFinding(
            "INVALID_APPROVAL_HISTORY",
            `${path}.approvalStatus`,
            "Approval status must equal the final audited history outcome.",
          ),
        );
      }
    }
    return validationResult(findings);
  }

  function blockerId(code, owner) {
    return `stage-blocker:${code}:${owner}`;
  }

  function createStageBlocker(
    code,
    severity,
    runId,
    stageSlug,
    owner,
    message,
    extra = {},
  ) {
    return {
      id: blockerId(code, owner),
      code,
      severity,
      runId,
      stageSlug,
      message,
      overrideable: extra.overrideable !== false,
      ...extra,
    };
  }

  function blockerFingerprint(blockingIds) {
    const normalized = Array.from(
      new Set(
        (Array.isArray(blockingIds) ? blockingIds : [])
          .map(String)
          .filter(Boolean),
      ),
    ).sort();
    return fingerprint(normalized);
  }

  function isCriticalIssueOpen(record) {
    if (
      !isObject(record) ||
      record.type !== "issue" ||
      record.priority !== "critical"
    ) {
      return false;
    }
    const closed = new Set([
      "closed",
      "resolved",
      "done",
      "verified",
      "dismissed",
    ]);
    return !closed.has(String(record.status || "open").toLowerCase());
  }

  function latestApprovalEntry(state, kind = null) {
    if (!state || !Array.isArray(state.approvalHistory)) return null;
    for (let index = state.approvalHistory.length - 1; index >= 0; index -= 1) {
      const entry = state.approvalHistory[index];
      if (isObject(entry) && (!kind || entry.kind === kind)) return entry;
    }
    return null;
  }

  function stageInputFingerprint(workspace, runId, stageSlug, stack = new Set()) {
    const located = locateStage(workspace, runId, stageSlug);
    if (!located.ok) return fingerprint({ runId, stageSlug, missing: true });
    const { run, stage } = located;
    const key = `${runId}::${stageSlug}`;
    if (stack.has(key)) return fingerprint({ key, cycle: true });
    const nextStack = new Set(stack);
    nextStack.add(key);
    const evidenceIds = new Set();
    for (const gate of Array.isArray(stage.gates) ? stage.gates : []) {
      const result = currentGateResult(gate);
      for (const id of Array.isArray(result && result.evidenceIds)
        ? result.evidenceIds
        : []) {
        evidenceIds.add(id);
      }
      for (const id of Array.isArray(
        result && result.waiver && result.waiver.evidenceIds,
      )
        ? result.waiver.evidenceIds
        : []) {
        evidenceIds.add(id);
      }
    }
    const evidence = Array.from(evidenceIds)
      .sort()
      .map((id) => {
        const resolved = resolveEvidenceReference(
          workspace,
          runId,
          stageSlug,
          id,
        );
        return resolved.ok
          ? { id, target: resolved.target, record: resolved.record }
          : { id, unresolved: true };
      });
    const issues = (Array.isArray(workspace.records) ? workspace.records : [])
      .filter(
        (record) =>
          isObject(record) &&
          record.runId === runId &&
          record.stageSlug === stageSlug &&
          record.type === "issue",
      )
      .map(clone);
    const predecessors =
      run.templateVersion === COMPANY_TEMPLATE_VERSION
        ? COMPANY_STAGE_DEPENDENCIES[stageSlug] || []
        : [];
    const predecessorState = predecessors.map((slug) => {
      const assessment = deriveStageAssessmentInternal(
        workspace,
        runId,
        slug,
        nextStack,
      );
      return {
        slug,
        accepted: assessment.accepted,
        acceptedWithOverride: assessment.acceptedWithOverride,
        qualityStatus: assessment.qualityStatus,
        approvalStatus: assessment.approvalStatus,
      };
    });
    return fingerprint({
      runId,
      stageSlug,
      executionStatus: stage.state && stage.state.executionStatus,
      gates: (Array.isArray(stage.gates) ? stage.gates : []).map((gate) => ({
        id: gate.id,
        definition: gate.definition,
        currentResult: currentGateResult(gate),
      })),
      evidence,
      issues,
      predecessors: predecessorState,
    });
  }

  function validateStageOverride(
    workspace,
    runId,
    stageSlug,
    override,
    currentOverrideableBlockers,
    path = "$.override",
  ) {
    const findings = [];
    if (!isObject(override)) {
      return validationResult([
        modelFinding(
          "INVALID_STAGE_OVERRIDE",
          path,
          "Stage Override must be an object.",
        ),
      ]);
    }
    for (const field of ["id", "decisionId", "reason", "approvedBy"]) {
      if (
        typeof override[field] !== "string" ||
        !override[field].trim()
      ) {
        findings.push(
          modelFinding(
            "INCOMPLETE_STAGE_OVERRIDE",
            `${path}.${field}`,
            `Override ${field} is required.`,
          ),
        );
      }
    }
    if (!isValidUpdatedAt(override.approvedAt)) {
      findings.push(
        modelFinding(
          "INCOMPLETE_STAGE_OVERRIDE",
          `${path}.approvedAt`,
          "Override approval time is required.",
        ),
      );
    }
    const evidence = validateEvidenceIds(
      workspace,
      runId,
      stageSlug,
      override.evidenceIds,
      `${path}.evidenceIds`,
    );
    findings.push(...evidence.findings);
    if (
      !Array.isArray(override.evidenceIds) ||
      override.evidenceIds.length === 0
    ) {
      findings.push(
        modelFinding(
          "INCOMPLETE_STAGE_OVERRIDE",
          `${path}.evidenceIds`,
          "Override requires at least one evidence reference.",
        ),
      );
    }
    if (!Array.isArray(override.blockingIds)) {
      findings.push(
        modelFinding(
          "INVALID_OVERRIDE_BLOCKERS",
          `${path}.blockingIds`,
          "Override blockingIds must be an array.",
        ),
      );
    } else {
      const normalized = Array.from(
        new Set(override.blockingIds.map(String).filter(Boolean)),
      ).sort();
      if (stableSerialize(normalized) !== stableSerialize(override.blockingIds)) {
        findings.push(
          modelFinding(
            "INVALID_OVERRIDE_BLOCKERS",
            `${path}.blockingIds`,
            "Override blockingIds must be unique and sorted.",
          ),
        );
      }
      if (override.blockerFingerprint !== blockerFingerprint(normalized)) {
        findings.push(
          modelFinding(
            "INVALID_OVERRIDE_FINGERPRINT",
            `${path}.blockerFingerprint`,
            "Override blocker fingerprint does not match its covered IDs.",
          ),
        );
      }
      if (override.status === "active") {
        const currentIds = currentOverrideableBlockers
          .map((blocker) => blocker.id)
          .sort();
        if (
          override.blockerFingerprint !== blockerFingerprint(currentIds) ||
          stableSerialize(override.blockingIds) !== stableSerialize(currentIds)
        ) {
          findings.push(
            modelFinding(
              "STALE_STAGE_OVERRIDE",
              path,
              "Override no longer matches the current blocker set.",
            ),
          );
        }
      }
    }
    if (!["active", "stale", "revoked"].includes(override.status)) {
      findings.push(
        modelFinding(
          "INVALID_OVERRIDE_STATUS",
          `${path}.status`,
          "Override status is unsupported.",
        ),
      );
    }
    if (
      override.expiresAt !== null &&
      override.expiresAt !== undefined &&
      !isValidUpdatedAt(override.expiresAt)
    ) {
      findings.push(
        modelFinding(
          "INVALID_OVERRIDE_EXPIRY",
          `${path}.expiresAt`,
          "Override expiry must be null or a valid timestamp.",
        ),
      );
    } else if (
      override.status === "active" &&
      isValidUpdatedAt(override.expiresAt) &&
      Date.parse(override.expiresAt) <= Date.now()
    ) {
      findings.push(
        modelFinding(
          "EXPIRED_STAGE_OVERRIDE",
          `${path}.expiresAt`,
          "Override has expired.",
        ),
      );
    }
    if (override.status === "revoked") {
      if (
        !isValidUpdatedAt(override.revokedAt) ||
        typeof override.revokedBy !== "string" ||
        !override.revokedBy.trim()
      ) {
        findings.push(
          modelFinding(
            "INVALID_OVERRIDE_REVOCATION",
            path,
            "Revoked Override requires revokedAt and revokedBy.",
          ),
        );
      }
    }
    return validationResult(findings);
  }

  function deriveStageAssessmentInternal(
    workspace,
    runId,
    stageSlug,
    stack = new Set(),
  ) {
    const located = locateStage(workspace, runId, stageSlug);
    if (!located.ok) {
      return {
        executionStatus: "not_started",
        qualityStatus: "pending",
        approvalStatus: "not_requested",
        accepted: false,
        acceptedWithOverride: false,
        gateSummary: {
          pending: 0,
          pass: 0,
          fail: 0,
          waived: 0,
          notApplicable: 0,
        },
        blockers: located.findings.map((finding) =>
          createStageBlocker(
            finding.code,
            "blocker",
            runId,
            stageSlug,
            stageSlug,
            finding.message,
            { overrideable: false },
          ),
        ),
        warnings: [],
        findings: located.findings,
        inputFingerprint: fingerprint({ runId, stageSlug, missing: true }),
      };
    }
    const { run, stage } = located;
    const state = isObject(stage.state) ? stage.state : {};
    const executionStatus = EXECUTION_STATUSES.includes(state.executionStatus)
      ? state.executionStatus
      : "not_started";
    const blockers = [];
    const warnings = [];
    const findings = [];
    const stateValidation = validateStageStateStructure(
      state,
      "$.state",
      executionBaselineFromStageStatus(stage.status),
    );
    findings.push(...stateValidation.findings);
    if (!stateValidation.ok) {
      blockers.push(
        createStageBlocker(
          "INVALID_STAGE_STATE",
          "blocker",
          runId,
          stageSlug,
          stageSlug,
          "Stage execution or approval history is structurally invalid.",
          {
            overrideable: false,
            findingCodes: stateValidation.errors.map((finding) => finding.code),
          },
        ),
      );
    }
    const gateSummary = {
      pending: 0,
      pass: 0,
      fail: 0,
      waived: 0,
      notApplicable: 0,
    };
    let hasFail = false;
    let hasPending = false;
    let hasWaiver = false;
    const gates = Array.isArray(stage.gates) ? stage.gates : [];
    if (!gates.length) hasPending = true;
    for (let gateIndex = 0; gateIndex < gates.length; gateIndex += 1) {
      const gate = gates[gateIndex];
      const gatePath = `$.runs[].stages[].gates[${gateIndex}]`;
      const history = validateGateHistory(
        workspace,
        runId,
        stageSlug,
        gate,
        gatePath,
      );
      findings.push(...history.findings);
      const current = history.current;
      const errors = history.findings.filter(
        (finding) => finding.severity !== "warning",
      );
      warnings.push(
        ...history.findings.filter(
          (finding) => finding.severity === "warning",
        ),
      );
      if (errors.length) {
        hasPending = true;
        blockers.push(
          createStageBlocker(
            "INVALID_GATE_RESULT",
            "blocker",
            runId,
            stageSlug,
            gate && gate.id ? gate.id : `gate-${gateIndex}`,
            `Gate ${gate && gate.label ? gate.label : gateIndex + 1} has an invalid definition or result.`,
            {
              gateId: gate && gate.id,
              overrideable: false,
              findingCodes: errors.map((finding) => finding.code),
            },
          ),
        );
        continue;
      }
      if (!current || current.status === "pending") {
        gateSummary.pending += 1;
        hasPending = true;
        blockers.push(
          createStageBlocker(
            "GATE_PENDING",
            gate.definition.severity,
            runId,
            stageSlug,
            gate.id,
            `Gate ${gate.definition.label} is pending.`,
            { gateId: gate.id },
          ),
        );
      } else if (current.status === "fail") {
        gateSummary.fail += 1;
        hasFail = true;
        blockers.push(
          createStageBlocker(
            "GATE_FAILED",
            gate.definition.severity,
            runId,
            stageSlug,
            gate.id,
            `Gate ${gate.definition.label} failed.`,
            { gateId: gate.id },
          ),
        );
      } else if (current.status === "waived") {
        gateSummary.waived += 1;
        hasWaiver = true;
        warnings.push(
          modelFinding(
            "GATE_WAIVED",
            gatePath,
            `Gate ${gate.definition.label} is accepted by Waiver.`,
            { severity: "warning", gateId: gate.id },
          ),
        );
      } else if (current.status === "not_applicable") {
        gateSummary.notApplicable += 1;
        warnings.push(
          modelFinding(
            "GATE_NOT_APPLICABLE",
            gatePath,
            `Gate ${gate.definition.label} is not applicable.`,
            { severity: "warning", gateId: gate.id },
          ),
        );
      } else {
        gateSummary.pass += 1;
      }
    }
    const criticalIssues = (Array.isArray(workspace.records)
      ? workspace.records
      : []
    ).filter(
      (record) =>
        isObject(record) &&
        record.runId === runId &&
        record.stageSlug === stageSlug &&
        isCriticalIssueOpen(record),
    );
    if (criticalIssues.length) {
      hasFail = true;
      for (const issue of criticalIssues) {
        blockers.push(
          createStageBlocker(
            "OPEN_CRITICAL_ISSUE",
            "critical",
            runId,
            stageSlug,
            issue.id,
            `Critical Issue ${issue.title || issue.id} is open.`,
            { recordId: issue.id },
          ),
        );
      }
    }
    const qualityStatus = hasFail
      ? "fail"
      : hasPending
        ? "pending"
        : hasWaiver
          ? "pass_with_waiver"
          : "pass";
    if (executionStatus !== "completed") {
      blockers.push(
        createStageBlocker(
          "EXECUTION_NOT_COMPLETE",
          "blocker",
          runId,
          stageSlug,
          stageSlug,
          "Stage execution is not completed.",
          { overrideable: false },
        ),
      );
    }
    const key = `${runId}::${stageSlug}`;
    const nextStack = new Set(stack);
    nextStack.add(key);
    if (!stack.has(key) && run.templateVersion === COMPANY_TEMPLATE_VERSION) {
      for (const predecessorSlug of COMPANY_STAGE_DEPENDENCIES[stageSlug] || []) {
        const predecessor = deriveStageAssessmentInternal(
          workspace,
          runId,
          predecessorSlug,
          nextStack,
        );
        if (!predecessor.accepted) {
          blockers.push(
            createStageBlocker(
              "PREDECESSOR_NOT_ACCEPTED",
              "blocker",
              runId,
              stageSlug,
              predecessorSlug,
              `Predecessor ${predecessorSlug} is not accepted.`,
              { predecessorSlug },
            ),
          );
        } else if (predecessor.acceptedWithOverride) {
          warnings.push(
            modelFinding(
              "INHERITED_OVERRIDE_RISK",
              "$.stage",
              `Predecessor ${predecessorSlug} was accepted with Override.`,
              { severity: "warning", predecessorSlug },
            ),
          );
        }
      }
    }
    const businessBlockers = blockers.filter(
      (blocker) => blocker.code !== "APPROVAL_NOT_GRANTED",
    );
    const overrideableBlockers = businessBlockers.filter(
      (blocker) => blocker.overrideable,
    );
    const unoverrideableBlockers = businessBlockers.filter(
      (blocker) => !blocker.overrideable,
    );
    const inputFingerprint = stageInputFingerprintBase(
      workspace,
      run,
      stage,
      warnings,
    );
    let approvalStatus = APPROVAL_STATUSES.includes(state.approvalStatus)
      ? state.approvalStatus
      : "not_requested";
    let accepted = false;
    let acceptedWithOverride = false;
    if (approvalStatus === "approved") {
      const decision = latestApprovalEntry(state, "decision");
      const current =
        stateValidation.ok &&
        decision &&
        decision.outcome === "approved" &&
        decision.inputFingerprint === inputFingerprint;
      if (
        current &&
        executionStatus === "completed" &&
        ["pass", "pass_with_waiver"].includes(qualityStatus) &&
        businessBlockers.length === 0
      ) {
        accepted = true;
      } else {
        approvalStatus = "stale";
      }
    } else if (approvalStatus === "approved_with_override") {
      const activeOverrides = Array.isArray(state.overrides)
        ? state.overrides.filter((override) => override && override.status === "active")
        : [];
      const override = activeOverrides[activeOverrides.length - 1];
      const validated = validateStageOverride(
        workspace,
        runId,
        stageSlug,
        override,
        overrideableBlockers,
      );
      const overrideDecision = matchingOverrideDecision(state, override);
      findings.push(...validated.findings);
      if (
        stateValidation.ok &&
        override &&
        overrideDecision &&
        overrideDecision.inputFingerprint === inputFingerprint &&
        validated.ok &&
        executionStatus === "completed" &&
        unoverrideableBlockers.length === 0
      ) {
        accepted = true;
        acceptedWithOverride = true;
      } else {
        approvalStatus = "stale";
      }
    } else if (approvalStatus === "pending") {
      const request = latestApprovalEntry(state, "request");
      if (
        !stateValidation.ok ||
        !request ||
        request.inputFingerprint !== inputFingerprint
      ) {
        approvalStatus = "stale";
      }
    }
    if (!accepted) {
      blockers.push(
        createStageBlocker(
          approvalStatus === "stale"
            ? "APPROVAL_STALE"
            : "APPROVAL_NOT_GRANTED",
          "warning",
          runId,
          stageSlug,
          stageSlug,
          approvalStatus === "stale"
            ? "Stage approval is stale."
            : "Stage approval has not been granted.",
          { overrideable: false },
        ),
      );
    }
    return {
      executionStatus,
      qualityStatus,
      approvalStatus,
      accepted,
      acceptedWithOverride,
      gateSummary,
      blockers,
      warnings,
      findings,
      inputFingerprint,
    };
  }

  function stageInputFingerprintBase(workspace, run, stage, warnings = []) {
    const runId = run.id;
    const stageSlug = stage.slug;
    const evidenceIds = new Set();
    for (const gate of Array.isArray(stage.gates) ? stage.gates : []) {
      const result = currentGateResult(gate);
      for (const id of Array.isArray(result && result.evidenceIds)
        ? result.evidenceIds
        : []) {
        evidenceIds.add(id);
      }
      for (const id of Array.isArray(
        result && result.waiver && result.waiver.evidenceIds,
      )
        ? result.waiver.evidenceIds
        : []) {
        evidenceIds.add(id);
      }
    }
    const evidence = Array.from(evidenceIds)
      .sort()
      .map((id) => {
        const resolved = resolveEvidenceReference(
          workspace,
          runId,
          stageSlug,
          id,
        );
        return resolved.ok
          ? { id, target: resolved.target, record: resolved.record }
          : { id, unresolved: true };
      });
    const issues = (Array.isArray(workspace.records) ? workspace.records : [])
      .filter(
        (record) =>
          isObject(record) &&
          record.runId === runId &&
          record.stageSlug === stageSlug &&
          record.type === "issue",
      )
      .map(clone);
    const predecessorWarnings = warnings
      .filter((warning) => warning.code === "INHERITED_OVERRIDE_RISK")
      .map((warning) => warning.predecessorSlug)
      .sort();
    const predecessorStates =
      run.templateVersion === COMPANY_TEMPLATE_VERSION
        ? (COMPANY_STAGE_DEPENDENCIES[stageSlug] || []).map((slug) => {
            const predecessor = (run.stages || []).find(
              (item) => item && item.slug === slug,
            );
            return {
              slug,
              state: predecessor && predecessor.state,
              gates: predecessor && predecessor.gates,
            };
          })
        : [];
    return fingerprint({
      runId,
      stageSlug,
      executionStatus: stage.state && stage.state.executionStatus,
      gates: (Array.isArray(stage.gates) ? stage.gates : []).map((gate) => ({
        id: gate.id,
        definition: gate.definition,
        currentResult: currentGateResult(gate),
      })),
      evidence,
      issues,
      predecessorStates,
      predecessorWarnings,
    });
  }

  function deriveStageAssessment(workspace, runId, stageSlug) {
    return deriveStageAssessmentInternal(workspace, runId, stageSlug);
  }

  function validateWorkspaceV3Candidate(candidate, report) {
    if (!isObject(candidate) || candidate.schemaVersion !== SCHEMA_VERSION) {
      addBlocking(
        report,
        "INVALID_SCHEMA_VERSION",
        "$.schemaVersion",
        null,
        "Schema-v3 candidate must have schemaVersion 3.",
      );
      return;
    }
    validateV2CollectionShapes(candidate, report);
    validateCandidateIdentities(candidate, report);
    validateCanonicalCandidate(candidate, report);
    validateV2ActiveStructures(candidate, report);
    const ownership = candidateOwnershipSets(candidate);
    validateCandidateRelationships(
      candidate,
      report,
      ownership.runIds,
      ownership.stageKeys,
    );
    const globalResultPaths = new Map();
    const runs = Array.isArray(candidate.runs) ? candidate.runs : [];
    for (let runIndex = 0; runIndex < runs.length; runIndex += 1) {
      const run = runs[runIndex];
      if (!isObject(run) || !Array.isArray(run.stages)) continue;
      for (let stageIndex = 0; stageIndex < run.stages.length; stageIndex += 1) {
        const stage = run.stages[stageIndex];
        if (!isObject(stage)) continue;
        const stagePath = `$.runs[${runIndex}].stages[${stageIndex}]`;
        const state = validateStageStateStructure(
          stage.state,
          `${stagePath}.state`,
          executionBaselineFromStageStatus(stage.status),
        );
        for (const finding of state.findings) {
          addBlocking(
            report,
            finding.code,
            finding.path,
            `${run.id}::${stage.slug}`,
            finding.message,
          );
        }
        const gates = Array.isArray(stage.gates) ? stage.gates : [];
        for (let gateIndex = 0; gateIndex < gates.length; gateIndex += 1) {
          const gate = gates[gateIndex];
          const gatePath = `${stagePath}.gates[${gateIndex}]`;
          const history = validateGateHistory(
            candidate,
            run.id,
            stage.slug,
            gate,
            gatePath,
          );
          for (const finding of history.findings) {
            if (finding.severity === "warning") {
              addWarning(report, finding.code, finding.path, finding.message);
            } else {
              addBlocking(
                report,
                finding.code,
                finding.path,
                `${run.id}::${stage.slug}::${gate && gate.id}`,
                finding.message,
              );
            }
          }
          for (let resultIndex = 0; resultIndex < (gate.results || []).length; resultIndex += 1) {
            const result = gate.results[resultIndex];
            if (!isObject(result) || !canonicalIdentity(result.id)) continue;
            const paths = globalResultPaths.get(result.id) || [];
            paths.push(`${gatePath}.results[${resultIndex}]`);
            globalResultPaths.set(result.id, paths);
          }
        }
        if (isObject(stage.state)) {
          const assessment = deriveStageAssessment(candidate, run.id, stage.slug);
          if (stage.state.qualityStatus !== assessment.qualityStatus) {
            addBlocking(
              report,
              "FORGED_QUALITY_STATUS",
              `${stagePath}.state.qualityStatus`,
              `${run.id}::${stage.slug}`,
              "Stored quality status does not match derived Gate and Issue state.",
            );
          }
          if (
            ["approved", "approved_with_override"].includes(
              stage.state.approvalStatus,
            ) &&
            !assessment.accepted
          ) {
            addBlocking(
              report,
              "FORGED_OR_STALE_APPROVAL",
              `${stagePath}.state.approvalStatus`,
              `${run.id}::${stage.slug}`,
              "Stored approval is not supported by current evidence and blockers.",
            );
          }
          if (
            stage.state.approvalStatus === "pending" &&
            assessment.approvalStatus === "stale"
          ) {
            addBlocking(
              report,
              "STALE_APPROVAL",
              `${stagePath}.state.approvalStatus`,
              `${run.id}::${stage.slug}`,
              "Pending approval no longer matches current Stage inputs.",
            );
          }
          const currentBusinessBlockers = assessment.blockers.filter(
            (blocker) =>
              !["APPROVAL_NOT_GRANTED", "APPROVAL_STALE"].includes(blocker.code),
          );
          const overrideable = currentBusinessBlockers.filter(
            (blocker) => blocker.overrideable,
          );
          const overrides = Array.isArray(stage.state.overrides)
            ? stage.state.overrides
            : [];
          for (
            let overrideIndex = 0;
            overrideIndex < overrides.length;
            overrideIndex += 1
          ) {
            const override = overrides[overrideIndex];
            const checked = validateStageOverride(
              candidate,
              run.id,
              stage.slug,
              override,
              overrideable,
              `${stagePath}.state.overrides[${overrideIndex}]`,
            );
            for (const finding of checked.findings) {
              addBlocking(
                report,
                finding.code,
                finding.path,
                override && override.id,
                finding.message,
              );
            }
          }
        }
      }
    }
    for (const [resultId, paths] of globalResultPaths) {
      if (paths.length < 2) continue;
      addBlocking(
        report,
        "DUPLICATE_GATE_RESULT_ID",
        paths[0],
        resultId,
        `Gate result ID ${resultId} is duplicated across the workspace.`,
        paths,
      );
    }
  }

  function inspectWorkspaceV3(source, report) {
    const candidate = clone(source);
    if (isObject(candidate.legacy)) {
      reapplyPreservedWorkspaceBlocks(candidate.legacy, report);
    }
    buildExactConservationLedger(candidate, report);
    validateWorkspaceV3Candidate(candidate, report);
    return candidate;
  }

  function operationFailure(workspace, findings) {
    return {
      ok: false,
      workspace,
      findings,
      changedIds: [],
    };
  }

  function operationSuccess(workspace, changedIds, findings = []) {
    return {
      ok: true,
      workspace,
      findings,
      changedIds,
    };
  }

  function operationWorkspace(workspace) {
    if (!isObject(workspace) || workspace.schemaVersion !== SCHEMA_VERSION) {
      return operationFailure(workspace, [
        modelFinding(
          "SCHEMA_V3_REQUIRED",
          "$.schemaVersion",
          "State operations require an already migrated schema-v3 workspace.",
        ),
      ]);
    }
    const inspected = previewWorkspaceImport(workspace);
    if (!inspected.report.safe) {
      return operationFailure(
        workspace,
        inspected.report.blockingErrors.map((finding) =>
          modelFinding(
            finding.code,
            finding.path,
            finding.message,
            { identity: finding.identity },
          ),
        ),
      );
    }
    return operationSuccess(inspected.candidate, []);
  }

  function operationWorkspaceForOverrideRevocation(workspace, options) {
    if (!isObject(workspace) || workspace.schemaVersion !== SCHEMA_VERSION) {
      return operationFailure(workspace, [
        modelFinding(
          "SCHEMA_V3_REQUIRED",
          "$.schemaVersion",
          "State operations require an already migrated schema-v3 workspace.",
        ),
      ]);
    }
    const inspected = previewWorkspaceImport(workspace);
    if (inspected.report.safe) return operationSuccess(inspected.candidate, []);
    const located = locateStage(
      inspected.candidate,
      options.runId,
      options.stageSlug,
    );
    if (!located.ok) return operationFailure(workspace, located.findings);
    const { run, stage } = located;
    const matches = (Array.isArray(stage.state && stage.state.overrides)
      ? stage.state.overrides
      : []
    ).filter((override) => override && override.id === options.overrideId);
    const target = matches.length === 1 ? matches[0] : null;
    const linkedDecision = matchingOverrideDecision(stage.state, target);
    if (
      !target ||
      target.status !== "active" ||
      stage.state.approvalStatus !== "approved_with_override" ||
      !linkedDecision
    ) {
      return operationFailure(workspace, [
        modelFinding(
          "INVALID_OVERRIDE_REVOCATION",
          "$.overrideId",
          "Recovery revocation requires one active Override with its exact approval decision.",
        ),
      ]);
    }
    const stageIdentity = `${run.id}::${stage.slug}`;
    const recoverable = inspected.report.blockingErrors.every((finding) => {
      if (
        ["EXPIRED_STAGE_OVERRIDE", "STALE_STAGE_OVERRIDE"].includes(
          finding.code,
        )
      ) {
        return finding.identity === target.id;
      }
      return (
        finding.code === "FORGED_OR_STALE_APPROVAL" &&
        finding.identity === stageIdentity
      );
    });
    if (!recoverable) {
      return operationFailure(
        workspace,
        inspected.report.blockingErrors.map((finding) =>
          modelFinding(finding.code, finding.path, finding.message, {
            identity: finding.identity,
          }),
        ),
      );
    }
    return operationSuccess(inspected.candidate, []);
  }

  function ensureEditableRun(workspace, runId, stageSlug, gateId = null) {
    const located =
      gateId === null
        ? locateStage(workspace, runId, stageSlug)
        : locateGate(workspace, runId, stageSlug, gateId);
    if (!located.ok) return located;
    if (located.run.templateVersion !== COMPANY_TEMPLATE_VERSION) {
      return validationResult([
        modelFinding(
          "RUN_READ_ONLY",
          "$.runs[].templateVersion",
          "Only company-ppt-v1 Runs are editable in Batch 2.",
        ),
      ]);
    }
    return located;
  }

  function markApprovalStale(stage, reason, at) {
    if (!isObject(stage.state)) return [];
    const changed = [];
    if (
      ["pending", "approved", "approved_with_override"].includes(
        stage.state.approvalStatus,
      )
    ) {
      stage.state.approvalStatus = "stale";
      const entry = {
        id: uid("approval-stale"),
        kind: "stale",
        actor: "system",
        at,
        reason,
        outcome: "stale",
        inputFingerprint: null,
        blockerFingerprint: null,
      };
      stage.state.approvalHistory.push(entry);
      changed.push(entry.id);
    }
    for (const override of Array.isArray(stage.state.overrides)
      ? stage.state.overrides
      : []) {
      if (override && override.status === "active") {
        override.status = "stale";
        changed.push(override.id);
      }
    }
    return changed;
  }

  function staleDownstreamApprovals(run, changedStageSlug, reason, at) {
    const changed = [];
    if (!run || run.templateVersion !== COMPANY_TEMPLATE_VERSION) return changed;
    const queue = [changedStageSlug];
    const visited = new Set();
    while (queue.length) {
      const source = queue.shift();
      for (const [slug, predecessors] of Object.entries(
        COMPANY_STAGE_DEPENDENCIES,
      )) {
        if (!predecessors.includes(source) || visited.has(slug)) continue;
        visited.add(slug);
        queue.push(slug);
        const stage = (run.stages || []).find((item) => item && item.slug === slug);
        if (stage) changed.push(...markApprovalStale(stage, reason, at));
      }
    }
    return changed;
  }

  function updateStageDerivedSnapshot(workspace, runId, stageSlug, at) {
    const located = locateStage(workspace, runId, stageSlug);
    if (!located.ok || !isObject(located.stage.state)) return null;
    const assessment = deriveStageAssessment(workspace, runId, stageSlug);
    located.stage.state.qualityStatus = assessment.qualityStatus;
    located.stage.state.evaluatedAt = at;
    return assessment;
  }

  function currentStageEvidenceReferences(stage) {
    const references = new Set();
    for (const gate of Array.isArray(stage && stage.gates) ? stage.gates : []) {
      const result = currentGateResult(gate);
      for (const reference of Array.isArray(result && result.evidenceIds)
        ? result.evidenceIds
        : []) {
        references.add(reference);
      }
      for (const reference of Array.isArray(
        result &&
          result.status === "waived" &&
          result.waiver &&
          result.waiver.evidenceIds,
      )
        ? result.waiver.evidenceIds
        : []) {
        references.add(reference);
      }
    }
    for (const override of Array.isArray(stage && stage.state && stage.state.overrides)
      ? stage.state.overrides
      : []) {
      if (!override || override.status !== "active") continue;
      for (const reference of Array.isArray(override.evidenceIds)
        ? override.evidenceIds
        : []) {
        references.add(reference);
      }
    }
    return Array.from(references).sort();
  }

  function currentStageEvidenceFingerprint(workspace, runId, stage) {
    return fingerprint(
      currentStageEvidenceReferences(stage).map((reference) => {
        const resolved = resolveEvidenceReference(
          workspace,
          runId,
          stage.slug,
          reference,
        );
        return resolved.ok
          ? {
              reference,
              target: resolved.target,
              record: resolved.record,
            }
          : {
              reference,
              unresolved: resolved.findings.map((finding) => finding.code),
            };
      }),
    );
  }

  function downstreamStageSlugs(run, sourceSlug) {
    if (!run || run.templateVersion !== COMPANY_TEMPLATE_VERSION) return [];
    const output = [];
    const visited = new Set();
    const queue = [sourceSlug];
    while (queue.length) {
      const source = queue.shift();
      for (const [slug, predecessors] of Object.entries(
        COMPANY_STAGE_DEPENDENCIES,
      )) {
        if (!predecessors.includes(source) || visited.has(slug)) continue;
        visited.add(slug);
        output.push(slug);
        queue.push(slug);
      }
    }
    return output;
  }

  function changedEvidenceEntityIds(previousWorkspace, candidateWorkspace) {
    const changed = new Set();
    for (const collection of ["records", "attachments"]) {
      const before = new Map(
        (Array.isArray(previousWorkspace[collection])
          ? previousWorkspace[collection]
          : []
        )
          .filter((item) => isObject(item) && canonicalIdentity(item.id))
          .map((item) => [item.id, item]),
      );
      const after = new Map(
        (Array.isArray(candidateWorkspace[collection])
          ? candidateWorkspace[collection]
          : []
        )
          .filter((item) => isObject(item) && canonicalIdentity(item.id))
          .map((item) => [item.id, item]),
      );
      for (const id of new Set([...before.keys(), ...after.keys()])) {
        if (stableSerialize(before.get(id)) !== stableSerialize(after.get(id))) {
          changed.add(`${collection.slice(0, -1)}:${id}`);
        }
      }
    }
    return Array.from(changed).sort();
  }

  function nonEvidenceWorkspaceProjection(workspace) {
    if (!isObject(workspace)) return workspace;
    const projection = {};
    for (const key of Object.keys(workspace)) {
      if (key === "records" || key === "attachments") continue;
      projection[key] = workspace[key];
    }
    return projection;
  }

  function reconcileEvidenceMutation(
    previousWorkspace,
    candidateWorkspace,
    options = {},
  ) {
    const ready = operationWorkspace(previousWorkspace);
    if (!ready.ok) return ready;
    if (
      !isObject(candidateWorkspace) ||
      candidateWorkspace.schemaVersion !== SCHEMA_VERSION ||
      candidateWorkspace.workspaceId !== ready.workspace.workspaceId
    ) {
      return operationFailure(previousWorkspace, [
        modelFinding(
          "INVALID_EVIDENCE_MUTATION",
          "$",
          "Evidence reconciliation requires a schema-v3 candidate for the same Workspace.",
        ),
      ]);
    }
    if (
      stableSerialize(nonEvidenceWorkspaceProjection(previousWorkspace)) !==
      stableSerialize(nonEvidenceWorkspaceProjection(candidateWorkspace))
    ) {
      return operationFailure(previousWorkspace, [
        modelFinding(
          "EVIDENCE_MUTATION_SCOPE_VIOLATION",
          "$",
          "Evidence reconciliation may change only Record and Attachment collections.",
        ),
      ]);
    }
    const previous = ready.workspace;
    const candidate = clone(candidateWorkspace);
    const referenceFindings = [];
    for (const run of Array.isArray(previous.runs) ? previous.runs : []) {
      for (const stage of Array.isArray(run && run.stages) ? run.stages : []) {
        for (const reference of currentStageEvidenceReferences(stage)) {
          const resolved = resolveEvidenceReference(
            candidate,
            run.id,
            stage.slug,
            reference,
          );
          if (!resolved.ok) {
            referenceFindings.push(
              modelFinding(
                "CURRENT_EVIDENCE_REFERENCE_REMOVED",
                "$.records",
                `Current Stage evidence ${reference} cannot be deleted, moved, or orphaned.`,
                {
                  runId: run.id,
                  stageSlug: stage.slug,
                  reference,
                  causes: resolved.findings.map((finding) => finding.code),
                },
              ),
            );
          }
        }
      }
    }
    if (referenceFindings.length) {
      return operationFailure(previousWorkspace, referenceFindings);
    }

    const timestamp = isValidUpdatedAt(options.at) ? options.at : now();
    const reason =
      typeof options.reason === "string" && options.reason.trim()
        ? options.reason.trim()
        : "Evidence or Issue inputs changed.";
    const directlyAffected = [];
    try {
      for (const previousRun of Array.isArray(previous.runs)
        ? previous.runs
        : []) {
        const candidateRuns = (Array.isArray(candidate.runs)
          ? candidate.runs
          : []
        ).filter((run) => isObject(run) && run.id === previousRun.id);
        if (candidateRuns.length !== 1) continue;
        const candidateRun = candidateRuns[0];
        for (const previousStage of Array.isArray(previousRun.stages)
          ? previousRun.stages
          : []) {
          const candidateStages = (Array.isArray(candidateRun.stages)
            ? candidateRun.stages
            : []
          ).filter(
            (stage) => isObject(stage) && stage.slug === previousStage.slug,
          );
          if (candidateStages.length !== 1) continue;
          const beforeFingerprint = deriveStageAssessment(
            previous,
            previousRun.id,
            previousStage.slug,
          ).inputFingerprint;
          const afterFingerprint = deriveStageAssessment(
            candidate,
            candidateRun.id,
            candidateStages[0].slug,
          ).inputFingerprint;
          const beforeEvidenceFingerprint = currentStageEvidenceFingerprint(
            previous,
            previousRun.id,
            previousStage,
          );
          const afterEvidenceFingerprint = currentStageEvidenceFingerprint(
            candidate,
            candidateRun.id,
            candidateStages[0],
          );
          if (
            beforeFingerprint !== afterFingerprint ||
            beforeEvidenceFingerprint !== afterEvidenceFingerprint
          ) {
            directlyAffected.push({
              run: candidateRun,
              stage: candidateStages[0],
            });
          }
        }
      }
    } catch (error) {
      return operationFailure(previousWorkspace, [
        modelFinding(
          "INVALID_EVIDENCE_MUTATION",
          "$",
          `Evidence candidate could not be assessed: ${String(
            error && error.message ? error.message : error,
          )}`,
        ),
      ]);
    }

    const changedIds = new Set(
      changedEvidenceEntityIds(previous, candidate),
    );
    const touchedStages = new Map();
    for (const { run, stage } of directlyAffected) {
      const key = `${run.id}::${stage.slug}`;
      touchedStages.set(key, { run, stage });
      changedIds.add(key);
      for (const id of markApprovalStale(stage, reason, timestamp)) {
        changedIds.add(id);
      }
      for (const id of staleDownstreamApprovals(
        run,
        stage.slug,
        `Upstream ${stage.slug}: ${reason}`,
        timestamp,
      )) {
        changedIds.add(id);
      }
      for (const slug of downstreamStageSlugs(run, stage.slug)) {
        const downstream = (run.stages || []).find(
          (item) => item && item.slug === slug,
        );
        if (downstream) {
          touchedStages.set(`${run.id}::${slug}`, {
            run,
            stage: downstream,
          });
        }
      }
    }
    for (const [key, { run, stage }] of touchedStages) {
      updateStageDerivedSnapshot(candidate, run.id, stage.slug, timestamp);
      run.updatedAt = timestamp;
      changedIds.add(key);
    }
    candidate.updatedAt = timestamp;
    return validateOperationCandidate(
      candidate,
      previousWorkspace,
      Array.from(changedIds),
    );
  }

  function validateOperationCandidate(candidate, original, changedIds) {
    const preview = previewWorkspaceImport(candidate);
    if (!preview.report.safe) {
      return operationFailure(
        original,
        preview.report.blockingErrors.map((finding) =>
          modelFinding(
            finding.code,
            finding.path,
            finding.message,
            { identity: finding.identity },
          ),
        ),
      );
    }
    return operationSuccess(preview.candidate, changedIds);
  }

  function transitionGateResult(workspace, options = {}) {
    const ready = operationWorkspace(workspace);
    if (!ready.ok) return ready;
    const candidate = ready.workspace;
    const proposal = isObject(options.proposal) ? options.proposal : options;
    const located = ensureEditableRun(
      candidate,
      options.runId,
      options.stageSlug,
      options.gateId,
    );
    if (!located.ok) return operationFailure(workspace, located.findings);
    const { run, stage, gate } = located;
    const current = currentGateResult(gate);
    if (!current) {
      return operationFailure(workspace, [
        modelFinding(
          "INVALID_CURRENT_GATE_RESULT",
          "$.currentResultId",
          "Gate has no current result to supersede.",
        ),
      ]);
    }
    const timestamp = isValidUpdatedAt(proposal.createdAt)
      ? proposal.createdAt
      : now();
    const revision =
      Math.max(...gate.results.map((result) => Number(result.revision) || 0)) + 1;
    const checkedBy = String(proposal.checkedBy || "").trim();
    const reviewedBy = String(proposal.reviewedBy || "").trim();
    const result = {
      id:
        canonicalIdentity(proposal.id) ||
        gateResultId(run.id, stage.slug, gate.id, revision),
      revision,
      definitionId: gate.definition.id,
      ruleVersion: gate.definition.ruleVersion,
      status: proposal.status || "pending",
      actual: hasOwn(proposal, "actual") ? clone(proposal.actual) : null,
      mode: String(proposal.mode || ""),
      corner: String(proposal.corner || ""),
      scenario: String(proposal.scenario || ""),
      evidenceIds: Array.isArray(proposal.evidenceIds)
        ? proposal.evidenceIds.map(String)
        : [],
      checkedBy,
      checkedAt:
        proposal.checkedAt === null
          ? null
          : isValidUpdatedAt(proposal.checkedAt)
            ? proposal.checkedAt
            : checkedBy
              ? timestamp
              : null,
      reviewedBy,
      reviewedAt:
        proposal.reviewedAt === null
          ? null
          : isValidUpdatedAt(proposal.reviewedAt)
            ? proposal.reviewedAt
            : reviewedBy
              ? timestamp
              : null,
      notApplicableReason: String(proposal.notApplicableReason || ""),
      waiver: proposal.status === "waived" ? clone(proposal.waiver) : null,
      origin: "native-v3",
      legacyDone:
        current.legacyDone === null ? null : Boolean(current.legacyDone),
      createdAt: timestamp,
      supersedesId: current.id,
    };
    if (isObject(result.waiver)) {
      if (!hasOwn(result.waiver, "expiresAt")) result.waiver.expiresAt = null;
      if (!hasOwn(result.waiver, "revokedAt")) result.waiver.revokedAt = null;
      if (!hasOwn(result.waiver, "revokedBy")) result.waiver.revokedBy = null;
      if (!hasOwn(result.waiver, "ruleVersion")) {
        result.waiver.ruleVersion = gate.definition.ruleVersion;
      }
    }
    const validated = validateGateResult(
      candidate,
      run.id,
      stage.slug,
      gate,
      result,
    );
    if (!validated.ok) return operationFailure(workspace, validated.findings);
    if (gate.results.some((item) => item.id === result.id)) {
      return operationFailure(workspace, [
        modelFinding(
          "DUPLICATE_GATE_RESULT_ID",
          "$.result.id",
          "The proposed Gate result ID already exists.",
        ),
      ]);
    }
    gate.results.push(result);
    gate.currentResultId = result.id;
    const changedIds = [result.id, gate.id];
    changedIds.push(
      ...markApprovalStale(stage, "Gate result changed.", timestamp),
      ...staleDownstreamApprovals(
        run,
        stage.slug,
        `Predecessor ${stage.slug} Gate result changed.`,
        timestamp,
      ),
    );
    updateStageDerivedSnapshot(candidate, run.id, stage.slug, timestamp);
    candidate.updatedAt = timestamp;
    run.updatedAt = timestamp;
    return validateOperationCandidate(candidate, workspace, changedIds);
  }

  function transitionStageExecution(workspace, options = {}) {
    const ready = operationWorkspace(workspace);
    if (!ready.ok) return ready;
    const candidate = ready.workspace;
    const located = ensureEditableRun(
      candidate,
      options.runId,
      options.stageSlug,
    );
    if (!located.ok) return operationFailure(workspace, located.findings);
    const { run, stage } = located;
    const from = stage.state.executionStatus;
    const to = options.targetStatus;
    if (
      !EXECUTION_STATUSES.includes(to) ||
      !(EXECUTION_TRANSITIONS[from] || []).includes(to)
    ) {
      return operationFailure(workspace, [
        modelFinding(
          "INVALID_EXECUTION_TRANSITION",
          "$.targetStatus",
          `Execution cannot transition from ${String(from)} to ${String(to)}.`,
        ),
      ]);
    }
    const actor = String(options.actor || "").trim();
    const reason = String(options.reason || "").trim();
    if (from === "completed" && to === "in_progress" && (!actor || !reason)) {
      return operationFailure(workspace, [
        modelFinding(
          "REOPEN_AUDIT_REQUIRED",
          "$.actor",
          "Reopening completed execution requires actor and reason.",
        ),
      ]);
    }
    const timestamp = isValidUpdatedAt(options.at) ? options.at : now();
    const history = {
      id: canonicalIdentity(options.id) || uid("execution"),
      from,
      to,
      actor,
      reason,
      at: timestamp,
    };
    stage.state.executionStatus = to;
    stage.state.executionHistory.push(history);
    const changedIds = [`${run.id}::${stage.slug}`];
    changedIds.push(
      ...markApprovalStale(stage, "Execution status changed.", timestamp),
      ...staleDownstreamApprovals(
        run,
        stage.slug,
        `Predecessor ${stage.slug} execution changed.`,
        timestamp,
      ),
    );
    updateStageDerivedSnapshot(candidate, run.id, stage.slug, timestamp);
    candidate.updatedAt = timestamp;
    run.updatedAt = timestamp;
    return validateOperationCandidate(candidate, workspace, changedIds);
  }

  function approvalBlockingItems(assessment) {
    return assessment.blockers.filter(
      (blocker) =>
        !["APPROVAL_NOT_GRANTED", "APPROVAL_STALE"].includes(blocker.code),
    );
  }

  function requestStageApproval(workspace, options = {}) {
    const ready = operationWorkspace(workspace);
    if (!ready.ok) return ready;
    const candidate = ready.workspace;
    const located = ensureEditableRun(
      candidate,
      options.runId,
      options.stageSlug,
    );
    if (!located.ok) return operationFailure(workspace, located.findings);
    const { run, stage } = located;
    const requester = String(options.requester || options.actor || "").trim();
    if (!requester) {
      return operationFailure(workspace, [
        modelFinding(
          "APPROVAL_REQUESTER_REQUIRED",
          "$.requester",
          "Approval request requires requester identity.",
        ),
      ]);
    }
    const assessment = deriveStageAssessment(
      candidate,
      run.id,
      stage.slug,
    );
    const blockers = approvalBlockingItems(assessment);
    if (blockers.length) {
      return operationFailure(
        workspace,
        blockers.map((blocker) =>
          modelFinding(blocker.code, "$.stage", blocker.message, { blocker }),
        ),
      );
    }
    const timestamp = isValidUpdatedAt(options.requestedAt)
      ? options.requestedAt
      : now();
    const entry = {
      id: canonicalIdentity(options.id) || uid("approval-request"),
      kind: "request",
      actor: requester,
      at: timestamp,
      reason: String(options.reason || ""),
      outcome: "pending",
      inputFingerprint: assessment.inputFingerprint,
      blockerFingerprint: blockerFingerprint([]),
    };
    if (stage.state.approvalHistory.some((item) => item.id === entry.id)) {
      return operationFailure(workspace, [
        modelFinding(
          "DUPLICATE_APPROVAL_HISTORY_ID",
          "$.id",
          "Approval history ID already exists.",
        ),
      ]);
    }
    stage.state.approvalHistory.push(entry);
    stage.state.approvalStatus = "pending";
    stage.state.evaluatedAt = timestamp;
    candidate.updatedAt = timestamp;
    run.updatedAt = timestamp;
    return validateOperationCandidate(candidate, workspace, [
      entry.id,
      `${run.id}::${stage.slug}`,
    ]);
  }

  function decideStageApproval(workspace, options = {}) {
    const ready = operationWorkspace(workspace);
    if (!ready.ok) return ready;
    const candidate = ready.workspace;
    const located = ensureEditableRun(
      candidate,
      options.runId,
      options.stageSlug,
    );
    if (!located.ok) return operationFailure(workspace, located.findings);
    const { run, stage } = located;
    if (stage.state.approvalStatus !== "pending") {
      return operationFailure(workspace, [
        modelFinding(
          "APPROVAL_REQUEST_REQUIRED",
          "$.stage.state.approvalStatus",
          "Approval decision requires a current pending request.",
        ),
      ]);
    }
    const decision = options.decision;
    if (!["approved", "rejected"].includes(decision)) {
      return operationFailure(workspace, [
        modelFinding(
          "INVALID_APPROVAL_DECISION",
          "$.decision",
          "Decision must be approved or rejected.",
        ),
      ]);
    }
    const approver = String(options.approver || options.actor || "").trim();
    const reason = String(options.reason || "").trim();
    if (!approver || (decision === "rejected" && !reason)) {
      return operationFailure(workspace, [
        modelFinding(
          "APPROVAL_DECISION_AUDIT_REQUIRED",
          "$.approver",
          "Decision requires approver identity; rejection also requires reason.",
        ),
      ]);
    }
    const assessment = deriveStageAssessment(
      candidate,
      run.id,
      stage.slug,
    );
    const blockers = approvalBlockingItems(assessment);
    if (decision === "approved" && blockers.length) {
      return operationFailure(
        workspace,
        blockers.map((blocker) =>
          modelFinding(blocker.code, "$.stage", blocker.message, { blocker }),
        ),
      );
    }
    const timestamp = isValidUpdatedAt(options.decidedAt)
      ? options.decidedAt
      : now();
    const entry = {
      id: canonicalIdentity(options.id) || uid("approval-decision"),
      kind: "decision",
      actor: approver,
      at: timestamp,
      reason,
      outcome: decision,
      inputFingerprint: assessment.inputFingerprint,
      blockerFingerprint: blockerFingerprint(
        blockers.map((blocker) => blocker.id),
      ),
    };
    if (stage.state.approvalHistory.some((item) => item.id === entry.id)) {
      return operationFailure(workspace, [
        modelFinding(
          "DUPLICATE_APPROVAL_HISTORY_ID",
          "$.id",
          "Approval history ID already exists.",
        ),
      ]);
    }
    stage.state.approvalHistory.push(entry);
    stage.state.approvalStatus = decision;
    stage.state.evaluatedAt = timestamp;
    candidate.updatedAt = timestamp;
    run.updatedAt = timestamp;
    return validateOperationCandidate(candidate, workspace, [
      entry.id,
      `${run.id}::${stage.slug}`,
    ]);
  }

  function applyStageOverride(workspace, options = {}) {
    const ready = operationWorkspace(workspace);
    if (!ready.ok) return ready;
    const candidate = ready.workspace;
    const located = ensureEditableRun(
      candidate,
      options.runId,
      options.stageSlug,
    );
    if (!located.ok) return operationFailure(workspace, located.findings);
    const { run, stage } = located;
    const assessment = deriveStageAssessment(
      candidate,
      run.id,
      stage.slug,
    );
    const businessBlockers = approvalBlockingItems(assessment);
    const unoverrideable = businessBlockers.filter(
      (blocker) => !blocker.overrideable,
    );
    const overrideable = businessBlockers.filter(
      (blocker) => blocker.overrideable,
    );
    if (
      stage.state.executionStatus !== "completed" ||
      unoverrideable.length
    ) {
      return operationFailure(
        workspace,
        [
          modelFinding(
            "UNOVERRIDEABLE_STAGE_BLOCKER",
            "$.stage",
            "Stage Override cannot bypass incomplete execution or data-integrity blockers.",
            { blockers: unoverrideable },
          ),
        ],
      );
    }
    if (!overrideable.length) {
      return operationFailure(workspace, [
        modelFinding(
          "NO_OVERRIDEABLE_BLOCKERS",
          "$.stage",
          "Stage has no current overrideable blockers.",
        ),
      ]);
    }
    if (!isValidUpdatedAt(options.approvedAt)) {
      return operationFailure(workspace, [
        modelFinding(
          "INCOMPLETE_STAGE_OVERRIDE",
          "$.approvedAt",
          "Override approval time is required.",
        ),
      ]);
    }
    const timestamp = options.approvedAt;
    const blockingIds = overrideable.map((blocker) => blocker.id).sort();
    const decisionId = uid("approval-decision");
    const override = {
      id: canonicalIdentity(options.id) || uid("stage-override"),
      decisionId,
      reason: String(options.reason || "").trim(),
      approvedBy: String(options.approvedBy || "").trim(),
      approvedAt: timestamp,
      evidenceIds: Array.isArray(options.evidenceIds)
        ? options.evidenceIds.map(String)
        : [],
      blockingIds,
      blockerFingerprint: blockerFingerprint(blockingIds),
      status: "active",
      expiresAt: options.expiresAt || null,
      revokedAt: null,
      revokedBy: null,
    };
    const validated = validateStageOverride(
      candidate,
      run.id,
      stage.slug,
      override,
      overrideable,
    );
    if (!validated.ok) return operationFailure(workspace, validated.findings);
    if (stage.state.overrides.some((item) => item.id === override.id)) {
      return operationFailure(workspace, [
        modelFinding(
          "DUPLICATE_STAGE_OVERRIDE_ID",
          "$.id",
          "Stage Override ID already exists.",
        ),
      ]);
    }
    stage.state.overrides.push(override);
    stage.state.approvalStatus = "approved_with_override";
    const decision = {
      id: decisionId,
      kind: "decision",
      actor: override.approvedBy,
      at: timestamp,
      reason: override.reason,
      outcome: "approved_with_override",
      inputFingerprint: assessment.inputFingerprint,
      blockerFingerprint: override.blockerFingerprint,
      overrideId: override.id,
    };
    stage.state.approvalHistory.push(decision);
    stage.state.evaluatedAt = timestamp;
    candidate.updatedAt = timestamp;
    run.updatedAt = timestamp;
    return validateOperationCandidate(candidate, workspace, [
      override.id,
      decision.id,
      `${run.id}::${stage.slug}`,
    ]);
  }

  function revokeStageOverride(workspace, options = {}) {
    const ready = operationWorkspaceForOverrideRevocation(workspace, options);
    if (!ready.ok) return ready;
    const candidate = ready.workspace;
    const located = ensureEditableRun(
      candidate,
      options.runId,
      options.stageSlug,
    );
    if (!located.ok) return operationFailure(workspace, located.findings);
    const { run, stage } = located;
    const matches = stage.state.overrides.filter(
      (override) => override && override.id === options.overrideId,
    );
    const actor = String(options.revokedBy || options.actor || "").trim();
    if (matches.length !== 1 || !actor) {
      return operationFailure(workspace, [
        modelFinding(
          "INVALID_OVERRIDE_REVOCATION",
          "$.overrideId",
          "Revocation requires one exact Override and revoker identity.",
        ),
      ]);
    }
    const timestamp = isValidUpdatedAt(options.revokedAt)
      ? options.revokedAt
      : now();
    const override = matches[0];
    if (override.status !== "active") {
      return operationFailure(workspace, [
        modelFinding(
          "INVALID_OVERRIDE_REVOCATION",
          "$.overrideId",
          "Only one active Stage Override can be revoked.",
        ),
      ]);
    }
    override.status = "revoked";
    override.revokedAt = timestamp;
    override.revokedBy = actor;
    stage.state.approvalStatus = "stale";
    stage.state.approvalHistory.push({
      id: uid("approval-stale"),
      kind: "stale",
      actor,
      at: timestamp,
      reason: String(options.reason || "Stage Override revoked."),
      outcome: "stale",
      inputFingerprint: null,
      blockerFingerprint: null,
      overrideId: override.id,
    });
    stage.state.evaluatedAt = timestamp;
    candidate.updatedAt = timestamp;
    run.updatedAt = timestamp;
    return validateOperationCandidate(candidate, workspace, [
      override.id,
      `${run.id}::${stage.slug}`,
    ]);
  }

  function validateCandidateRelationships(
    candidate,
    report,
    runIds,
    stageKeys,
  ) {
    const objects = collectCandidateObjects(candidate);
    const recordsById = new Map();
    const attachmentsById = new Map();
    for (const item of objects.records) {
      const record = item.value;
      const recordId = canonicalIdentity(record && record.id);
      if (recordId) {
        const values = recordsById.get(recordId) || [];
        values.push(item);
        recordsById.set(recordId, values);
      }
      if (!isObject(record)) continue;
      const runId = canonicalIdentity(record.runId);
      const stageSlug = canonicalIdentity(record.stageSlug);
      if (!runIds.has(runId)) {
        addBlocking(
          report,
          "ORPHAN_RECORD_RUN",
          item.path,
          recordId,
          `Record ${recordId || "(无 ID)"} 引用了不存在的 Run。`,
        );
      }
      if (!stageKeys.has(`${runId}::${stageSlug}`)) {
        addBlocking(
          report,
          "ORPHAN_RECORD_STAGE",
          item.path,
          recordId,
          `Record ${recordId || "(无 ID)"} 引用了不存在的 Stage。`,
        );
      }
    }
    for (const item of objects.attachments) {
      const attachment = item.value;
      const attachmentId = canonicalIdentity(attachment && attachment.id);
      if (attachmentId) {
        const values = attachmentsById.get(attachmentId) || [];
        values.push(item);
        attachmentsById.set(attachmentId, values);
      }
      if (!isObject(attachment)) continue;
      const recordId = canonicalIdentity(attachment.recordId);
      if (recordId && !recordsById.has(recordId)) {
        addBlocking(
          report,
          "ORPHAN_ATTACHMENT_RECORD",
          item.path,
          attachmentId,
          `Attachment ${attachmentId || "(无 ID)"} 引用了不存在的 Record。`,
        );
      }
    }
    for (const [recordId, recordItems] of recordsById) {
      for (const item of recordItems) {
        const record = item.value;
        if (!isObject(record)) continue;
        if (hasOwn(record, "attachmentIds")) {
          if (!Array.isArray(record.attachmentIds)) {
            addBlocking(
              report,
              "INCONSISTENT_ATTACHMENT_LINK",
              `${item.path}.attachmentIds`,
              recordId,
              "Record 的 attachmentIds 已声明但不是数组。",
            );
            continue;
          }
          const linkPathsById = new Map();
          for (let index = 0; index < record.attachmentIds.length; index += 1) {
            const attachmentId = canonicalIdentity(record.attachmentIds[index]);
            const paths = linkPathsById.get(attachmentId) || [];
            paths.push(`${item.path}.attachmentIds[${index}]`);
            linkPathsById.set(attachmentId, paths);
          }
          for (const [attachmentId, paths] of linkPathsById) {
            if (paths.length < 2) continue;
            addBlocking(
              report,
              "DUPLICATE_ATTACHMENT_LINK",
              paths[0],
              attachmentId,
              "同一 Record 的 attachmentIds 包含重复身份。",
              paths,
            );
          }
          for (let index = 0; index < record.attachmentIds.length; index += 1) {
            const attachmentId = canonicalIdentity(record.attachmentIds[index]);
            const attachmentItems = attachmentsById.get(attachmentId);
            if (!attachmentItems || !attachmentItems.length) {
              addBlocking(
                report,
                "INCONSISTENT_ATTACHMENT_LINK",
                `${item.path}.attachmentIds[${index}]`,
                attachmentId,
                "Record 声明的 Attachment 不存在。",
              );
              continue;
            }
            for (const attachmentItem of attachmentItems) {
              const linkedRecordId = canonicalIdentity(
                attachmentItem.value && attachmentItem.value.recordId,
              );
              if (linkedRecordId !== recordId) {
                addBlocking(
                  report,
                  "INCONSISTENT_ATTACHMENT_LINK",
                  attachmentItem.path,
                  attachmentId,
                  "Record 与 Attachment 的双向关系不一致。",
                  [item.path, attachmentItem.path],
                );
              }
            }
          }
        } else if (
          objects.attachments.some(
            (attachmentItem) =>
              canonicalIdentity(
                attachmentItem.value && attachmentItem.value.recordId,
              ) === recordId,
          )
        ) {
          addWarning(
            report,
            "LEGACY_ONE_WAY_ATTACHMENT_LINK",
            item.path,
            "旧 Record 没有 attachmentIds 字段；保留单向 Attachment 关系且不自动补写。",
          );
        }
      }
    }
    for (const [attachmentId, attachmentItems] of attachmentsById) {
      for (const item of attachmentItems) {
        const attachment = item.value;
        if (!isObject(attachment)) continue;
        const recordId = canonicalIdentity(attachment.recordId);
        if (!recordId || !recordsById.has(recordId)) continue;
        for (const recordItem of recordsById.get(recordId)) {
          const record = recordItem.value;
          if (
            hasOwn(record, "attachmentIds") &&
            (!Array.isArray(record.attachmentIds) ||
              !record.attachmentIds.some(
                (id) => canonicalIdentity(id) === attachmentId,
              ))
          ) {
            addBlocking(
              report,
              "INCONSISTENT_ATTACHMENT_LINK",
              item.path,
              attachmentId,
              "Attachment 指向 Record，但其显式 attachmentIds 未列出该 Attachment。",
              [recordItem.path, item.path],
            );
          }
        }
      }
    }
  }

  function enumerateSourcePaths(source) {
    const paths = [];
    const runs = Array.isArray(source && source.runs) ? source.runs : [];
    for (let runIndex = 0; runIndex < runs.length; runIndex += 1) {
      paths.push(`$.runs[${runIndex}]`);
      const stages = Array.isArray(runs[runIndex] && runs[runIndex].stages)
        ? runs[runIndex].stages
        : [];
      for (
        let stageIndex = 0;
        stageIndex < stages.length;
        stageIndex += 1
      ) {
        const stagePath = `$.runs[${runIndex}].stages[${stageIndex}]`;
        paths.push(stagePath);
        const gates = Array.isArray(stages[stageIndex] && stages[stageIndex].gates)
          ? stages[stageIndex].gates
          : [];
        for (let gateIndex = 0; gateIndex < gates.length; gateIndex += 1) {
          paths.push(`${stagePath}.gates[${gateIndex}]`);
        }
      }
    }
    for (const category of ["records", "attachments"]) {
      const values = Array.isArray(source && source[category])
        ? source[category]
        : [];
      for (let index = 0; index < values.length; index += 1) {
        paths.push(`$.${category}[${index}]`);
      }
    }
    const legacy = isObject(source && source.legacy) ? source.legacy : {};
    for (const category of ["stages", "gates", "records", "attachments"]) {
      const entries = Array.isArray(legacy[category]) ? legacy[category] : [];
      for (let index = 0; index < entries.length; index += 1) {
        paths.push(`$.legacy.${category}[${index}]`);
      }
    }
    return paths;
  }

  function finalizeMigrationReport(source, candidate, report) {
    report.beforeCounts = countWorkspaceObjects(source);
    report.afterCounts = countWorkspaceObjects(candidate);
    report.sourceConservation.expected = totalCounts(report.beforeCounts);
    report.sourceConservation.accounted = report.conservationLedger.length;
    if (
      report.sourceConservation.accounted !==
      report.sourceConservation.expected
    ) {
      const accountedPaths = new Set(
        report.conservationLedger.map((entry) => entry.sourcePath),
      );
      report.sourceConservation.unaccountedPaths = enumerateSourcePaths(
        source,
      ).filter((path) => !accountedPaths.has(path));
      addBlocking(
        report,
        "UNACCOUNTED_SOURCE_OBJECT",
        "$",
        null,
        "源对象守恒校验失败，存在未被唯一计入的对象。",
        report.sourceConservation.unaccountedPaths,
      );
    }
    if (report.discardedItems.length) {
      addBlocking(
        report,
        "DISCARDED_OBJECT",
        "$",
        null,
        "迁移报告包含丢弃对象，禁止导入或保存。",
        report.discardedItems.map((item) => item.path).filter(Boolean),
      );
    }
    report.safe =
      report.blockingErrors.length === 0 &&
      report.discardedItems.length === 0 &&
      report.sourceConservation.expected ===
        report.sourceConservation.accounted;
    report.canImport = report.safe;
    report.canSave = report.safe;
  }

  function finalizeMigrationReportV2(source, candidate, report) {
    report.beforeCounts = countWorkspaceObjects(source);
    report.afterCounts = countWorkspaceObjects(candidate);
    const audit = verifyConservation(
      source,
      candidate,
      report.conservationLedger,
    );
    report.conservationLedger = audit.ledger;
    report.sourceConservation = {
      expected: audit.expected,
      accounted: audit.accounted,
      unaccountedPaths: audit.unaccountedPaths,
      duplicateSourcePaths: audit.duplicateSourcePaths,
      extraSourcePaths: audit.extraSourcePaths,
      duplicateDestinationPaths: audit.duplicateDestinationPaths,
      missingDestinations: audit.missingDestinations,
      fingerprintMismatches: audit.fingerprintMismatches,
    };
    if (!audit.safe) {
      addBlocking(
        report,
        "UNACCOUNTED_SOURCE_OBJECT",
        "$",
        null,
        "源对象守恒校验失败：每个源路径必须恰好映射到一个真实且内容一致的目标。",
        [
          ...audit.unaccountedPaths,
          ...audit.extraSourcePaths,
          ...audit.duplicateDestinationPaths,
          ...audit.missingDestinations.map(
            (item) => item.destinationPath,
          ),
        ],
      );
    }

    const insertedGateCount = report.insertedStages.reduce(
      (sum, insertion) => {
        const template = STAGE_TEMPLATE.find(
          (item) => item.slug === insertion.stageSlug,
        );
        return sum + (template ? template.gates.length : 0);
      },
      0,
    );
    const expectedAfterCounts = {
      runs: report.beforeCounts.runs,
      stages:
        report.beforeCounts.stages + report.insertedStages.length,
      gates: report.beforeCounts.gates + insertedGateCount,
      records: report.beforeCounts.records,
      attachments: report.beforeCounts.attachments,
    };
    const countMismatches = Object.keys(expectedAfterCounts).filter(
      (key) => expectedAfterCounts[key] !== report.afterCounts[key],
    );
    if (countMismatches.length) {
      addBlocking(
        report,
        "UNACCOUNTED_SOURCE_OBJECT",
        "$",
        null,
        "迁移前后对象数量与明确记录的新增阶段不一致。",
        countMismatches.map(
          (key) =>
            `${key}:${report.afterCounts[key]}/${expectedAfterCounts[key]}`,
        ),
      );
    }
    if (report.discardedItems.length) {
      addBlocking(
        report,
        "DISCARDED_OBJECT",
        "$",
        null,
        "迁移报告包含丢弃对象，禁止导入或保存。",
        report.discardedItems.map((item) => item.path).filter(Boolean),
      );
    }
    report.safe =
      report.blockingErrors.length === 0 &&
      report.discardedItems.length === 0 &&
      audit.safe &&
      countMismatches.length === 0;
    report.canImport = report.safe;
    report.canSave = report.safe;
  }

  function unsupportedPreview(source, report, code, message) {
    addBlocking(report, code, "$.schemaVersion", null, message);
    const candidate = clone(source);
    report.beforeCounts = countWorkspaceObjects(source);
    report.afterCounts = countWorkspaceObjects(candidate);
